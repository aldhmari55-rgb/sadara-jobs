<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام المسوقين (Affiliate) - صدارة</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <div class="logo"><a href="index.html" style="color:white; text-decoration:none;">صدارة <span>ذمار</span></a></div>
        <nav><a href="index.html">الرئيسية</a></nav>
    </header>

    <div class="container">
        <h2>لوحة تحكم المسوقين الشركاء</h2>
        <div id="affiliate-login-box">
            <p>سجل برقم هاتفك للحصول على رابط التسويق الخاص بك:</p>
            <input type="tel" id="aff_phone" placeholder="أدخل رقم هاتفك (مثال: 77XXXXXXX)" style="width:100%; padding:10px; margin:10px 0;">
            <button onclick="loginAffiliate()" class="btn-submit">دخول لوحة المسوق</button>
        </div>

        <div id="affiliate-dashboard" style="display:none; margin-top:20px;">
            <h3>أهلاً بك، <span id="dash-phone"></span></h3>
            <p style="margin: 10px 0;">رابط الإحالة الخاص بك:</p>
            <input type="text" id="ref-link" readonly style="width:100%; padding:10px; background:#eee;">
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
