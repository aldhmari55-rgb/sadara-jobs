<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>برنامج التسويق بالعمولة | منصة صدارة</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #0f2347; --gold: #d4af37; --green: #25d366; --red: #ef4444; --bg: #f8fafc; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background: var(--bg); padding: 15px; color: #0f172a; padding-bottom: 50px; }
        .header { background: var(--primary); color: white; padding: 18px; border-radius: 12px; text-align: center; margin-bottom: 20px; border-bottom: 3px solid var(--gold); }
        .card { background: white; padding: 20px; border-radius: 12px; border: 1px solid #e2e8f0; max-width: 600px; margin: 0 auto; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
        label { font-size: 12px; font-weight: bold; display: block; margin-top: 10px; color: #475569; }
        input, select { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 13px; outline: none; }
        button { width: 100%; background: var(--primary); color: white; border: none; padding: 12px; margin-top: 15px; border-radius: 8px; font-weight: bold; font-size: 13px; cursor: pointer; transition: 0.2s; }
        button:hover { opacity: 0.9; }
        .tabs { display: flex; gap: 10px; margin-bottom: 15px; }
        .tab-btn { flex: 1; padding: 10px; background: #e2e8f0; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; color: #475569; }
        .tab-btn.active { background: var(--primary); color: white; }
        .status-msg { margin-top: 10px; font-size: 12px; font-weight: bold; text-align: center; }
        .dashboard-box { display: none; }
        .dashboard-box.active { display: block; }
        .aff-stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 15px; }
        .stat-card { background: #f8fafc; padding: 12px; border-radius: 10px; text-align: center; border: 1px solid #cbd5e1; }
        .stat-card h3 { color: var(--primary); font-size: 16px; font-weight: 900; }
        .stat-card p { font-size: 11px; color: #64748b; font-weight: bold; margin-top: 4px; }
        .link-box { background: #f1f5f9; padding: 10px; border-radius: 8px; border: 1px dashed #cbd5e1; margin-top: 15px; text-align: center; word-break: break-all; font-size: 12px; color: #1e40af; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <h1>برنامج التسويق بالعمولة 🤝</h1>
        <p style="font-size: 12px; opacity: 0.8; margin-top: 4px;">سوق لخدمات صدارة واحصل على أرباح وعمولات مجزية (20%)</p>
    </div>

    <div class="card">
        <!-- أزرار التبديل بين تسجيل الدخول وتسجيل حساب جديد -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('register')">تسجيل مسوق جديد 📝</button>
            <button class="tab-btn" onclick="switchTab('login')">تسجيل الدخول برقم الجوال 📱</button>
        </div>

        <!-- 1. نموذج تسجيل مسوق جديد -->
        <div id="registerBox" class="dashboard-box active">
            <h3 style="font-size: 15px; color: var(--primary); margin-bottom: 10px;">إنشاء حساب مسوق جديد</h3>
            
            <label>الاسم الكامل</label>
            <input type="text" id="regName" placeholder="الاسم الكامل...">
            
            <label>رقم الواتساب (للتواصل وصرف الأرباح)</label>
            <input type="text" id="regPhone" placeholder="9677xxxxxxxx">
            
            <label>وسيلة استلام العمولات والأرباح</label>
            <select id="regMethod">
                <option value="محفظة جيب jeeb">محفظة جيب jeeb</option>
                <option value="بنك الكريمي">بنك الكريمي</option>
                <option value="محفظة جوالي">محفظة جوالي</option>
            </select>
            
            <label>رقم الحساب / المحفظة لاستلام الأرباح</label>
            <input type="text" id="regNumber" placeholder="رقم الحساب أو المحفظة...">
            
            <button onclick="registerAffiliate()" style="background: var(--gold); color: #0a1324;">إنشاء الحساب البدء التسويق 🚀</button>
            <div id="regMsg" class="status-msg"></div>
        </div>

        <!-- 2. نموذج تسجيل الدخول برقم الجوال -->
        <div id="loginBox" class="dashboard-box">
            <h3 style="font-size: 15px; color: var(--primary); margin-bottom: 10px;">تسجيل الدخول للوحة التحكم</h3>
            
            <label>رقم الجوال المسجل به</label>
            <input type="text" id="logPhone" placeholder="9677xxxxxxxx">
            
            <button onclick="loginAffiliate()">دخول لوحة التحكم 🔐</button>
            <div id="logMsg" class="status-msg"></div>
        </div>

        <!-- 3. لوحة تحكم المسوق الخاصة (تظهر بعد الدخول) -->
        <div id="affDashboard" class="dashboard-box">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h3 id="welcomeMsg" style="font-size: 14px; color: var(--primary);">مرحباً، ...</h3>
                <button onclick="logoutAffiliate()" style="width: auto; padding: 6px 12px; background: var(--red); margin: 0; font-size: 11px;">خروج 🚪</button>
            </div>

            <!-- إحصائيات الأرباح والمبيعات -->
            <div class="aff-stats-grid">
                <div class="stat-card">
                    <h3 id="affTotalEarnings">0 YER</h3>
                    <p>إجمالي الأرباح الكلية 📈</p>
                </div>
                <div class="stat-card">
                    <h3 id="affDueEarnings" style="color: green;">0 YER</h3>
                    <p>العمولات المستحقة 💰</p>
                </div>
            </div>

            <div class="aff-stats-grid" style="grid-template-columns: repeat(2, 1fr); margin-bottom: 15px;">
                <div class="stat-card">
                    <h3 id="affClicks">0</h3>
                    <p>الزيارات عبر رابطك 👁️</p>
                </div>
                <div class="stat-card">
                    <h3 id="affSales">0</h3>
                    <p>المبيعات الناجحة 🛒</p>
                </div>
            </div>

            <label style="color: var(--primary);">🔗 رابط التسويق الخاص بك (فريد وآمن):</label>
            <div class="link-box" id="affLinkDisplay">جاري إنشاء الرابط...</div>
            <button onclick="copyAffLink()" style="background: #10b981; margin-top: 10px;">نسخ الرابط الخاص بك 📋</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://lvutrzswngpkjfamgact.supabase.co";
        const SUPABASE_KEY = "sb_publishable_fB8RmZyfymR8YpjLInA2LQ_hMA6qgRG";
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.dashboard-box').forEach(b => b.classList.remove('active'));
            if(tab === 'register') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('registerBox').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('loginBox').classList.add('active');
            }
        }

        // تسجيل مسوق جديد
        async function registerAffiliate() {
            const full_name = document.getElementById('regName').value.trim();
            const phone = document.getElementById('regPhone').value.trim();
            const payout_method = document.getElementById('regMethod').value;
            const payout_number = document.getElementById('regNumber').value.trim();
            const msg = document.getElementById('regMsg');

            if (!full_name || !phone || !payout_number) {
                msg.style.color = 'red'; msg.textContent = 'يرجى ملء جميع الحقول المطلوبة!'; return;
            }

            // التحقق إن كان الرقم مسجلاً مسبقاً
            let { data: existing } = await db.from('affiliates').select('*').eq('phone', phone).single();
            if (existing) {
                msg.style.color = 'red'; msg.textContent = 'هذا الرقم مسجل مسبقاً، يرجى تسجيل الدخول مباشرة.'; return;
            }

            // توليد كود وعريف فريد للمسوق
            let ref_code = 'sdr_' + Math.random().toString(36).substring(7);

            msg.style.color = 'blue'; msg.textContent = 'جاري إنشاء الحساب... ⏳';

            let { data, error } = await db.from('affiliates').insert([{
                full_name, name: full_name, phone, payout_method, payout_number, ref_code, total_sales: 0, total_earnings: 0, paid_earnings: 0, clicks: 0
            }]).select().single();

            if (error) {
                msg.style.color = 'red'; msg.textContent = 'خطأ في التسجيل: ' + error.message;
            } else {
                msg.style.color = 'green'; msg.textContent = 'تم إنشاء الحساب بنجاح! جاري تحويلك لوحتك... ✅';
                setTimeout(() => { openAffDashboard(data); }, 1000);
            }
        }

        // تسجيل الدخول برقم الجوال
        async function loginAffiliate() {
            const phone = document.getElementById('logPhone').value.trim();
            const msg = document.getElementById('logMsg');

            if (!phone) { msg.style.color = 'red'; msg.textContent = 'يرجى إدخال رقم الجوال!'; return; }

            msg.style.color = 'blue'; msg.textContent = 'جاري التحقق من الحساب... ⏳';

            let { data, error } = await db.from('affiliates').select('*').eq('phone', phone).single();

            if (error || !data) {
                msg.style.color = 'red'; msg.textContent = 'رقم الجوال غير مسجل معنا كمسوق!';
            } else {
                msg.style.color = 'green'; msg.textContent = 'تم تسجيل الدخول بنجاح! 🎉';
                setTimeout(() => { openAffDashboard(data); }, 800);
            }
        }

        // فتح لوحة تحكم المسوق وعرض بياناته وأرباحه
        function openAffDashboard(aff) {
            document.getElementById('registerBox').classList.remove('active');
            document.getElementById('loginBox').classList.remove('active');
            document.querySelector('.tabs').style.display = 'none';
            
            let dash = document.getElementById('affDashboard');
            dash.classList.add('active');

            document.getElementById('welcomeMsg').textContent = `مرحباً، ${aff.full_name || aff.name || 'مسوق صدارة'}`;

            // الأرباح والتراكمات التاريخية
            let totalEarned = Number(aff.total_earnings || 0); // إجمالي الأرباح الكلية المتراكمة
            let paidEarned = Number(aff.paid_earnings || 0);   // ما تم تسويته ودفع مسبقاً
            let dueEarned = totalEarned - paidEarned;          // الصافي المستحق تحت التسوية

            document.getElementById('affTotalEarnings').textContent = totalEarned + ' YER';
            document.getElementById('affDueEarnings').textContent = dueEarned + ' YER';
            document.getElementById('affSales').textContent = aff.total_sales || 0;
            document.getElementById('affClicks').textContent = aff.clicks || 0;

            let refCode = aff.ref_code || aff.phone;
            let fullLink = `https://www.sadarah.top/services.html?ref=${refCode}`;
            document.getElementById('affLinkDisplay').textContent = fullLink;
            window.currentAffLink = fullLink;

            // حفظ الجلسة محلياً
            localStorage.setItem('sadara_affiliate_phone', aff.phone);
        }

        function copyAffLink() {
            if(window.currentAffLink) {
                navigator.clipboard.writeText(window.currentAffLink);
                alert('تم نسخ رابط التسويق الخاص بك بنجاح! 📋 أرسله الآن للعملاء واحصل على 20% أرباح.');
            }
        }

        function logoutAffiliate() {
            localStorage.removeItem('sadara_affiliate_phone');
            location.reload();
        }

        // التحقق التلقائي من الجلسة المحفوظة عند فتح الصفحة
        window.addEventListener('DOMContentLoaded', async () => {
            let savedPhone = localStorage.getItem('sadara_affiliate_phone');
            if (savedPhone) {
                let { data } = await db.from('affiliates').select('*').eq('phone', savedPhone).single();
                if (data) {
                    openAffDashboard(data);
                }
            }
        });
    </script>
</body>
</html>
