<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6392257665418096" crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة المسوقين (الأفلييت) | منصة صدارة</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #0f2347;
            --dark: #0a1324;
            --gold: #d4af37;
            --green: #16a34a;
            --red: #e11d48;
            --bg-light: #f4f6fa;
            --card: #ffffff;
            --border: #e2e8f0;
            --muted: #64748b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background: var(--bg-light); color: #0f172a; padding-bottom: 70px; }

        .top-navbar {
            background: var(--dark);
            color: #fff;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 2px solid rgba(212, 175, 55, 0.35);
        }
        .brand-title { font-weight: 900; font-size: 14.5px; color: #fff; text-decoration: none; }
        .brand-title span { color: var(--gold); }
        .home-pill {
            background: rgba(212, 175, 55, 0.14);
            color: var(--gold);
            border: 1px solid rgba(212, 175, 55, 0.45);
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 9px;
            font-size: 12px;
            font-weight: 900;
        }

        .hero-banner {
            background: linear-gradient(135deg, var(--dark) 0%, var(--primary) 100%);
            color: #fff;
            padding: 22px 16px 38px;
            text-align: center;
        }
        .hero-banner h1 { font-size: 18px; font-weight: 900; margin-bottom: 4px; }
        .hero-banner p { font-size: 12px; color: #cbd5e1; }

        .main-container { max-width: 820px; margin: -22px auto 0; padding: 0 14px; display: grid; gap: 14px; }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 16px;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.05);
        }
        .card h2 { font-size: 14.5px; font-weight: 900; color: var(--primary); margin-bottom: 10px; }

        .field-group { margin-bottom: 10px; }
        .field-group label { display: block; font-size: 12px; font-weight: 900; color: var(--primary); margin-bottom: 4px; }
        .field-group input, .field-group select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 12.5px;
            font-weight: 700;
            background: #f8fafc;
            outline: none;
        }
        .btn-gold {
            width: 100%;
            background: var(--gold);
            color: var(--dark);
            border: none;
            padding: 11px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 900;
            cursor: pointer;
            margin-top: 6px;
        }
        .btn-primary {
            width: 100%;
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 10px;
            font-size: 12.5px;
            font-weight: 900;
            cursor: pointer;
            margin-top: 6px;
        }

        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
        .stat-box { background: #f8fafc; border: 1px solid var(--border); border-radius: 12px; padding: 12px; text-align: center; }
        .stat-num { font-size: 16px; font-weight: 900; color: var(--primary); }
        .stat-lbl { font-size: 11px; color: var(--muted); font-weight: 700; margin-top: 2px; }

        .ref-link-box {
            background: #f0fdf4;
            border: 1px dashed var(--green);
            border-radius: 10px;
            padding: 10px;
            margin-top: 10px;
            font-size: 12px;
            word-break: break-all;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <header class="top-navbar">
        <a href="index.html" class="brand-title">منصة <span>صدارة</span></a>
        <a href="index.html" class="home-pill"><i class="fa-solid fa-store"></i> المتجر والدورات</a>
    </header>

    <section class="hero-banner">
        <h1><i class="fa-solid fa-handshake"></i> بوابة المسوقين بالعمولة</h1>
        <p>سوّق لمنتجات ودورات منصة صدارة واحصل على رابط إحالة خاص بك وتابع أرباحك</p>
    </section>

    <main class="main-container">
        <div class="card">
            <h2><i class="fa-solid fa-user-plus"></i> تسجيل حساب مسوق جديد</h2>
            <div class="field-group">
                <label>الاسم الكامل</label>
                <input type="text" id="affName" placeholder="أدخل اسمك الكامل">
            </div>
            <div class="field-group">
                <label>رقم الهاتف / الواتساب</label>
                <input type="tel" id="affPhone" placeholder="مثال: 780568507">
            </div>
            <div class="field-group">
                <label>وسيلة استلام الأرباح</label>
                <select id="affMethod">
                    <option value="محفظة جيب (Jeeb)">محفظة جيب (Jeeb)</option>
                    <option value="حاسب الكريمي">حاسب الكريمي</option>
                </select>
            </div>
            <div class="field-group">
                <label>رقم المحفظة أو الحساب</label>
                <input type="text" id="affAccount" placeholder="رقم المحفظة أو الحساب">
            </div>
            <button type="button" class="btn-gold" onclick="registerAffiliate()">إنشاء حساب مسوق والحصول على الرابط 🚀</button>
            <div id="regMsg" style="margin-top:8px; font-size:12px; font-weight:900;"></div>
        </div>

        <div class="card">
            <h2><i class="fa-solid fa-chart-line"></i> متابعة حساب المسوق ورابط الإحالة</h2>
            <div class="field-group">
                <label>أدخل رقم هاتفك المسجل لعرض بياناتك</label>
                <input type="tel" id="checkPhone" placeholder="أدخل رقم الهاتف">
            </div>
            <button type="button" class="btn-primary" onclick="checkAffiliateStats()">عرض الإحصائيات والرابط 📊</button>

            <div id="affDashboard" style="display:none; margin-top:12px;">
                <div style="font-size:13px; font-weight:900; color:var(--primary);" id="dashTitle"></div>
                <div class="ref-link-box" id="refLinkText"></div>
                <button type="button" class="btn-primary" style="background:var(--green);" onclick="copyRefLink()">نسخ رابط الإحالة 📋</button>
                <div class="stats-grid">
                    <div class="stat-box">
                        <div class="stat-num" id="statSales">0</div>
                        <div class="stat-lbl">المبيعات المعتمدة</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-num" id="statEarnings">0</div>
                        <div class="stat-lbl">الأرباح (YER)</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-num" id="statCode">-</div>
                        <div class="stat-lbl">كود الإحالة</div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const db = supabase.createClient("https://lvutrzswngpkjfamgact.supabase.co", "sb_publishable_fB8RmZyfymR8YpjLInA2LQ_hMA6qgRG");

        function toEng(s) {
            return String(s || '').replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d));
        }

        async function registerAffiliate() {
            const full_name = document.getElementById('affName').value.trim();
            const phone = toEng(document.getElementById('affPhone').value.trim());
            const payment_method = document.getElementById('affMethod').value;
            const payment_account = toEng(document.getElementById('affAccount').value.trim());
            const msgEl = document.getElementById('regMsg');

            if (!full_name || !phone || !payment_account) {
                msgEl.style.color = 'var(--red)';
                msgEl.textContent = 'يرجى تعبئة الاسم ورقم الهاتف ورقم المحفظة/الحساب.';
                return;
            }

            const ref_code = 'SDR' + phone.slice(-4) + Math.floor(10 + Math.random() * 89);

            const { data, error } = await db.from('affiliates').insert([{
                full_name,
                name: full_name,
                phone,
                ref_code,
                payment_method,
                payment_account,
                payout_method: payment_method,
                payout_number: payment_account
            }]).select().maybeSingle();

            if (error) {
                if (String(error.message || '').toLowerCase().includes('unique') || String(error.message || '').includes('duplicate')) {
                    msgEl.style.color = 'var(--primary)';
                    msgEl.textContent = 'هذا الرقم مسجل مسبقاً! يمكنك استعراض بياناتك من صندوق المتابعة بالأسفل.';
                    document.getElementById('checkPhone').value = phone;
                    checkAffiliateStats();
                    return;
                }
                msgEl.style.color = 'var(--red)';
                msgEl.textContent = 'تعذر التسجيل: ' + error.message;
                return;
            }

            msgEl.style.color = 'var(--green)';
            msgEl.textContent = 'تم تسجيل حسابك بنجاح! كود الإحالة الخاص بك: ' + (data?.ref_code || ref_code);
            document.getElementById('checkPhone').value = phone;
            checkAffiliateStats();
        }

        async function checkAffiliateStats() {
            const phone = toEng(document.getElementById('checkPhone').value.trim());
            if (!phone) return alert('أدخل رقم الهاتف');
            const { data } = await db.from('affiliates').select('*').eq('phone', phone).maybeSingle();
            if (!data) return alert('لم يتم العثور على حساب مسوق بهذا الرقم.');

            document.getElementById('affDashboard').style.display = 'block';
            document.getElementById('dashTitle').textContent = `مرحباً ${data.full_name || data.name || 'مسوق'}`;
            const baseUrl = window.location.origin + '/index.html?ref=' + encodeURIComponent(data.ref_code);
            document.getElementById('refLinkText').textContent = baseUrl;
            document.getElementById('statSales').textContent = data.total_sales || 0;
            document.getElementById('statEarnings').textContent = data.total_earnings || 0;
            document.getElementById('statCode').textContent = data.ref_code;
        }

        function copyRefLink() {
            const txt = document.getElementById('refLinkText').textContent;
            navigator.clipboard?.writeText(txt);
            alert('تم نسخ رابط الإحالة بنجاح!');
        }
    </script>
</body>
</html>
