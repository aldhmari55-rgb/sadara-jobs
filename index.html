<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <!-- شفرة أدسنس -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6392257665418096" crossorigin="anonymous"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر صدارة | SADARAH STORE</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { 
            --sadarah-primary: #0F2A4A;
            --sadarah-dark: #0A1C33;
            --sadarah-light: #F4F7FB;
            --sadarah-gold: #D4AF37;
            --sadarah-btn: #0284C7;
            --sadarah-btn-hover: #0369A1;
            --green-wa: #25D366;
            --spec-bg: #F0F7FF;
            --spec-border: #0284C7;
            --spec-text: #1E3A8A;
            --text-main: #0B132B;
            --neu-shadow: 8px 8px 16px #cbced1, -8px -8px 16px #ffffff;
            --neu-shadow-inset: inset 4px 4px 8px #cbced1, inset -4px -4px 8px #ffffff;
            --neu-card-hover: 12px 12px 24px #cbced1, -12px -12px 24px #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        html { scroll-behavior: smooth; }
        body { background: var(--sadarah-light); padding-bottom: 100px; color: var(--text-main); overflow-x: hidden; -webkit-overflow-scrolling: touch; }

        /* شريط علوي مرن وشي إن ستايل */
        .top-navbar { background: var(--sadarah-primary); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--sadarah-gold); position: sticky; top: 0; z-index: 1000; box-shadow: 0 8px 20px rgba(10,28,51,0.3); width: 100%; }
        .brand-logo-container { display: flex; align-items: center; gap: 8px; text-decoration: none; }
        .brand-logo-img { height: 38px; object-fit: contain; }
        
        .nav-actions { display: flex; gap: 10px; align-items: center; }
        .mini-btn { background: rgba(255,255,255,0.1); color: #FFFFFF; border: 1px solid rgba(212,175,55,0.4); padding: 8px 14px; border-radius: 12px; font-weight: 800; font-size: 11px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; transition: 0.3s; }
        .mini-btn:hover { background: var(--sadarah-gold); color: var(--sadarah-dark); }

        .container { max-width: 1200px; margin: 20px auto; padding: 0 15px; width: 100%; }
        
        .store-header { background: var(--sadarah-light); padding: 25px; border-radius: 22px; text-align: center; margin-bottom: 22px; box-shadow: var(--neu-shadow); border: 1px solid rgba(255,255,255,0.8); }
        .store-header h1 { color: var(--sadarah-primary); font-size: clamp(20px, 4vw, 26px); font-weight: 900; margin-bottom: 6px; }
        .store-header p { color: #49769F; font-size: clamp(12px, 2vw, 13px); font-weight: 700; }

        /* شريط البحث والأقسام */
        .search-filter-box { background: var(--sadarah-light); border-radius: 20px; padding: 18px; margin-bottom: 25px; box-shadow: var(--neu-shadow); border: 1px solid rgba(255,255,255,0.8); }
        .search-input-main { width: 100%; padding: 14px 18px; border: none; border-radius: 12px; font-size: 13px; font-weight: 700; outline: none; margin-bottom: 12px; background: var(--sadarah-light); color: var(--text-main); box-shadow: var(--neu-shadow-inset); }

        .categories-tags { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; overflow-x: auto; padding-bottom: 5px; }
        .categories-tags::-webkit-scrollbar { display: none; }
        .cat-tag { background: var(--sadarah-light); color: var(--sadarah-primary); border: none; padding: 9px 18px; border-radius: 18px; font-size: 12px; font-weight: 800; cursor: pointer; transition: 0.3s; box-shadow: var(--neu-shadow); white-space: nowrap; flex-shrink: 0; }
        .cat-tag.active, .cat-tag:hover { box-shadow: var(--neu-shadow-inset); color: var(--sadarah-gold); }

        /* شبكة المنتجات (مرنة ومماثلة لتجربة شي إن) */
        .products-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; width: 100%; }
        @media (max-width: 992px) { .products-grid { grid-template-columns: repeat(2, 1fr); gap: 14px; } }
        @media (max-width: 576px) { .products-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; } }

        .product-card { background: var(--sadarah-light); border-radius: 20px; border: 1px solid rgba(255,255,255,0.9); padding: 14px; box-shadow: var(--neu-shadow); display: flex; flex-direction: column; justify-content: space-between; gap: 10px; transition: 0.4s; width: 100%; }
        .product-card:hover { box-shadow: var(--neu-card-hover); transform: translateY(-4px); }

        .product-img-container { width: 100%; height: 220px; background: var(--sadarah-light); border-radius: 14px; display: flex; justify-content: center; align-items: center; overflow: hidden; box-shadow: var(--neu-shadow-inset); padding: 6px; cursor: pointer; position: relative; }
        @media (max-width: 576px) { .product-img-container { height: 160px; } }
        .product-img { width: 100%; height: 100%; object-fit: contain; border-radius: 10px; transition: transform 0.4s; }
        .product-img-container:hover .product-img { transform: scale(1.05); }

        .product-title { font-size: 13px; font-weight: 900; color: var(--text-main); height: 38px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; cursor: pointer; }
        .product-price { font-size: 14px; font-weight: 900; color: var(--sadarah-btn); }
        
        .product-desc { font-size: 11px; color: var(--spec-text); background: var(--spec-bg); padding: 8px; border-radius: 8px; border-right: 3px solid var(--spec-border); box-shadow: var(--neu-shadow-inset); font-weight: 700; line-height: 1.4; height: 50px; overflow: hidden; }

        .order-btn { background: var(--sadarah-btn); color: white; text-align: center; padding: 11px; border-radius: 12px; font-weight: 900; font-size: 12px; cursor: pointer; border: none; width: 100%; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: 0.3s; box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3); }
        .order-btn:hover { background: var(--sadarah-btn-hover); transform: translateY(-2px); }

        /* نافذة الطلب ومنتج المعاينة مع إمكانية النقر في أي مكان للإغلاق */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(10,28,51,0.85); backdrop-filter: blur(8px); z-index: 99999; justify-content: center; align-items: center; padding: 15px; overflow-y: auto; }
        .modal-card { background: var(--sadarah-light); padding: 25px; border-radius: 24px; width: 100%; max-width: 480px; box-shadow: var(--neu-shadow); border-top: 5px solid var(--sadarah-gold); max-height: 90vh; overflow-y: auto; position: relative; animation: modalPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes modalPop { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

        .modal-card h3 { color: var(--sadarah-primary); font-size: 17px; font-weight: 900; margin-bottom: 10px; }
        .modal-spec-box { font-size: 12px; color: var(--spec-text); background: var(--spec-bg); padding: 12px; border-radius: 10px; border-right: 4px solid var(--spec-border); box-shadow: var(--neu-shadow-inset); font-weight: 700; line-height: 1.7; margin-bottom: 14px; }
        
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; font-weight: 900; color: var(--sadarah-primary); margin-bottom: 4px; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 11px; border: none; border-radius: 10px; font-size: 12px; font-weight: 700; outline: none; background: var(--sadarah-light); box-shadow: var(--neu-shadow-inset); color: var(--text-main); }
        
        .whatsapp-float-btn { position: fixed; bottom: 25px; left: 20px; background: var(--sadarah-light); color: var(--green-wa); width: 60px; height: 60px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 32px; box-shadow: var(--neu-shadow); z-index: 950; text-decoration: none; transition: all 0.4s ease; animation: pulse-whatsapp 2s infinite; }
        @keyframes pulse-whatsapp { 0% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.4); } 70% { box-shadow: 0 0 0 20px rgba(37, 211, 102, 0); } 100% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0); } }
    </style>
</head>
<body>

    <div class="top-navbar">
        <a href="affiliate.html" class="mini-btn"><i class="fa-solid fa-handshake-angle"></i> المسوقون (أفلييت)</a>
        <a href="index.html" class="brand-logo-container">
            <img src="٢٠٢٦٠٩٢٦_١٩٥٨٣٩.jpg" class="brand-logo-img" alt="شعار صدارة">
            <span style="font-weight: 900; font-size: 15px; color: #FFFFFF;">متجر <span style="color:var(--sadarah-gold);">صدارة</span></span>
        </a>
        <div class="nav-actions">
            <a href="blog.html" class="mini-btn"><i class="fa-solid fa-newspaper"></i> المدونة</a>
        </div>
    </div>

    <a href="https://chat.whatsapp.com/HyBM7PNxwuOJCIB5WijyVk" target="_blank" class="whatsapp-float-btn" title="انضم لمجتمعنا على الواتساب">
        <i class="fa-brands fa-whatsapp"></i>
    </a>

    <div class="container">
        <div class="store-header">
            <h1>🛒 متجر صدارة الرقمي والميداني</h1>
            <p>تصفح أحدث المنتجات والعروض، وانسخ رابط الإحالة الخاص بك لمضاعفة أرباحك فوراً</p>
        </div>

        <div class="search-filter-box">
            <input type="text" id="searchInput" class="search-input-main" placeholder="🔍 ابحث عن منتج، خدمة، أو عرض..." oninput="filterStoreProducts()">
            <div class="categories-tags" id="categoriesContainer">
                <span class="cat-tag active" onclick="filterStore('الكل', this)">الكل 🌐</span>
                <span class="cat-tag" onclick="filterStore('اشتراكات رقمية', this)">🔑 اشتراكات رقمية</span>
                <span class="cat-tag" onclick="filterStore('خدمات', this)">🛠️ خدمات</span>
                <span class="cat-tag" onclick="filterStore('تجميل وعناية', this)">💄 تجميل وعناية</span>
            </div>
        </div>

        <div id="productsGridContainer" class="products-grid">
            جاري تحميل المنتجات...
        </div>
    </div>

    <!-- نافذة الطلب والتفاصيل مع دعم الإغلاق بالنقر في أي مكان خارجها -->
    <div class="modal-overlay" id="orderModal" onclick="checkOutsideModalClick(event, 'orderModalCard')">
        <div class="modal-card" id="orderModalCard">
            <h3><i class="fa-solid fa-cart-shopping" style="color:var(--sadarah-gold);"></i> طلب المنتج الرقمي</h3>
            <div id="modalProductDetails" class="modal-spec-box">تفاصيل المنتج...</div>
            
            <div class="form-group">
                <label>اسمك الكريم</label>
                <input type="text" id="orderName" placeholder="أدخل الاسم الكامل">
            </div>
            <div class="form-group">
                <label>رقم الواتساب للتواصل وتفعيل الطلب</label>
                <input type="tel" id="orderPhone" placeholder="770000000">
            </div>
            <div class="form-group">
                <label>وسيلة الدفع / التحويل</label>
                <select id="orderPaymentMethod">
                    <option value="محفظة جيب (780568507)">محفظة جيب (780568507)</option>
                    <option value="بنك الكريمي (2628009)">بنك الكريمي (2628009)</option>
                </select>
            </div>
            <div class="form-group">
                <label>رابط أو صورة سند التحويل</label>
                <input type="text" id="orderReceipt" placeholder="رابط صورة سند التحويل أو إيصال الدفع">
            </div>
            <div class="form-group">
                <label>ملاحظات إضافية (اختياري)</label>
                <textarea id="orderNotes" rows="2" placeholder="أي تفاصيل تود إضافتها"></textarea>
            </div>

            <button onclick="submitOrder()" class="order-btn" style="margin-top:5px;">تأكيد وإرسال الطلب عبر الواتساب 📱</button>
            <button onclick="document.getElementById('orderModal').style.display='none'" style="width:100%; background:var(--sadarah-light); color:var(--sadarah-primary); border:none; padding:11px; border-radius:10px; margin-top:8px; font-weight:900; cursor:pointer; box-shadow:var(--neu-shadow);">إغلاق</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://lvutrzswngpkjfamgact.supabase.co";
        const SUPABASE_KEY = "sb_publishable_fB8RmZyfymR8YpjLInA2LQ_hMA6qgRG";
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let allProducts = [];
        let selectedProductObj = null;

        async function loadStoreProducts() {
            try {
                let { data, error } = await db.from('platform_services').select('*').eq('is_active', true).order('id', {ascending: false});
                allProducts = data || [];
                renderStoreProducts(allProducts);

                const urlParams = new URLSearchParams(window.location.search);
                const prodId = urlParams.get('product_id');
                const refCode = urlParams.get('ref');
                if(refCode) localStorage.setItem('sadara_ref', refCode);

                if(prodId && allProducts.length > 0) {
                    let matched = allProducts.find(p => p.id == prodId);
                    if(matched) openOrderModal(matched);
                }
            } catch(e) {
                document.getElementById('productsGridContainer').innerHTML = '<p style="text-align:center; color:#49769F;">عذراً، حدث خطأ في تحميل المنتجات.</p>';
            }
        }

        function filterStore(category, el) {
            document.querySelectorAll('.cat-tag').forEach(t => t.classList.remove('active'));
            if(el) el.classList.add('active');

            if(category === 'الكل') {
                renderStoreProducts(allProducts);
            } else {
                let filtered = allProducts.filter(p => p.category === category);
                renderStoreProducts(filtered);
            }
        }

        function filterStoreProducts() {
            let query = document.getElementById('searchInput').value.toLowerCase().trim();
            let filtered = allProducts.filter(p => p.title.toLowerCase().includes(query) || (p.description && p.description.toLowerCase().includes(query)));
            renderStoreProducts(filtered);
        }

        function renderStoreProducts(list) {
            let container = document.getElementById('productsGridContainer');
            container.innerHTML = '';

            if(!list || list.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#49769F; grid-column:1/-1; padding:30px;">لا توجد منتجات متاحة حالياً.</p>';
                return;
            }

            list.forEach(p => {
                let imgTag = (p.image && p.image.trim() !== '') ? `<img src="${p.image}" class="product-img">` : '<i class="fa-solid fa-store" style="font-size:32px; color:#49769F;"></i>';
                let descText = p.description || 'منتج رقمي معتمد ومضمون من صدارة.';

                container.innerHTML += `
                    <div class="product-card">
                        <div class="product-img-container" onclick='openOrderModal(${JSON.stringify(p)})'>
                            ${imgTag}
                        </div>
                        <div>
                            <div class="product-title" onclick='openOrderModal(${JSON.stringify(p)})'>${p.title}</div>
                            <div class="product-price" style="margin:4px 0;">السعر: ${p.price}</div>
                            <div class="product-desc">${descText}</div>
                        </div>
                        <button class="order-btn" onclick='openOrderModal(${JSON.stringify(p)})'><i class="fa-solid fa-cart-shopping"></i> طلب المنتج 🚀</button>
                    </div>
                `;
            });
        }

        function openOrderModal(product) {
            selectedProductObj = product;
            let currentRef = localStorage.getItem('sadara_ref') || 'مباشر';
            document.getElementById('modalProductDetails').innerHTML = `
                <b>📦 المنتج:</b> ${product.title}<br>
                <b>💵 السعر:</b> ${product.price}<br>
                <b>🔗 مسوق الإحالة:</b> ${currentRef}<br>
                <b>📝 التفاصيل:</b> ${product.description || 'لا توجد تفاصيل إضافية'}
            `;
            document.getElementById('orderModal').style.display = 'flex';
        }

        function checkOutsideModalClick(event, cardContentId) {
            let cardContent = document.getElementById(cardContentId);
            if (!cardContent.contains(event.target)) {
                let overlay = cardContent.closest('.modal-overlay');
                if (overlay) overlay.style.display = 'none';
            }
        }

        async function submitOrder() {
            let name = document.getElementById('orderName').value.trim();
            let phone = document.getElementById('orderPhone').value.trim();
            let payment = document.getElementById('orderPaymentMethod').value;
            let receipt = document.getElementById('orderReceipt').value.trim();
            let notes = document.getElementById('orderNotes').value.trim();
            let refCode = localStorage.getItem('sadara_ref') || 'مباشر';

            if(!name || !phone) {
                alert('يرجى إدخال الاسم ورقم الواتساب على الأقل.');
                return;
            }

            try {
                await db.from('orders').insert([{
                    product_id: selectedProductObj.id,
                    product_title: selectedProductObj.title,
                    customer_name: name,
                    customer_phone: phone,
                    payment_method: payment,
                    receipt_url: receipt,
                    notes: notes,
                    ref_code: refCode,
                    status: 'جديد'
                }]);
            } catch(e) {}

            let waMessage = `مرحباً، أريد طلب المنتج الرقمي التالي:\n\n📦 المنتج: ${selectedProductObj.title}\n💵 السعر: ${selectedProductObj.price}\n👤 الاسم: ${name}\n📱 الهاتف: ${phone}\n💳 الدفع: ${payment}\n📄 سند التحويل: ${receipt || 'لم يُرفق'}\n🔗 الإحالة: ${refCode}\n\nملاحظات: ${notes}`;
            let encoded = encodeURIComponent(waMessage);
            window.open(`https://wa.me/967780568507?text=${encoded}`, '_blank');
            document.getElementById('orderModal').style.display = 'none';
        }

        window.addEventListener('DOMContentLoaded', loadStoreProducts);
    </script>
</body>
</html>
