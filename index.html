<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة صدارة للوظائف والخدمات | ذمار</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-dark: #0a1324;
            --primary-blue: #0f2347;
            --accent-gold: #d4af37;
            --accent-blue: #2563eb;
            --bg-light: #f8fafc;
            --card-bg: #ffffff;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --whatsapp-green: #25d366;
            --border-color: #e2e8f0;
            --radius-lg: 16px;
            --radius-md: 10px;
            --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.05);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background-color: var(--bg-light); color: var(--text-dark); padding-bottom: 90px; }

        .top-navbar {
            background: var(--primary-dark);
            color: #ffffff;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
        }

        .brand-logo-wrap { display: flex; align-items: center; gap: 10px; }
        .brand-logo {
            background: linear-gradient(135deg, var(--accent-gold), #fff8dc);
            color: var(--primary-dark);
            width: 40px; height: 40px; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; font-weight: 900;
        }

        .nav-auth-actions { display: flex; gap: 8px; align-items: center; }
        .auth-btn {
            background: linear-gradient(135deg, var(--accent-gold), #f3e5ab);
            color: var(--primary-dark);
            border: none; padding: 7px 14px; border-radius: 20px;
            font-weight: 800; font-size: 12px; cursor: pointer;
        }
        .register-btn {
            background: transparent;
            color: #ffffff;
            border: 1px solid var(--accent-gold);
            padding: 7px 14px; border-radius: 20px;
            font-weight: 800; font-size: 12px; cursor: pointer;
        }
        .btn-add-job {
            background: var(--accent-blue);
            color: #ffffff; border: none; padding: 7px 16px; border-radius: 20px;
            font-weight: 800; font-size: 13px; cursor: pointer;
        }
        .profile-btn {
            background: rgba(255, 255, 255, 0.15);
            color: #ffffff; border: 1px solid var(--accent-gold);
            padding: 6px 12px; border-radius: 20px;
            font-weight: 700; font-size: 12px; cursor: pointer;
        }

        .hero-banner-title {
            background: linear-gradient(180deg, var(--primary-dark) 0%, var(--primary-blue) 100%);
            color: #ffffff; padding: 28px 20px 45px 20px; text-align: center;
        }
        .hero-banner-title h1 { font-size: 22px; font-weight: 900; }

        .whatsapp-channel-bar {
            background: #dcfce7;
            border: 1px solid #86efac;
            padding: 10px 16px;
            border-radius: var(--radius-md);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-weight: 800;
            color: #166534;
        }
        .whatsapp-channel-btn {
            background: var(--whatsapp-green);
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 12px;
            font-weight: bold;
        }

        .main-container { max-width: 800px; margin: -25px auto 0 auto; padding: 0 16px; }

        .ad-banner-box {
            background: var(--card-bg); border-radius: var(--radius-lg);
            border: 1px solid var(--border-color); overflow: hidden;
            box-shadow: var(--shadow-sm); margin-bottom: 20px; text-align: center;
            min-height: 80px; display: flex; align-items: center; justify-content: center;
        }
        .ad-banner-box img { width: 100%; height: auto; display: block; max-height: 250px; object-fit: cover; }
        .ad-banner-text { padding: 15px; color: var(--text-muted); font-size: 14px; font-weight: 700; }

        .jobs-section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
        .jobs-section-title { font-size: 20px; font-weight: 900; color: var(--primary-dark); }
        .show-all-btn { background: #e2e8f0; color: var(--text-dark); border: none; padding: 5px 12px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; }

        .jobs-grid { display: flex; flex-direction: column; gap: 16px; }
        .job-card { background: var(--card-bg); border-radius: var(--radius-lg); padding: 18px; border: 1px solid var(--border-color); box-shadow: var(--shadow-sm); }
        .job-card-img { width: 100%; max-height: 220px; object-fit: cover; border-radius: 10px; margin-bottom: 12px; }
        .job-header-row { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
        .job-title { font-size: 18px; font-weight: 800; color: var(--primary-blue); }
        .job-company { font-size: 14px; color: var(--text-muted); font-weight: 700; margin-top: 2px; }
        .status-badge { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 800; }
        .status-available { background: #dcfce7; color: #166534; }
        .status-unavailable { background: #fee2e2; color: #991b1b; }

        .job-card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; padding-top: 12px; border-top: 1px solid #f1f5f9; }
        .apply-btn { background: var(--whatsapp-green); color: #ffffff; text-decoration: none; padding: 8px 18px; border-radius: var(--radius-md); font-weight: 800; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
        .apply-btn.disabled { background: #cbd5e1; pointer-events: none; }

        .partners-ticker-section {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: var(--primary-dark); color: #ffffff;
            border-top: 2px solid var(--accent-gold); padding: 8px 0;
            overflow: hidden; z-index: 900; display: flex; align-items: center;
        }

        .ticker-label {
            background: var(--accent-gold); color: var(--primary-dark);
            font-weight: 900; font-size: 11px; padding: 6px 14px;
            border-radius: 0 15px 15px 0; white-space: nowrap; z-index: 10;
        }

        .ticker-wrapper { display: flex; overflow: hidden; width: 100%; }
        .ticker-content { display: flex; align-items: center; gap: 20px; white-space: nowrap; animation: tickerSlide 20s linear infinite; }
        .ticker-logo-only {
            width: 42px; height: 42px;
            border-radius: 50%; object-fit: cover;
            border: 2px solid var(--accent-gold);
            background: #ffffff; box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            flex-shrink: 0;
        }

        @keyframes tickerSlide {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }

        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(10, 19, 36, 0.75); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 16px; }
        .modal-box { background: #ffffff; width: 100%; max-width: 440px; border-radius: var(--radius-lg); padding: 24px; position: relative; max-height: 90vh; overflow-y: auto; }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 12px; font-weight: 800; margin-bottom: 5px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: var(--radius-md); font-size: 13px; outline: none; }
        .btn-submit { width: 100%; background: var(--primary-blue); color: #ffffff; border: none; padding: 11px; border-radius: var(--radius-md); font-weight: 800; font-size: 14px; cursor: pointer; margin-top: 8px; }
        .modal-close-btn { position: absolute; left: 15px; top: 15px; border: none; background: #f1f5f9; width: 28px; height: 28px; border-radius: 50%; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div class="top-navbar">
        <div class="brand-logo-wrap">
            <div class="brand-logo">ص</div>
            <span style="font-weight: 800;">صدارة للوظائف</span>
        </div>
        <div class="nav-auth-actions" id="navAuthArea">
            <button class="btn-add-job" onclick="openModal('addModal')">+ نشر شغل</button>
            <button class="register-btn" onclick="openModal('registerModal')">حساب جديد</button>
            <button class="auth-btn" onclick="openModal('loginModal')">تسجيل الدخول</button>
        </div>
    </div>

    <div class="hero-banner-title">
        <h1>المنصة الأولى للوظائف بمحافظة ذمار</h1>
    </div>

    <div class="main-container">
        <div class="whatsapp-channel-bar">
            <span>📢 انضم لقناة المنصة الرسمية على الواتساب!</span>
            <a href="https://whatsapp.com/channel/0029VbDXcGt0G0XmrZfHLh1s" target="_blank" class="whatsapp-channel-btn">الانضمام للقناة 🟢</a>
        </div>

        <div class="ad-banner-box" id="topAdBanner"><div class="ad-banner-text">إعلان المنصة العلوي</div></div>
        <div class="jobs-section-header">
            <h2 class="jobs-section-title">الوظائف والخدمات المتاحة</h2>
            <button class="show-all-btn" onclick="renderMainJobs()">عرض الكل</button>
        </div>
        <div class="jobs-grid" id="jobsContainer"></div>
    </div>

    <div class="partners-ticker-section">
        <div class="ticker-label">شركاء النجاح 🤝</div>
        <div class="ticker-wrapper">
            <div class="ticker-content" id="tickerContainer"></div>
        </div>
    </div>

    <div class="modal-overlay" id="registerModal">
        <div class="modal-box">
            <button class="modal-close-btn" onclick="closeModal('registerModal')">✕</button>
            <h3 style="margin-bottom: 16px; font-size: 18px; color: var(--primary-blue);">إنشاء حساب جديد</h3>
            <div class="form-group">
                <label>نوع الحساب</label>
                <select id="regRole">
                    <option value="باحث عن عمل">باحث عن عمل (موظف)</option>
                    <option value="صاحب عمل">صاحب عمل (مؤسسة / متجر)</option>
                </select>
            </div>
            <div class="form-group">
                <label>الاسم الكامل / اسم الشركة أو المتجر *</label>
                <input type="text" id="regName" placeholder="مثال: متجر الأمل">
            </div>
            <div class="form-group">
                <label>اسم المستخدم (4 حروف إنجليزي للدخول) *</label>
                <input type="text" id="regUsername" maxlength="4" style="text-transform: lowercase;" placeholder="مثال: abdo">
            </div>
            <div class="form-group">
                <label>رقم الهاتف الأساسي (الواتساب) *</label>
                <input type="text" id="regPhone" placeholder="770000000">
            </div>
            <div class="form-group">
                <label>كلمة المرور (4 أرقام أو حروف) *</label>
                <input type="password" id="regPin" maxlength="4" placeholder="مثال: 1234">
            </div>
            <button class="btn-submit" onclick="handleRegister()">تسجيل وإنشاء الحساب فوراً</button>
        </div>
    </div>

    <div class="modal-overlay" id="profileModal">
        <div class="modal-box">
            <button class="modal-close-btn" onclick="closeModal('profileModal')">✕</button>
            <h3 style="margin-bottom: 16px; font-size: 18px; color: var(--primary-dark);">تعديل الملف الشخصي</h3>
            <div class="form-group">
                <label>الاسم الكامل / اسم الجهة</label>
                <input type="text" id="profName">
            </div>
            <div class="form-group">
                <label>رقم الهاتف الأساسي</label>
                <input type="text" id="profPhone">
            </div>
            <div class="form-group">
                <label>رقم هاتف إضافي (اختياري)</label>
                <input type="text" id="profPhone2" placeholder="أدخل رقم إضافي إن وجد">
            </div>
            <button class="btn-submit" onclick="saveProfileChanges()">حفظ التعديلات</button>
        </div>
    </div>

    <div class="modal-overlay" id="loginModal">
        <div class="modal-box">
            <button class="modal-close-btn" onclick="closeModal('loginModal')">✕</button>
            <h3 style="margin-bottom: 16px; font-size: 18px;">تسجيل الدخول بحسابك</h3>
            <div class="form-group">
                <label>اسم المستخدم (4 حروف إنجليزي) *</label>
                <input type="text" id="loginUsername" maxlength="4" style="text-transform: lowercase;" placeholder="مثال: abdo">
            </div>
            <div class="form-group">
                <label>كلمة المرور (4 أرقام / حروف) *</label>
                <input type="password" id="loginPin" maxlength="4" placeholder="أدخل كلمة المرور">
            </div>
            <button class="btn-submit" onclick="handleLogin()">دخول المنصة</button>
        </div>
    </div>

    <div class="modal-overlay" id="addModal">
        <div class="modal-box">
            <button class="modal-close-btn" onclick="closeModal('addModal')">✕</button>
            <h3 style="margin-bottom: 14px; font-size: 16px;">نشر شاغر وظيفي / خدمة جديد</h3>
            <div class="form-group">
                <label>عنوان الوظيفة / الخدمة *</label>
                <input type="text" id="jobTitleInput" placeholder="مثال: محاسب عام">
            </div>
            <div class="form-group">
                <label>اسم الشركة / المكان *</label>
                <input type="text" id="companyInput" placeholder="اسم الشركة أو المتجر">
            </div>
            <div class="form-group">
                <label>رقم التواصل (الواتساب) *</label>
                <input type="text" id="phoneInput" placeholder="770000000">
            </div>
            <div class="form-group">
                <label>صورة الإعلان / الشعار (اختياري من المعرض)</label>
                <input type="file" id="jobImageInput" accept="image/*" style="background:#f8fafc; padding:6px;">
            </div>
            <button class="btn-submit" onclick="submitNewJob()">إرسال للمراجعة والاعتماد</button>
        </div>
    </div>
    <script>
        // الوظائف الافتراضية الموحدة لجميع الزوار على أي جهاز
        var DEFAULT_JOBS = [
            { id: 1, title: 'محاسب مالي معتمد', company: 'شركة الأمل للتجارة - ذمار', phone: '967770000000', image: '', status: 'متوفر', approved: true },
            { id: 2, title: 'مسوق إلكتروني وميداني', company: 'مؤسسة صدارة', phone: '967770000000', image: '', status: 'متوفر', approved: true }
        ];

        function getStoredJobs() {
            var stored = localStorage.getItem('dhawar_jobs');
            if (!stored) {
                localStorage.setItem('dhawar_jobs', JSON.stringify(DEFAULT_JOBS));
                return DEFAULT_JOBS;
            }
            return JSON.parse(stored);
        }

        function getStoredPartners() {
            var stored = localStorage.getItem('dhawar_partners');
            if (!stored) {
                var defaultPartners = [
                    { id: 1, name: 'صدارة', logo: 'https://via.placeholder.com/60/0f2347/ffffff?text=SADARA' },
                    { id: 2, name: 'الأمل', logo: 'https://via.placeholder.com/60/d4af37/000000?text=AMAL' }
                ];
                localStorage.setItem('dhawar_partners', JSON.stringify(defaultPartners));
                return defaultPartners;
            }
            return JSON.parse(stored);
        }

        function openModal(id) { 
            document.getElementById(id).style.display = 'flex'; 
        }
        
        function closeModal(id) { 
            document.getElementById(id).style.display = 'none'; 
        }

        function checkAuthStatus() {
            var currentUser = JSON.parse(localStorage.getItem('currentUser'));
            var navAuthArea = document.getElementById('navAuthArea');

            if(currentUser) {
                navAuthArea.innerHTML = 
                    '<button class="profile-btn" onclick="openProfileModal()">👤 الملف الشخصي</button>' +
                    '<button class="btn-add-job" onclick="openModal(\'addModal\')">+ نشر شغل</button>' +
                    '<button class="auth-btn" style="background:#ef4444; color:white;" onclick="handleLogout()">خروج</button>';
            } else {
                navAuthArea.innerHTML = 
                    '<button class="btn-add-job" onclick="openModal(\'addModal\')">+ نشر شغل</button>' +
                    '<button class="register-btn" onclick="openModal(\'registerModal\')">حساب جديد</button>' +
                    '<button class="auth-btn" onclick="openModal(\'loginModal\')">تسجيل الدخول</button>';
            }
        }

        function openProfileModal() {
            var user = JSON.parse(localStorage.getItem('currentUser'));
            if(!user) return;

            document.getElementById('profName').value = user.name || '';
            document.getElementById('profPhone').value = user.phone || '';
            document.getElementById('profPhone2').value = user.phone2 || '';
            openModal('profileModal');
        }

        function saveProfileChanges() {
            var user = JSON.parse(localStorage.getItem('currentUser'));
            if(!user) return;

            var name = document.getElementById('profName').value.trim();
            var phone = document.getElementById('profPhone').value.trim();
            var phone2 = document.getElementById('profPhone2').value.trim();

            if(!name || !phone) {
                alert('الاسم ورقم الهاتف الأساسي مطلوبان');
                return;
            }

            user.name = name;
            user.phone = phone;
            user.phone2 = phone2;

            var users = JSON.parse(localStorage.getItem('dhawar_registered_users')) || [];
            for (var i = 0; i < users.length; i++) {
                if (users[i].username === user.username) {
                    users[i] = user;
                }
            }
            
            localStorage.setItem('dhawar_registered_users', JSON.stringify(users));
            localStorage.setItem('currentUser', JSON.stringify(user));

            alert('تم حفظ وتحديث البيانات بنجاح!');
            closeModal('profileModal');
            checkAuthStatus();
        }

        function handleRegister() {
            var name = document.getElementById('regName').value.trim();
            var username = document.getElementById('regUsername').value.trim().toLowerCase();
            var phone = document.getElementById('regPhone').value.trim();
            var pin = document.getElementById('regPin').value.trim();
            var role = document.getElementById('regRole').value;

            if(!name || !username || !phone || !pin) {
                alert('يرجى ملء جميع الحقول المطلوبة');
                return;
            }

            if(username.length !== 4) { alert('اسم المستخدم يجب أن يكون 4 حروف إنجليزية'); return; }
            if(pin.length !== 4) { alert('كلمة المرور يجب أن تكون 4 عناصر'); return; }

            var users = JSON.parse(localStorage.getItem('dhawar_registered_users')) || [];
            for (var i = 0; i < users.length; i++) {
                if(users[i].username === username) { 
                    alert('اسم المستخدم مستخدم مسبقاً'); 
                    return; 
                }
            }

            var newUser = { name: name, username: username, phone: phone, phone2: '', pin: pin, role: role };
            users.push(newUser);
            localStorage.setItem('dhawar_registered_users', JSON.stringify(users));
            localStorage.setItem('currentUser', JSON.stringify(newUser));

            alert('مرحباً بك يا ' + name + '! تم إنشاء حسابك بنجاح.');
            closeModal('registerModal');
            checkAuthStatus();
        }

        function handleLogin() {
            var username = document.getElementById('loginUsername').value.trim().toLowerCase();
            var pin = document.getElementById('loginPin').value.trim();

            if(!username || !pin) {
                alert('يرجى إدخال اسم المستخدم وكلمة المرور');
                return;
            }

            var users = JSON.parse(localStorage.getItem('dhawar_registered_users')) || [];
            var foundUser = null;
            for (var i = 0; i < users.length; i++) {
                if (users[i].username === username && users[i].pin === pin) {
                    foundUser = users[i];
                    break;
                }
            }

            if(foundUser) {
                localStorage.setItem('currentUser', JSON.stringify(foundUser));
                alert('أهلاً بعودتك يا ' + foundUser.name + '!');
                closeModal('loginModal');
                checkAuthStatus();
            } else {
                alert('اسم المستخدم أو كلمة المرور غير صحيحة.');
            }
        }

        function handleLogout() {
            localStorage.removeItem('currentUser');
            alert('تم تسجيل الخروج بنجاح.');
            checkAuthStatus();
        }

        function renderTicker() {
            var partners = getStoredPartners();
            var container = document.getElementById('tickerContainer');
            if(!container) return;
            container.innerHTML = '';

            for (var i = 0; i < partners.length; i++) {
                var p = partners[i];
                container.innerHTML += '<img class="ticker-logo-only" src="' + p.logo + '" alt="' + p.name + '">';
            }
        }

        function renderMainJobs() {
            var allJobs = getStoredJobs();
            var container = document.getElementById('jobsContainer');
            container.innerHTML = '';

            var approvedJobs = [];
            for (var i = 0; i < allJobs.length; i++) {
                if (allJobs[i].approved === true) {
                    approvedJobs.push(allJobs[i]);
                }
            }

            if (approvedJobs.length === 0) {
                container.innerHTML = '<p style="text-align:center; padding:20px; color:var(--text-muted);">لا توجد وظائف معروضة حالياً</p>';
            } else {
                for (var j = 0; j < approvedJobs.length; j++) {
                    var job = approvedJobs[j];
                    var isAvailable = (job.status === 'متوفر');
                    var imgTag = (job.image) ? '<img src="' + job.image + '" class="job-card-img" alt="صورة الإعلان">' : '';
                    var statusClass = isAvailable ? 'status-available' : 'status-unavailable';
                    var applyBtnClass = isAvailable ? 'apply-btn' : 'apply-btn disabled';
                    var applyBtnText = isAvailable ? 'رقم التقديم (واتساب)' : 'التقديم مغلق';
                    var applyLink = isAvailable ? ('https://wa.me/' + job.phone) : '#';

                    var cardHtml = '<div class="job-card">';
                    cardHtml += imgTag;
                    cardHtml += '<div class="job-header-row">';
                    cardHtml += '<div><div class="job-title">' + job.title + '</div><div class="job-company">' + job.company + '</div></div>';
                    cardHtml += '<span class="status-badge ' + statusClass + '">' + job.status + '</span>';
                    cardHtml += '</div>';
                    cardHtml += '<div class="job-card-footer">';
                    cardHtml += '<span style="font-size:12px; color:var(--text-muted);">ذمار - اليمن</span>';
                    cardHtml += '<a href="' + applyLink + '" target="_blank" class="' + applyBtnClass + '">' + applyBtnText + '</a>';
                    cardHtml += '</div></div>';

                    container.innerHTML += cardHtml;
                }
            }

            var topBanner = localStorage.getItem('ad_banner_top');
            if(topBanner) {
                document.getElementById('topAdBanner').innerHTML = '<img src="' + topBanner + '">';
            }
        }

        function submitNewJob() {
            var title = document.getElementById('jobTitleInput').value;
            var company = document.getElementById('companyInput').value;
            var phone = document.getElementById('phoneInput').value;
            var imgInput = document.getElementById('jobImageInput');
            var imgFile = imgInput.files[0];

            if (!title || !company || !phone) {
                alert('يرجى ملء كافة البيانات المطلوبة');
                return;
            }

            function saveJob(imgData) {
                var jobs = getStoredJobs();
                jobs.push({
                    id: Date.now(),
                    title: title,
                    company: company,
                    phone: phone,
                    image: imgData || '',
                    status: 'متوفر',
                    approved: false
                });

                localStorage.setItem('dhawar_jobs', JSON.stringify(jobs));
                alert('تم إرسال الوظيفة مع الصورة بنجاح! ستظهر بالمنصة فور اعتمادها من الإدارة.');
                closeModal('addModal');
            }

            if(imgFile) {
                var reader = new FileReader();
                reader.onload = function(e) { saveJob(e.target.result); };
                reader.readAsDataURL(imgFile);
            } else {
                saveJob('');
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            checkAuthStatus();
            renderMainJobs();
            renderTicker();
        });
    </script>
</body>
</html>
