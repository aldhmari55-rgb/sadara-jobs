<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة صدارة للوظائف والخدمات | ذمار</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-dark: #0a1324;
            --primary-blue: #0f2347;
            --accent-gold: #d4af37;
            --accent-blue: #2563eb;
            --bg-light: #f8fafc;
            --card-bg: #ffffff;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --whatsapp-green: #25d366;
            --border-color: #e2e8f0;
            --radius-lg: 16px;
            --radius-md: 10px;
            --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.05);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background-color: var(--bg-light); color: var(--text-dark); padding-bottom: 40px; }

        .top-navbar {
            background: var(--primary-dark);
            color: #ffffff;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
        }

        .brand-logo-wrap { display: flex; align-items: center; gap: 10px; }
        .brand-logo {
            background: linear-gradient(135deg, var(--accent-gold), #fff8dc);
            color: var(--primary-dark);
            width: 40px; height: 40px; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; font-weight: 900;
        }

        .nav-auth-actions { display: flex; gap: 8px; align-items: center; }
        .auth-btn {
            background: linear-gradient(135deg, var(--accent-gold), #f3e5ab);
            color: var(--primary-dark);
            border: none; padding: 7px 16px; border-radius: 20px;
            font-weight: 800; font-size: 13px; cursor: pointer;
        }
        .btn-add-job {
            background: var(--accent-blue);
            color: #ffffff; border: none; padding: 7px 16px; border-radius: 20px;
            font-weight: 800; font-size: 13px; cursor: pointer;
        }
        .user-welcome { font-size: 12px; color: var(--accent-gold); font-weight: 800; }

        .hero-banner-title {
            background: linear-gradient(180deg, var(--primary-dark) 0%, var(--primary-blue) 100%);
            color: #ffffff; padding: 28px 20px 45px 20px; text-align: center;
        }
        .hero-banner-title h1 { font-size: 22px; font-weight: 900; }

        .main-container { max-width: 800px; margin: -25px auto 0 auto; padding: 0 16px; }

        .ad-banner-box {
            background: var(--card-bg); border-radius: var(--radius-lg);
            border: 1px solid var(--border-color); overflow: hidden;
            box-shadow: var(--shadow-sm); margin-bottom: 20px; text-align: center;
            min-height: 80px; display: flex; align-items: center; justify-content: center;
        }
        .ad-banner-box img { width: 100%; height: auto; display: block; max-height: 250px; object-fit: cover; }
        .ad-banner-text { padding: 15px; color: var(--text-muted); font-size: 14px; font-weight: 700; }

        .jobs-section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
        .jobs-section-title { font-size: 20px; font-weight: 900; color: var(--primary-dark); }
        .show-all-btn { background: #e2e8f0; color: var(--text-dark); border: none; padding: 5px 12px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; }

        .jobs-grid { display: flex; flex-direction: column; gap: 16px; }
        .job-card { background: var(--card-bg); border-radius: var(--radius-lg); padding: 18px; border: 1px solid var(--border-color); box-shadow: var(--shadow-sm); }
        .job-header-row { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
        .job-title { font-size: 18px; font-weight: 800; color: var(--primary-blue); }
        .job-company { font-size: 14px; color: var(--text-muted); font-weight: 700; margin-top: 2px; }
        .status-badge { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 800; }
        .status-available { background: #dcfce7; color: #166534; }
        .status-unavailable { background: #fee2e2; color: #991b1b; }

        .job-card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; padding-top: 12px; border-top: 1px solid #f1f5f9; }
        .apply-btn { background: var(--whatsapp-green); color: #ffffff; text-decoration: none; padding: 8px 18px; border-radius: var(--radius-md); font-weight: 800; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
        .apply-btn.disabled { background: #cbd5e1; pointer-events: none; }

        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(10, 19, 36, 0.75); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 16px; }
        .modal-box { background: #ffffff; width: 100%; max-width: 440px; border-radius: var(--radius-lg); padding: 24px; position: relative; }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 12px; font-weight: 800; margin-bottom: 5px; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: var(--radius-md); font-size: 13px; outline: none; }
        .btn-submit { width: 100%; background: var(--primary-blue); color: #ffffff; border: none; padding: 11px; border-radius: var(--radius-md); font-weight: 800; font-size: 14px; cursor: pointer; margin-top: 8px; }
        .modal-close-btn { position: absolute; left: 15px; top: 15px; border: none; background: #f1f5f9; width: 28px; height: 28px; border-radius: 50%; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <!-- الهيدر العلوي -->
    <div class="top-navbar">
        <div class="brand-logo-wrap">
            <div class="brand-logo">ص</div>
            <span style="font-weight: 800;">صدارة للوظائف</span>
        </div>
        <div class="nav-auth-actions" id="navAuthArea">
            <button class="btn-add-job" onclick="openModal('addModal')">+ نشر شغل</button>
            <button class="auth-btn" onclick="openModal('authModal')">دخول / اشتراك</button>
        </div>
    </div>

    <!-- العنوان والبنر -->
    <div class="hero-banner-title">
        <h1>المنصة الأولى للوظائف بمحافظة ذمار</h1>
    </div>

    <div class="main-container">
        <!-- البنـر العلـوي -->
        <div class="ad-banner-box" id="topAdBanner"><div class="ad-banner-text">إعلان المنصة العلوي</div></div>

        <!-- قائمة الوظائف -->
        <div class="jobs-section-header">
            <h2 class="jobs-section-title">الوظائف والخدمات المتاحة</h2>
            <button class="show-all-btn" onclick="renderMainJobs()">عرض الكل</button>
        </div>

        <div class="jobs-grid" id="jobsContainer"></div>

        <!-- البنـر السفلـي -->
        <div class="ad-banner-box" style="margin-top: 25px;" id="bottomAdBanner"><div class="ad-banner-text">إعلان المنصة السفلي</div></div>
    </div>

    <!-- نافذة تسجيل الدخول / إنشاء حساب -->
    <div class="modal-overlay" id="authModal">
        <div class="modal-box">
            <button class="modal-close-btn" onclick="closeModal('authModal')">✕</button>
            <h3 style="margin-bottom: 16px; font-size: 18px;">تسجيل الدخول / طلب حساب جديد</h3>
            
            <div class="form-group">
                <label>نوع الحساب</label>
                <select id="userRoleSelect">
                    <option value="باحث عن عمل">باحث عن عمل (موظف)</option>
                    <option value="صاحب عمل">صاحب عمل (مؤسسة / متجر)</option>
                </select>
            </div>
            <div class="form-group">
                <label>الاسم الكامل / اسم الجهة *</label>
                <input type="text" id="authName" placeholder="أدخل اسمك أو اسم شركتك">
            </div>
            <div class="form-group">
                <label>رقم الهاتف (الواتساب) *</label>
                <input type="text" id="authPhone" placeholder="770000000">
            </div>
            <button class="btn-submit" onclick="handleRegisterSubmit()">إرسال الطلب للإدارة للموافقة</button>
        </div>
    </div>

    <!-- نافذة إضافة وظيفة -->
    <div class="modal-overlay" id="addModal">
        <div class="modal-box">
            <button class="modal-close-btn" onclick="closeModal('addModal')">✕</button>
            <h3 style="margin-bottom: 14px; font-size: 16px;">نشر شاغر وظيفي / خدمة جديد</h3>
            <div class="form-group">
                <label>عنوان الوظيفة *</label>
                <input type="text" id="jobTitleInput" placeholder="مثال: محاسب، مسوق إلكتروني">
            </div>
            <div class="form-group">
                <label>اسم الشركة / المكان *</label>
                <input type="text" id="companyInput" placeholder="اسم المحل أو الشركة">
            </div>
            <div class="form-group">
                <label>رقم التواصل (الواتساب) *</label>
                <input type="text" id="phoneInput" placeholder="770000000">
            </div>
            <button class="btn-submit" onclick="submitNewJob()">إرسال للمراجعة والاعتماد</button>
        </div>
    </div>

    <script>
        const DEFAULT_JOBS = [
            { id: 1, title: 'محاسب مالي معتمد', company: 'شركة الأمل للتجارة - ذمار', phone: '967770000000', status: 'متوفر', approved: true }
        ];

        function getStoredJobs() {
            return JSON.parse(localStorage.getItem('dhawar_jobs')) || DEFAULT_JOBS;
        }

        function checkAuthStatus() {
            const currentUser = JSON.parse(localStorage.getItem('currentUser'));
            const navAuthArea = document.getElementById('navAuthArea');

            if(currentUser && currentUser.approved) {
                navAuthArea.innerHTML = `
                    <span class="user-welcome">👤 ${currentUser.name} (${currentUser.role})</span>
                    <button class="btn-add-job" onclick="openModal('addModal')">+ نشر شغل</button>
                    <button class="auth-btn" style="background:#ef4444; color:white;" onclick="handleLogout()">خروج</button>
                `;
            } else {
                navAuthArea.innerHTML = `
                    <button class="btn-add-job" onclick="openModal('addModal')">+ نشر شغل</button>
                    <button class="auth-btn" onclick="openModal('authModal')">دخول / اشتراك</button>
                `;
            }
        }

        function handleRegisterSubmit() {
            const name = document.getElementById('authName').value;
            const phone = document.getElementById('authPhone').value;
            const role = document.getElementById('userRoleSelect').value;

            if(!name || !phone) {
                alert('يرجى كتابة الاسم ورقم الهاتف بوضوح');
                return;
            }

            const users = JSON.parse(localStorage.getItem('dhawar_users')) || [];
            users.push({ id: Date.now(), name, phone, role, approved: false });
            localStorage.setItem('dhawar_users', JSON.stringify(users));

            alert('تم إرسال طلب إنشاء الحساب بنجاح! سيتم تفعيل حسابك فور مراجعته وقبوله من قبل إدارة المنصة.');
            closeModal('authModal');
        }

        function handleLogout() {
            localStorage.removeItem('currentUser');
            alert('تم تسجيل الخروج بنجاح.');
            checkAuthStatus();
        }

        function renderMainJobs() {
            const jobs = getStoredJobs().filter(j => j.approved === true);
            const container = document.getElementById('jobsContainer');
            container.innerHTML = '';

            if (jobs.length === 0) {
                container.innerHTML = '<p style="text-align:center; padding:20px; color:var(--text-muted);">لا توجد وظائف معروضة حالياً</p>';
            } else {
                jobs.forEach(job => {
                    const isAvailable = job.status === 'متوفر';
                    container.innerHTML += `
                        <div class="job-card">
                            <div class="job-header-row">
                                <div>
                                    <div class="job-title">${job.title}</div>
                                    <div class="job-company">${job.company}</div>
                                </div>
                                <span class="status-badge ${isAvailable ? 'status-available' : 'status-unavailable'}">${job.status}</span>
                            </div>
                            <div class="job-card-footer">
                                <span style="font-size:12px; color:var(--text-muted);">ذمار - اليمن</span>
                                <a href="${isAvailable ? 'https://wa.me/' + job.phone : '#'}" target="_blank" class="apply-btn ${!isAvailable ? 'disabled' : ''}">
                                    ${isAvailable ? 'رقم التقديم (واتساب)' : 'التقديم مغلق'}
                                </a>
                            </div>
                        </div>
                    `;
                });
            }

            // تحميل البنرات من الذاكرة
            const topBanner = localStorage.getItem('ad_banner_top');
            if(topBanner) document.getElementById('topAdBanner').innerHTML = `<img src="${topBanner}">`;
            
            const bottomBanner = localStorage.getItem('ad_banner_bottom');
            if(bottomBanner) document.getElementById('bottomAdBanner').innerHTML = `<img src="${bottomBanner}">`;
        }

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        function submitNewJob() {
            const title = document.getElementById('jobTitleInput').value;
            const company = document.getElementById('companyInput').value;
            const phone = document.getElementById('phoneInput').value;

            if (!title || !company || !phone) {
                alert('يرجى ملء كافة البيانات المطلوب');
                return;
            }

            const jobs = getStoredJobs();
            jobs.push({
                id: Date.now(),
                title: title,
                company: company,
                phone: phone,
                status: 'متوفر',
                approved: false
            });

            localStorage.setItem('dhawar_jobs', JSON.stringify(jobs));
            alert('تم إرسال الوظيفة! ستظهر بالمنصة فور اعتمادها من قبل إدارة المنصة.');
            closeModal('addModal');
        }

        document.addEventListener('DOMContentLoaded', () => {
            checkAuthStatus();
            renderMainJobs();
        });
    </script>
</body>
</html>
