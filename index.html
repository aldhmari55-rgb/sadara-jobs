<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة صدارة للوظائف والخدمات | ذمار</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary:#0f2347; --gold:#d4af37; --green:#25d366; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background: #f8fafc; padding-bottom: 90px; }
        .top-navbar { background: #0a1324; color: white; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
        .hero { background: var(--primary); color: white; padding: 25px; text-align: center; }
        .main-container { max-width: 800px; margin: -20px auto 0; padding: 0 16px; }
        .ad-slider-box { background: white; border-radius: 12px; overflow: hidden; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); min-height: 120px; display: flex; align-items: center; justify-content: center; }
        .ad-slider-img { width: 100%; max-height: 240px; object-fit: cover; display: none; }
        .ad-slider-img.active { display: block; }
        .job-card { background: white; border-radius: 12px; padding: 16px; margin-bottom: 14px; border: 1px solid #e2e8f0; }
        .job-card img { width: 100%; max-height: 220px; object-fit: cover; border-radius: 8px; margin-bottom: 10px; }
        .apply-btn { background: var(--green); color: white; text-decoration: none; padding: 8px 16px; border-radius: 8px; font-weight: bold; font-size: 12px; display: inline-block; margin-top: 10px; }
        .partners-ticker { position: fixed; bottom: 0; left: 0; right: 0; background: #0a1324; padding: 8px 0; border-top: 2px solid var(--gold); display: flex; align-items: center; z-index: 900; }
        .ticker-label { background: var(--gold); color: #0a1324; font-weight: 900; font-size: 11px; padding: 6px 12px; border-radius: 0 12px 12px 0; z-index: 10; }
        .ticker-content { display: flex; align-items: center; gap: 15px; animation: ticker 20s linear infinite; }
        .ticker-content img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid var(--gold); background: white; }
        @keyframes ticker { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
    </style>
</head>
<body>

    <div class="top-navbar">
        <span style="font-weight: 900;">صدارة للوظائف والخدمات</span>
    </div>

    <div class="hero">
        <h1 style="font-size: 20px;">المنصة الأولى للوظائف بمحافظة ذمار</h1>
    </div>

    <div class="main-container">
        <div class="ad-slider-box" id="sliderBox"></div>
        <h2 style="font-size: 18px; margin-bottom: 12px; color: #0f172a;">الوظائف والخدمات المتاحة</h2>
        <div id="jobsBox"></div>
    </div>

    <div class="partners-ticker">
        <div class="ticker-label">شركاء النجاح 🤝</div>
        <div style="display:flex; overflow:hidden; width:100%;">
            <div class="ticker-content" id="tickerBox"></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://lvutrzswngpkjfamgact.supabase.co";
        const SUPABASE_KEY = "sb_publishable_fB8RmZyfymR8YpjLInA2LQ_hMA6qgRG";
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function initPlatform() {
            // 1. جلب البنرات
            let { data: banners } = await db.from('banners').select('*');
            let sBox = document.getElementById('sliderBox');
            sBox.innerHTML = '';
            (banners || []).forEach((b, i) => {
                sBox.innerHTML += `<img src="${b.url}" class="ad-slider-img ${i===0?'active':''}">`;
            });
            let idx = 0;
            setInterval(() => {
                let imgs = sBox.querySelectorAll('img');
                if(imgs.length <= 1) return;
                imgs[idx].classList.remove('active');
                idx = (idx + 1) % imgs.length;
                imgs[idx].classList.add('active');
            }, 3500);

            // 2. جلب الشركاء
            let { data: partners } = await db.from('partners').select('*');
            let tBox = document.getElementById('tickerBox');
            tBox.innerHTML = '';
            (partners || []).forEach(p => {
                tBox.innerHTML += `<img src="${p.logo}" alt="${p.name}">`;
            });

            // 3. جلب الوظائف
            let { data: jobs } = await db.from('jobs').select('*').eq('approved', true).order('id', {ascending: false});
            let jBox = document.getElementById('jobsBox');
            jBox.innerHTML = '';
            (jobs || []).forEach(j => {
                let imgTag = (j.image && j.image.trim() !== '') ? `<img src="${j.image}">` : '';
                let statusBadge = (j.status === 'متوفر') ? '<span style="background:#dcfce7; color:#166534; padding:3px 8px; border-radius:12px; font-size:11px; font-weight:bold;">متوفر</span>' : '<span style="background:#fee2e2; color:#991b1b; padding:3px 8px; border-radius:12px; font-size:11px; font-weight:bold;">غير متوفر</span>';
                
                jBox.innerHTML += `<div class="job-card">
                    ${imgTag}
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <h3 style="font-size: 16px; color:#0f2347;">${j.title}</h3>
                        ${statusBadge}
                    </div>
                    <p style="font-size: 13px; color:#64748b; margin-top:4px;">${j.company}</p>
                    <a href="https://wa.me/${j.phone}" target="_blank" class="apply-btn">تقديم عبر الواتساب 🟢</a>
                </div>`;
            });
        }

        document.addEventListener('DOMContentLoaded', initPlatform);
    </script>
</body>
</html>
