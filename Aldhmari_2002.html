<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الإدارة الشاملة | منصة صدارة</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { 
            --primary: #111827;
            --light: #F9FAFB;
            --gold: #D4AF37;
            --btn: #0284C7;
            --red: #EF4444; 
            --green: #10B981;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background: var(--light); padding: 15px; color: var(--primary); padding-bottom: 60px; }

        .container { max-width: 900px; margin: 0 auto; }
        .top-nav { background: var(--primary); padding: 12px 18px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; color: white; margin-bottom: 20px; }
        .mini-btn { background: rgba(255,255,255,0.1); color: white; text-decoration: none; padding: 6px 12px; border-radius: 8px; font-size: 11px; font-weight: bold; }

        .section-box { background: #ffffff; padding: 18px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #E5E7EB; box-shadow: 0 2px 6px rgba(0,0,0,0.02); }
        .section-box h3 { font-size: 14px; margin-bottom: 12px; font-weight: 900; color: var(--primary); }

        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; font-size: 11px; font-weight: 900; margin-bottom: 4px; color: #374151; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 9px; border: 1px solid #E5E7EB; border-radius: 8px; font-size: 11px; outline: none; background: #F9FAFB; }

        .submit-btn { background: var(--btn); color: white; border: none; padding: 11px; border-radius: 8px; font-weight: 900; width: 100%; cursor: pointer; font-size: 12px; }
        
        .data-row { background: #F9FAFB; border: 1px solid #E5E7EB; padding: 10px; border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
        .action-btn { border: none; padding: 6px 10px; border-radius: 6px; font-weight: 900; font-size: 10px; cursor: pointer; color: white; }
    </style>
</head>
<body>

    <div class="container">
        <div class="top-nav">
            <span>⚙️ لوحة التحكم والإدارة</span>
            <a href="index.html" class="mini-btn">المتجر الرئيسي 🏪</a>
        </div>

        <!-- مربع إدارة ورفع البنرات الإعلانية الثلاثة من المعرض -->
        <div class="section-box">
            <h3>🖼️ إدارة ورفع البنرات الإعلانية الثلاثة من المعرض</h3>
            <div class="form-group">
                <label>اختر صورة البنر العلوي (Top Banner)</label>
                <input type="file" id="topBannerFile" accept="image/*">
            </div>
            <div class="form-group">
                <label>اختر صورة البنر الأوسط (Middle Banner)</label>
                <input type="file" id="midBannerFile" accept="image/*">
            </div>
            <div class="form-group">
                <label>اختر صورة البنر السفلي (Bottom Banner)</label>
                <input type="file" id="botBannerFile" accept="image/*">
            </div>
            <button onclick="uploadBanners()" class="submit-btn" style="background:var(--primary); color:var(--gold);">رفع وتحديث البنرات سحابياً 🌟</button>
        </div>

        <!-- إضافة / تعديل منتج وتخفيض -->
        <div class="section-box">
            <h3 id="formTitle">➕ إضافة / تعديل منتج أو عرض تخفيض</h3>
            <input type="hidden" id="editProductId">
            <div class="form-group"><label>عنوان المنتج</label><input type="text" id="pTitle"></div>
            <div class="form-group">
                <label>القسم</label>
                <select id="pCategory">
                    <option value="إلكترونيات">إلكترونيات</option>
                    <option value="جوالات">جوالات</option>
                    <option value="اكسسوارات">اكسسوارات</option>
                    <option value="ساعات واساور">ساعات وأساور</option>
                    <option value="بطاريات متنقلة">باوربانك</option>
                    <option value="عطور">عطور</option>
                    <option value="ملابس">ملابس</option>
                </select>
            </div>
            <div class="form-group"><label>السعر الحالي</label><input type="text" id="pPrice" placeholder="1500 ريال"></div>
            <div class="form-group"><label>السعر السابق المشطوب (اختياري لتفعيل التخفيض والعرض)</label><input type="text" id="pOldPrice" placeholder="2000 ريال"></div>
            <div class="form-group"><label>نسبة الخصم (مثل: 25%)</label><input type="text" id="pDiscount" placeholder="25%"></div>
            <div class="form-group"><label>صورة المنتج</label><input type="file" id="pImage" accept="image/*"></div>
            <div class="form-group"><label>الوصف</label><textarea id="pDesc" rows="2"></textarea></div>
            <button onclick="saveProductData()" id="saveBtn" class="submit-btn">نشر المنتج في المتجر 🚀</button>
        </div>

        <!-- قائمة المنتجات -->
        <div class="section-box">
            <h3>📦 قائمة المنتجات والتخفيضات (تعديل وحذف)</h3>
            <div id="productsAdminList">جاري التحميل...</div>
        </div>

        <!-- إدارة المسوقين والعمولات -->
        <div class="section-box">
            <h3>🤝 مسوقي المتجر (الأفلييت) والعمولات</h3>
            <div id="affiliatesAdminList">جاري التحميل...</div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://lvutrzswngpkjfamgact.supabase.co";
        const SUPABASE_KEY = "sb_publishable_fB8RmZyfymR8YpjLInA2LQ_hMA6qgRG";
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let globalProducts = [];

        async function loadAdminPanel() {
            let { data: prods } = await db.from('platform_services').select('*').order('id', {ascending: false});
            globalProducts = prods || [];
            let pBox = document.getElementById('productsAdminList');
            pBox.innerHTML = '';

            globalProducts.forEach(p => {
                pBox.innerHTML += `
                    <div class="data-row">
                        <div style="font-size:11px;"><b>${p.title}</b> - السعر: <span style="color:var(--red);">${p.price}</span> ${p.old_price ? `(السابق: ${p.old_price})` : ''}</div>
                        <div>
                            <button class="action-btn" style="background:var(--btn);" onclick="editProduct(${p.id})">تعديل ✏️</button>
                            <button class="action-btn" style="background:var(--red);" onclick="deleteRecord('platform_services', ${p.id})">حذف 🗑️</button>
                        </div>
                    </div>
                `;
            });

            let { data: affs } = await db.from('affiliates').select('*');
            let aBox = document.getElementById('affiliatesAdminList');
            aBox.innerHTML = '';
            if(affs) {
                affs.forEach(a => {
                    aBox.innerHTML += `
                        <div class="data-row">
                            <div style="font-size:11px;">👤 ${a.full_name || a.name} (${a.phone}) | كود: <code>${a.ref_code}</code> | العمولات: <b style="color:var(--green);">${a.total_earnings || 0} YER</b></div>
                            <button class="action-btn" style="background:var(--red);" onclick="deleteRecord('affiliates', ${a.id})">حذف 🗑️</button>
                        </div>
                    `;
                });
            }
        }

        async function uploadBanners() {
            let topFile = document.getElementById('topBannerFile').files[0];
            let midFile = document.getElementById('midBannerFile').files[0];
            let botFile = document.getElementById('botBannerFile').files[0];

            if(topFile) {
                let fileName = 'banners/top_' + Date.now() + '_' + topFile.name;
                let { data } = await db.storage.from('products_images').upload(fileName, topFile);
                if(data) {
                    let { data: pub } = db.storage.from('products_images').getPublicUrl(fileName);
                    await db.from('store_settings').upsert({ key: 'top_banner', value: pub.publicUrl });
                }
            }

            if(midFile) {
                let fileName = 'banners/mid_' + Date.now() + '_' + midFile.name;
                let { data } = await db.storage.from('products_images').upload(fileName, midFile);
                if(data) {
                    let { data: pub } = db.storage.from('products_images').getPublicUrl(fileName);
                    await db.from('store_settings').upsert({ key: 'middle_banner', value: pub.publicUrl });
                }
            }

            if(botFile) {
                let fileName = 'banners/bot_' + Date.now() + '_' + botFile.name;
                let { data } = await db.storage.from('products_images').upload(fileName, botFile);
                if(data) {
                    let { data: pub } = db.storage.from('products_images').getPublicUrl(fileName);
                    await db.from('store_settings').upsert({ key: 'bottom_banner', value: pub.publicUrl });
                }
            }

            alert('تم رفع وتحديث البنرات بنجاح وعرضها في المتجر! 🌟');
        }

        async function saveProductData() {
            let editId = document.getElementById('editProductId').value;
            let title = document.getElementById('pTitle').value.trim();
            let category = document.getElementById('pCategory').value;
            let price = document.getElementById('pPrice').value.trim();
            let old_price = document.getElementById('pOldPrice').value.trim();
            let discount = document.getElementById('pDiscount').value.trim();
            let fileInput = document.getElementById('pImage');
            let description = document.getElementById('pDesc').value.trim();

            if(!title || !price) { alert('أدخل العنوان والسعر'); return; }

            let imageUrl = '';
            if(fileInput.files[0]) {
                let file = fileInput.files[0];
                let fileName = 'products/' + Date.now() + '_' + file.name;
                let { data } = await db.storage.from('products_images').upload(fileName, file);
                if(data) {
                    let { data: pub } = db.storage.from('products_images').getPublicUrl(fileName);
                    imageUrl = pub.publicUrl;
                }
            }

            let payload = { title, category, price, old_price, discount, description, is_active: true };
            if(imageUrl) payload.image = imageUrl;

            if(editId) {
                await db.from('platform_services').update(payload).eq('id', editId);
                alert('تم التعديل بنجاح!');
            } else {
                await db.from('platform_services').insert([payload]);
                alert('تمت الإضافة بنجاح!');
            }
            location.reload();
        }

        function editProduct(id) {
            let p = globalProducts.find(x => x.id === id);
            if(p) {
                document.getElementById('editProductId').value = p.id;
                document.getElementById('pTitle').value = p.title;
                document.getElementById('pCategory').value = p.category;
                document.getElementById('pPrice').value = p.price;
                document.getElementById('pOldPrice').value = p.old_price || '';
                document.getElementById('pDiscount').value = p.discount || '';
                document.getElementById('pDesc').value = p.description || '';
                window.scrollTo({top:0, behavior:'smooth'});
            }
        }

        async function deleteRecord(table, id) {
            if(confirm('تأكيد الحذف؟')) {
                await db.from(table).delete().eq('id', id);
                loadAdminPanel();
            }
        }

        window.addEventListener('DOMContentLoaded', loadAdminPanel);
    </script>
</body>
</html>
