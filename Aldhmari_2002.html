<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة إدارة منصة صدارة</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { 
            --primary: #001D39; 
            --gold: #d4af37; 
            --emerald-btn: #10B981;
            --spec-bg: #F0F7FF;
            --spec-border: #0284C7;
            --spec-text: #1E3A8A;
            --red: #ef4444; 
            --bg: #eef2f7;
            --neu-surface: #eef2f7;
            --neu-shadow: 8px 8px 16px #cbced1, -8px -8px 16px #ffffff;
            --neu-shadow-inset: inset 4px 4px 8px #cbced1, inset -4px -4px 8px #ffffff;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background: var(--bg); padding: 20px; color: #0f172a; }

        .admin-card { background: var(--neu-surface); padding: 25px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.9); max-width: 900px; margin: 0 auto; box-shadow: var(--neu-shadow); }
        .admin-header { background: var(--primary); color: white; padding: 20px; border-radius: 14px; text-align: center; margin-bottom: 20px; border-bottom: 3px solid var(--gold); }
        
        .section-box { background: var(--neu-surface); padding: 18px; border-radius: 16px; margin-bottom: 20px; box-shadow: var(--neu-shadow-inset); }
        .section-box h3 { color: var(--primary); font-size: 15px; margin-bottom: 12px; font-weight: 900; }

        .data-row { background: var(--neu-surface); border-right: 4px solid var(--spec-border); padding: 12px 16px; border-radius: 10px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; box-shadow: var(--neu-shadow); }
        .data-info { font-size: 12px; color: var(--spec-text); font-weight: 700; }

        .action-btn { border: none; padding: 8px 14px; border-radius: 8px; font-weight: 900; font-size: 11px; cursor: pointer; color: white; transition: 0.3s; }
        .btn-delete { background: var(--red); }
        .btn-delete:hover { opacity: 0.8; }
    </style>
</head>
<body>

    <div class="admin-card">
        <div class="admin-header">
            <h2>⚙️ لوحة تحكم وإدارة منصة صدارة</h2>
            <p style="font-size:11px; opacity:0.8; margin-top:4px;">إدارة الوظائف، الكفاءات، والطلبات الواردة مباشرة</p>
        </div>

        <div class="section-box">
            <h3>💼 الوظائف المسجلة</h3>
            <div id="jobsAdminList">جاري التحميل...</div>
        </div>

        <div class="section-box">
            <h3>👨‍💻 دليل الكفاءات والخبرات</h3>
            <div id="resumesAdminList">جاري التحميل...</div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://lvutrzswngpkjfamgact.supabase.co";
        const SUPABASE_KEY = "sb_publishable_fB8RmZyfymR8YpjLInA2LQ_hMA6qgRG";
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function loadAdminData() {
            let { data: jobs } = await db.from('jobs').select('*').order('id', {ascending: false});
            let jBox = document.getElementById('jobsAdminList');
            jBox.innerHTML = '';
            (jobs || []).forEach(j => {
                jBox.innerHTML += `
                    <div class="data-row">
                        <div class="data-info">📌 ${j.title} | ${j.company || 'صدارة'} (${j.phone || 'بدون رقم'})</div>
                        <button class="action-btn btn-delete" onclick="deleteItem('jobs', ${j.id})">حذف 🗑️</button>
                    </div>
                `;
            });

            let { data: resumes } = await db.from('resumes').select('*').order('id', {ascending: false});
            let rBox = document.getElementById('resumesAdminList');
            rBox.innerHTML = '';
            (resumes || []).forEach(r => {
                rBox.innerHTML += `
                    <div class="data-row">
                        <div class="data-info">👤 ${r.name || r.title} | ${r.job_title || 'تخصص عام'} (${r.phone || 'بدون رقم'})</div>
                        <button class="action-btn btn-delete" onclick="deleteItem('resumes', ${r.id})">حذف 🗑️</button>
                    </div>
                `;
            });
        }

        async function deleteItem(table, id) {
            if(confirm('هل أنت تأكد من رغبتك في حذف هذا العنصر؟')) {
                await db.from(table).delete().eq('id', id);
                loadAdminData();
            }
        }

        window.addEventListener('DOMContentLoaded', loadAdminData);
    </script>
</body>
</html>
