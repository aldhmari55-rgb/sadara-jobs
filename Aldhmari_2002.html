<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الشاملة والإدارة المطلقة | منصة صدارة</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { 
            --sadarah-primary: #0F2A4A;
            --sadarah-light: #F4F7FB;
            --sadarah-gold: #D4AF37;
            --sadarah-btn: #0284C7;
            --red: #ef4444; 
            --green: #10b981;
            --neu-shadow: 6px 6px 14px #cbced1, -6px -6px 14px #ffffff;
            --neu-shadow-inset: inset 3px 3px 6px #cbced1, inset -3px -3px 6px #ffffff;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background: var(--sadarah-light); padding: 15px; color: #0f172a; }

        .container { max-width: 950px; margin: 0 auto; }
        .top-navbar { background: var(--sadarah-primary); padding: 12px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; color: white; margin-bottom: 20px; }
        .mini-btn { background: rgba(255,255,255,0.1); color: white; text-decoration: none; padding: 6px 12px; border-radius: 8px; font-size: 11px; font-weight: bold; }

        .section-box { background: var(--sadarah-light); padding: 18px; border-radius: 16px; margin-bottom: 20px; box-shadow: var(--neu-shadow-inset); }
        .section-box h3 { color: var(--sadarah-primary); font-size: 14px; margin-bottom: 12px; font-weight: 900; }

        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; font-size: 11px; font-weight: 900; color: var(--sadarah-primary); margin-bottom: 4px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border: none; border-radius: 8px; font-size: 11px; outline: none; background: #ffffff; box-shadow: var(--neu-shadow-inset); }

        .submit-btn { background: var(--sadarah-btn); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: 900; width: 100%; cursor: pointer; }
        
        .data-row { background: #ffffff; padding: 10px; border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; box-shadow: var(--neu-shadow); }
        .action-btn { border: none; padding: 6px 10px; border-radius: 6px; font-weight: 900; font-size: 10px; cursor: pointer; color: white; }
    </style>
</head>
<body>

    <div class="container">
        <div class="top-navbar">
            <span>⚙️ لوحة الإدارة المطلقة والتحكم الكامل</span>
            <a href="index.html" class="mini-btn">المتجر الرئيسي 🏪</a>
        </div>

        <!-- 1. مربع إدارة الشعار والهوية -->
        <div class="section-box">
            <h3>🖼️ إدارة الشعار المباشر للمنصة والمتجر</h3>
            <div class="form-group">
                <label>اختر صورة الشعار الجديد من المعرض</label>
                <input type="file" id="logoFile" accept="image/*">
            </div>
            <button onclick="uploadStoreLogo()" class="submit-btn" style="background:var(--sadarah-primary); color:var(--sadarah-gold);">تحديث الشعار فوراً 🌟</button>
        </div>

        <!-- 2. مربع إدارة المنتجات والتخفيضات -->
        <div class="section-box">
            <h3>📦 إضافة وتعديل المنتجات والعروض</h3>
            <div class="form-group"><label>عنوان المنتج/الخدمة</label><input type="text" id="pTitle"></div>
            <div class="form-group">
                <label>التصنيف</label>
                <select id="pCategory">
                    <option value="إلكترونيات">إلكترونيات</option>
                    <option value="جوالات">جوالات</option>
                    <option value="اكسسوارات">اكسسوارات</option>
                    <option value="عطور">عطور</option>
                    <option value="ملابس">ملابس</option>
                    <option value="ادوات تجميل">أدوات تجميل</option>
                    <option value="اشتراكات رقمية">اشتراكات رقمية</option>
                </select>
            </div>
            <div class="form-group"><label>السعر الحالي</label><input type="text" id="pPrice" placeholder="3500 YER"></div>
            <div class="form-group"><label>السعر السابق (المشطوب - التخفيضات)</label><input type="text" id="pOldPrice" placeholder="5000 YER"></div>
            <div class="form-group"><label>نسبة الخصم</label><input type="text" id="pDiscount" placeholder="-30%"></div>
            <div class="form-group"><label>صورة المنتج</label><input type="file" id="pImage"></div>
            <div class="form-group"><label>الوصف</label><textarea id="pDesc" rows="2"></textarea></div>
            <button onclick="saveProductData()" class="submit-btn">نشر / حفظ المنتج 🚀</button>
        </div>

        <!-- 3. مربع تسوية العمولات والمسوقين -->
        <div class="section-box">
            <h3>🤝 مربع المسوقين وتصفية العمولات</h3>
            <div id="affiliatesList">جاري تحميل المسوقين...</div>
        </div>

        <!-- 4. مربع الطلبات الواردة -->
        <div class="section-box">
            <h3>🛒 طلبات الشراء المباشرة</h3>
            <div id="ordersList">جاري تحميل الطلبات...</div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://lvutrzswngpkjfamgact.supabase.co";
        const SUPABASE_KEY = "sb_publishable_fB8RmZyfymR8YpjLInA2LQ_hMA6qgRG";
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function loadAdminPanel() {
            // تحميل المسوقين والعمولات
            let { data: affs } = await db.from('affiliates').select('*').order('id', {ascending: false});
            let affBox = document.getElementById('affiliatesList');
            affBox.innerHTML = '';
            if(affs) {
                affs.forEach(a => {
                    affBox.innerHTML += `
                        <div class="data-row">
                            <div style="font-size:11px;"><b>${a.full_name || a.name}</b> (${a.phone})<br>كود: <code>${a.ref_code}</code> | العمولات: <b>${a.total_earnings || 0} YER</b></div>
                            <div>
                                <button class="action-btn" style="background:var(--green);" onclick="settleCommission(${a.id}, ${a.total_earnings || 0})">تسوية العمولة 💰</button>
                                <button class="action-btn" style="background:var(--red);" onclick="deleteRecord('affiliates', ${a.id})">حذف 🗑️</button>
                            </div>
                        </div>
                    `;
                });
            }

            // تحميل الطلبات
            let { data: orders } = await db.from('orders').select('*').order('id', {ascending: false});
            let ordBox = document.getElementById('ordersList');
            ordBox.innerHTML = '';
            if(orders) {
                orders.forEach(o => {
                    ordBox.innerHTML += `
                        <div class="data-row">
                            <div style="font-size:11px;"><b>${o.product_title}</b><br>العميل: ${o.customer_name} | المسوق: ${o.ref_code}</div>
                            <button class="action-btn" style="background:var(--red);" onclick="deleteRecord('orders', ${o.id})">حذف 🗑️</button>
                        </div>
                    `;
                });
            }
        }

        async function saveProductData() {
            let title = document.getElementById('pTitle').value;
            let category = document.getElementById('pCategory').value;
            let price = document.getElementById('pPrice').value;
            let old_price = document.getElementById('pOldPrice').value;
            let discount = document.getElementById('pDiscount').value;
            let fileInput = document.getElementById('pImage');
            let description = document.getElementById('pDesc').value;

            let imageUrl = '';
            if(fileInput.files[0]) {
                let file = fileInput.files[0];
                let fileName = 'products/' + Date.now() + '_' + file.name;
                let { data } = await db.storage.from('products_images').upload(fileName, file);
                if(data) {
                    let { data: pub } = db.storage.from('products_images').getPublicUrl(fileName);
                    imageUrl = pub.publicUrl;
                }
            }

            await db.from('platform_services').insert([{
                title, category, price, old_price, discount, image: imageUrl, description, is_active: true
            }]);

            alert('تم نشر المنتج والعرض بنجاح! 🎉');
            location.reload();
        }

        async function settleCommission(affId, current) {
            let paid = prompt('أدخل المبلغ المراد تسويته مع المسوق:', current);
            if(paid) {
                await db.from('affiliates').update({ total_earnings: current - Number(paid) }).eq('id', affId);
                alert('تمت تسوية العمولة بنجاح! 💵');
                loadAdminPanel();
            }
        }

        async function uploadStoreLogo() {
            let fileInput = document.getElementById('logoFile');
            if(fileInput.files[0]) {
                let file = fileInput.files[0];
                await db.storage.from('products_images').upload('logo.jpg', file, { upsert: true });
                alert('تم تحديث شعار المتجر بنجاح!');
            }
        }

        async function deleteRecord(table, id) {
            if(confirm('تأكيد الحذف؟')) {
                await db.from(table).delete().eq('id', id);
                loadAdminPanel();
            }
        }

        window.addEventListener('DOMContentLoaded', loadAdminPanel);
    </script>
</body>
</html>
