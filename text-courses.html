<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الدورات النصية - صدارة للخدمات الرقمية</title>
    <!-- استيراد مكتبة Supabase للاتصال وقراءة الدورات -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 20px;
            direction: rtl;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        h2 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
        }
        .course-card {
            background: #fff;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .course-title {
            color: #007bff;
            font-size: 20px;
            margin-bottom: 10px;
        }
        .course-content {
            color: #444;
            line-height: 1.6;
            white-space: pre-line;
        }
        .loading {
            text-align: center;
            color: #666;
            font-size: 18px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>📖 الدورات النصية المتاحة للطلاب</h2>
    
    <!-- مكان عرض الدورات التي يتم جلبها من قاعدة البيانات -->
    <div id="courses-container">
        <div class="loading">جاري تحميل الدورات...</div>
    </div>
</div>

<script>
    // إعداد اتصال Supabase (تأكد من مطابقة مفاتيح مشروعك)
    const SUPABASE_URL = 'ضع_رابط_مشروعك_هنا';
    const SUPABASE_ANON_KEY = 'ضع_مفتاح_anon_هنا';
    
    // إذا كنت تستخدم كايت أو كود جاهز مسبقاً في مشروعك للاتصال، استبدله بالاتصال الفعلي لديك
    // const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function loadTextCoursesForStudents() {
        const container = document.getElementById('courses-container');
        
        try {
            // جلب الدورات النصية من الجدول
            const { data: courses, error } = await supabase
                .from('text_courses')
                .select('*')
                .order('id', { ascending: false });

            if (error) throw error;

            if (!courses || courses.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #777;">لا توجد دورات نصية منشورة حتى الآن.</p>';
                return;
            }

            let html = '';
            courses.forEach(course => {
                html += `
                    <div class="course-card">
                        <div class="course-title">${course.title}</div>
                        <div class="course-content">${course.content}</div>
                        <!-- يمكنك إضافة أزرار الاختبارات أو المشاهدة هنا مستقبلاً -->
                    </div>
                `;
            });

            container.innerHTML = html;

        } catch (error) {
            console.error(error);
            container.innerHTML = '<p style="text-align: center; color: red;">حدث خطأ أثناء تحميل الدورات.</p>';
        }
    }

    // استدعاء دالة العرض عند فتح الصفحة
    // loadTextCoursesForStudents();
</script>

</body>
</html>
