<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <!-- شفرة أدسنس -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6392257665418096"
         crossorigin="anonymous"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الدورات النصية والاختبارات المهنية | منصة صدارة</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #0f2347; --gold: #d4af37; --green: #25d366; --bg-light: #f8fafc; --text-dark: #0f172a; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background: var(--bg-light); color: var(--text-dark); padding-bottom: 60px; line-height: 1.8; }
        
        header { background: #0a1324; color: #fff; padding: 18px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--gold); }
        header h1 { font-size: 1.1rem; color: #38bdf8; }
        .back-btn { background: #1e293b; color: #fff; padding: 6px 14px; border-radius: 8px; text-decoration: none; font-weight: 700; font-size: 12px; border: 1px solid var(--gold); cursor: pointer; }
        
        .container { max-width: 850px; margin: 25px auto; padding: 0 16px; }
        
        /* ديباجة عليا */
        .top-banner { background: linear-gradient(135deg, #0f2347, #1e3a8a); color: white; padding: 25px; border-radius: 14px; text-align: center; margin-bottom: 25px; border-bottom: 4px solid var(--gold); box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .top-banner h2 { font-size: 1.3rem; margin-bottom: 8px; color: #38bdf8; }
        .top-banner p { font-size: 12px; opacity: 0.9; }

        .card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 20px; border: 1px solid #e2e8f0; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
        .card h3 { font-size: 16px; color: var(--primary); border-right: 4px solid var(--gold); padding-right: 10px; margin-bottom: 10px; }
        .card p { font-size: 13px; color: #334155; text-align: justify; margin-bottom: 15px; line-height: 2; white-space: pre-line; }
        
        /* أزرار المعاينة والانتقال */
        .course-actions { display: flex; gap: 10px; margin-top: 15px; }
        .btn-action { flex: 1; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 12px; cursor: pointer; border: none; text-align: center; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: 0.3s; }
        .btn-preview { background: #0284c7; color: white; }
        .btn-preview:hover { background: #0369a1; }
        .btn-quiz-lock { background: #94a3b8; color: white; cursor: not-allowed; }
        .btn-quiz-open { background: var(--primary); color: white; }
        .btn-quiz-open:hover { background: #1e3a8a; }

        /* قسم القراءة والاختبار */
        .read-confirm-box { background: #eff6ff; border: 2px dashed #38bdf8; padding: 15px; border-radius: 10px; text-align: center; margin-top: 25px; }
        .btn-ready { background: var(--primary); color: white; border: none; padding: 12px 24px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 13px; transition: 0.3s; }
        .btn-ready:disabled { background: #94a3b8; cursor: not-allowed; opacity: 0.7; }
        
        .quiz-section { display: none; background: #f1f5f9; padding: 15px; border-radius: 10px; margin-top: 20px; border: 1px solid #cbd5e1; }
        .quiz-q { font-weight: bold; font-size: 13px; color: var(--primary); margin-top: 14px; background: #fff; padding: 6px 10px; border-radius: 6px; border-right: 3px solid var(--gold); }
        .quiz-opt { display: block; font-size: 12px; margin: 6px 0 6px 12px; cursor: pointer; color: #1e293b; }
        .quiz-opt input { margin-left: 6px; }
        
        .btn-submit { background: var(--green); color: white; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 13px; margin-top: 18px; width: 100%; transition: 0.3s; }
        
        .cert-wrapper { display: none; margin-top: 25px; text-align: center; }
        .canvas-container { max-width: 100%; overflow-x: auto; background: #fff; padding: 10px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        canvas { max-width: 100%; height: auto; border-radius: 8px; border: 1px solid #cbd5e1; }
        
        .cert-actions { margin-top: 15px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        .action-btn-green { background: var(--green); color: white; border: none; padding: 10px 18px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 12px; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
        .action-btn-blue { background: #0284c7; color: white; border: none; padding: 10px 18px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 12px; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }

        .empty-box { text-align: center; padding: 40px; background: white; border-radius: 12px; border: 1px solid #e2e8f0; }
        .empty-box i { font-size: 40px; color: var(--gold); margin-bottom: 10px; }
    </style>
</head>
<body>

    <header>
        <h1>📚 الدورات التأهيلية والبرامج النصية</h1>
        <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-right"></i> الرئيسية</a>
    </header>

    <div class="container">
        <!-- الديباجة العليا -->
        <div class="top-banner">
            <h2>🎓 الدورات الأكاديمية والمهنية المعتمدة</h2>
            <p>منصة صدارة للخدمات الرقمية والتنمية المهنية - طوّر مهاراتك الإبداعية والتقنية بأحدث المناهج المعتمدة.</p>
        </div>

        <!-- منطقة عرض المحتوى (تتغير ديناميكياً حسب اختيار الزائر) -->
        <div id="dynamicContent">
            <div class="empty-box">
                <i class="fa-solid fa-spinner fa-spin"></i>
                <p style="color: #64748b; font-size: 13px;">جاري تحميل الدورات النصية...</p>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://lvutrzswngpkjfamgact.supabase.co";
        const SUPABASE_KEY = "sb_publishable_fB8RmZyfymR8YpjLInA2LQ_hMA6qgRG";
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const templateImgUrl = "https://lvutrzswngpkjfamgact.supabase.co/storage/v1/object/public/platform-files/certificate.png";
        let allCourses = [];

        async function loadCoursesList() {
            let container = document.getElementById('dynamicContent');
            let { data: courses, error } = await db.from('text_courses').select('*').order('id', { ascending: false });

            if (error || !courses || courses.length === 0) {
                container.innerHTML = `
                    <div class="empty-box">
                        <i class="fa-solid fa-book-open"></i>
                        <h3 style="color: var(--primary); font-size: 16px; margin-bottom: 6px;">لا توجد دورات تدريبية منشورة حالياً</h3>
                        <p style="color: #64748b; font-size: 12px;">ترقبوا إطلاق أحدث البرامج قريباً!</p>
                    </div>
                `;
                return;
            }

            allCourses = courses;
            renderIndexView();
        }

        // عرض قائمة الدورات الرئيسية
        function renderIndexView() {
            let container = document.getElementById('dynamicContent');
            container.innerHTML = `<h3 style="color: var(--primary); font-size: 15px; margin-bottom: 15px;">اختر الدورة لاستعراض محتواها وبدء الاختبار:</h3>`;

            allCourses.forEach(c => {
                let shortDesc = c.content.length > 150 ? c.content.substring(0, 150) + '...' : c.content;
                container.innerHTML += `
                    <div class="card">
                        <h3>${c.title}</h3>
                        <p>${shortDesc}</p>
                        <div class="course-actions">
                            <button class="btn-action btn-preview" onclick="openCourseReview(${c.id})"><i class="fa-solid fa-book-open-reader"></i> استعراض الدورة</button>
                            <button class="btn-action btn-quiz-lock" id="indexQuizBtn_${c.id}" disabled onclick="openCourseQuiz(${c.id})"><i class="fa-solid fa-lock"></i> بدء الاختبار (مغلق)</button>
                        </div>
                    </div>
                `;
            });
        }

        // 1. فتح معاينة وقراءة الدورة (مع مؤقت دقيقتين)
        function openCourseReview(id) {
            let c = allCourses.find(item => item.id == id);
            if (!c) return;

            let container = document.getElementById('dynamicContent');
            container.innerHTML = `
                <button onclick="renderIndexView()" class="back-btn" style="margin-bottom: 15px;"><i class="fa-solid fa-arrow-right"></i> العودة لقائمة الدورات</button>
                <div class="card">
                    <h3>${c.title}</h3>
                    <p style="white-space: pre-line;">${c.content}</p>

                    <!-- مؤقت قراءة الدورة الإلزامي (دقيقتين) -->
                    <div class="read-confirm-box" id="readBox_${c.id}">
                        <p style="font-size: 12px; color: var(--primary); font-weight: bold; margin-bottom: 8px;" id="timerMsg_${c.id}">⏳ يرجى قراءة محتوى الدورة بعناية (يفتح زر الاختبار خلال دقيقتين...)</p>
                        <button class="btn-ready" id="readyBtn_${c.id}" disabled onclick="unlockQuizFromReview(${c.id})">
                            <i class="fa-solid fa-lock"></i> لقد قرأت المحتوى بالكامل وفهمته، انتقال للاختبار 🚀
                        </button>
                    </div>
                </div>
            `;

            startTimer(c.id);
        }

        function startTimer(id) {
            let timeLeft = 120; // 120 ثانية = دقيقتين
            const timerInterval = setInterval(() => {
                timeLeft--;
                const msgEl = document.getElementById(`timerMsg_${id}`);
                const btnEl = document.getElementById(`readyBtn_${id}`);
                if (!msgEl || !btnEl) { clearInterval(timerInterval); return; }

                const mins = Math.floor(timeLeft / 60);
                const secs = timeLeft % 60;

                if (timeLeft > 0) {
                    msgEl.innerHTML = `⏳ يرجى قراءة محتوى الدورة بعناية (يفتح زر الاختبار خلال ${mins} دقيقة و ${secs} ثانية)...`;
                } else {
                    clearInterval(timerInterval);
                    msgEl.innerHTML = `✅ شكراً لقراءتك المستند بالكامل! يمكنك الانتقال للاختبار الآن.`;
                    btnEl.disabled = false;
                    btnEl.innerHTML = `<i class="fa-solid fa-lock-open"></i> لقد قرأت المحتوى بالكامل وفهمته، انتقال للاختبار 🚀`;
                    btnEl.style.background = 'var(--green)';
                }
            }, 1000);
        }

        // عند انتهاء القراءة، يتم فتح الاختبار لهذه الدورة
        function unlockQuizFromReview(id) {
            // حفظ حالة أن الطالب قرا هذه الدورة
            localStorage.setItem(`course_read_${id}`, "true");
            openCourseQuiz(id);
        }

        // 2. فتح صفحة الاختبار
        function openCourseQuiz(id) {
            let c = allCourses.find(item => item.id == id);
            if (!c) return;

            let container = document.getElementById('dynamicContent');
            container.innerHTML = `
                <button onclick="openCourseReview(${c.id})" class="back-btn" style="margin-bottom: 15px;"><i class="fa-solid fa-arrow-right"></i> العودة لقراءة الدورة</button>
                <div class="card">
                    <h3>اختبار دورة: ${c.title}</h3>
                    
                    <div class="quiz-section" style="display: block; margin-top: 10px;">
                        <h3 style="font-size: 14px; color: var(--gold); margin-bottom: 10px;">📝 اختبار إتمام الدورة (10 أسئلة شاملة - يشترط 6 درجات فأكثر للنجاح):</h3>
                        
                        <div class="quiz-q">1. ما هو الهدف الأساسي أو المفهوم المحوري المذكور في محتوى هذه الدورة؟</div>
                        <label class="quiz-opt"><input type="radio" name="q1_${c.id}" value="1"> الفهم الدقيق وتطبيق المحتوى المطروح بمهنية</label>
                        <label class="quiz-opt"><input type="radio" name="q1_${c.id}" value="0"> تجاهل التعليمات والمحتوى المقدم</label>

                        <div class="quiz-q">2. كيف تساهم الاستفادة من المهارات المشروحة في تطوير العمل؟</div>
                        <label class="quiz-opt"><input type="radio" name="q2_${c.id}" value="1"> برفع الكفاءة وتحقيق أفضل عائد استثماري ونتائج</label>
                        <label class="quiz-opt"><input type="radio" name="q2_${c.id}" value="0"> بزيادة الأخطاء والعشوائية</label>

                        <div class="quiz-q">3. لماذا يُعد الالتزام بالتفاصيل الإرشادية أمراً حيوياً في نجاح المشاريع؟</div>
                        <label class="quiz-opt"><input type="radio" name="q3_${c.id}" value="1"> لأنه يضمن جودة التنفيذ والوصول للأهداف المرجوة</label>
                        <label class="quiz-opt"><input type="radio" name="q3_${c.id}" value="0"> لأنه لا يقدم أي فائدة عملية</label>

                        <div class="quiz-q">4. ما أهمية تحليل البيانات والمتابعة الدورية للنتائج؟</div>
                        <label class="quiz-opt"><input type="radio" name="q4_${c.id}" value="1"> معرفة نقاط القوة والضعف والتحسين المستمر</label>
                        <label class="quiz-opt"><input type="radio" name="q4_${c.id}" value="0"> إغلاق المشروع نهائياً</label>

                        <div class="quiz-q">5. ما هي أهم ركيزة لبناء الثقة المستدامة مع الجمهور أو العملاء؟</div>
                        <label class="quiz-opt"><input type="radio" name="q5_${c.id}" value="1"> تقديم قيمة حقيقية وحلول فعلية للمشكلات</label>
                        <label class="quiz-opt"><input type="radio" name="q5_${c.id}" value="0"> تقديم معلومات غير دقيقة</label>

                        <div class="quiz-q">6. كيف يؤثر التخطيط السليم على تقليل التكاليف والنفقات؟</div>
                        <label class="quiz-opt"><input type="radio" name="q6_${c.id}" value="1"> بتوجيه الموارد نحو الأنشطة الأكثر جدوى وفائدة</label>
                        <label class="quiz-opt"><input type="radio" name="q6_${c.id}" value="0"> بمضاعفة الهدر المالي</label>

                        <div class="quiz-q">7. ما الفائدة من مراجعة المفاهيم الأساسية بانتظام؟</div>
                        <label class="quiz-opt"><input type="radio" name="q7_${c.id}" value="1"> ترسيخ المعلومات وتجنب الأخطاء السابقة</label>
                        <label class="quiz-opt"><input type="radio" name="q7_${c.id}" value="0"> نسيان محتوى الدورة بسرعة</label>

                        <div class="quiz-q">8. ما هو التصرف الصحيح عند مواجهة صعوبة في تنفيذ استراتيجية معينة؟</div>
                        <label class="quiz-opt"><input type="radio" name="q8_${c.id}" value="1"> إعادة دراسة الدرس النصي وتطبيق الاختبارات التجريبية</label>
                        <label class="quiz-opt"><input type="radio" name="q8_${c.id}" value="0"> الاستسلام وعدم المحاولة</label>

                        <div class="quiz-q">9. ما هو العنصر الأهم لجعل أي مخرجات مهنية ناجحة ومؤثرة؟</div>
                        <label class="quiz-opt"><input type="radio" name="q9_${c.id}" value="1"> الدقة، والوضوح، والالتزام بالمعايير المهنية</label>
                        <label class="quiz-opt"><input type="radio" name="q9_${c.id}" value="0"> العشوائية التامة</label>

                        <div class="quiz-q">10. هل اجتياز هذا الاختبار بنجاح يمنحك شهادة معتمدة من المنصة؟</div>
                        <label class="quiz-opt"><input type="radio" name="q10_${c.id}" value="1"> نعم، يتم إصدار شهادة إتمام رسمية باسمك</label>
                        <label class="quiz-opt"><input type="radio" name="q10_${c.id}" value="0"> لا، لا توجد شهادات</label>

                        <label style="font-size: 11px; font-weight: bold; margin-top: 18px; display: block;">أدخل اسمك الكامل لطباعته على الشهادة عند النجاح:</label>
                        <input type="text" id="studentName_${c.id}" placeholder="مثال: عبدالرحمن عبدالله صالح الذماري" style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; margin-top: 4px; font-size: 12px;">

                        <button class="btn-submit" onclick="evaluateQuiz(${c.id}, '${c.title.replace(/'/g, "\\'")}')">تقديم الاختبار وتصحيح الإجابات 🎓</button>
                    </div>

                    <!-- حاوية الشهادة -->
                    <div class="cert-wrapper" id="certWrapper_${c.id}">
                        <div class="canvas-container">
                            <canvas id="certCanvas_${c.id}" width="1200" height="850"></canvas>
                        </div>
                        <div class="cert-actions">
                            <button class="action-btn-green" onclick="downloadCertificate(${c.id})"><i class="fa-solid fa-download"></i> تنزيل الشهادة بصيغة صورة PNG</button>
                            <button class="action-btn-blue" onclick="window.print()"><i class="fa-solid fa-print"></i> طباعة الشهادة / حفظ PDF (A4)</button>
                        </div>
                    </div>
                </div>
            `;
        }

        async function evaluateQuiz(id, courseTitle) {
            const name = document.getElementById(`studentName_${id}`).value.trim();
            if (!name) { alert('يرجى كتابة اسمك الكامل لإصداره على الشهادة.'); return; }

            let score = 0;
            for (let i = 1; i <= 10; i++) {
                let ans = document.querySelector(`input[name="q${i}_${id}"]:checked`);
                if (!ans) {
                    alert(`يرجى الإجابة على السؤال رقم (${i}) قبل تقديم الاختبار.`);
                    return;
                }
                if (ans.value === "1") score++;
            }

            if (score >= 6) {
                try {
                    await db.from('cert_results').insert([{
                        student_name: name,
                        course_name: courseTitle,
                        score: score
                    }]);
                } catch(e) {}

                generateCertificate(id, name, courseTitle);
            } else {
                alert(`عذراً، حصلت على (${score} من 10). لا يمكن تسليم الشهادة لمن يحصل على أقل من 6 درجات (60%). يرجى مراجعة المستند والمحاولة مرة أخرى! ❌`);
            }
        }

        function generateCertificate(id, studentName, courseTitle) {
            const canvas = document.getElementById(`certCanvas_${id}`);
            const ctx = canvas.getContext('2d');
            const img = new Image();
            img.crossOrigin = "Anonymous";
            img.src = templateImgUrl;

            img.onload = function () {
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                ctx.font = "bold 38px 'Tajawal', sans-serif";
                ctx.fillStyle = "#d4af37";
                ctx.textAlign = "center";
                ctx.fillText(studentName, canvas.width / 2, 420);

                ctx.font = "bold 22px 'Tajawal', sans-serif";
                ctx.fillStyle = "#0f2347";
                ctx.fillText("قد اجتاز بنجاح اختبار دورة: " + courseTitle, canvas.width / 2, 500);

                const todayDate = new Date().toLocaleDateString('ar-EG');
                ctx.font = "18px 'Tajawal', sans-serif";
                ctx.fillStyle = "#475569";
                ctx.textAlign = "right";
                ctx.fillText("تاريخ الإصدار: " + todayDate, canvas.width - 120, 680);

                document.getElementById(`certWrapper_${id}`).style.display = 'block';
                window.scrollTo({ top: document.getElementById(`certWrapper_${id}`).offsetTop - 20, behavior: 'smooth' });
            };
        }

        function downloadCertificate(id) {
            const canvas = document.getElementById(`certCanvas_${id}`);
            const link = document.createElement('a');
            link.download = 'شهادة_إتمام_دورة_صدارة.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadCoursesList();
        });
    </script>
</body>
</html>
