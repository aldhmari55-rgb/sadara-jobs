<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الدورات النصية والاختبارات - صدارة للخدمات الرقمية</title>
    <!-- استيراد خط تجملي أو استخدام خط النظام الاحترافي -->
    <style>
        :root {
            --primary-color: #007bff;
            --primary-hover: #0056b3;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-muted: #666666;
            --border-radius: 12px;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            direction: rtl;
            color: var(--text-main);
        }

        .page-container {
            max-width: 1000px;
            margin: 0 auto;
        }

        /* رأس الصفحة الجميل */
        .page-header {
            text-align: center;
            margin-bottom: 40px;
            padding: 20px;
            background: linear-gradient(135deg, #007bff, #00c6ff);
            color: white;
            border-radius: var(--border-radius);
            box-shadow: 0 4px 15px rgba(0, 123, 255, 0.2);
        }

        .page-header h1 {
            margin: 0 0 10px 0;
            font-size: 28px;
        }

        .page-header p {
            margin: 0;
            font-size: 16px;
            opacity: 0.9;
        }

        /* تخطيط الشبكة والمربعات (Grid) */
        .courses-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        /* تصميم المربع / البطاقة لكل دورة */
        .course-card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border-top: 4px solid var(--primary-color);
        }

        .course-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        }

        .course-title {
            font-size: 20px;
            font-weight: bold;
            color: var(--text-main);
            margin-bottom: 12px;
        }

        .course-snippet {
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 20px;
            flex-grow: 1;
            white-space: pre-line;
            display: -webkit-box;
            -webkit-line-clamp: 3; /* عرض أول 3 أسطر فقط بشكل مرتب */
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* حاوية الأزرار داخل المربع */
        .card-actions {
            display: flex;
            gap: 10px;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }

        .btn {
            flex: 1;
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: background-color 0.2s;
        }

        .btn-read {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-read:hover {
            background-color: var(--primary-hover);
        }

        .btn-quiz {
            background-color: #28a745;
            color: white;
        }

        .btn-quiz:hover {
            background-color: #218838;
        }

        /* حالة التحميل أو الفراغ */
        .status-message {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: var(--border-radius);
            color: var(--text-muted);
            font-size: 18px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>

<div class="page-container">
    <!-- هيدر الصفحة الجميل -->
    <div class="page-header">
        <h1>📚 الدورات النصية والاختبارات</h1>
        <p>تصفح أحدث الدورات الإبداعية والمحتوى التعليمي الحصري لمنصة صدارة</p>
    </div>

    <!-- شبكة عرض الدورات (مربعات منظمة) -->
    <div id="courses-grid" class="courses-grid">
        <div class="status-message">جاري تحميل الدورات الإبداعية...</div>
    </div>
</div>

<script>
    // كود جلب وعرض الدورات من قاعدة البيانات بشكل أنيق
    async function loadStudentTextCourses() {
        const gridContainer = document.getElementById('courses-grid');
        
        try {
            // جلب البيانات من جدول text_courses
            const { data: courses, error } = await supabase
                .from('text_courses')
                .select('*')
                .order('id', { ascending: false });

            if (error) throw error;

            if (!courses || courses.length === 0) {
                gridContainer.innerHTML = '<div class="status-message">لا توجد دورات نصية منشورة حالياً، ترقبونا قريباً!</div>';
                return;
            }

            let cardsHtml = '';
            courses.forEach(course => {
                cardsHtml += `
                    <div class="course-card">
                        <div>
                            <div class="course-title">${course.title}</div>
                            <div class="course-snippet">${course.content}</div>
                        </div>
                        <div class="card-actions">
                            <button class="btn btn-read" onclick="openCourse('${course.id}')">📖 مشاهدة</button>
                            <button class="btn btn-quiz" onclick="openQuiz('${course.id}')">✍️ اختبار</button>
                        </div>
                    </div>
                `;
            });

            gridContainer.innerHTML = cardsHtml;

        } catch (error) {
            console.error(error);
            gridContainer.innerHTML = '<div class="status-message" style="color: red;">حدث خطأ أثناء تحميل الدورات. تأكد من الاتصال.</div>';
        }
    }

    // دوال تفاعلية للأزرار (يمكن ربطها بصفحات العرض أو النوافذ المنبثقة لاحقاً)
    function openCourse(courseId) {
        alert('فتح تفاصيل الدورة رقم: ' + courseId);
        // يمكنك توجيه الطالب لصفحة قراءة الدورة الكاملة هنا
    }

    function openQuiz(courseId) {
        alert('الانتقال لاختبار الدورة رقم: ' + courseId);
        // يمكنك توجيه الطالب لصفحة الاختبارات هنا
    }

    // استدعاء دالة التحميل عند فتح الصفحة
    // loadStudentTextCourses();
</script>

</body>
</html>
