<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أكاديمية صدارة - الدورات والبرامج التأهيلية</title>
    <!-- استيراد مكتبة Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #0f172a;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --radius: 16px;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8fafc;
            margin: 0;
            padding: 0;
            direction: rtl;
            color: var(--text-main);
        }

        /* هيدر أكاديمي فخم */
        .hero-section {
            background: var(--bg-gradient);
            color: white;
            padding: 50px 20px;
            text-align: center;
            border-bottom-left-radius: 35px;
            border-bottom-right-radius: 35px;
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.15);
            margin-bottom: 40px;
        }

        .hero-section h1 {
            margin: 0 0 15px 0;
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .hero-section p {
            margin: 0;
            font-size: 17px;
            opacity: 0.85;
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.6;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px 50px 20px;
        }

        /* شبكة عرض الدورات الأكاديمية */
        .courses-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
        }

        /* تصميم المربع / البطاقة الأكاديمية الفاخرة */
        .course-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 25px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.3s ease;
            border: 1px solid #e2e8f0;
            position: relative;
            overflow: hidden;
        }

        .course-card::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 100%;
            height: 5px;
            background: var(--accent);
        }

        .course-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 30px rgba(37, 99, 235, 0.1);
            border-color: #cbd5e1;
        }

        .course-title {
            font-size: 21px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .course-content-preview {
            color: var(--text-muted);
            font-size: 15px;
            line-height: 1.7;
            margin-bottom: 25px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            white-space: pre-line;
        }

        /* أزرار أكاديمية احترافية */
        .card-footer {
            display: flex;
            gap: 12px;
            border-top: 1px solid #f1f5f9;
            padding-top: 18px;
        }

        .btn-action {
            flex: 1;
            padding: 12px 15px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            border: none;
            transition: background 0.2s, transform 0.1s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-view {
            background-color: #eff6ff;
            color: var(--accent);
        }

        .btn-view:hover {
            background-color: #dbeafe;
        }

        .btn-exam {
            background-color: var(--accent);
            color: white;
        }

        .btn-exam:hover {
            background-color: var(--accent-hover);
        }

        /* رسائل الحالة والحمل */
        .status-box {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            background: white;
            border-radius: var(--radius);
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            color: var(--text-muted);
            font-size: 18px;
            border: 1px dashed #cbd5e1;
        }
    </style>
</head>
<body>

    <!-- هيدر أكاديمي فخم -->
    <div class="hero-section">
        <h1>🎓 الدورات التأهيلية والبرامج النصية</h1>
        <p>منصة صدارة للخدمات الرقمية والتنمية المهنية - طوّر مهاراتك الإبداعية والتقنية بأحدث المناهج المعتمدة.</p>
    </div>

    <div class="container">
        <!-- شبكة عرض الدورات -->
        <div id="courses-grid" class="courses-grid">
            <div class="status-box">جاري مزامنة وتحميل الدورات الأكاديمية...</div>
        </div>
    </div>

    <script>
        // إعدادات اتصال Supabase (نفس إعدادات موقعك الأساسية)
        const SUPABASE_URL = 'ضع_رابط_مشروعك_هنا';
        const SUPABASE_ANON_KEY = 'ضع_مفتاح_anon_هنا';
        // const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // دالة جلب وعرض الدورات الحقيقية من جدول text_courses
        async function fetchAndRenderCourses() {
            const grid = document.getElementById('courses-grid');

            try {
                // جلب الدورات من جدول text_courses مرتبة من الأحدث للأقدم
                const { data: courses, error } = await supabase
                    .from('text_courses')
                    .select('*')
                    .order('id', { ascending: false });

                if (error) throw error;

                if (!courses || courses.length === 0) {
                    grid.innerHTML = '<div class="status-box">لا توجد دورات تدريبية منشورة حالياً. ترقبوا إطلاق أحدث البرامج قريباً!</div>';
                    return;
                }

                let htmlContent = '';
                courses.forEach(course => {
                    htmlContent += `
                        <div class="course-card">
                            <div>
                                <div class="course-title">${course.title}</div>
                                <div class="course-content-preview">${course.content}</div>
                            </div>
                            <div class="card-footer">
                                <button class="btn-action btn-view" onclick="openCourseDetails('${course.id}')">
                                    📖 استعراض الدورة
                                </button>
                                <button class="btn-action btn-exam" onclick="openCourseExam('${course.id}')">
                                    ✍️ بدء الاختبار
                                </button>
                            </div>
                        </div>
                    `;
                });

                grid.innerHTML = htmlContent;

            } catch (err) {
                console.error(err);
                grid.innerHTML = '<div class="status-box" style="color: #ef4444;">حدث خطأ أثناء جلب الدورات من القاعدة. تأكد من إعدادات الاتصال.</div>';
            }
        }

        function openCourseDetails(id) {
            alert('فتح تفاصيل الدورة الأكاديمية رقم: ' + id);
            // يمكنك توجيه الطالب لصفحة عرض محتوى الدورة كاملاً هنا
        }

        function openCourseExam(id) {
            alert('الانتقال لاختبار الدورة رقم: ' + id);
            // يمكنك توجيه الطالب لصفحة الاختبار هنا
        }

        // تنفيذ دالة الجلب عند تحميل الصفحة
        // fetchAndRenderCourses();
    </script>
</body>
</html>
