<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم صدارة</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #2563eb; --danger: #ef4444; --success: #10b981; --bg: #f1f5f9; --border: #e2e8f0; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
        body { background: var(--bg); color: #1e293b; }

        .login-wrap { position: fixed; inset: 0; background: #0f172a; z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .login-box { background: #fff; width: 100%; max-width: 360px; padding: 28px; border-radius: 22px; text-align: center; }
        
        .admin-header { background: #0f172a; color: #fff; padding: 16px 22px; display: flex; justify-content: space-between; align-items: center; }
        .container { max-width: 1100px; margin: 22px auto; padding: 0 16px 50px; }

        .tabs { display: flex; gap: 10px; overflow-x: auto; margin-bottom: 20px; padding-bottom: 5px; scrollbar-width: none; }
        .tab-btn { background: #fff; border: 1px solid var(--border); padding: 10px 18px; border-radius: 12px; font-weight: 700; cursor: pointer; white-space: nowrap; }
        .tab-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

        .panel { display: none; }
        .panel.active { display: block; }
        .btn-new { background: var(--success); color: #fff; border: none; padding: 11px 20px; border-radius: 12px; font-weight: 800; cursor: pointer; margin-bottom: 18px; display: inline-flex; align-items: center; gap: 8px; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
        .card { background: #fff; border-radius: 16px; padding: 16px; border: 1px solid var(--border); display: flex; flex-direction: column; justify-content: space-between; position: relative; }
        
        .card-img-wrap { width: 100%; height: 150px; background: #f8fafc; border-radius: 10px; overflow: hidden; margin-bottom: 12px; position: relative; display: flex; align-items: center; justify-content: center; }
        .card-img-wrap img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .img-count-badge { position: absolute; top: 8px; left: 8px; background: rgba(15,23,42,0.75); color: #fff; font-size: 0.75rem; padding: 3px 8px; border-radius: 8px; font-weight: 700; }
        .prefix-badge { display: inline-block; background: #eff6ff; color: var(--primary); font-weight: 800; padding: 3px 10px; border-radius: 8px; font-size: 0.85rem; margin-top: 6px; direction: ltr; }

        .card-actions { display: flex; gap: 8px; margin-top: 12px; }
        .btn-sm { flex: 1; padding: 8px; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; }
        .btn-edit { background: #eff6ff; color: var(--primary); }
        .btn-del { background: #fef2f2; color: var(--danger); }

        .modal { position: fixed; inset: 0; background: rgba(15,23,42,0.5); z-index: 3000; display: none; align-items: center; justify-content: center; padding: 20px; }
        .modal.open { display: flex; }
        .modal-card { background: #fff; width: 100%; max-width: 440px; border-radius: 22px; padding: 22px; max-height: 90vh; overflow-y: auto; }
        .grp { margin-bottom: 14px; text-align: right; }
        .grp label { display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 5px; }
        .grp input, .grp select { width: 100%; padding: 11px; border: 1px solid var(--border); border-radius: 10px; background: #f8fafc; outline: none; }
        .btn-main { width: 100%; padding: 12px; border: none; border-radius: 12px; background: var(--primary); color: #fff; font-weight: 800; cursor: pointer; font-size: 1rem; }

        .multi-img-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .mini-thumb { position: relative; width: 68px; height: 68px; border-radius: 10px; border: 1px solid var(--border); overflow: hidden; background: #f8fafc; display: flex; align-items: center; justify-content: center; }
        .mini-thumb img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .mini-thumb button { position: absolute; top: 2px; right: 2px; background: var(--danger); color: #fff; border: none; width: 18px; height: 18px; border-radius: 50%; font-size: 0.7rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        .banner-preview-box { width: 100%; min-height: 100px; max-height: 180px; border: 1px dashed var(--border); border-radius: 12px; background: #f8fafc; display: flex; align-items: center; justify-content: center; overflow: hidden; margin-top: 8px; }
        .banner-preview-box img { max-width: 100%; max-height: 180px; object-fit: contain; }

        .toast { position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%) translateY(100px); background: #1e293b; color: #fff; padding: 10px 22px; border-radius: 25px; font-size: 0.9rem; z-index: 9999; transition: 0.3s; }
        .toast.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

<div class="login-wrap" id="loginWrap">
    <div class="login-box">
        <h2 style="margin-bottom:18px;">دخول الإدارة</h2>
        <form onsubmit="adminLogin(event)">
            <div class="grp"><label>اسم المستخدم</label><input type="text" id="aUser" required style="direction:ltr;"></div>
            <div class="grp"><label>كلمة المرور</label><input type="password" id="aPass" required style="direction:ltr;"></div>
            <button type="submit" class="btn-main">دخول</button>
        </form>
    </div>
</div>

<div id="adminApp" style="display:none;">
    <header class="admin-header">
        <div>
            <h3 style="font-size:1.1rem;">لوحة تحكم صدارة السحابية</h3>
            <small id="connStatus" style="color:#38bdf8;">جاري التحقق من الاتصال...</small>
        </div>
        <button onclick="logout()" style="background:var(--danger); color:#fff; border:none; padding:8px 14px; border-radius:8px; font-weight:700; cursor:pointer;">خروج</button>
    </header>

    <div class="container">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('products', this)">المنتجات</button>
            <button class="tab-btn" onclick="switchTab('categories', this)">الأقسام</button>
            <button class="tab-btn" onclick="switchTab('shein', this)">شحنات شي إن</button>
            <button class="tab-btn" onclick="switchTab('banners', this)">البنرات</button>
            <button class="tab-btn" onclick="switchTab('payments', this)">طرق الدفع</button>
            <button class="tab-btn" onclick="switchTab('settings', this)">الإعدادات</button>
        </div>

        <div class="panel active" id="p-products">
            <button class="btn-new" onclick="openModal('product')"><i class="fas fa-plus"></i> إضافة منتج</button>
            <div class="grid" id="gridProducts"></div>
        </div>

        <div class="panel" id="p-categories">
            <button class="btn-new" onclick="openModal('category')"><i class="fas fa-plus"></i> إضافة قسم</button>
            <div class="grid" id="gridCategories"></div>
        </div>

        <div class="panel" id="p-shein">
            <button class="btn-new" onclick="openModal('shein')"><i class="fas fa-plus"></i> إضافة شحنة شي إن جديدة</button>
            <div class="grid" id="gridShein"></div>
        </div>

        <div class="panel" id="p-banners">
            <button class="btn-new" onclick="openModal('banner')"><i class="fas fa-plus"></i> إضافة بنر إعلاني</button>
            <div class="grid" id="gridBanners"></div>
        </div>

        <div class="panel" id="p-payments">
            <button class="btn-new" onclick="openModal('payment')"><i class="fas fa-plus"></i> إضافة طريقة دفع</button>
            <div class="grid" id="gridPayments"></div>
        </div>

        <div class="panel" id="p-settings">
            <div class="card" style="max-width:450px;">
                <h3 style="margin-bottom:15px;">الإعدادات العامة</h3>
                <div class="grp"><label>اسم المتجر</label><input type="text" id="setName"></div>
                <div class="grp"><label>رقم الواتساب</label><input type="text" id="setWa" style="direction:ltr;"></div>
                <button class="btn-main" onclick="saveSettings()">حفظ الإعدادات</button>
            </div>
        </div>
    </div>
</div>

<div class="modal" id="formModal" onclick="if(event.target===this) closeModal()">
    <div class="modal-card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
            <h3 id="mTitle">إضافة</h3>
            <button onclick="closeModal()" style="background:none; border:none; font-size:1.5rem; cursor:pointer;">&times;</button>
        </div>
        <form onsubmit="handleSave(event)">
            <div id="mFields"></div>
            <button type="submit" class="btn-main" style="margin-top:10px;">حفظ في السحابة</button>
        </form>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
    const SUPABASE_URL = 'https://lvutrzswngpkjfamgact.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx2dXRyenN3bmdwa2pmYW1nYWN0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzNTk4MzAsImV4cCI6MjEwNzkzNTgzMH0.fK9eGSy2uv3spG6tynUCoGNivzmRCJnwLEnBFCCgu7g';

    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let storeData = { settings: { storeName: "متجر صدارة", whatsapp: "967780568507" }, categories: [], products: [], payments: [], banners: [], shein: [], users: [] };
    let editType = '', editId = null, uploadedImgUrl = '';
    let currentProductImgs = [];

    function getCategoryPrefix(cat) {
        if (cat.prefix && cat.prefix.trim()) return cat.prefix.trim().toUpperCase();
        const n = (cat.name || '').trim();
        if (n.includes('رجال')) return 'M';
        if (n.includes('نساء') || n.includes('نسائ')) return 'W';
        if (n.includes('ولاد') || n.includes('أولاد')) return 'B';
        if (n.includes('بنات')) return 'G';
        return n.charAt(0).toUpperCase() || 'P';
    }

    function generateNextCode(catId) {
        const cat = (storeData.categories || []).find(c => c.id === catId);
        if (!cat) return 'P100';
        const prefix = getCategoryPrefix(cat);
        const catProds = (storeData.products || []).filter(p => p.catId === catId);
        let maxNum = 99;
        catProds.forEach(p => {
            if (p.code) {
                const match = String(p.code).toUpperCase().match(new RegExp('^' + prefix + '(\\d+)$'));
                if (match) {
                    const num = parseInt(match[1], 10);
                    if (num >= 100 && num <= 10000 && num > maxNum) maxNum = num;
                }
            }
        });
        const nextNum = maxNum + 1;
        return prefix + (nextNum > 10000 ? 10000 : nextNum);
    }

    async function initCloud() {
        const statusEl = document.getElementById('connStatus');
        const { data, error } = await _supabase.from('store_data').select('payload').eq('id', 1).maybeSingle();
        if (error) { statusEl.innerText = 'خطأ اتصال: ' + error.message; statusEl.style.color = '#ef4444'; return; }
        statusEl.innerText = 'متصل بالسحابة بنجاح ✓'; statusEl.style.color = '#10b981';
        if (data && data.payload) { 
            storeData = data.payload; 
            if(!Array.isArray(storeData.banners)) storeData.banners = [];
            if(!Array.isArray(storeData.shein)) storeData.shein = [];
        }
        renderAdmin();
    }

    async function pushToCloud() {
        showToast('جاري الحفظ...');
        const { error } = await _supabase.from('store_data').upsert({ id: 1, payload: storeData });
        if (error) { alert('فشل الحفظ: ' + error.message); } 
        else { showToast('تم الحفظ والمزامنة بنجاح ✓'); renderAdmin(); }
    }

    function adminLogin(e) {
        e.preventDefault();
        if (document.getElementById('aUser').value === 'admin' && document.getElementById('aPass').value === 'admin2026') {
            sessionStorage.setItem('sadarah_admin', '1'); checkSession();
        } else { showToast('بيانات الدخول غير صحيحة'); }
    }

    function checkSession() {
        if (sessionStorage.getItem('sadarah_admin') === '1') {
            document.getElementById('loginWrap').style.display = 'none';
            document.getElementById('adminApp').style.display = 'block';
            initCloud();
        }
    }

    function logout() { sessionStorage.removeItem('sadarah_admin'); location.reload(); }

    function switchTab(name, btn) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('p-' + name).classList.add('active');
    }

    function renderAdmin() {
        document.getElementById('gridProducts').innerHTML = (storeData.products || []).map(p => {
            const imgs = (p.imgs && p.imgs.length) ? p.imgs : (p.img ? [p.img] : []);
            const mainImg = imgs[0] || 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400&q=80';
            const badgeHtml = imgs.length > 1 ? `<span class="img-count-badge">${imgs.length} صور</span>` : '';
            return `
            <div class="card">
                <div>
                    <div class="card-img-wrap">${badgeHtml}<img src="${mainImg}"></div>
                    <h4>${p.name}</h4>
                    <small>كود: <strong>${p.code}</strong></small>
                    <p style="font-weight:800; color:var(--primary);">${Number(p.price).toLocaleString()} ريال</p>
                </div>
                <div class="card-actions">
                    <button class="btn-sm btn-edit" onclick="openModal('product', ${p.id})">تعديل</button>
                    <button class="btn-sm btn-del" onclick="delItem('products', ${p.id})">حذف</button>
                </div>
            </div>`;
        }).join('');

        document.getElementById('gridCategories').innerHTML = (storeData.categories || []).map(c => `
            <div class="card">
                <div><h4>${c.name}</h4><span class="prefix-badge">حرف: ${getCategoryPrefix(c)}</span></div>
                <div class="card-actions">
                    <button class="btn-sm btn-edit" onclick="openModal('category', '${c.id}')">تعديل</button>
                    <button class="btn-sm btn-del" onclick="delItem('categories', '${c.id}')">حذف</button>
                </div>
            </div>`).join('');

        document.getElementById('gridShein').innerHTML = (storeData.shein || []).map(s => `
            <div class="card">
                <div>
                    <h4>${s.title}</h4>
                    <p style="color:var(--primary); font-weight:800; margin-top:5px;">الحالة: ${s.status}</p>
                    <small style="color:#64748b;">التاريخ: ${s.date}</small>
                </div>
                <div class="card-actions">
                    <button class="btn-sm btn-edit" onclick="openModal('shein', ${s.id})">تعديل</button>
                    <button class="btn-sm btn-del" onclick="delItem('shein', ${s.id})">حذف</button>
                </div>
            </div>`).join('');

        document.getElementById('gridBanners').innerHTML = (storeData.banners || []).map(b => `
            <div class="card">
                <div>
                    <div class="card-img-wrap" style="height:130px;"><img src="${b.img || b.url}"></div>
                    <h4>${b.title || 'بنر'}</h4>
                </div>
                <div class="card-actions">
                    <button class="btn-sm btn-edit" onclick="openModal('banner', ${b.id})">تعديل</button>
                    <button class="btn-sm btn-del" onclick="delItem('banners', ${b.id})">حذف</button>
                </div>
            </div>`).join('');

        document.getElementById('gridPayments').innerHTML = (storeData.payments || []).map(pay => `
            <div class="card">
                <div>
                    <h4>${pay.title}</h4>
                    <p style="font-weight:800; color:var(--primary); direction:ltr; text-align:right;">${pay.number}</p>
                </div>
                <div class="card-actions">
                    <button class="btn-sm btn-edit" onclick="openModal('payment', ${pay.id})">تعديل</button>
                    <button class="btn-sm btn-del" onclick="delItem('payments', ${pay.id})">حذف</button>
                </div>
            </div>`).join('');

        document.getElementById('setName').value = storeData.settings?.storeName || '';
        document.getElementById('setWa').value = storeData.settings?.whatsapp || '';
    }

    function openModal(type, id = null) {
        editType = type; editId = id; 
        const f = document.getElementById('mFields'); const t = document.getElementById('mTitle');

        if (type === 'product') {
            if (!storeData.categories || !storeData.categories.length) return showToast('أضف قسماً أولاً!');
            const defCat = storeData.categories[0].id;
            const item = id ? storeData.products.find(x => x.id === id) : { name: '', code: generateNextCode(defCat), price: '', catId: defCat, imgs: [] };
            currentProductImgs = (item.imgs && item.imgs.length) ? [...item.imgs] : (item.img ? [item.img] : []);
            t.innerText = id ? 'تعديل منتج' : 'منتج جديد';
            const opts = storeData.categories.map(c => `<option value="${c.id}" ${c.id===item.catId?'selected':''}>${c.name}</option>`).join('');
            f.innerHTML = `
                <div class="grp"><label>اسم المنتج</label><input type="text" id="inName" value="${item.name}" required></div>
                <div class="grp"><label>القسم</label><select id="inCat" onchange="onProductCatChange(this.value)">${opts}</select></div>
                <div class="grp"><label>الكود</label><input type="text" id="inCode" value="${item.code}" style="direction:ltr; font-weight:800;" required></div>
                <div class="grp"><label>السعر</label><input type="number" id="inPrice" value="${item.price}" required></div>
                <div class="grp"><label>رفع صور</label><input type="file" accept="image/*" multiple onchange="uploadMultipleProductImgs(event)"></div>
                <div class="grp"><label>الصور (<span id="imgCounter">0</span>):</label><div class="multi-img-list" id="multiImgPreview"></div></div>`;
            renderProductImgPreviews();
        } else if (type === 'category') {
            const item = id ? storeData.categories.find(x => x.id === id) : { name: '', prefix: '' };
            t.innerText = id ? 'تعديل قسم' : 'قسم جديد';
            f.innerHTML = `
                <div class="grp"><label>اسم القسم</label><input type="text" id="inCatName" value="${item.name}" required></div>
                <div class="grp"><label>الحرف الأولي للكود</label><input type="text" id="inCatPrefix" value="${item.prefix || ''}" maxlength="3" style="direction:ltr; text-transform:uppercase;" required></div>`;
        } else if (type === 'shein') {
            const item = id ? (storeData.shein || []).find(x => x.id === id) : { title: '', status: 'قيد المراجعة والتجميع', date: new Date().toISOString().slice(0,10) };
            t.innerText = id ? 'تعديل شحنة شي إن' : 'شحنة شي إن جديدة';
            f.innerHTML = `
                <div class="grp"><label>عنوان الطلبية (مثال: طلبية #تخفيضات نوفمبر)</label><input type="text" id="inSheinTitle" value="${item.title}" required></div>
                <div class="grp">
                    <label>حالة الشحنة</label>
                    <select id="inSheinStatus">
                        <option value="قيد المراجعة والتجميع" ${item.status==='قيد المراجعة والتجميع'?'selected':''}>قيد المراجعة والتجميع</option>
                        <option value="تم الشراء" ${item.status==='تم الشراء'?'selected':''}>تم الشراء</option>
                        <option value="في الطريق إليك" ${item.status==='في الطريق إليك'?'selected':''}>في الطريق إليك</option>
                        <option value="تم التسليم بنجاح" ${item.status==='تم التسليم بنجاح'?'selected':''}>تم التسليم بنجاح</option>
                    </select>
                </div>
                <div class="grp"><label>تاريخ رفع السلة</label><input type="text" id="inSheinDate" value="${item.date}" required style="direction:ltr;"></div>`;
        } else if (type === 'banner') {
            const item = id ? storeData.banners.find(x => x.id === id) : { title: '', img: '' };
            uploadedImgUrl = item.img || item.url || '';
            t.innerText = id ? 'تعديل بنر' : 'بنر جديد';
            f.innerHTML = `
                <div class="grp"><label>عنوان البنر</label><input type="text" id="inBannerTitle" value="${item.title || ''}"></div>
                <div class="grp"><label>رفع صورة البنر</label><input type="file" accept="image/*" onchange="uploadBannerImg(event)"></div>
                <div class="grp"><label>رابط الصورة</label><input type="text" id="inImgUrl" value="${uploadedImgUrl}" style="direction:ltr;" required></div>`;
        } else if (type === 'payment') {
            const item = id ? storeData.payments.find(x => x.id === id) : { title: '', number: '', note: '' };
            t.innerText = id ? 'تعديل دفع' : 'طريقة دفع جديدة';
            f.innerHTML = `
                <div class="grp"><label>اسم البنك/المحفظة</label><input type="text" id="inPayTitle" value="${item.title}" required></div>
                <div class="grp"><label>رقم الحساب</label><input type="text" id="inPayNum" value="${item.number}" required style="direction:ltr;"></div>`;
        }
        document.getElementById('formModal').classList.add('open');
    }

    function onProductCatChange(catId) { if (!editId) document.getElementById('inCode').value = generateNextCode(catId); }

    function renderProductImgPreviews() {
        const container = document.getElementById('multiImgPreview');
        document.getElementById('imgCounter').innerText = currentProductImgs.length;
        container.innerHTML = currentProductImgs.map((url, idx) => `
            <div class="mini-thumb"><img src="${url}"><button type="button" onclick="currentProductImgs.splice(${idx},1); renderProductImgPreviews();">&times;</button></div>
        `).join('');
    }

    async function uploadMultipleProductImgs(e) {
        const files = Array.from(e.target.files);
        if (!files.length) return;
        showToast('جاري رفع الصور...');
        for (const file of files) {
            const fileName = `${Date.now()}_${Math.random()}_${file.name}`;
            const { error } = await _supabase.storage.from('platform-files').upload(fileName, file);
            if (!error) {
                const { data } = _supabase.storage.from('platform-files').getPublicUrl(fileName);
                if (data && data.publicUrl) { currentProductImgs.push(data.publicUrl); renderProductImgPreviews(); }
            }
        }
        showToast('تم الرفع ✓');
    }

    async function uploadBannerImg(e) {
        const file = e.target.files[0];
        if (!file) return;
        const fileName = `banner_${Date.now()}_${file.name}`;
        const { error } = await _supabase.storage.from('platform-files').upload(fileName, file);
        if (!error) {
            const { data } = _supabase.storage.from('platform-files').getPublicUrl(fileName);
            if (data && data.publicUrl) { uploadedImgUrl = data.publicUrl; document.getElementById('inImgUrl').value = uploadedImgUrl; showToast('تم الرفع ✓'); }
        }
    }

    function handleSave(e) {
        e.preventDefault();
        if (editType === 'product') {
            const finalImgs = currentProductImgs.length ? currentProductImgs : ['https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400&q=80'];
            const obj = { id: editId || Date.now(), name: document.getElementById('inName').value, catId: document.getElementById('inCat').value, code: document.getElementById('inCode').value.trim().toUpperCase(), price: Number(document.getElementById('inPrice').value), img: finalImgs[0], imgs: finalImgs };
            if (editId) storeData.products[storeData.products.findIndex(x => x.id === editId)] = obj; else storeData.products.unshift(obj);
        } else if (editType === 'category') {
            const name = document.getElementById('inCatName').value.trim();
            const prefix = document.getElementById('inCatPrefix').value.trim().toUpperCase();
            if (editId) { const c = storeData.categories.find(x => x.id === editId); c.name = name; c.prefix = prefix; }
            else storeData.categories.push({ id: 'cat_' + Date.now(), name, prefix });
        } else if (editType === 'shein') {
            if (!Array.isArray(storeData.shein)) storeData.shein = [];
            const obj = { id: editId || Date.now(), title: document.getElementById('inSheinTitle').value, status: document.getElementById('inSheinStatus').value, date: document.getElementById('inSheinDate').value };
            if (editId) storeData.shein[storeData.shein.findIndex(x => x.id === editId)] = obj; else storeData.shein.unshift(obj);
        } else if (editType === 'banner') {
            if (!Array.isArray(storeData.banners)) storeData.banners = [];
            const obj = { id: editId || Date.now(), title: document.getElementById('inBannerTitle').value, img: uploadedImgUrl, url: uploadedImgUrl };
            if (editId) storeData.banners[storeData.banners.findIndex(x => x.id === editId)] = obj; else storeData.banners.push(obj);
        } else if (editType === 'payment') {
            const obj = { id: editId || Date.now(), title: document.getElementById('inPayTitle').value, number: document.getElementById('inPayNum').value };
            if (editId) storeData.payments[storeData.payments.findIndex(x => x.id === editId)] = obj; else storeData.payments.push(obj);
        }
        closeModal(); pushToCloud();
    }

    function delItem(key, id) {
        if (!confirm('تأكيد الحذف؟')) return;
        storeData[key] = storeData[key].filter(x => x.id !== id && String(x.id) !== String(id));
        pushToCloud();
    }

    function saveSettings() {
        storeData.settings.storeName = document.getElementById('setName').value;
        storeData.settings.whatsapp = document.getElementById('setWa').value;
        pushToCloud();
    }

    function closeModal() { document.getElementById('formModal').classList.remove('open'); }
    function showToast(m) { const t = document.getElementById('toast'); t.innerText = m; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2500); }

    checkSession();
</script>
</body>
</html>
