<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم صدارة</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #2563eb; --danger: #ef4444; --success: #10b981; --bg: #f1f5f9; --border: #e2e8f0; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
        body { background: var(--bg); color: #1e293b; }

        .login-wrap { position: fixed; inset: 0; background: #0f172a; z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .login-box { background: #fff; width: 100%; max-width: 360px; padding: 28px; border-radius: 22px; text-align: center; }
        
        .admin-header { background: #0f172a; color: #fff; padding: 16px 22px; display: flex; justify-content: space-between; align-items: center; }
        .container { max-width: 1100px; margin: 22px auto; padding: 0 16px 50px; }

        .tabs { display: flex; gap: 10px; overflow-x: auto; margin-bottom: 20px; padding-bottom: 5px; scrollbar-width: none; }
        .tab-btn { background: #fff; border: 1px solid var(--border); padding: 10px 18px; border-radius: 12px; font-weight: 700; cursor: pointer; white-space: nowrap; }
        .tab-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

        .panel { display: none; }
        .panel.active { display: block; }
        .btn-new { background: var(--success); color: #fff; border: none; padding: 11px 20px; border-radius: 12px; font-weight: 800; cursor: pointer; margin-bottom: 18px; display: inline-flex; align-items: center; gap: 8px; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
        .card { background: #fff; border-radius: 16px; padding: 16px; border: 1px solid var(--border); display: flex; flex-direction: column; justify-content: space-between; }
        
        /* عرض مرن بالكامل يملأ المكان دون قص */
        .card-img-wrap { width: 100%; height: 160px; background: #f8fafc; border-radius: 10px; display: flex; align-items: center; justify-content: center; overflow: hidden; margin-bottom: 12px; padding: 5px; }
        .card-img-wrap img { width: 100%; height: 100%; object-fit: contain; }

        .card-actions { display: flex; gap: 8px; margin-top: 12px; }
        .btn-sm { flex: 1; padding: 8px; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; }
        .btn-edit { background: #eff6ff; color: var(--primary); }
        .btn-del { background: #fef2f2; color: var(--danger); }

        .modal { position: fixed; inset: 0; background: rgba(15,23,42,0.5); z-index: 3000; display: none; align-items: center; justify-content: center; padding: 20px; }
        .modal.open { display: flex; }
        .modal-card { background: #fff; width: 100%; max-width: 420px; border-radius: 22px; padding: 22px; max-height: 90vh; overflow-y: auto; }
        .grp { margin-bottom: 14px; text-align: right; }
        .grp label { display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 5px; }
        .grp input, .grp select { width: 100%; padding: 11px; border: 1px solid var(--border); border-radius: 10px; background: #f8fafc; outline: none; }
        .btn-main { width: 100%; padding: 12px; border: none; border-radius: 12px; background: var(--primary); color: #fff; font-weight: 800; cursor: pointer; font-size: 1rem; }

        .toast { position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%) translateY(100px); background: #1e293b; color: #fff; padding: 10px 22px; border-radius: 25px; font-size: 0.9rem; z-index: 9999; transition: 0.3s; }
        .toast.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

<div class="login-wrap" id="loginWrap">
    <div class="login-box">
        <h2 style="margin-bottom:18px;">دخول الإدارة</h2>
        <form onsubmit="adminLogin(event)">
            <div class="grp"><label>اسم المستخدم</label><input type="text" id="aUser" required style="direction:ltr;"></div>
            <div class="grp"><label>كلمة المرور</label><input type="password" id="aPass" required style="direction:ltr;"></div>
            <button type="submit" class="btn-main">دخول</button>
        </form>
    </div>
</div>

<div id="adminApp" style="display:none;">
    <header class="admin-header">
        <div>
            <h3 style="font-size:1.1rem;">لوحة تحكم صدارة السحابية</h3>
            <small id="connStatus" style="color:#38bdf8;">جاري التحقق من الاتصال...</small>
        </div>
        <button onclick="logout()" style="background:var(--danger); color:#fff; border:none; padding:8px 14px; border-radius:8px; font-weight:700; cursor:pointer;">خروج</button>
    </header>

    <div class="container">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('products', this)">المنتجات</button>
            <button class="tab-btn" onclick="switchTab('categories', this)">الأقسام</button>
            <button class="tab-btn" onclick="switchTab('payments', this)">طرق الدفع</button>
            <button class="tab-btn" onclick="switchTab('settings', this)">الإعدادات</button>
        </div>

        <div class="panel active" id="p-products">
            <button class="btn-new" onclick="openModal('product')"><i class="fas fa-plus"></i> إضافة منتج</button>
            <div class="grid" id="gridProducts"></div>
        </div>

        <div class="panel" id="p-categories">
            <button class="btn-new" onclick="openModal('category')"><i class="fas fa-plus"></i> إضافة قسم</button>
            <div class="grid" id="gridCategories"></div>
        </div>

        <div class="panel" id="p-payments">
            <button class="btn-new" onclick="openModal('payment')"><i class="fas fa-plus"></i> إضافة طريقة دفع</button>
            <div class="grid" id="gridPayments"></div>
        </div>

        <div class="panel" id="p-settings">
            <div class="card" style="max-width:450px;">
                <h3 style="margin-bottom:15px;">الإعدادات العامة</h3>
                <div class="grp"><label>اسم المتجر</label><input type="text" id="setName"></div>
                <div class="grp"><label>رقم الواتساب (مع مفتاح الدولة)</label><input type="text" id="setWa" style="direction:ltr;"></div>
                <button class="btn-main" onclick="saveSettings()">حفظ الإعدادات</button>
            </div>
        </div>
    </div>
</div>

<div class="modal" id="formModal" onclick="if(event.target===this) closeModal()">
    <div class="modal-card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
            <h3 id="mTitle">إضافة</h3>
            <button onclick="closeModal()" style="background:none; border:none; font-size:1.5rem; cursor:pointer;">&times;</button>
        </div>
        <form onsubmit="handleSave(event)">
            <div id="mFields"></div>
            <button type="submit" class="btn-main" style="margin-top:10px;">حفظ في السحابة</button>
        </form>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
    const SUPABASE_URL = 'https://lvutrzswngpkjfamgact.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx2dXRyenN3bmdwa2pmYW1nYWN0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzNTk4MzAsImV4cCI6MjEwNzkzNTgzMH0.fK9eGSy2uv3spG6tynUCoGNivzmRCJnwLEnBFCCgu7g';

    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let storeData = { settings: { storeName: "متجر صدارة", whatsapp: "967780568507" }, categories: [], products: [], payments: [], users: [] };
    let editType = '', editId = null, uploadedImgUrl = '';

    async function initCloud() {
        const statusEl = document.getElementById('connStatus');
        const { data, error } = await _supabase.from('store_data').select('payload').eq('id', 1).maybeSingle();
        if (error) {
            statusEl.innerText = 'خطأ اتصال: ' + error.message;
            statusEl.style.color = '#ef4444';
            return;
        }
        statusEl.innerText = 'متصل بالسحابة بنجاح ✓';
        statusEl.style.color = '#10b981';
        if (data && data.payload) { storeData = data.payload; }
        renderAdmin();
    }

    async function pushToCloud() {
        showToast('جاري الحفظ...');
        const { error } = await _supabase.from('store_data').upsert({ id: 1, payload: storeData });
        if (error) {
            alert('فشل الحفظ! السبب التقني: ' + error.message);
        } else {
            showToast('تم الحفظ والمزامنة مع المتجر بنجاح ✓');
            renderAdmin();
        }
    }

    function adminLogin(e) {
        e.preventDefault();
        if (document.getElementById('aUser').value === 'admin' && document.getElementById('aPass').value === 'admin2026') {
            sessionStorage.setItem('sadarah_admin', '1');
            checkSession();
        } else {
            showToast('بيانات الدخول غير صحيحة');
        }
    }

    function checkSession() {
        if (sessionStorage.getItem('sadarah_admin') === '1') {
            document.getElementById('loginWrap').style.display = 'none';
            document.getElementById('adminApp').style.display = 'block';
            initCloud();
        }
    }

    function logout() { sessionStorage.removeItem('sadarah_admin'); location.reload(); }

    function switchTab(name, btn) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('p-' + name).classList.add('active');
    }

    function renderAdmin() {
        document.getElementById('gridProducts').innerHTML = (storeData.products || []).map(p => `
            <div class="card">
                <div>
                    <div class="card-img-wrap"><img src="${p.img}" onerror="this.src='https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400&q=80'"></div>
                    <h4>${p.name}</h4>
                    <small style="color:#64748b;">كود: ${p.code}</small>
                    <p style="font-weight:800; color:var(--primary); margin-top:4px;">${Number(p.price).toLocaleString()} ريال</p>
                </div>
                <div class="card-actions">
                    <button class="btn-sm btn-edit" onclick="openModal('product', ${p.id})">تعديل</button>
                    <button class="btn-sm btn-del" onclick="delItem('products', ${p.id})">حذف</button>
                </div>
            </div>
        `).join('');

        document.getElementById('gridCategories').innerHTML = (storeData.categories || []).map(c => `
            <div class="card">
                <h4>${c.name}</h4>
                <div class="card-actions">
                    <button class="btn-sm btn-edit" onclick="openModal('category', '${c.id}')">تعديل</button>
                    <button class="btn-sm btn-del" onclick="delItem('categories', '${c.id}')">حذف</button>
                </div>
            </div>
        `).join('');

        document.getElementById('gridPayments').innerHTML = (storeData.payments || []).map(pay => `
            <div class="card">
                <div>
                    <h4>${pay.title}</h4>
                    <p style="font-weight:800; color:var(--primary); direction:ltr; text-align:right; margin-top:5px;">${pay.number}</p>
                    <small style="color:#64748b;">${pay.note || ''}</small>
                </div>
                <div class="card-actions">
                    <button class="btn-sm btn-edit" onclick="openModal('payment', ${pay.id})">تعديل</button>
                    <button class="btn-sm btn-del" onclick="delItem('payments', ${pay.id})">حذف</button>
                </div>
            </div>
        `).join('');

        document.getElementById('setName').value = storeData.settings?.storeName || '';
        document.getElementById('setWa').value = storeData.settings?.whatsapp || '';
    }

    function openModal(type, id = null) {
        editType = type; editId = id; 
        const f = document.getElementById('mFields');
        const t = document.getElementById('mTitle');

        if (type === 'product') {
            if (!storeData.categories || !storeData.categories.length) return showToast('أضف قسماً أولاً قبل إضافة المنتجات!');
            const item = id ? storeData.products.find(x => x.id === id) : { name: '', code: '', price: '', catId: storeData.categories[0].id, img: '' };
            uploadedImgUrl = item.img;
            t.innerText = id ? 'تعديل منتج' : 'منتج جديد';
            const opts = storeData.categories.map(c => `<option value="${c.id}" ${c.id===item.catId?'selected':''}>${c.name}</option>`).join('');
            f.innerHTML = `
                <div class="grp"><label>اسم المنتج</label><input type="text" id="inName" value="${item.name}" required></div>
                <div class="grp"><label>القسم</label><select id="inCat">${opts}</select></div>
                <div class="grp"><label>الكود</label><input type="text" id="inCode" value="${item.code}" required></div>
                <div class="grp"><label>السعر</label><input type="number" id="inPrice" value="${item.price}" required></div>
                <div class="grp">
                    <label>اختر صورة من جهازك (سيتم ضغطها وتوليد الرابط تلقائياً)</label>
                    <input type="file" accept="image/*" onchange="compressAndUploadImg(event)">
                </div>
                <div class="grp">
                    <label>رابط الصورة المولد</label>
                    <input type="text" id="inImgUrl" value="${item.img}" style="direction:ltr;" required>
                </div>`;
        } else if (type === 'category') {
            const item = id ? storeData.categories.find(x => x.id === id) : { name: '' };
            t.innerText = id ? 'تعديل قسم' : 'قسم جديد';
            f.innerHTML = `<div class="grp"><label>اسم القسم</label><input type="text" id="inCatName" value="${item.name}" required></div>`;
        } else if (type === 'payment') {
            const item = id ? storeData.payments.find(x => x.id === id) : { title: '', number: '', note: '' };
            t.innerText = id ? 'تعديل طريقة دفع' : 'طريقة دفع جديدة';
            f.innerHTML = `
                <div class="grp"><label>اسم البنك / المحفظة</label><input type="text" id="inPayTitle" value="${item.title}" required></div>
                <div class="grp"><label>رقم الحساب</label><input type="text" id="inPayNum" value="${item.number}" required style="direction:ltr;"></div>
                <div class="grp"><label>ملاحظة (مثل اسم المستلم)</label><input type="text" id="inPayNote" value="${item.note || ''}"></div>`;
        }
        document.getElementById('formModal').classList.add('open');
    }

    // دالة لضغط الصورة برمجياً قبل رفعها لضمان سرعة التحميل الخارقة
    function compressAndUploadImg(e) {
        const file = e.target.files[0];
        if (!file) return;
        showToast('جاري ضغط الصورة وتحسينها...');

        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = function(event) {
            const img = new Image();
            img.src = event.target.result;
            img.onload = async function() {
                const canvas = document.createElement('canvas');
                let width = img.width;
                let height = img.height;
                
                // تحديد أقصى عرض أو ارتفاع للصورة لتقليل الحجم مع الحفاظ على الوضوح الكامل
                const MAX_WIDTH = 900;
                const MAX_HEIGHT = 900;
                
                if (width > height) {
                    if (width > MAX_WIDTH) {
                        height *= MAX_WIDTH / width;
                        width = MAX_WIDTH;
                    }
                } else {
                    if (height > MAX_HEIGHT) {
                        width *= MAX_HEIGHT / height;
                        height = MAX_HEIGHT;
                    }
                }

                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);

                // تحويل الصورة المضغوطة إلى ملف Blob بجودة 80% (لتوفير المساحة وسرعة هائلة في التصفح)
                canvas.toBlob(async (blob) => {
                    showToast('جاري رفع الصورة المضغوطة للسحابة...');
                    const cleanName = file.name.replace(/[^a-zA-Z0-9.]/g, '_');
                    const fileName = `${Date.now()}_${cleanName}`;
                    
                    const { error } = await _supabase.storage.from('platform-files').upload(fileName, blob);
                    if (error) { 
                        alert('فشل الرفع: ' + error.message); 
                        return; 
                    }
                    
                    const { data } = _supabase.storage.from('platform-files').getPublicUrl(fileName);
                    if (data && data.publicUrl) {
                        uploadedImgUrl = data.publicUrl;
                        document.getElementById('inImgUrl').value = uploadedImgUrl;
                        showToast('تم ضغط الصورة وتوليد الرابط بنجاح ✓');
                    }
                }, 'image/jpeg', 0.8);
            }
        }
    }

    function handleSave(e) {
        e.preventDefault();
        if (editType === 'product') {
            const imgVal = document.getElementById('inImgUrl').value;
            const obj = {
                id: editId || Date.now(),
                name: document.getElementById('inName').value,
                catId: document.getElementById('inCat').value,
                code: document.getElementById('inCode').value,
                price: Number(document.getElementById('inPrice').value),
                img: imgVal || uploadedImgUrl || 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400&q=80'
            };
            if (editId) storeData.products[storeData.products.findIndex(x => x.id === editId)] = obj;
            else storeData.products.unshift(obj);
        } else if (editType === 'category') {
            const name = document.getElementById('inCatName').value;
            if (editId) storeData.categories.find(x => x.id === editId).name = name;
            else storeData.categories.push({ id: 'cat_' + Date.now(), name });
        } else if (editType === 'payment') {
            const obj = {
                id: editId || Date.now(),
                title: document.getElementById('inPayTitle').value,
                number: document.getElementById('inPayNum').value,
                note: document.getElementById('inPayNote').value
            };
            if (editId) storeData.payments[storeData.payments.findIndex(x => x.id === editId)] = obj;
            else storeData.payments.push(obj);
        }
        closeModal();
        pushToCloud();
    }

    function delItem(key, id) {
        if (!confirm('تأكيد الحذف؟')) return;
        storeData[key] = storeData[key].filter(x => x.id !== id && String(x.id) !== String(id));
        pushToCloud();
    }

    function saveSettings() {
        storeData.settings.storeName = document.getElementById('setName').value;
        storeData.settings.whatsapp = document.getElementById('setWa').value;
        pushToCloud();
    }

    function closeModal() { document.getElementById('formModal').classList.remove('open'); }
    function showToast(m) { const t = document.getElementById('toast'); t.innerText = m; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2500); }

    checkSession();
</script>
</body>
</html>
