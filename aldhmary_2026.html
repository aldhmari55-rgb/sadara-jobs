<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <!-- شفرة أدسنس -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6392257665418096" crossorigin="anonymous"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إضافة وظيفة أو كفاءة جديدة | منصة صدارة</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { 
            --bg-main: #eef2f7;
            --neu-surface: #eef2f7;
            --c-darkest: #001D39;
            --c-mid: #49769F;
            --gold: #d4af37; 
            --emerald-btn: #10B981;
            --spec-bg: #F0F7FF;
            --spec-border: #0284C7;
            --spec-text: #1E3A8A;
            --text-main: #0b132b;
            --neu-shadow: 9px 9px 18px #cbced1, -9px -9px 18px #ffffff;
            --neu-shadow-inset: inset 5px 5px 10px #cbced1, inset -5px -5px 10px #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background: var(--bg-main); padding-bottom: 80px; color: var(--text-main); }

        .top-navbar { background: var(--neu-surface); padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--gold); position: sticky; top: 0; z-index: 1000; box-shadow: 0 8px 20px rgba(0,29,57,0.08); }
        .mini-btn { background: var(--neu-surface); color: var(--c-darkest); border: 1px solid rgba(212,175,55,0.4); padding: 10px 18px; border-radius: 16px; font-weight: 800; font-size: 12px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; transition: 0.3s; box-shadow: var(--neu-shadow); }
        .mini-btn:hover { box-shadow: var(--neu-shadow-inset); color: var(--gold); }

        .container { max-width: 700px; margin: 25px auto; padding: 0 15px; }
        .form-card { background: var(--neu-surface); padding: 30px; border-radius: 26px; box-shadow: var(--neu-shadow); border-top: 6px solid var(--gold); }
        .form-card h2 { color: var(--c-darkest); font-size: 20px; font-weight: 900; margin-bottom: 8px; text-align: center; }
        .form-card p { color: var(--c-mid); font-size: 12px; text-align: center; margin-bottom: 25px; font-weight: 700; }

        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 12px; background: var(--neu-surface); border: none; border-radius: 14px; font-weight: 900; font-size: 13px; cursor: pointer; box-shadow: var(--neu-shadow); transition: 0.3s; color: var(--c-darkest); }
        .tab-btn.active { background: var(--c-darkest); color: var(--gold); box-shadow: var(--neu-shadow-inset); }

        .form-group { margin-bottom: 16px; text-align: right; }
        .form-group label { display: block; font-size: 12px; font-weight: 900; color: var(--c-darkest); margin-bottom: 6px; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 14px; border: none; border-radius: 14px; font-size: 13px; font-weight: 700; outline: none; background: var(--neu-surface); box-shadow: var(--neu-shadow-inset); color: var(--text-main); }

        .submit-btn { width: 100%; background: var(--emerald-btn); color: white; border: none; padding: 15px; border-radius: 14px; font-weight: 900; font-size: 14px; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); margin-top: 10px; }
        .submit-btn:hover { background: #059669; transform: translateY(-2px); }
        
        .info-spec-note { background: var(--spec-bg); border-right: 4px solid var(--spec-border); color: var(--spec-text); padding: 12px; border-radius: 10px; font-size: 11px; font-weight: 700; margin-bottom: 15px; line-height: 1.6; }
    </style>
</head>
<body>

    <div class="top-navbar">
        <a href="index.html" class="mini-btn"><i class="fa-solid fa-house"></i> الرئيسية</a>
        <span style="font-weight: 900; font-size: 16px; color: var(--c-darkest);">إضافة <span style="color:var(--gold);">عرض أو طلب</span></span>
        <a href="services.html" class="mini-btn"><i class="fa-solid fa-store"></i> المتجر</a>
    </div>

    <div class="container">
        <div class="form-card">
            <h2>إضافة فرصة جديدة إلى المنصة 🚀</h2>
            <p>أضف تفاصيل الوظيفة الشاغرة أو سيرتك الذاتية ليصل طلبك إلى آلاف المستفيدين فوراً</p>

            <div class="tabs">
                <button class="tab-btn active" id="btnJobTab" onclick="switchFormType('job')">💼 إضافة وظيفة شاغرة</button>
                <button class="tab-btn" id="btnResumeTab" onclick="switchFormType('resume')">👨‍💻 إضافة كفاءة / سيرة ذاتية</button>
            </div>

            <div class="info-spec-note">
                💡 <b>تنبيه هام:</b> يرجى التأكد من كتابة التفاصيل الدقيقة ورقم الواتساب بشكل صحيح لضمان سرعة التواصل وتأكيد النشر.
            </div>

            <form id="addForm" onsubmit="handleFormSubmit(event)">
                <div class="form-group" id="titleGroup">
                    <label id="titleLabel">المسمى الوظيفي / المسمى المهني</label>
                    <input type="text" id="inputTitle" required placeholder="مثال: محاسب عام / مصمم جرافيك">
                </div>

                <div class="form-group" id="categoryGroup">
                    <label>القسم / المجال</label>
                    <select id="inputCategory">
                        <option value="محاسبية">🧮 محاسبية</option>
                        <option value="تسويقية">📢 تسويقية</option>
                        <option value="تجارية">🛒 تجارية</option>
                        <option value="برمجية">💻 برمجية</option>
                        <option value="عملية">⚙️ عملية</option>
                    </select>
                </div>

                <div class="form-group" id="companyGroup">
                    <label>اسم الشركة / الجهة (اختياري)</label>
                    <input type="text" id="inputCompany" placeholder="مثال: مجموعة صدارة الرقمية">
                </div>

                <div class="form-group">
                    <label>رقم الواتساب للتواصل</label>
                    <input type="tel" id="inputPhone" required placeholder="مثال: 770000000">
                </div>

                <div class="form-group">
                    <label>رابط الصورة / الشعار (اختياري)</label>
                    <input type="url" id="inputImage" placeholder="https://example.com/image.jpg">
                </div>

                <div class="form-group">
                    <label id="descLabel">التفاصيل والخبرات الشاملة</label>
                    <textarea id="inputDetails" rows="4" required placeholder="اكتب الشروط والمهارات المطلوبة بالتفصيل..."></textarea>
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">إرسال ونشر البيانات 📤</button>
                <div id="statusMsg" style="text-align:center; font-size:12px; margin-top:12px; font-weight:900;"></div>
            </form>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://lvutrzswngpkjfamgact.supabase.co";
        const SUPABASE_KEY = "sb_publishable_fB8RmZyfymR8YpjLInA2LQ_hMA6qgRG";
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentType = 'job';

        function switchFormType(type) {
            currentType = type;
            if(type === 'job') {
                document.getElementById('btnJobTab').classList.add('active');
                document.getElementById('btnResumeTab').classList.remove('active');
                document.getElementById('titleLabel').textContent = 'المسمى الوظيفي المطلوب';
                document.getElementById('companyGroup').style.display = 'block';
                document.getElementById('categoryGroup').style.display = 'block';
                document.getElementById('descLabel').textContent = 'تفاصيل الوظيفة والمؤهلات المطلوبة';
            } else {
                document.getElementById('btnResumeTab').classList.add('active');
                document.getElementById('btnJobTab').classList.remove('active');
                document.getElementById('titleLabel').textContent = 'اسمك / التخصص المهني';
                document.getElementById('companyGroup').style.display = 'none';
                document.getElementById('categoryGroup').style.display = 'none';
                document.getElementById('descLabel').textContent = 'ملخص الخبرات والمهارات الشخصية';
            }
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            const msg = document.getElementById('statusMsg');
            msg.style.color = 'blue';
            msg.textContent = 'جاري حفظ وتنفيذ الطلب...';

            const title = document.getElementById('inputTitle').value.trim();
            const phone = document.getElementById('inputPhone').value.trim();
            const image = document.getElementById('inputImage').value.trim();
            const details = document.getElementById('inputDetails').value.trim();

            try {
                if(currentType === 'job') {
                    const category = document.getElementById('inputCategory').value;
                    const company = document.getElementById('inputCompany').value.trim();
                    await db.from('jobs').insert([{ title, category, company, phone, image, description: details, approved: true }]);
                } else {
                    await db.from('resumes').insert([{ name: title, job_title: title, phone, image, experience: details }]);
                }
                msg.style.color = 'green';
                msg.textContent = 'تم النشر بنجاح! جاري التوجيه للرئيسية...';
                setTimeout(() => window.location.href = 'index.html', 1200);
            } catch(err) {
                msg.style.color = 'red';
                msg.textContent = 'حدث خطأ أثناء النشر: ' + err.message;
            }
        }
    </script>
</body>
</html>
