<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة صدارة | سياسات المتجر</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background: #F9FAFB; padding: 20px; color: #1F2937; }
        .container { max-width: 800px; margin: 0 auto; background: #ffffff; padding: 25px; border-radius: 12px; border: 1px solid #E5E7EB; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
        h2 { font-size: 18px; font-weight: 900; color: #111827; margin-bottom: 15px; border-bottom: 2px solid #F3F4F6; padding-bottom: 10px; display: flex; align-items: center; gap: 8px; }
        p, div { font-size: 12px; line-height: 1.8; color: #4B5563; white-space: pre-line; }
        .back-btn { display: inline-block; margin-top: 20px; background: #111827; color: white; padding: 10px 18px; border-radius: 8px; text-decoration: none; font-weight: 900; font-size: 11px; }
    </style>
</head>
<body>
    <div class="container">
        <h2 id="pageTitle">📄 جاري التحميل...</h2>
        <div id="pageContent">جاري جلب المحتوى من لوحة التحكم...</div>
        <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-right"></i> عودة للمتجر الرئيسي</a>
    </div>

    <script>
        const SUPABASE_URL = "https://lvutrzswngpkjfamgact.supabase.co";
        const SUPABASE_KEY = "sb_publishable_fB8RmZyfymR8YpjLInA2LQ_hMA6qgRG";
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const titles = {
            'privacy': 'سياسة الخصوصية',
            'exchange': 'سياسة الاستبدال والاسترجاع',
            'shipping': 'شروط وسياسة الشحن والتوصيل',
            'warranty': 'الضمان وشروط الخدمة'
        };

        async function loadPage() {
            const urlParams = new URLSearchParams(window.location.search);
            const type = urlParams.get('type') || 'privacy';
            
            document.getElementById('pageTitle').textContent = titles[type] || 'تفاصيل السياسة';
            
            try {
                let { data } = await db.from('store_settings').select('value').eq('key', 'policy_' + type).maybeSingle();
                if(data && data.value) {
                    document.getElementById('pageContent').textContent = data.value;
                } else {
                    document.getElementById('pageContent').textContent = 'عذراً، لم يتم إدراج محتوى لهذه الصفحة بعد من قبل إدارة المتجر.';
                }
            } catch(e) {
                document.getElementById('pageContent').textContent = 'حدث خطأ أثناء تحميل المحتوى.';
            }
        }

        window.addEventListener('DOMContentLoaded', loadPage);
    </script>
</body>
</html>
