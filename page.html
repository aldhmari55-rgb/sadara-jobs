<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صدارة شي إن | سياسات المتجر</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 pb-10">

    <!-- Header -->
    <header class="bg-white border-b border-slate-100 p-4 sticky top-0 z-40 shadow-sm flex items-center justify-between">
        <div class="flex items-center gap-2">
            <a href="index.html" class="p-1.5 rounded-full bg-slate-100 text-slate-600">
                <i class="fa-solid fa-arrow-right"></i>
            </a>
            <h1 class="font-black text-base text-slate-800" id="pageTitle">📄 جاري التحميل...</h1>
        </div>
        <div class="bg-lime-500 text-slate-900 font-extrabold px-2.5 py-1 rounded-lg text-xs">
            صدارة SHEIN
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-md mx-auto p-4 space-y-4">
        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-4">
            <div id="pageContent" class="text-xs leading-relaxed text-slate-600 whitespace-pre-line">
                <div class="flex items-center justify-center py-8 text-slate-400 gap-2">
                    <i class="fa-solid fa-spinner fa-spin text-lg"></i>
                    <span>جاري جلب المحتوى من صدارة...</span>
                </div>
            </div>
            
            <div class="pt-4 border-t border-slate-100">
                <a href="index.html" class="w-full py-3 bg-slate-900 text-white text-xs font-bold rounded-xl flex items-center justify-center gap-2 shadow-md">
                    <i class="fa-solid fa-house"></i>
                    <span>العودة للرئيسية</span>
                </a>
            </div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = "https://lvutrzswngpkjfamgact.supabase.co";
        const SUPABASE_KEY = "sb_publishable_fB8RmZyfymR8YpjLInA2LQ_hMA6qgRG";
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const titles = {
            'privacy': 'سياسة الخصوصية',
            'exchange': 'سياسة الاستبدال والاسترجاع',
            'shipping': 'شروط وسياسة الشحن والتوصيل',
            'warranty': 'الضمان وشروط الخدمة'
        };

        async function loadPage() {
            const urlParams = new URLSearchParams(window.location.search);
            const type = urlParams.get('type') || 'privacy';
            
            document.getElementById('pageTitle').textContent = titles[type] || 'تفاصيل السياسة';
            
            try {
                let { data } = await db.from('store_settings').select('value').eq('key', 'policy_' + type).maybeSingle();
                if(data && data.value) {
                    document.getElementById('pageContent').textContent = data.value;
                } else {
                    document.getElementById('pageContent').innerHTML = `
                        <div class="text-center py-6 space-y-2">
                            <i class="fa-solid fa-file-circle-exclamation text-3xl text-slate-300"></i>
                            <p class="font-bold text-slate-700">لم يتم إدراج المحتوى بعد</p>
                            <p class="text-[11px] text-slate-400">يمكنك إضافة تفاصيل هذه السياسة من لوحة تحكم إدارة صدارة.</p>
                        </div>
                    `;
                }
            } catch(e) {
                document.getElementById('pageContent').textContent = 'حدث خطأ أثناء تحميل المحتوى، يرجى المحاولة لاحقاً.';
            }
        }

        window.addEventListener('DOMContentLoaded', loadPage);
    </script>
</body>
</html>
