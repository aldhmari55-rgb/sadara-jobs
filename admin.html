<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الشاملة والسيطرة الكاملة | صدارة</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --admin-dark: #0f172a; --admin-blue: #2563eb; --bg: #f8fafc; --card: #ffffff; --green: #16a34a; --red: #dc2626; --gold: #ca8a04; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background: var(--bg); padding: 15px; color: #1e293b; }
        .box { max-width: 750px; margin: 0 auto; background: var(--card); border: 2px solid var(--admin-dark); border-radius: 12px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { font-size: 20px; text-align: center; margin-bottom: 20px; color: var(--admin-dark); }
        .sec { background: #f1f5f9; padding: 14px; border-radius: 10px; margin-bottom: 16px; border: 1px solid #cbd5e1; }
        .sec h3 { font-size: 15px; margin-bottom: 10px; color: var(--admin-dark); font-weight: 900; }
        input, select { width: 100%; padding: 8px; margin: 6px 0; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 12px; outline: none; background: #fff; }
        .btn { border: none; padding: 6px 12px; border-radius: 6px; font-weight: bold; font-size: 12px; cursor: pointer; color: white; display: inline-flex; align-items: center; gap: 4px; }
        .btn-add { background: var(--green); width: 100%; justify-content: center; padding: 10px; margin-top: 6px; font-size: 14px; }
        .btn-edit { background: var(--admin-blue); }
        .btn-del { background: var(--red); }
        .btn-toggle { background: var(--gold); }
        .item { background: white; padding: 12px; border-radius: 8px; border: 1px solid #cbd5e1; margin-bottom: 10px; }
        .flex-btns { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
        .partner-grid { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
        .partner-card { background: white; padding: 8px; border-radius: 8px; border: 1px solid #cbd5e1; width: 110px; text-align: center; }
        .partner-card img { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; margin-bottom: 4px; }
    </style>
</head>
<body>
    <div class="box">
        <h1>⚡ لوحة التحكم الشاملة والمباشرة (صدارة)</h1>

        <!-- قسم إضافة وظيفة أو خدمة مباشرة من الأدمن -->
        <div class="sec" style="background:#e0f2fe; border-color:#7dd3fc;">
            <h3 style="color:#0369a1;">➕ إضافة شاغر أو خدمة جديدة مباشرة</h3>
            <input type="text" id="jTitle" placeholder="عنوان الوظيفة أو الخدمة (مثال: محاسب عام)">
            <input type="text" id="jCompany" placeholder="اسم الشركة أو الجهة">
            <input type="text" id="jPhone" placeholder="رقم الواتساب (مثال: 967770000000)">
            <input type="text" id="jImage" placeholder="مسار صورة الإعلان اختياري (مثال: images/banner 1 .png)">
            <select id="jStatus">
                <option value="متوفر">الحالة: متوفر</option>
                <option value="غير متوفر">الحالة: غير متوفر</option>
            </select>
            <button class="btn btn-add" onclick="addNewJobDirect()">نشر الوظيفة في المنصة فوراً 🟢</button>
        </div>

        <!-- البنرات -->
        <div class="sec">
            <h3>🖼️ إدارة البنرات الإعلانية المتحركة (سلايدر)</h3>
            <input type="text" id="bUrl" placeholder="مسار البنر (مثال: images/banner 1 .png)">
            <button class="btn btn-add" onclick="addBanner()" style="padding:8px; font-size:12px;">إضافة البنر للسحابة</button>
            <div id="bList" style="margin-top:10px;"></div>
        </div>

        <!-- الشركاء -->
        <div class="sec">
            <h3>🤝 إدارة شعارات شركاء النجاح (الشريط المتحرك)</h3>
            <input type="text" id="pName" placeholder="اسم الشريك أو المتجر">
            <input type="text" id="pLogo" placeholder="مسار الشعار (مثال: images/logo 1 .jpg)">
            <button class="btn btn-add" onclick="addPartner()" style="padding:8px; font-size:12px;">إضافة الشريك للسحابة</button>
            <div class="partner-grid" id="pList"></div>
        </div>

        <!-- الوظائف -->
        <div class="sec">
            <h3>📋 إدارة ومراجعة كافة الوظائف والخدمات المعروضة</h3>
            <div id="jList"></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://lvutrzswngpkjfamgact.supabase.co";
        const SUPABASE_KEY = "sb_publishable_fB8RmZyfymR8YpjLInA2LQ_hMA6qgRG"; 
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function loadAll() {
            // 1. البنرات
            let { data: banners } = await db.from('banners').select('*').order('id', {ascending: false});
            let bBox = document.getElementById('bList');
            bBox.innerHTML = '';
            (banners || []).forEach(b => {
                bBox.innerHTML += `<div class="item" style="display:flex; justify-content:space-between; align-items:center;">
                    <span style="font-size:11px; font-weight:bold; word-break:break-all;">${b.url}</span>
                    <div class="flex-btns" style="margin:0;">
                        <button class="btn btn-edit" onclick="editBanner(${b.id}, '${b.url}')">✏️ تعديل</button>
                        <button class="btn btn-del" onclick="delBanner(${b.id})">🗑️ حذف</button>
                    </div>
                </div>`;
            });

            // 2. الشركاء
            let { data: partners } = await db.from('partners').select('*').order('id', {ascending: false});
            let pBox = document.getElementById('pList');
            pBox.innerHTML = '';
            (partners || []).forEach(p => {
                pBox.innerHTML += `<div class="partner-card">
                    <img src="${p.logo}">
                    <div style="font-size:10px; font-weight:bold; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${p.name}</div>
                    <button class="btn btn-edit" style="font-size:9px; padding:2px; width:100%; justify-content:center; margin:2px 0;" onclick="editPartner(${p.id}, '${p.name}', '${p.logo}')">✏️ تعديل</button>
                    <button class="btn btn-del" style="font-size:9px; padding:2px; width:100%; justify-content:center;" onclick="delPartner(${p.id})">🗑️ حذف</button>
                </div>`;
            });

            // 3. الوظائف
            let { data: jobs } = await db.from('jobs').select('*').order('id', {ascending: false});
            let jBox = document.getElementById('jList');
            jBox.innerHTML = '';
            (jobs || []).forEach(j => {
                jBox.innerHTML += `<div class="item">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <strong>${j.title}</strong>
                        <span style="font-size:11px; font-weight:bold; color:${j.approved?'green':'orange'}">${j.approved?'مقبول ومنشور':'قيد المراجعة'}</span>
                    </div>
                    <div style="font-size:11px; color:#64748b; margin-top:2px;">${j.company} | هاتف: ${j.phone} | الحالة: <b>${j.status}</b></div>
                    <div class="flex-btns">
                        ${!j.approved ? `<button class="btn btn-add" style="width:auto; padding:4px 8px;" onclick="approveJob(${j.id})">🟢 قبول ونشر</button>` : `<button class="btn btn-toggle" onclick="toggleJob(${j.id}, '${j.status}')">🔄 تغيير التوفر</button>`}
                        <button class="btn btn-edit" onclick="editJob(${j.id}, '${j.title}', '${j.company}', '${j.phone}', '${j.image||''}')">✏️ تعديل شامل</button>
                        <button class="btn btn-del" onclick="delJob(${j.id})">🗑️ حذف</button>
                    </div>
                </div>`;
            });
        }

        async function addBanner() {
            let url = document.getElementById('bUrl').value.trim();
            if(url) { await db.from('banners').insert([{ url }]); document.getElementById('bUrl').value=''; loadAll(); alert('تمت الإضافة بنجاح!'); }
        }
        async function editBanner(id, oldUrl) {
            let url = prompt('تعديل مسار/رابط البنر:', oldUrl);
            if(url) { await db.from('banners').update({ url }).eq('id', id); loadAll(); }
        }
        async function delBanner(id) {
            if(confirm('هل تريد حذف هذا البنر؟')) { await db.from('banners').delete().eq('id', id); loadAll(); }
        }

        async function addPartner() {
            let name = document.getElementById('pName').value.trim();
            let logo = document.getElementById('pLogo').value.trim();
            if(name && logo) { await db.from('partners').insert([{ name, logo }]); document.getElementById('pName').value=''; document.getElementById('pLogo').value=''; loadAll(); alert('تمت إضافة الشريك بنجاح!'); }
        }
        async function editPartner(id, oldName, oldLogo) {
            let name = prompt('تعديل اسم الشريك:', oldName);
            let logo = prompt('تعديل مسار الشعار:', oldLogo);
            if(name && logo) { await db.from('partners').update({ name, logo }).eq('id', id); loadAll(); }
        }
        async function delPartner(id) {
            if(confirm('هل تريد حذف هذا الشريك؟')) { await db.from('partners').delete().eq('id', id); loadAll(); }
        }

        async function addNewJobDirect() {
            let title = document.getElementById('jTitle').value.trim();
            let company = document.getElementById('jCompany').value.trim();
            let phone = document.getElementById('jPhone').value.trim();
            let image = document.getElementById('jImage').value.trim();
            let status = document.getElementById('jStatus').value;

            if(!title || !company || !phone) { alert('يرجى ملء الحقول الأساسية (العنوان، الجهة، الهاتف)'); return; }

            await db.from('jobs').insert([{ title, company, phone, image, status, approved: true }]);
            document.getElementById('jTitle').value = '';
            document.getElementById('jCompany').value = '';
            document.getElementById('jPhone').value = '';
            document.getElementById('jImage').value = '';
            loadAll();
            alert('تم نشر الوظيفة في المنصة فوراً للجميع!');
        }

        async function approveJob(id) { await db.from('jobs').update({ approved: true }).eq('id', id); loadAll(); }
        async function toggleJob(id, cur) { await db.from('jobs').update({ status: cur === 'متوفر' ? 'غير متوفر' : 'متوفر' }).eq('id', id); loadAll(); }
        
        async function editJob(id, t, c, p, img) {
            let title = prompt('تعديل العنوان:', t);
            let company = prompt('تعديل الجهة:', c);
            let phone = prompt('تعديل الهاتف:', p);
            let image = prompt('تعديل مسار الصورة:', img);
            if(title && company && phone) { 
                await db.from('jobs').update({ title, company, phone, image }).eq('id', id); 
                loadAll(); 
            }
        }
        
        async function delJob(id) {
            if(confirm('هل تريد حذف هذه الوظيفة نهائياً؟')) { await db.from('jobs').delete().eq('id', id); loadAll(); }
        }

        document.addEventListener('DOMContentLoaded', loadAll);
    </script>
</body>
</html>
