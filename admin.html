<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم إدارة منصة صدارة</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --admin-dark: #0f172a;
            --admin-accent: #2563eb;
            --bg-light: #f1f5f9;
            --card-bg: #ffffff;
            --text-dark: #1e293b;
            --success: #16a34a;
            --danger: #dc2626;
            --warning: #ca8a04;
            --whatsapp: #25d366;
            --border: #cbd5e1;
            --radius: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background-color: var(--bg-light); color: var(--text-dark); padding: 15px; }

        .admin-card-frame {
            max-width: 650px; margin: 0 auto; background: var(--card-bg);
            border: 2px solid var(--admin-dark); border-radius: var(--radius);
            padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .header-title { text-align: center; border-bottom: 2px dashed var(--border); padding-bottom: 15px; margin-bottom: 20px; }
        .header-title h1 { font-size: 20px; font-weight: 900; color: var(--admin-dark); }
        .header-title span { font-size: 13px; color: var(--admin-accent); font-weight: 800; }

        .section-box { background: #f8fafc; border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 20px; }
        .section-box h3 { font-size: 15px; font-weight: 900; margin-bottom: 12px; color: var(--admin-dark); }

        .admin-item { background: #ffffff; border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 10px; }
        .item-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }

        .action-btns { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
        .btn-action { border: none; padding: 6px 12px; border-radius: 6px; font-weight: 800; font-size: 12px; cursor: pointer; color: white; text-decoration: none; display: inline-flex; align-items: center; }
        .btn-approve { background: var(--success); }
        .btn-reject { background: var(--danger); }
        .btn-toggle { background: var(--warning); }
        .btn-share { background: var(--whatsapp); color: white; }

        .file-upload-btn {
            display: inline-block; background: var(--admin-accent); color: white;
            padding: 8px 14px; border-radius: 8px; font-weight: bold; font-size: 12px;
            cursor: pointer; text-align: center; margin-top: 5px;
        }
        .file-upload-btn input { display: none; }
        .banner-preview-img { width: 100%; max-height: 120px; object-fit: cover; border-radius: 8px; margin-top: 8px; display: none; }

        .partner-logo-grid { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
        .partner-logo-card { position: relative; width: 70px; text-align: center; background: white; padding: 6px; border-radius: 8px; border: 1px solid var(--border); }
        .partner-logo-card img { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; }
        .partner-delete-btn { background: var(--danger); color: white; border: none; padding: 2px 6px; font-size: 10px; border-radius: 4px; cursor: pointer; margin-top: 4px; width: 100%; }
        
        .job-thumb { width: 50px; height: 50px; border-radius: 8px; object-fit: cover; margin-left: 10px; }
    </style>
</head>
<body>

    <div class="admin-card-frame">
        <div class="header-title">
            <span>حساب خارجي لإدارة المنصة</span>
            <h1>لوحة التحكم الشاملة لمدير المنصة</h1>
        </div>

        <div class="section-box">
            <h3>🤝 إدارة شعارات شركاء النجاح (الشريط المتحرك)</h3>
            <div style="background: white; padding: 12px; border-radius: 8px; border: 1px solid var(--border);">
                <label style="font-size:12px; font-weight:bold;">➕ إضافة شركة / شريك جديد:</label><br>
                <input type="text" id="newPartnerName" placeholder="اسم الشركة أو المتجر" style="width:100%; padding:8px; margin: 6px 0; border:1px solid var(--border); border-radius:6px; font-size:12px;">
                <label class="file-upload-btn">
                    📷 اختيار الشعار من المعرض
                    <input type="file" id="newPartnerLogoFile" accept="image/*">
                </label>
                <button class="btn-action btn-approve" style="margin-top:6px;" onclick="addPartnerByAdmin()">إضافة للشريط المتحرك</button>
            </div>
            <h4 style="font-size:13px; font-weight:bold; margin-top:15px;">الشعارات المعروضة حالياً:</h4>
            <div class="partner-logo-grid" id="adminPartnersList"></div>
        </div>

        <div class="section-box">
            <h3>⚫ إدارة الوظائف والخدمات (مراجعة ونشر)</h3>
            <div id="adminJobsList"></div>
        </div>

        <div class="section-box">
            <h3>⚫ إدارة إعلانات البنرات</h3>
            <div>
                <label style="font-size:12px; font-weight:bold;">البنر العلوي:</label><br>
                <label class="file-upload-btn">
                    📷 اختيار صورة البنر العلوي
                    <input type="file" accept="image/*" onchange="uploadBanner(event, 'top')">
                </label>
                <img id="prevTop" class="banner-preview-img">
                <button class="btn-action btn-reject" style="margin-top:5px;" onclick="deleteBanner('top')">حذف البنر العلوي</button>
            </div>
        </div>
    </div>
    <script>
        var CHANNEL_LINK = "https://whatsapp.com/channel/0029VbDXcGt0G0XmrZfHLh1s";

        function getJobs() {
            return JSON.parse(localStorage.getItem('dhawar_jobs')) || [];
        }

        function getPartners() {
            return JSON.parse(localStorage.getItem('dhawar_partners')) || [];
        }

        function renderAllAdmin() {
            var partners = getPartners();
            var partnerContainer = document.getElementById('adminPartnersList');
            partnerContainer.innerHTML = (partners.length === 0) ? '<p style="font-size:11px; color:#64748b;">لا توجد شعارات معروضة.</p>' : '';
            
            for (var i = 0; i < partners.length; i++) {
                var p = partners[i];
                var cardHtml = '<div class="partner-logo-card">';
                cardHtml += '<img src="' + p.logo + '">';
                cardHtml += '<button class="partner-delete-btn" onclick="deletePartner(' + p.id + ')">حذف ✕</button>';
                cardHtml += '</div>';
                partnerContainer.innerHTML += cardHtml;
            }

            var jobs = getJobs();
            var jobsContainer = document.getElementById('adminJobsList');
            jobsContainer.innerHTML = (jobs.length === 0) ? '<p style="font-size:12px; color:#64748b;">لا توجد وظائف جديدة.</p>' : '';
            
            for (var j = 0; j < jobs.length; j++) {
                var job = jobs[j];
                var approveBtn = (!job.approved) ? '<button class="btn-action btn-approve" onclick="approveJob(' + job.id + ')">قبول ونشر</button>' : '';
                var imgTag = (job.image) ? '<img src="' + job.image + '" class="job-thumb">' : '';
                var statusText = (job.approved) ? 'مقبول' : 'قيد المراجعة';
                var statusColor = (job.approved) ? 'green' : 'orange';

                var itemHtml = '<div class="admin-item">';
                itemHtml += '<div class="item-header">';
                itemHtml += '<div style="display:flex; align-items:center;">' + imgTag + '<div><strong>' + job.title + '</strong><br><span style="font-size:12px; color:#64748b;">' + job.company + '</span></div></div>';
                itemHtml += '<span style="font-size:11px; font-weight:bold; color:' + statusColor + ';">' + statusText + '</span>';
                itemHtml += '</div>';
                itemHtml += '<div style="font-size:12px; color:#64748b; margin-top:6px;">الهاتف: ' + job.phone + ' | الحالة: <strong>' + job.status + '</strong></div>';
                itemHtml += '<div class="action-btns">';
                itemHtml += approveBtn;
                itemHtml += '<button class="btn-action btn-share" onclick="shareToWhatsAppChannel(' + job.id + ')">مشاركة بالقناة 🟢</button>';
                itemHtml += '<button class="btn-action btn-toggle" onclick="toggleJobStatus(' + job.id + ')">تغيير التوفر</button>';
                itemHtml += '<button class="btn-action btn-reject" onclick="deleteJob(' + job.id + ')">حذف</button>';
                itemHtml += '</div></div>';

                jobsContainer.innerHTML += itemHtml;
            }

            var topB = localStorage.getItem('ad_banner_top');
            if (topB) {
                document.getElementById('prevTop').src = topB;
                document.getElementById('prevTop').style.display = 'block';
            }
        }

        function shareToWhatsAppChannel(jobId) {
            var jobs = getJobs();
            var job = null;
            for (var i = 0; i < jobs.length; i++) {
                if (jobs[i].id === jobId) {
                    job = jobs[i];
                    break;
                }
            }
            if (!job) return;

            var msg = "📢 *فرصة عمل جديدة - منصة صدارة للوظائف بذمار*\n\n";
            msg += "💼 *المسمى الوظيفي:* " + job.title + "\n";
            msg += "🏢 *الجهة / المكان:* " + job.company + "\n";
            msg += "📍 *الموقع:* محافظة ذمار - اليمن\n";
            msg += "الحالة: *" + job.status + "*\n\n";
            msg += "📲 *للتقديم والتواصل المباشر عبر الواتساب:*\n";
            msg += "https://wa.me/" + job.phone + "\n\n";
            msg += "---\n";
            msg += "🟢 *تابع جديد الوظائف والخدمات اليومية عبر قناتنا الرسمية:*\n";
            msg += CHANNEL_LINK;

            navigator.clipboard.writeText(msg);

            if (job.image) {
                var win = window.open("", "_blank");
                if (win) {
                    win.document.write('<html><head><title>صورة الخدمة</title></head><body style="text-align:center; font-family:sans-serif; padding:20px;"><h3>تم نسخ النص العربي! أحفظ الصورة أدناه لمشاركتها بالقناة:</h3><img src="' + job.image + '" style="max-width:90%; border-radius:12px;"></body></html>');
                }
            }

            alert('تم نسخ نص الوظيفة بالعربي بنجاح! سيتم فتح الواتساب الآن للصق الرسالة وإرسالها للقناة.');
            window.open("https://api.whatsapp.com/send?text=" + encodeURIComponent(msg), '_blank');
        }

        function addPartnerByAdmin() {
            var name = document.getElementById('newPartnerName').value.trim();
            var fileInput = document.getElementById('newPartnerLogoFile');
            var file = fileInput.files[0];

            if (!name || !file) {
                alert('يرجى إدخال الاسم واختيار الشعار');
                return;
            }

            var reader = new FileReader();
            reader.onload = function(e) {
                var partners = getPartners();
                partners.push({ id: Date.now(), name: name, logo: e.target.result });
                localStorage.setItem('dhawar_partners', JSON.stringify(partners));
                alert('تمت إضافة الشعار بنجاح!');
                document.getElementById('newPartnerName').value = '';
                renderAllAdmin();
            };
            reader.readAsDataURL(file);
        }

        function deletePartner(id) {
            if (confirm('هل أنت متأكد من حذف الشعار؟')) {
                var partners = getPartners();
                var filtered = [];
                for (var i = 0; i < partners.length; i++) {
                    if (partners[i].id !== id) {
                        filtered.push(partners[i]);
                    }
                }
                localStorage.setItem('dhawar_partners', JSON.stringify(filtered));
                renderAllAdmin();
            }
        }

        function approveJob(id) {
            var jobs = getJobs();
            for (var i = 0; i < jobs.length; i++) {
                if (jobs[i].id === id) {
                    jobs[i].approved = true;
                }
            }
            localStorage.setItem('dhawar_jobs', JSON.stringify(jobs));
            alert('تم قبول الوظيفة بنجاح!');
            renderAllAdmin();
        }

        function toggleJobStatus(id) {
            var jobs = getJobs();
            for (var i = 0; i < jobs.length; i++) {
                if (jobs[i].id === id) {
                    jobs[i].status = (jobs[i].status === 'متوفر' ? 'غير متوفر' : 'متوفر');
                }
            }
            localStorage.setItem('dhawar_jobs', JSON.stringify(jobs));
            renderAllAdmin();
        }

        function deleteJob(id) {
            var jobs = getJobs();
            var filtered = [];
            for (var i = 0; i < jobs.length; i++) {
                if (jobs[i].id !== id) {
                    filtered.push(jobs[i]);
                }
            }
            localStorage.setItem('dhawar_jobs', JSON.stringify(filtered));
            renderAllAdmin();
        }

        function uploadBanner(event, type) {
            var file = event.target.files[0];
            if (!file) return;
            var reader = new FileReader();
            reader.onload = function(e) {
                localStorage.setItem('ad_banner_top', e.target.result);
                alert('تم رفع البنر بنجاح!');
                renderAllAdmin();
            };
            reader.readAsDataURL(file);
        }

        function deleteBanner(type) {
            localStorage.removeItem('ad_banner_top');
            document.getElementById('prevTop').style.display = 'none';
            alert('تم حذف البنر.');
        }

        document.addEventListener('DOMContentLoaded', renderAllAdmin);
    </script>
</body>
</html>
