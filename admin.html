<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة إدارة منصة صدارة</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #0f2347; --gold: #d4af37; --green: #25d366; --bg: #f8fafc; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background: var(--bg); padding: 15px; color: #0f172a; }
        .header { background: var(--primary); color: white; padding: 15px; border-radius: 12px; text-align: center; margin-bottom: 20px; border-bottom: 3px solid var(--gold); }
        .grid-container { display: grid; grid-template-columns: 1fr; gap: 20px; max-width: 900px; margin: 0 auto; }
        @media(min-width: 768px) { .grid-container { grid-template-columns: 1fr 1fr; } }
        .card { background: white; padding: 18px; border-radius: 12px; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
        .card h2 { font-size: 16px; margin-bottom: 12px; color: var(--primary); border-bottom: 2px solid #f1f5f9; padding-bottom: 6px; }
        label { font-size: 12px; font-weight: bold; display: block; margin-top: 8px; color: #475569; }
        input, select, textarea { width: 100%; padding: 10px; margin-top: 4px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 13px; outline: none; }
        input[type="file"] { background: #f1f5f9; cursor: pointer; }
        button { width: 100%; background: var(--primary); color: white; border: none; padding: 12px; margin-top: 15px; border-radius: 8px; font-weight: bold; font-size: 13px; cursor: pointer; transition: 0.2s; }
        button:hover { background: #1e3a8a; }
        .status-msg { margin-top: 8px; font-size: 11px; font-weight: bold; text-align: center; }
        .list-box { margin-top: 15px; max-height: 250px; overflow-y: auto; }
        .item-row { display: flex; justify-content: space-between; align-items: center; padding: 8px; border-bottom: 1px solid #f1f5f9; font-size: 12px; }
        .btn-del { background: #ef4444; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 10px; width: auto; margin-top: 0; }
    </style>
</head>
<body>

    <div class="header">
        <h1>لوحة تحكم منصة صدارة للوظائف 🛠️</h1>
        <p style="font-size: 12px; opacity: 0.8; margin-top: 4px;">إدارة الوظائف، السير الذاتية، البنرات والشركاء</p>
    </div>

    <div class="grid-container">

        <!-- 1. إضافة وظيفة جديدة -->
        <div class="card">
            <h2>💼 إضافة وظيفة جديدة</h2>
            <label>عنوان الوظيفة / الخدمة</label>
            <input type="text" id="jobTitle" placeholder="مثال: مطلوب محاسب خبرة">
            
            <label>اسم الشركة / الجهة</label>
            <input type="text" id="jobCompany" placeholder="مثال: شركة صدارة">
            
            <label>رقم التواصل (واتساب)</label>
            <input type="text" id="jobPhone" value="967780568507">
            
            <label>حالة الوظيفة</label>
            <select id="jobStatus">
                <option value="متاحة">متاحة 🟢</option>
                <option value="مغلقة">مغلقة 🔴</option>
            </select>

            <label>صورة الوظيفة (اختياري)</label>
            <input type="file" id="jobImgFile" accept="image/*">

            <button onclick="addJob()">نشر الوظيفة الآن 🚀</button>
            <div id="jobMsg" class="status-msg"></div>
        </div>

        <!-- 2. إضافة سيرة ذاتية (كفاءة) -->
        <div class="card">
            <h2>📄 إضافة سيرة ذاتية / كفاءة</h2>
            <label>الاسم الكامل</label>
            <input type="text" id="resName" placeholder="مثال: عبدالرحمن الذماري">
            
            <label>المسمى الوظيفي / التخصص</label>
            <input type="text" id="resTitle" placeholder="مثال: مستشار تسويق ومدرب">
            
            <label>الخبرات / نبذة مختصرة</label>
            <textarea id="resExp" rows="2" placeholder="خبرة سنتين في المجال..."></textarea>
            
            <label>رقم الواتساب للتواصل</label>
            <input type="text" id="resPhone" value="967780568507">

            <label>صورة الشخص / الشعار (اختياري)</label>
            <input type="file" id="resImgFile" accept="image/*">

            <label>ملف الـ CV بصيغة PDF (اختياري)</label>
            <input type="file" id="resPdfFile" accept=".pdf">

            <button onclick="addResume()" style="background: var(--gold); color: #0a1324;">إضافة السيرة الذاتية 📄</button>
            <div id="resMsg" class="status-msg"></div>
        </div>

        <!-- 3. رفع بنر للسلايدر المتحرك -->
        <div class="card">
            <h2>🖼️ إضافة بنر للسلايدر العلوي</h2>
            <label>اختر صورة البنر</label>
            <input type="file" id="bannerFile" accept="image/*">
            <button onclick="addBanner()">رفع البنر للسلايدر 📤</button>
            <div id="bannerMsg" class="status-msg"></div>
            
            <div class="list-box" id="bannersList"></div>
        </div>

        <!-- 4. إضافة شعار شركاء النجاح -->
        <div class="card">
            <h2>🤝 إضافة شعار شريك نجاح</h2>
            <label>اختر صورة الشعار</label>
            <input type="file" id="partnerFile" accept="image/*">
            <button onclick="addPartner()">إضافة للشريط المتحرك 🔄</button>
            <div id="partnerMsg" class="status-msg"></div>

            <div class="list-box" id="partnersList"></div>
        </div>

    </div>
    <script>
        const SUPABASE_URL = "https://lvutrzswngpkjfamgact.supabase.co";
        const SUPABASE_KEY = "sb_publishable_fB8RmZyfymR8YpjLInA2LQ_hMA6qgRG";
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // دالة رفع الملفات إلى Supabase Storage
        async function uploadFile(file, bucket) {
            if (!file) return '';
            const fileExt = file.name.split('.').pop();
            const fileName = `${Date.now()}_${Math.random().toString(36).substring(7)}.${fileExt}`;
            const { data, error } = await db.storage.from(bucket).upload(fileName, file);
            
            if (error) {
                console.error("Upload Error:", error);
                return '';
            }
            const { data: publicUrlData } = db.storage.from(bucket).getPublicUrl(fileName);
            return publicUrlData.publicUrl;
        }

        // 1. نشر وظيفة
        async function addJob() {
            const title = document.getElementById('jobTitle').value.trim();
            const company = document.getElementById('jobCompany').value.trim();
            const phone = document.getElementById('jobPhone').value.trim();
            const status = document.getElementById('jobStatus').value;
            const imgFile = document.getElementById('jobImgFile').files[0];
            const msg = document.getElementById('jobMsg');

            if (!title || !company) { alert('الرجاء كتابة العنوان واسم الشركة'); return; }
            msg.style.color = 'blue'; msg.textContent = 'جاري النشر والرفع...';

            let imgUrl = await uploadFile(imgFile, 'job-images');

            const { error } = await db.from('jobs').insert([{
                title: title,
                company: company,
                phone: phone,
                status: status,
                image: imgUrl,
                approved: true
            }]);

            if (error) {
                msg.style.color = 'red'; msg.textContent = 'حدث خطأ: ' + error.message;
            } else {
                msg.style.color = 'green'; msg.textContent = 'تم نشر الوظيفة بنجاح! ✅';
                document.getElementById('jobTitle').value = '';
                document.getElementById('jobCompany').value = '';
                document.getElementById('jobImgFile').value = '';
            }
        }

        // 2. إضافة سيرة ذاتية (معدلة بدون حقل approved المتسبب في الخطأ)
        async function addResume() {
            const name = document.getElementById('resName').value.trim();
            const title = document.getElementById('resTitle').value.trim();
            const exp = document.getElementById('resExp').value.trim();
            const phone = document.getElementById('resPhone').value.trim();
            const imgFile = document.getElementById('resImgFile').files[0];
            const pdfFile = document.getElementById('resPdfFile').files[0];
            const msg = document.getElementById('resMsg');

            if (!name || !title) { alert('الرجاء كتابة الاسم والتخصص'); return; }
            msg.style.color = 'blue'; msg.textContent = 'جاري رفع الملفات والسيرة الذاتية...';

            let imgUrl = await uploadFile(imgFile, 'resume-images');
            let pdfUrl = await uploadFile(pdfFile, 'resume-pdfs');

            const { error } = await db.from('resumes').insert([{
                name: name,
                job_title: title,
                experience: exp,
                phone: phone,
                image: imgUrl,
                file_url: pdfUrl
            }]);

            if (error) {
                msg.style.color = 'red'; msg.textContent = 'حدث خطأ: ' + error.message;
            } else {
                msg.style.color = 'green'; msg.textContent = 'تم إضافة السيرة الذاتية بنجاح! ✅';
                document.getElementById('resName').value = '';
                document.getElementById('resTitle').value = '';
                document.getElementById('resExp').value = '';
                document.getElementById('resImgFile').value = '';
                document.getElementById('resPdfFile').value = '';
            }
        }

        // 3. إضافة بنر للسلايدر
        async function addBanner() {
            const file = document.getElementById('bannerFile').files[0];
            const msg = document.getElementById('bannerMsg');
            if (!file) { alert('اختر صورة البنر أولاً'); return; }

            msg.style.color = 'blue'; msg.textContent = 'جاري الرفع...';
            let url = await uploadFile(file, 'banners');

            if (url) {
                await db.from('banners').insert([{ url: url }]);
                msg.style.color = 'green'; msg.textContent = 'تم رفع البنر بنجاح! ✅';
                document.getElementById('bannerFile').value = '';
                loadBanners();
            } else {
                msg.style.color = 'red'; msg.textContent = 'فشل رفع البنر';
            }
        }

        // 4. إضافة شريك
        async function addPartner() {
            const file = document.getElementById('partnerFile').files[0];
            const msg = document.getElementById('partnerMsg');
            if (!file) { alert('اختر صورة الشعار أولاً'); return; }

            msg.style.color = 'blue'; msg.textContent = 'جاري الرفع...';
            let url = await uploadFile(file, 'partners');

            if (url) {
                await db.from('partners').insert([{ logo: url }]);
                msg.style.color = 'green'; msg.textContent = 'تم إضافة الشريك بنجاح! ✅';
                document.getElementById('partnerFile').value = '';
                loadPartners();
            } else {
                msg.style.color = 'red'; msg.textContent = 'فشل الرفع';
            }
        }

        // دوان جلب وحذف البنرات والشركاء
        async function loadBanners() {
            let { data } = await db.from('banners').select('*').order('id', {ascending: false});
            let box = document.getElementById('bannersList');
            box.innerHTML = '';
            (data || []).forEach(b => {
                box.innerHTML += `<div class="item-row">
                    <img src="${b.url}" style="height:30px; border-radius:4px;">
                    <button class="btn-del" onclick="deleteItem('banners', ${b.id})">حذف</button>
                </div>`;
            });
        }

        async function loadPartners() {
            let { data } = await db.from('partners').select('*').order('id', {ascending: false});
            let box = document.getElementById('partnersList');
            box.innerHTML = '';
            (data || []).forEach(p => {
                box.innerHTML += `<div class="item-row">
                    <img src="${p.logo}" style="height:25px; border-radius:50%;">
                    <button class="btn-del" onclick="deleteItem('partners', ${p.id})">حذف</button>
                </div>`;
            });
        }

        async function deleteItem(table, id) {
            if (confirm('هل أنت تأكد من الحذف؟')) {
                await db.from(table).delete().eq('id', id);
                if (table === 'banners') loadBanners();
                if (table === 'partners') loadPartners();
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadBanners();
            loadPartners();
        });
    </script>
</body>
</html>
