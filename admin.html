<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة إدارة منصة صدارة الشاملة</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #0f2347; --gold: #d4af37; --green: #25d366; --red: #ef4444; --bg: #f8fafc; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background: var(--bg); padding: 15px; color: #0f172a; }
        .header { background: var(--primary); color: white; padding: 15px; border-radius: 12px; text-align: center; margin-bottom: 20px; border-bottom: 3px solid var(--gold); }
        .grid-container { display: grid; grid-template-columns: 1fr; gap: 20px; max-width: 1000px; margin: 0 auto; }
        @media(min-width: 768px) { .grid-container { grid-template-columns: 1fr 1fr; } }
        .card { background: white; padding: 18px; border-radius: 12px; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
        .card h2 { font-size: 15px; margin-bottom: 12px; color: var(--primary); border-bottom: 2px solid #f1f5f9; padding-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
        label { font-size: 12px; font-weight: bold; display: block; margin-top: 8px; color: #475569; }
        input, select, textarea { width: 100%; padding: 10px; margin-top: 4px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 13px; outline: none; }
        input[type="file"] { background: #f1f5f9; cursor: pointer; }
        button { width: 100%; background: var(--primary); color: white; border: none; padding: 12px; margin-top: 15px; border-radius: 8px; font-weight: bold; font-size: 13px; cursor: pointer; transition: 0.2s; }
        button:hover { opacity: 0.9; }
        .status-msg { margin-top: 8px; font-size: 11px; font-weight: bold; text-align: center; }
        .list-box { margin-top: 12px; max-height: 280px; overflow-y: auto; border-top: 1px dashed #e2e8f0; padding-top: 8px; }
        .item-row { display: flex; flex-direction: column; gap: 6px; padding: 10px; border-bottom: 1px solid #f1f5f9; font-size: 12px; background: #fafafa; border-radius: 8px; margin-bottom: 8px; }
        .row-header { display: flex; justify-content: space-between; align-items: center; }
        .action-btns { display: flex; gap: 6px; margin-top: 4px; flex-wrap: wrap; }
        .btn-sm { padding: 4px 8px; border-radius: 4px; border: none; cursor: pointer; font-size: 10px; font-weight: bold; color: white; }
        .btn-del { background: var(--red); }
        .btn-edit { background: #3b82f6; }
        .badge { background: #e2e8f0; color: #334155; padding: 2px 6px; border-radius: 4px; font-size: 10px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>لوحة تحكم منصة صدارة الشاملة 🛠️</h1>
        <p style="font-size: 12px; opacity: 0.8; margin-top: 4px;">إدارة الوظائف، الكفاءات، الشارات الزرقاء، والمستخدمين</p>
    </div>

    <div class="grid-container">

        <!-- 1. إدارة الوظائف -->
        <div class="card">
            <h2><span>💼 إدارة الوظائف</span><span class="badge" id="jobsCount">0</span></h2>
            <input type="hidden" id="editJobId">
            <label>عنوان الوظيفة</label>
            <input type="text" id="jobTitle" placeholder="مثال: مسوق ميداني">
            <label>اسم الشركة</label>
            <input type="text" id="jobCompany" placeholder="شركة صدارة">
            <label>رقم الواتساب</label>
            <input type="text" id="jobPhone" value="967780568507">
            <label>الحالة</label>
            <select id="jobStatus"><option value="متاحة">متاحة 🟢</option><option value="مغلقة">مغلقة 🔴</option></select>
            <label>الشارة الزرقاء الموثقة 🔵</label>
            <select id="jobIsVerified"><option value="false">بدون شارة</option><option value="true">تفعيل الشارة الزرقاء ☑️</option></select>
            <label>صورة</label>
            <input type="file" id="jobImgFile" accept="image/*">
            <button id="btnSaveJob" onclick="saveJob()">حفظ الوظيفة 🚀</button>
            <button id="btnCancelJob" onclick="resetJobForm()" style="display:none; background:#64748b; margin-top:5px;">إلغاء</button>
            <div id="jobMsg" class="status-msg"></div>
            <div class="list-box" id="jobsList"></div>
        </div>

        <!-- 2. إدارة الكفاءات المحسنة -->
        <div class="card">
            <h2><span>📄 إدارة الكفاءات</span><span class="badge" id="resCount">0</span></h2>
            <input type="hidden" id="editResId">
            <label>الاسم الكامل</label>
            <input type="text" id="resName" placeholder="الاسم">
            <label>التخصص / المسمى الوظيفي</label>
            <input type="text" id="resTitle" placeholder="التخصص">
            <label>الخبرات</label>
            <textarea id="resExp" rows="2" placeholder="الخبرات..."></textarea>
            <label>رقم الواتساب</label>
            <input type="text" id="resPhone" value="967780568507">
            <label>الشارة الزرقاء الموثقة 🔵</label>
            <select id="resIsVerified"><option value="false">بدون شارة</option><option value="true">تفعيل الشارة الزرقاء ☑️</option></select>
            <label>صورة شخصية</label>
            <input type="file" id="resImgFile" accept="image/*">
            <button id="btnSaveRes" onclick="saveResume()" style="background: var(--gold); color: #0a1324;">حفظ الكفاءة 📄</button>
            <button id="btnCancelRes" onclick="resetResForm()" style="display:none; background:#64748b; margin-top:5px;">إلغاء</button>
            <div id="resMsg" class="status-msg"></div>
            <div class="list-box" id="resumesList">جاري التحميل...</div>
        </div>

        <!-- 3. البنرات والشركاء -->
        <div class="card">
            <h2>🖼️ البنرات الإعلانية</h2>
            <input type="file" id="bannerFile" accept="image/*">
            <button onclick="addBanner()">رفع البنر 📤</button>
            <div class="list-box" id="bannersList"></div>
        </div>
        <div class="card">
            <h2>🤝 شركاء النجاح</h2>
            <input type="file" id="partnerFile" accept="image/*">
            <button onclick="addPartner()">إضافة شريك 🔄</button>
            <div class="list-box" id="partnersList"></div>
        </div>

        <!-- 4. قائمة المستخدمين -->
        <div class="card" style="border: 2px solid var(--primary); grid-column: 1 / -1;">
            <h2>👥 حسابات المستخدمين والشركات المسجلة <span class="badge" id="usersCount">0</span></h2>
            <div class="list-box" id="usersList">جاري التحميل...</div>
        </div>

    </div>

    <script>
        const SUPABASE_URL = "https://lvutrzswngpkjfamgact.supabase.co";
        const SUPABASE_KEY = "sb_publishable_fB8RmZyfymR8YpjLInA2LQ_hMA6qgRG";
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function uploadFile(file, bucket) {
            if (!file) return '';
            const fileExt = file.name.split('.').pop();
            const fileName = `${Date.now()}_${Math.random().toString(36).substring(7)}.${fileExt}`;
            const { data, error } = await db.storage.from(bucket).upload(fileName, file);
            if (error) return '';
            const { data: publicUrlData } = db.storage.from(bucket).getPublicUrl(fileName);
            return publicUrlData.publicUrl;
        }

        let cachedJobs = [];
        async function saveJob() {
            const editId = document.getElementById('editJobId').value;
            const title = document.getElementById('jobTitle').value.trim();
            const company = document.getElementById('jobCompany').value.trim();
            const phone = document.getElementById('jobPhone').value.trim();
            const status = document.getElementById('jobStatus').value;
            const isVerified = document.getElementById('jobIsVerified').value === 'true';
            const imgFile = document.getElementById('jobImgFile').files[0];
            const msg = document.getElementById('jobMsg');

            if (!title) { alert('أدخل عنوان الوظيفة'); return; }
            msg.style.color = 'blue'; msg.textContent = 'جاري الحفظ...';

            let imgUrl = await uploadFile(imgFile, 'job-images');
            let payload = { title, company, phone, status, approved: true, is_verified: isVerified };
            if (imgUrl) payload.image = imgUrl;

            let res = editId ? await db.from('jobs').update(payload).eq('id', editId) : await db.from('jobs').insert([payload]);
            if (res.error) {
                msg.style.color = 'red'; msg.textContent = 'خطأ: ' + res.error.message;
                return;
            }

            msg.style.color = 'green'; msg.textContent = 'تم الحفظ بنجاح! ✅';
            resetJobForm(); loadJobs();
        }

        function resetJobForm() {
            document.getElementById('editJobId').value = '';
            document.getElementById('jobTitle').value = '';
            document.getElementById('jobCompany').value = '';
            document.getElementById('jobIsVerified').value = 'false';
            document.getElementById('jobImgFile').value = '';
            document.getElementById('btnSaveJob').textContent = 'حفظ الوظيفة 🚀';
            document.getElementById('btnCancelJob').style.display = 'none';
        }

        async function loadJobs() {
            let { data } = await db.from('jobs').select('*').order('id', {ascending: false});
            cachedJobs = data || [];
            let box = document.getElementById('jobsList');
            document.getElementById('jobsCount').textContent = cachedJobs.length;
            box.innerHTML = '';
            cachedJobs.forEach(j => {
                box.innerHTML += `<div class="item-row">
                    <div class="row-header"><strong>${j.title || 'وظيفة'} ${j.is_verified ? '🔵' : ''}</strong><span>${j.status || 'متاحة'}</span></div>
                    <div style="color:#64748b; font-size:11px;">الشركة: ${j.company || '-'}</div>
                    <div class="action-btns">
                        <button class="btn-sm btn-edit" onclick="editJob(${j.id})">تعديل ✏️</button>
                        <button class="btn-sm btn-del" onclick="deleteItem('jobs', ${j.id})">حذف 🗑️</button>
                    </div>
                </div>`;
            });
        }

        function editJob(id) {
            let j = cachedJobs.find(item => item.id === id);
            if (!j) return;
            document.getElementById('editJobId').value = j.id;
            document.getElementById('jobTitle').value = j.title || '';
            document.getElementById('jobCompany').value = j.company || '';
            document.getElementById('jobPhone').value = j.phone || '';
            document.getElementById('jobStatus').value = j.status || 'متاحة';
            document.getElementById('jobIsVerified').value = j.is_verified ? 'true' : 'false';
            document.getElementById('btnSaveJob').textContent = 'تعديل وحفظ 💾';
            document.getElementById('btnCancelJob').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        let cachedResumes = [];
        async function saveResume() {
            const editId = document.getElementById('editResId').value;
            const name = document.getElementById('resName').value.trim();
            const title = document.getElementById('resTitle').value.trim();
            const exp = document.getElementById('resExp').value.trim();
            const phone = document.getElementById('resPhone').value.trim();
            const isVerified = document.getElementById('resIsVerified').value === 'true';
            const imgFile = document.getElementById('resImgFile').files[0];
            const msg = document.getElementById('resMsg');

            if (!title) { alert('أدخل التخصص أو المسمى'); return; }
            msg.style.color = 'blue'; msg.textContent = 'جاري الحفظ الفعلي بالسحابة...';

            let imgUrl = await uploadFile(imgFile, 'resume-images');
            
            let payload = {
                name: name || title,
                title: name || title,
                job_title: title,
                specialty: title,
                experience: exp,
                phone: phone,
                is_verified: isVerified
            };
            if (imgUrl) payload.image = imgUrl;

            let res = editId ? await db.from('resumes').update(payload).eq('id', editId) : await db.from('resumes').insert([payload]);

            if (res.error) {
                msg.style.color = 'red'; 
                msg.textContent = 'خطأ سحابي: ' + res.error.message;
                return;
            }

            msg.style.color = 'green'; msg.textContent = 'تم حفظ الكفاءة ورفعها بنجاح تام! ✅';
            resetResForm(); 
            loadResumes();
        }

        function resetResForm() {
            document.getElementById('editResId').value = '';
            document.getElementById('resName').value = '';
            document.getElementById('resTitle').value = '';
            document.getElementById('resExp').value = '';
            document.getElementById('resIsVerified').value = 'false';
            document.getElementById('resImgFile').value = '';
            document.getElementById('btnSaveRes').textContent = 'حفظ الكفاءة 📄';
            document.getElementById('btnCancelRes').style.display = 'none';
        }

        async function loadResumes() {
            let { data, error } = await db.from('resumes').select('*').order('id', {ascending: false});
            cachedResumes = data || [];
            let box = document.getElementById('resumesList');
            document.getElementById('resCount').textContent = cachedResumes.length;
            box.innerHTML = '';
            
            if (error || cachedResumes.length === 0) {
                box.innerHTML = '<p style="color:#64748b; font-size:11px;">لا توجد كفاءات مسجلة حالياً.</p>';
                return;
            }

            cachedResumes.forEach(r => {
                let displayName = r.name || r.title || 'بدون اسم';
                let displayJob = r.job_title || r.specialty || '-';
                box.innerHTML += `<div class="item-row">
                    <div class="row-header"><strong>${displayName} ${r.is_verified ? '🔵' : ''}</strong><span>معروض 🟢</span></div>
                    <div style="color:#64748b; font-size:11px;">التخصص: ${displayJob}</div>
                    <div class="action-btns">
                        <button class="btn-sm btn-edit" onclick="editResume(${r.id})">تعديل ✏️</button>
                        <button class="btn-sm btn-del" onclick="deleteItem('resumes', ${r.id})">حذف 🗑️</button>
                    </div>
                </div>`;
            });
        }

        function editResume(id) {
            let r = cachedResumes.find(item => item.id === id);
            if (!r) return;
            document.getElementById('editResId').value = r.id;
            document.getElementById('resName').value = r.name || r.title || '';
            document.getElementById('resTitle').value = r.job_title || r.specialty || '';
            document.getElementById('resExp').value = r.experience || '';
            document.getElementById('resPhone').value = r.phone || '';
            document.getElementById('resIsVerified').value = r.is_verified ? 'true' : 'false';
            document.getElementById('btnSaveRes').textContent = 'تعديل وحفظ 💾';
            document.getElementById('btnCancelRes').style.display = 'block';
            window.scrollTo({ top: 300, behavior: 'smooth' });
        }

        async function addBanner() {
            const file = document.getElementById('bannerFile').files[0];
            if (!file) return;
            let url = await uploadFile(file, 'banners');
            if (url) { await db.from('banners').insert([{ url }]); loadBanners(); }
        }
        async function loadBanners() {
            let { data } = await db.from('banners').select('*').order('id', {ascending: false});
            let box = document.getElementById('bannersList'); box.innerHTML = '';
            (data || []).forEach(b => {
                box.innerHTML += `<div class="item-row" style="flex-direction:row; justify-content:space-between;"><img src="${b.url}" style="height:35px;"><button class="btn-sm btn-del" onclick="deleteItem('banners', ${b.id})">حذف 🗑️</button></div>`;
            });
        }

        async function addPartner() {
            const file = document.getElementById('partnerFile').files[0];
            if (!file) return;
            let url = await uploadFile(file, 'partners');
            if (url) { await db.from('partners').insert([{ logo: url }]); loadPartners(); }
        }
        async function loadPartners() {
            let { data } = await db.from('partners').select('*').order('id', {ascending: false});
            let box = document.getElementById('partnersList'); box.innerHTML = '';
            (data || []).forEach(p => {
                box.innerHTML += `<div class="item-row" style="flex-direction:row; justify-content:space-between;"><img src="${p.logo}" style="height:30px; border-radius:50%;"><button class="btn-sm btn-del" onclick="deleteItem('partners', ${p.id})">حذف 🗑️</button></div>`;
            });
        }

        async function loadUsers() {
            let { data } = await db.from('users').select('*').order('id', {ascending: false});
            let box = document.getElementById('usersList'); box.innerHTML = '';
            document.getElementById('usersCount').textContent = (data ? data.length : 0);
            (data || []).forEach(u => {
                box.innerHTML += `<div class="item-row"><div class="row-header"><strong>${u.full_name || 'مستخدم'}</strong><a href="https://wa.me/${u.phone}" target="_blank" style="color:green; font-weight:bold;">واتساب: ${u.phone}</a></div><div style="color:#64748b; font-size:11px;">كلمة المرور: ${u.password || '••••'}</div></div>`;
            });
        }

        async function deleteItem(table, id) {
            if (confirm('هل أنت متأكد من الحذف؟')) {
                await db.from(table).delete().eq('id', id);
                if (table === 'jobs') loadJobs();
                if (table === 'resumes') loadResumes();
                if (table === 'banners') loadBanners();
                if (table === 'partners') loadPartners();
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadJobs(); loadResumes(); loadBanners(); loadPartners(); loadUsers();
        });
    </script>
</body>
</html>
