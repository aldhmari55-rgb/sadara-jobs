<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حساب مدير المنصة | لوحة التحكم الخارجي</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --admin-dark: #0f172a;
            --admin-accent: #2563eb;
            --bg-light: #f1f5f9;
            --card-bg: #ffffff;
            --text-dark: #1e293b;
            --success: #16a34a;
            --danger: #dc2626;
            --warning: #ca8a04;
            --border: #cbd5e1;
            --radius: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background-color: var(--bg-light); color: var(--text-dark); padding: 15px; }

        .admin-card-frame {
            max-width: 650px; margin: 0 auto; background: var(--card-bg);
            border: 2px solid var(--admin-dark); border-radius: var(--radius);
            padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .header-title { text-align: center; border-bottom: 2px dashed var(--border); padding-bottom: 15px; margin-bottom: 20px; }
        .header-title h1 { font-size: 20px; font-weight: 900; color: var(--admin-dark); }
        .header-title span { font-size: 13px; color: var(--admin-accent); font-weight: 800; }

        .section-box { background: #f8fafc; border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 20px; }
        .section-box h3 { font-size: 15px; font-weight: 900; margin-bottom: 12px; color: var(--admin-dark); }

        .admin-item { background: #ffffff; border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 10px; }
        .item-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }

        .action-btns { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
        .btn-action { border: none; padding: 6px 12px; border-radius: 6px; font-weight: 800; font-size: 12px; cursor: pointer; color: white; }
        .btn-approve { background: var(--success); }
        .btn-reject { background: var(--danger); }
        .btn-toggle { background: var(--warning); }

        .file-upload-btn {
            display: inline-block; background: var(--admin-accent); color: white;
            padding: 8px 14px; border-radius: 8px; font-weight: bold; font-size: 12px;
            cursor: pointer; text-align: center; margin-top: 5px;
        }
        .file-upload-btn input { display: none; }
        .banner-preview-img { width: 100%; max-height: 120px; object-fit: cover; border-radius: 8px; margin-top: 8px; display: none; }
    </style>
</head>
<body>

    <div class="admin-card-frame">
        <div class="header-title">
            <span>حساب خارجي لإدارة المنصة</span>
            <h1>لوحة التحكم الشاملة لمدير المنصة</h1>
        </div>

        <!-- 1. إدارة الوظائف والخدمات -->
        <div class="section-box">
            <h3>⚫ إدارة الوظائف (قبول - رفض - تعديل)</h3>
            <div id="adminJobsList"></div>
        </div>

        <!-- 2. إدارة المستخدمين والحسابات -->
        <div class="section-box">
            <h3>⚫ إدارة طلبات وتسجيل المستخدمين</h3>
            <div id="adminUsersList"></div>
        </div>

        <!-- 3. إدارة البنرات مباشرة من المعرض -->
        <div class="section-box">
            <h3>⚫ إدارة البنرات والإعلانات (تحميل من الاستوديو)</h3>
            
            <div style="margin-bottom: 15px;">
                <label style="font-size:12px; font-weight:bold;">البنر العلوي:</label><br>
                <label class="file-upload-btn">
                    📷 اختيار صورة البنر العلوي من المعرض
                    <input type="file" accept="image/*" onchange="uploadBanner(event, 'top')">
                </label>
                <img id="prevTop" class="banner-preview-img">
                <button class="btn-action btn-reject" style="margin-top:5px;" onclick="deleteBanner('top')">حذف البنر العلوي</button>
            </div>

            <hr style="margin:12px 0; border:none; border-top:1px dashed var(--border);">

            <div>
                <label style="font-size:12px; font-weight:bold;">البنر السفلي:</label><br>
                <label class="file-upload-btn">
                    📷 اختيار صورة البنر السفلي من المعرض
                    <input type="file" accept="image/*" onchange="uploadBanner(event, 'bottom')">
                </label>
                <img id="prevBottom" class="banner-preview-img">
                <button class="btn-action btn-reject" style="margin-top:5px;" onclick="deleteBanner('bottom')">حذف البنر السفلي</button>
            </div>
        </div>
    </div>

    <script>
        function getJobs() { return JSON.parse(localStorage.getItem('dhawar_jobs')) || []; }
        function getUsers() { return JSON.parse(localStorage.getItem('dhawar_users')) || []; }

        function renderAllAdmin() {
            // 1. الوظائف
            const jobs = getJobs();
            const jobsContainer = document.getElementById('adminJobsList');
            jobsContainer.innerHTML = jobs.length === 0 ? '<p style="font-size:12px; color:#64748b;">لا توجد وظائف جديدة.</p>' : '';
            jobs.forEach(job => {
                jobsContainer.innerHTML += `
                    <div class="admin-item">
                        <div class="item-header">
                            <strong>${job.title} - (${job.company})</strong>
                            <span style="font-size:11px; font-weight:bold; color:${job.approved ? 'green' : 'orange'}">${job.approved ? 'مقبول' : 'قيد المراجعة'}</span>
                        </div>
                        <div style="font-size:12px; color:#64748b;">الهاتف: ${job.phone} | الحالة: <strong>${job.status}</strong></div>
                        <div class="action-btns">
                            ${!job.approved ? `<button class="btn-action btn-approve" onclick="approveJob(${job.id})">قبول ونشر</button>` : ''}
                            <button class="btn-action btn-toggle" onclick="toggleJobStatus(${job.id})">تغيير التوفر (${job.status === 'متوفر' ? 'غير متوفر' : 'متوفر'})</button>
                            <button class="btn-action btn-reject" onclick="deleteJob(${job.id})">حذف</button>
                        </div>
                    </div>
                `;
            });

            // 2. المستخدمين
            const users = getUsers();
            const usersContainer = document.getElementById('adminUsersList');
            usersContainer.innerHTML = users.length === 0 ? '<p style="font-size:12px; color:#64748b;">لا توجد طلبات تسجيل حسابت.</p>' : '';
            users.forEach(u => {
                usersContainer.innerHTML += `
                    <div class="admin-item">
                        <div class="item-header">
                            <strong>${u.name} (${u.role})</strong>
                            <span style="font-size:11px; font-weight:bold; color:${u.approved ? 'green' : 'orange'}">${u.approved ? 'حساب مفعل' : 'ينتظر الموافقة'}</span>
                        </div>
                        <div style="font-size:12px; color:#64748b;">الهاتف: ${u.phone}</div>
                        <div class="action-btns">
                            ${!u.approved ? `<button class="btn-action btn-approve" onclick="approveUser(${u.id})">تفعيل الحساب</button>` : ''}
                            <button class="btn-action btn-reject" onclick="deleteUser(${u.id})">رفض / حذف الحساب</button>
                        </div>
                    </div>
                `;
            });

            // 3. المعاينة الحالية للبنرات
            const topB = localStorage.getItem('ad_banner_top');
            if(topB) { document.getElementById('prevTop').src = topB; document.getElementById('prevTop').style.display = 'block'; }
            
            const botB = localStorage.getItem('ad_banner_bottom');
            if(botB) { document.getElementById('prevBottom').src = botB; document.getElementById('prevBottom').style.display = 'block'; }
        }

        // إجراءات الوظائف
        function approveJob(id) {
            let jobs = getJobs().map(j => j.id === id ? {...j, approved: true} : j);
            localStorage.setItem('dhawar_jobs', JSON.stringify(jobs));
            renderAllAdmin();
        }
        function toggleJobStatus(id) {
            let jobs = getJobs().map(j => j.id === id ? {...j, status: j.status === 'متوفر' ? 'غير متوفر' : 'متوفر'} : j);
            localStorage.setItem('dhawar_jobs', JSON.stringify(jobs));
            renderAllAdmin();
        }
        function deleteJob(id) {
            let jobs = getJobs().filter(j => j.id !== id);
            localStorage.setItem('dhawar_jobs', JSON.stringify(jobs));
            renderAllAdmin();
        }

        // إجراءات المستخدمين
        function approveUser(id) {
            let users = getUsers().map(u => {
                if(u.id === id) {
                    u.approved = true;
                    localStorage.setItem('currentUser', JSON.stringify(u));
                }
                return u;
            });
            localStorage.setItem('dhawar_users', JSON.stringify(users));
            alert('تم قبول وتفعيل الحساب بنجاح!');
            renderAllAdmin();
        }
        function deleteUser(id) {
            let users = getUsers().filter(u => u.id !== id);
            localStorage.setItem('dhawar_users', JSON.stringify(users));
            renderAllAdmin();
        }

        // رفع البنر مباشرة من معرض صور الهاتف
        function uploadBanner(event, type) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const imgData = e.target.result;
                localStorage.setItem(type === 'top' ? 'ad_banner_top' : 'ad_banner_bottom', imgData);
                alert('تم رفع البنر بنجاح من المعرض وسيطبق في المنصة فوراً!');
                renderAllAdmin();
            };
            reader.readAsDataURL(file);
        }

        function deleteBanner(type) {
            localStorage.removeItem(type === 'top' ? 'ad_banner_top' : 'ad_banner_bottom');
            if(type==='top') document.getElementById('prevTop').style.display = 'none';
            else document.getElementById('prevBottom').style.display = 'none';
            alert('تم حذف البنر.');
        }

        document.addEventListener('DOMContentLoaded', renderAllAdmin);
    </script>
</body>
</html>
