<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم السحابية المباشرة | صدارة</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --admin-dark: #0f172a; --admin-blue: #2563eb; --bg: #f8fafc; --card: #ffffff; --green: #16a34a; --red: #dc2626; --gold: #ca8a04; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background: var(--bg); padding: 15px; color: #1e293b; }
        .box { max-width: 700px; margin: 0 auto; background: var(--card); border: 2px solid var(--admin-dark); border-radius: 12px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { font-size: 20px; text-align: center; margin-bottom: 15px; color: var(--admin-dark); }
        .sec { background: #f1f5f9; padding: 14px; border-radius: 10px; margin-bottom: 16px; border: 1px solid #cbd5e1; }
        .sec h3 { font-size: 15px; margin-bottom: 10px; }
        input { width: 100%; padding: 8px; margin: 5px 0; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 12px; outline: none; }
        .btn { border: none; padding: 6px 12px; border-radius: 6px; font-weight: bold; font-size: 12px; cursor: pointer; color: white; display: inline-flex; align-items: center; gap: 4px; }
        .btn-add { background: var(--green); width: 100%; justify-content: center; padding: 8px; margin-top: 4px; }
        .btn-edit { background: var(--admin-blue); }
        .btn-del { background: var(--red); }
        .btn-toggle { background: var(--gold); }
        .item { background: white; padding: 10px; border-radius: 8px; border: 1px solid #cbd5e1; margin-bottom: 8px; }
        .flex-btns { display: flex; gap: 6px; margin-top: 6px; }
        .partner-grid { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
        .partner-card { background: white; padding: 8px; border-radius: 8px; border: 1px solid #cbd5e1; width: 95px; text-align: center; }
        .partner-card img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
    </style>
</head>
<body>
    <div class="box">
        <h1>☁️ لوحة التحكم السحابية المباشرة (Supabase)</h1>

        <!-- البنرات -->
        <div class="sec">
            <h3>🖼️ إدارة البنرات الإعلانية (سلايدر متحرك)</h3>
            <input type="text" id="bUrl" placeholder="مسار البنر (مثال: images/banner 1 .png)">
            <button class="btn btn-add" onclick="addBanner()">🟢 إضافة البنر المباشر للسحابة</button>
            <div id="bList" style="margin-top:10px;"></div>
        </div>

        <!-- الشركاء -->
        <div class="sec">
            <h3>🤝 إدارة شركاء النجاح (الشريط المتحرك)</h3>
            <input type="text" id="pName" placeholder="اسم الشريك / الشركة">
            <input type="text" id="pLogo" placeholder="مسار الشعار (مثال: images/logo 1 .jpg)">
            <button class="btn btn-add" onclick="addPartner()">🟢 إضافة الشريك المباشر للسحابة</button>
            <div class="partner-grid" id="pList"></div>
        </div>

        <!-- الوظائف -->
        <div class="sec">
            <h3>📋 إدارة ومراجعة الوظائف والخدمات</h3>
            <div id="jList"></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://lvutrzswngpkjfamgact.supabase.co";
        const SUPABASE_KEY = "sb_publishable_fB8RmZyfymR8YpjLInA2LQ_hMA6qgRG"; 
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function loadAll() {
            // البنرات
            let { data: banners } = await db.from('banners').select('*').order('id', {ascending: false});
            let bBox = document.getElementById('bList');
            bBox.innerHTML = '';
            (banners || []).forEach(b => {
                bBox.innerHTML += `<div class="item">
                    <div style="font-size:11px; font-weight:bold;">${b.url}</div>
                    <div class="flex-btns">
                        <button class="btn btn-edit" onclick="editBanner(${b.id}, '${b.url}')">✏️ تعديل</button>
                        <button class="btn btn-del" onclick="delBanner(${b.id})">🗑️ حذف</button>
                    </div>
                </div>`;
            });

            // الشركاء
            let { data: partners } = await db.from('partners').select('*').order('id', {ascending: false});
            let pBox = document.getElementById('pList');
            pBox.innerHTML = '';
            (partners || []).forEach(p => {
                pBox.innerHTML += `<div class="partner-card">
                    <img src="${p.logo}">
                    <div style="font-size:10px; font-weight:bold;">${p.name}</div>
                    <button class="btn btn-edit" style="font-size:9px; padding:2px; width:100%; justify-content:center; margin:2px 0;" onclick="editPartner(${p.id}, '${p.name}', '${p.logo}')">✏️ تعديل</button>
                    <button class="btn btn-del" style="font-size:9px; padding:2px; width:100%; justify-content:center;" onclick="delPartner(${p.id})">🗑️ حذف</button>
                </div>`;
            });

            // الوظائف
            let { data: jobs } = await db.from('jobs').select('*').order('id', {ascending: false});
            let jBox = document.getElementById('jList');
            jBox.innerHTML = '';
            (jobs || []).forEach(j => {
                jBox.innerHTML += `<div class="item">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <strong>${j.title}</strong>
                        <span style="font-size:11px; font-weight:bold; color:${j.approved?'green':'orange'}">${j.approved?'مقبول':'قيد المراجعة'}</span>
                    </div>
                    <div style="font-size:11px; color:#64748b;">${j.company} | ${j.phone} | الحالة: <b>${j.status}</b></div>
                    <div class="flex-btns">
                        ${!j.approved ? `<button class="btn btn-add" style="width:auto; padding:4px 8px;" onclick="approveJob(${j.id})">🟢 قبول ونشر</button>` : `<button class="btn btn-toggle" onclick="toggleJob(${j.id}, '${j.status}')">🔄 توفر الوظيفة</button>`}
                        <button class="btn btn-edit" onclick="editJob(${j.id}, '${j.title}', '${j.company}', '${j.phone}')">✏️ تعديل</button>
                        <button class="btn btn-del" onclick="delJob(${j.id})">🗑️ حذف</button>
                    </div>
                </div>`;
            });
        }

        async function addBanner() {
            let url = document.getElementById('bUrl').value.trim();
            if(url) { await db.from('banners').insert([{ url }]); document.getElementById('bUrl').value=''; loadAll(); }
        }
        async function editBanner(id, oldUrl) {
            let url = prompt('تعديل مسار البنر:', oldUrl);
            if(url) { await db.from('banners').update({ url }).eq('id', id); loadAll(); }
        }
        async function delBanner(id) {
            if(confirm('حذف البنر؟')) { await db.from('banners').delete().eq('id', id); loadAll(); }
        }

        async function addPartner() {
            let name = document.getElementById('pName').value.trim();
            let logo = document.getElementById('pLogo').value.trim();
            if(name && logo) { await db.from('partners').insert([{ name, logo }]); document.getElementById('pName').value=''; document.getElementById('pLogo').value=''; loadAll(); }
        }
        async function editPartner(id, oldName, oldLogo) {
            let name = prompt('تعديل الاسم:', oldName);
            let logo = prompt('تعديل اللوجو:', oldLogo);
            if(name && logo) { await db.from('partners').update({ name, logo }).eq('id', id); loadAll(); }
        }
        async function delPartner(id) {
            if(confirm('حذف الشريك؟')) { await db.from('partners').delete().eq('id', id); loadAll(); }
        }

        async function approveJob(id) { await db.from('jobs').update({ approved: true }).eq('id', id); loadAll(); }
        async function toggleJob(id, cur) { await db.from('jobs').update({ status: cur === 'متوفر' ? 'غير متوفر' : 'متوفر' }).eq('id', id); loadAll(); }
        async function editJob(id, t, c, p) {
            let title = prompt('العنوان:', t);
            let company = prompt('الجهة:', c);
            let phone = prompt('الهاتف:', p);
            if(title && company && phone) { await db.from('jobs').update({ title, company, phone }).eq('id', id); loadAll(); }
        }
        async function delJob(id) {
            if(confirm('حذف الوظيفة؟')) { await db.from('jobs').delete().eq('id', id); loadAll(); }
        }

        document.addEventListener('DOMContentLoaded', loadAll);
    </script>
</body>
</html>
