<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دليل الكفاءات والخدمات | صدارة</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #10b981; --primary-dark: #059669; --dark: #0f172a; --slate: #475569; --bg: #f8fafc; --white: #ffffff; --border: #e2e8f0; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background-color: var(--bg); color: var(--dark); padding-bottom: 50px; }

        header { background: var(--white); border-bottom: 1px solid var(--border); padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 15px; font-weight: 800; color: var(--primary-dark); display: flex; align-items: center; gap: 6px; }

        .btn { padding: 6px 12px; border-radius: 8px; font-size: 11px; font-weight: 700; cursor: pointer; border: none; display: inline-flex; align-items: center; gap: 4px; text-decoration: none; }
        .btn-primary { background-color: var(--primary); color: var(--white); }

        .hero { background: linear-gradient(135deg, #059669 0%, #10b981 100%); color: var(--white); padding: 25px 16px; text-align: center; margin-bottom: 16px; }
        .hero h1 { font-size: 18px; margin-bottom: 6px; font-weight: 800; }

        .container { max-width: 900px; margin: 0 auto; padding: 0 14px; }

        .categories-bar { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 16px; scrollbar-width: none; }
        .cat-chip { background: var(--white); border: 1px solid var(--border); padding: 5px 12px; border-radius: 18px; font-size: 11px; font-weight: 700; color: var(--slate); cursor: pointer; white-space: nowrap; }
        .cat-chip.active { background: var(--primary); color: var(--white); border-color: var(--primary); }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
        .card { background: var(--white); border: 1px solid var(--border); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; justify-content: space-between; }
        .card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background: #ecfdf5; color: var(--primary-dark); display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: bold; }
        .badge-cat { background: #e0f2fe; color: #0369a1; padding: 2px 6px; border-radius: 8px; font-size: 9px; font-weight: bold; display: inline-block; margin-bottom: 4px; }
        .skills-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
        .tag { background: var(--bg); color: var(--slate); padding: 2px 6px; border-radius: 10px; font-size: 10px; border: 1px solid var(--border); }
        .card-footer { display: flex; gap: 6px; padding-top: 10px; border-top: 1px solid var(--border); margin-top:10px; }
    </style>
</head>
<body>

    <header>
        <div class="logo"><i class="fa-solid fa-briefcase"></i><span>دليل الكفاءات والخدمات</span></div>
        <a href="https://wa.me/967780568507?text=مرحبا،%20اريد%20إضافة%20ملفي%20الشخصي/السي%20في%20في%20دليل%20الكفاءات" target="_blank" class="btn btn-primary"><i class="fa-solid fa-plus"></i> إضافة سيرتك الذاتية 🟢</a>
    </header>

    <section class="hero">
        <h1>دليل الكفاءات والخدمات المتاحين للتوظيف</h1>
        <p style="font-size: 11px; opacity: 0.95; margin-top: 4px;">تواصل مباشرة مع أصحاب الخدمات والكفاءات</p>
    </section>

    <main class="container">
        <div class="categories-bar">
            <div class="cat-chip active" onclick="filterCat('الكل', this)">الكل</div>
            <div class="cat-chip" onclick="filterCat('التسويق والترويج', this)">📢 التسويق والترويج</div>
            <div class="cat-chip" onclick="filterCat('المحاسبة والمالية', this)">📊 المحاسبة والمالية</div>
            <div class="cat-chip" onclick="filterCat('الطب والصحة', this)">🩺 الطب والصحة</div>
            <div class="cat-chip" onclick="filterCat('التقنية وبرمجة', this)">💻 التقنية والبرمجة</div>
            <div class="cat-chip" onclick="filterCat('الخدمات والنظافه', this)">🧹 الخدمات العامة والنظافة</div>
            <div class="cat-chip" onclick="filterCat('أخرى', this)">📁 تخصصات أخرى</div>
        </div>

        <div class="grid" id="candidates-grid"></div>
    </main>

    <script>
        const SUPABASE_URL = "https://lvutrzswngpkjfamgact.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_fB8RmZyfymR8YpjLInA2LQ_hMA6qgRG";
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let candidates = [], currentCat = 'الكل';

        async function load() {
            let { data } = await db.from('resumes').select('*').order('id', { ascending: false });
            candidates = data || [];
            render();
        }

        function filterCat(cat, el) {
            currentCat = cat;
            document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            render();
        }

        function render() {
            let grid = document.getElementById('candidates-grid');
            let filtered = (currentCat === 'الكل') ? candidates : candidates.filter(c => c.category === currentCat);
            grid.innerHTML = '';
            if(filtered.length === 0) { grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--slate); padding: 30px;">لا توجد كفاءات مسجلة في هذا القسم حالياً.</p>'; return; }
            filtered.forEach(c => {
                let skills = c.skills ? c.skills.split(',').map(s=>s.trim()) : [];
                grid.innerHTML += `<div class="card">
                    <div>
                        <span class="badge-cat">${c.category||'عام'}</span>
                        <div class="card-header">
                            <div class="avatar">${c.full_name ? c.full_name.charAt(0) : '؟'}</div>
                            <div>
                                <h3 style="font-size:14px;">${c.full_name}</h3>
                                <p style="font-size:11px; color:var(--primary-dark); font-weight:bold;">${c.job_title}</p>
                            </div>
                        </div>
                        <p style="font-size:11px; color:var(--slate);">${c.experience||''}</p>
                        ${skills.length>0 ? `<div class="skills-tags">${skills.map(s=>`<span class="tag">${s}</span>`).join('')}</div>` : ''}
                    </div>
                    <div class="card-footer">
                        <a href="https://wa.me/${c.phone.replace(/[^0-9]/g, '')}" target="_blank" class="btn btn-primary" style="flex:1; justify-content:center;">تواصل واتساب 🟢</a>
                        ${c.cv_url ? `<a href="${c.cv_url}" target="_blank" class="btn" style="background:#e2e8f0; color:#334155;"><i class="fa-solid fa-file-pdf"></i> CV</a>` : ''}
                    </div>
                </div>`;
            });
        }
        document.addEventListener('DOMContentLoaded', load);
    </script>
</body>
</html>
