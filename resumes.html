<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صدارة للوظائف والكفاءات | دليل الكفاءات</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #0f2347; --gold: #d4af37; --green: #25d366; --bg: #f8fafc; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background: var(--bg); color: #0f172a; padding-bottom: 40px; }
        
        header { background: var(--primary); color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--gold); }
        .logo { font-weight: 900; font-size: 18px; color: white; text-decoration: none; }
        
        .container { max-width: 1000px; margin: 20px auto; padding: 0 15px; }
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .btn-add-cv { background: var(--gold); color: #0f2347; padding: 9px 18px; border-radius: 8px; font-weight: bold; text-decoration: none; font-size: 13px; border: none; cursor: pointer; }

        .resumes-grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
        @media(min-width: 768px) { .resumes-grid { grid-template-columns: 1fr 1fr; } }
        
        .resume-card { background: white; padding: 16px; border-radius: 12px; border: 1px solid #e2e8f0; transition: 0.2s; }
        .resume-card:hover { border-color: var(--gold); }
        .user-name { font-size: 15px; font-weight: bold; color: var(--primary); display: flex; align-items: center; gap: 4px; }
        .user-title { font-size: 12px; color: #64748b; margin-top: 2px; }
        .user-exp { font-size: 12px; color: #334155; margin-top: 8px; line-height: 1.5; background: #f8fafc; padding: 8px; border-radius: 6px; }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">صدارة للوظائف 🚀</a>
        <a href="index.html" style="color:white; text-decoration:none; font-size:13px; font-weight:bold;">الرئيسية 🏠</a>
    </header>

    <div class="container">
        
        <div class="top-bar">
            <h2 style="font-size:17px; color:var(--primary);">📄 دليل الكفاءات والخبرات المسجلة</h2>
            <button class="btn-add-cv" onclick="redirectToWhatsApp('إضافة سيرة ذاتية / كفاءة')">إضافة سيرتك الذاتية ➕</button>
        </div>

        <div class="resumes-grid" id="resumesContainer">
            <p style="color:#64748b; font-size:12px;">جاري تحميل الكفاءات...</p>
        </div>

    </div>

    <script>
        const SUPABASE_URL = "https://lvutrzswngpkjfamgact.supabase.co";
        const SUPABASE_KEY = "sb_publishable_fB8RmZyfymR8YpjLInA2LQ_hMA6qgRG";
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // الشارة الزرقاء الموثقة للمستقلين والكفاءات (Blue Badge SVG)
        function getBlueBadgeHTML() {
            return `<span title="مستقل / كفاءة موثوقة" style="display:inline-flex; align-items:center; vertical-align:middle; margin-right:3px;">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z" fill="#1877F2"/>
                </svg>
            </span>`;
        }

        async function loadResumes() {
            let { data, error } = await db.from('resumes').select('*').order('id', {ascending: false});
            let container = document.getElementById('resumesContainer');
            container.innerHTML = '';

            if (error || !data || data.length === 0) {
                container.innerHTML = '<p style="color:#64748b; font-size:12px;">لا توجد كفاءات معروضة حالياً.</p>';
                return;
            }

            data.forEach(r => {
                let displayName = r.name || r.title || 'بدون اسم';
                let displayJob = r.job_title || r.specialty || 'تخصص عام';
                let verifiedBadge = r.is_verified ? getBlueBadgeHTML() : '';

                container.innerHTML += `
                    <div class="resume-card">
                        <div class="user-name">${displayName} ${verifiedBadge}</div>
                        <div class="user-title">${displayJob}</div>
                        ${r.experience ? `<div class="user-exp">${r.experience}</div>` : ''}
                        <a href="https://wa.me/${r.phone || '967780568507'}?text=${encodeURIComponent('مرحباً، أود التواصل بشأن الكفاءة: ' + displayName)}" target="_blank" style="display:inline-block; margin-top:10px; background:var(--green); color:white; padding:6px 14px; border-radius:6px; text-decoration:none; font-size:11px; font-weight:bold;">تواصل مع الكفاءة 💬</a>
                    </div>`;
            });
        }

        function redirectToWhatsApp(actionType) {
            const savedUser = localStorage.getItem('sadara_user') || 'زائر';
            const adminPhone = "967780568507";
            const text = encodeURIComponent(`مرحباً إدارة صدارة، أنا المسجل: (${savedUser}) أود طلب ${actionType} على المنصة.`);
            window.open(`https://wa.me/${adminPhone}?text=${text}`, '_blank');
        }

        document.addEventListener('DOMContentLoaded', loadResumes);
    </script>
</body>
</html>
