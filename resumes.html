<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دليل الكفاءات ورفع السيرة الذاتية | صدارة</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --primary-light: #ecfdf5;
            --dark: #0f172a;
            --slate: #475569;
            --light-bg: #f8fafc;
            --white: #ffffff;
            --border: #e2e8f0;
            --radius: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background-color: var(--light-bg); color: var(--dark); padding-bottom: 60px; }

        header {
            background: var(--white); border-bottom: 1px solid var(--border);
            padding: 14px 20px; display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 100;
        }

        .logo { font-size: 18px; font-weight: 800; color: var(--primary-dark); display: flex; align-items: center; gap: 8px; }

        .btn {
            padding: 8px 16px; border-radius: var(--radius); font-size: 13px; font-weight: 700;
            cursor: pointer; border: none; display: inline-flex; align-items: center; gap: 6px;
            text-decoration: none;
        }
        .btn-primary { background-color: var(--primary); color: var(--white); }
        .btn-outline { background-color: transparent; border: 1px solid var(--primary); color: var(--primary-dark); }

        .hero {
            background: linear-gradient(135deg, #059669 0%, #10b981 100%);
            color: var(--white); padding: 35px 20px; text-align: center; margin-bottom: 25px;
        }
        .hero h1 { font-size: 22px; margin-bottom: 10px; font-weight: 800; }
        .hero p { font-size: 13px; opacity: 0.95; max-width: 600px; margin: 0 auto 18px auto; }

        .container { max-width: 900px; margin: 0 auto; padding: 0 16px; }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
        .section-title { font-size: 18px; font-weight: 800; color: var(--dark); }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
        .card {
            background: var(--white); border: 1px solid var(--border); border-radius: var(--radius);
            padding: 16px; display: flex; flex-direction: column; justify-content: space-between;
        }
        .card-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
        .avatar {
            width: 45px; height: 45px; border-radius: 50%; background: var(--primary-light);
            color: var(--primary-dark); display: flex; align-items: center; justify-content: center;
            font-size: 20px; font-weight: bold; flex-shrink: 0;
        }
        .candidate-info h3 { font-size: 15px; color: var(--dark); }
        .candidate-info p { font-size: 12px; color: var(--primary-dark); font-weight: 600; }
        .card-body { font-size: 12px; color: var(--slate); margin-bottom: 14px; }
        .skills-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
        .tag { background: var(--light-bg); color: var(--slate); padding: 2px 8px; border-radius: 12px; font-size: 11px; border: 1px solid var(--border); }
        .card-footer { display: flex; gap: 6px; padding-top: 12px; border-top: 1px solid var(--border); }

        /* Modal Overlay */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 23, 42, 0.6);
            display: none; align-items: center; justify-content: center; z-index: 1000; padding: 16px;
        }
        .modal-overlay.active { display: flex !important; }
        .modal { background: var(--white); border-radius: var(--radius); width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; padding: 20px; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .close-btn { background: none; border: none; font-size: 20px; color: var(--slate); cursor: pointer; }
        
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 4px; color: var(--dark); }
        .form-control { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; outline: none; }
        textarea.form-control { resize: vertical; min-height: 70px; }
        .file-upload-box { border: 2px dashed var(--border); border-radius: 8px; padding: 16px; text-align: center; background: var(--light-bg); cursor: pointer; }
        
        .toast {
            position: fixed; bottom: 20px; left: 20px; background: var(--dark); color: var(--white);
            padding: 10px 20px; border-radius: 8px; font-size: 13px; display: none; align-items: center; gap: 8px; z-index: 2000;
        }
        .toast.show { display: flex !important; }
    </style>
</head>
<body>

    <header>
        <div class="logo"><i class="fa-solid fa-briefcase"></i><span>دليل الكفاءات والسي في</span></div>
        <button class="btn btn-outline" id="btnOpenTop" onclick="openModal()"><i class="fa-solid fa-id-card"></i> إنشاء ملف / رفع CV</button>
    </header>

    <section class="hero">
        <h1>اعرض خدماتك وسيرتك الذاتية لأصحاب العمل مباشرة</h1>
        <p>قم بإنشاء ملفك الشخصي وأرفق سيرتك الذاتية ليتواصل معك أصحاب الشركات عبر الواتساب.</p>
        <button class="btn btn-primary" id="btnOpenHero" onclick="openModal()"><i class="fa-solid fa-cloud-arrow-up"></i> إضافة ملفك الآن</button>
    </section>

    <main class="container">
        <div class="section-header">
            <h2 class="section-title">الكفاءات المتاحة للتوظيف</h2>
            <span id="candidates-count" style="color: var(--slate); font-weight: 600; font-size: 13px;">جاري التحميل...</span>
        </div>
        <div class="grid" id="candidates-grid"></div>
    </main>

    <!-- النافذة المنسدلة -->
    <div class="modal-overlay" id="profile-modal">
        <div class="modal">
            <div class="modal-header">
                <h3 style="font-size: 16px; font-weight: 800;">إنشاء ملف شخصي / رفع السيرة الذاتية</h3>
                <button type="button" class="close-btn" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="candidate-form" onsubmit="handleSubmit(event)">
                <div class="form-group"><label>الاسم الكامل *</label><input type="text" id="full_name" class="form-control" required placeholder="مثال: عبدالرحمن الذماري"></div>
                <div class="form-group"><label>المسمى الوظيفي / الخدمة *</label><input type="text" id="job_title" class="form-control" required placeholder="مثال: محاسب، مسوق إلكتروني"></div>
                <div class="form-group"><label>رقم الواتساب للتواصل *</label><input type="tel" id="phone" class="form-control" required placeholder="مثال: 967770000000"></div>
                <div class="form-group"><label>المهارات الرئيسية (مفصولة بفواصل)</label><input type="text" id="skills" class="form-control" placeholder="إدارة، تصميم، إكسل"></div>
                <div class="form-group"><label>نبذة عن خبراتك والخدمات</label><textarea id="experience" class="form-control" placeholder="ملخص عن خبرتك..."></textarea></div>
                <div class="form-group">
                    <label>رفع السيرة الذاتية (CV)</label>
                    <div class="file-upload-box" onclick="document.getElementById('cv_file').click()">
                        <i class="fa-solid fa-file-pdf" style="font-size: 24px; color: var(--primary);"></i>
                        <p id="file-label" style="font-size: 12px; font-weight: 600; margin-top:4px;">انقر لرفع ملف السي في (PDF/صورة)</p>
                    </div>
                    <input type="file" id="cv_file" accept=".pdf,.doc,.docx,image/*" style="display: none;" onchange="handleFileChange(event)">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 12px;" id="submit-btn">حفظ ونشر الملف 🟢</button>
            </form>
        </div>
    </div>

    <div class="toast" id="toast"><i class="fa-solid fa-circle-check" style="color: var(--primary);"></i><span id="toast-message">تمت العملية بنجاح!</span></div>

    <script>
        const SUPABASE_URL = "https://lvutrzswngpkjfamgact.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_fB8RmZyfymR8YpjLInA2LQ_hMA6qgRG";
        
        let db = null;
        try {
            db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        } catch(e) {
            console.error("Supabase Init Error:", e);
        }

        let selectedFile = null;

        function openModal() {
            document.getElementById('profile-modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('profile-modal').classList.remove('active');
            document.getElementById('candidate-form').reset();
            document.getElementById('file-label').textContent = 'انقر لرفع ملف السي في (PDF/صورة)';
            selectedFile = null;
        }

        function handleFileChange(event) {
            const file = event.target.files[0];
            if (file) {
                selectedFile = file;
                document.getElementById('file-label').textContent = `تم اختيار: ${file.name}`;
            }
        }

        async function fetchCandidates() {
            const grid = document.getElementById('candidates-grid');
            const countLabel = document.getElementById('candidates-count');

            if (!db) {
                countLabel.textContent = "خطأ في الاتصال بالخادم";
                return;
            }

            try {
                const { data, error } = await db.from('resumes').select('*').order('id', { ascending: false });
                if (error) throw error;

                countLabel.textContent = `${(data || []).length} كفاءة متوفرة`;
                grid.innerHTML = '';

                if (!data || data.length === 0) {
                    grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--slate); padding: 30px;">لا توجد ملفات شخصية مسجلة حالياً.</p>';
                    return;
                }

                data.forEach(candidate => {
                    const skillsArray = candidate.skills ? candidate.skills.split(',').map(s => s.trim()) : [];
                    const initial = candidate.full_name ? candidate.full_name.charAt(0) : '؟';
                    
                    grid.insertAdjacentHTML('beforeend', `
                        <div class="card">
                            <div>
                                <div class="card-header">
                                    <div class="avatar">${initial}</div>
                                    <div class="candidate-info">
                                        <h3>${escapeHtml(candidate.full_name)}</h3>
                                        <p>${escapeHtml(candidate.job_title)}</p>
                                    </div>
                                </div>
                                <div class="card-body">
                                    <p>${escapeHtml(candidate.experience || 'لا توجد نبذة مختصرة مضافة.')}</p>
                                    ${skillsArray.length > 0 ? `<div class="skills-tags">${skillsArray.map(s => `<span class="tag">${escapeHtml(s)}</span>`).join('')}</div>` : ''}
                                </div>
                            </div>
                            <div class="card-footer">
                                <a href="https://wa.me/${candidate.phone.replace(/[^0-9]/g, '')}" target="_blank" class="btn btn-primary" style="flex: 1; justify-content: center; font-size: 11px;">
                                    <i class="fa-brands fa-whatsapp"></i> تواصل واتساب
                                </a>
                                ${candidate.cv_url ? `<a href="${candidate.cv_url}" target="_blank" class="btn btn-outline" style="font-size: 11px;"><i class="fa-solid fa-file-pdf"></i> CV</a>` : ''}
                            </div>
                        </div>
                    `);
                });
            } catch (err) {
                console.error("Fetch error:", err);
                countLabel.textContent = "لا توجد ملفات مسجلة حالياً";
            }
        }

        async function handleSubmit(event) {
            event.preventDefault();
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري الحفظ...';

            try {
                let cvUrl = '';

                // إذا قمت بتحديد صورة أو ملف، وسجلت رابط صورة مباشر هنا
                if (selectedFile) {
                    try {
                        const fileName = `${Date.now()}_${selectedFile.name.replace(/\s+/g, '_')}`;
                        const { data: uploadData, error: uploadError } = await db.storage.from('cv_files').upload(fileName, selectedFile);
                        if (!uploadError) {
                            const { data: publicUrlData } = db.storage.from('cv_files').getPublicUrl(fileName);
                            cvUrl = publicUrlData.publicUrl;
                        }
                    } catch(e) { console.log("Storage bypass", e); }
                }

                const newCandidate = {
                    full_name: document.getElementById('full_name').value.trim(),
                    job_title: document.getElementById('job_title').value.trim(),
                    phone: document.getElementById('phone').value.trim(),
                    skills: document.getElementById('skills').value.trim(),
                    experience: document.getElementById('experience').value.trim(),
                    cv_url: cvUrl
                };

                const { error: insertError } = await db.from('resumes').insert([newCandidate]);
                if (insertError) throw insertError;

                showToast('تم نشر ملفك الشخصي بنجاح!');
                closeModal();
                fetchCandidates();
            } catch (error) {
                console.error("Save error:", error);
                showToast('حدث خطأ أثناء الحفظ، يرجى إعادة المحاولة');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'حفظ ونشر الملف 🟢';
            }
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3500);
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }

        document.addEventListener('DOMContentLoaded', fetchCandidates);
    </script>
</body>
</html>
