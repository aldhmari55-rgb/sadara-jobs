<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة التوظيف - دليل الكفاءات ورفع السيرة الذاتية</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --primary-light: #ecfdf5;
            --dark: #0f172a;
            --slate: #475569;
            --light-bg: #f8fafc;
            --white: #ffffff;
            --border: #e2e8f0;
            --radius: 12px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background-color: var(--light-bg); color: var(--dark); line-height: 1.6; padding-bottom: 60px; }

        header {
            background: var(--white); border-bottom: 1px solid var(--border);
            padding: 16px 32px; display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 100;
        }

        .logo { font-size: 22px; font-weight: 800; color: var(--primary-dark); display: flex; align-items: center; gap: 10px; }
        .nav-actions { display: flex; gap: 12px; }

        .btn {
            padding: 10px 20px; border-radius: var(--radius); font-size: 15px; font-weight: 700;
            cursor: pointer; border: none; display: inline-flex; align-items: center; gap: 8px;
            transition: all 0.2s ease; text-decoration: none;
        }
        .btn-primary { background-color: var(--primary); color: var(--white); }
        .btn-primary:hover { background-color: var(--primary-dark); }
        .btn-outline { background-color: transparent; border: 1px solid var(--primary); color: var(--primary-dark); }
        .btn-outline:hover { background-color: var(--primary-light); }

        .hero {
            background: linear-gradient(135deg, #059669 0%, #10b981 100%);
            color: var(--white); padding: 48px 32px; text-align: center; margin-bottom: 40px;
        }
        .hero h1 { font-size: 32px; margin-bottom: 12px; font-weight: 800; }
        .hero p { font-size: 18px; opacity: 0.95; max-width: 680px; margin: 0 auto 24px auto; }

        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .section-title { font-size: 22px; font-weight: 700; color: var(--dark); }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px; }
        .card {
            background: var(--white); border: 1px solid var(--border); border-radius: var(--radius);
            padding: 24px; box-shadow: var(--shadow); display: flex; flex-direction: column; justify-content: space-between;
        }
        .card-header { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; }
        .avatar {
            width: 56px; height: 56px; border-radius: 50%; background: var(--primary-light);
            color: var(--primary-dark); display: flex; align-items: center; justify-content: center;
            font-size: 24px; font-weight: bold; flex-shrink: 0;
        }
        .candidate-info h3 { font-size: 18px; color: var(--dark); margin-bottom: 4px; }
        .candidate-info p { font-size: 14px; color: var(--primary-dark); font-weight: 600; }
        .card-body { font-size: 14px; color: var(--slate); margin-bottom: 20px; }
        .skills-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
        .tag { background: var(--light-bg); color: var(--slate); padding: 4px 10px; border-radius: 20px; font-size: 12px; border: 1px solid var(--border); }
        .card-footer { display: flex; gap: 8px; padding-top: 16px; border-top: 1px solid var(--border); }

        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 23, 42, 0.6);
            display: flex; align-items: center; justify-content: center; z-index: 1000; opacity: 0; visibility: hidden; transition: all 0.3s ease; padding: 20px;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal { background: var(--white); border-radius: var(--radius); width: 100%; max-width: 600px; max-height: 90vh; overflow-y: auto; padding: 32px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .close-btn { background: none; border: none; font-size: 20px; color: var(--slate); cursor: pointer; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 14px; font-weight: 700; margin-bottom: 6px; color: var(--dark); }
        .form-control { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 15px; outline: none; }
        textarea.form-control { resize: vertical; min-height: 90px; }
        .file-upload-box { border: 2px dashed var(--border); border-radius: 8px; padding: 20px; text-align: center; background: var(--light-bg); cursor: pointer; }
        .toast {
            position: fixed; bottom: 24px; left: 24px; background: var(--dark); color: var(--white);
            padding: 12px 24px; border-radius: 8px; font-size: 14px; display: flex; align-items: center; gap: 10px;
            opacity: 0; transform: translateY(20px); transition: all 0.3s ease; z-index: 2000;
        }
        .toast.show { opacity: 1; transform: translateY(0); }
    </style>
</head>
<body>

    <header>
        <div class="logo"><i class="fa-solid fa-briefcase"></i><span>دليل الكفاءات والوظائف</span></div>
        <div class="nav-actions"><button class="btn btn-outline" onclick="openModal()"><i class="fa-solid fa-id-card"></i> إنشاء ملف / رفع CV</button></div>
    </header>

    <section class="hero">
        <h1>اعرض خدماتك وسيرتك الذاتية لأصحاب العمل مباشرة</h1>
        <p>قم بإنشاء ملفك الشخصي وأرفق سيرتك الذاتية ليتواصل معك أصحاب الشركات والمؤسسات عبر الواتساب.</p>
        <button class="btn btn-primary" onclick="openModal()"><i class="fa-solid fa-cloud-arrow-up"></i> إضافة ملفك الآن</button>
    </section>

    <main class="container">
        <div class="section-header">
            <h2 class="section-title">الكفاءات المتاحة للتوظيف</h2>
            <span id="candidates-count" style="color: var(--slate); font-weight: 600;">جاري التحميل...</span>
        </div>
        <div class="grid" id="candidates-grid"></div>
    </main>

    <div class="modal-overlay" id="profile-modal">
        <div class="modal">
            <div class="modal-header">
                <h3 style="font-size: 20px; font-weight: 700;">إنشاء ملف شخصي / رفع السيرة الذاتية</h3>
                <button class="close-btn" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="candidate-form" onsubmit="handleSubmit(event)">
                <div class="form-group"><label>الاسم الكامل *</label><input type="text" id="full_name" class="form-control" required></div>
                <div class="form-group"><label>المسمى الوظيفي / الخدمة *</label><input type="text" id="job_title" class="form-control" required></div>
                <div class="form-group"><label>رقم الواتساب للتواصل *</label><input type="tel" id="phone" class="form-control" required></div>
                <div class="form-group"><label>المهارات الرئيسية (مفصولة بفواصل)</label><input type="text" id="skills" class="form-control"></div>
                <div class="form-group"><label>نبذة عن خبراتك والخدمات</label><textarea id="experience" class="form-control"></textarea></div>
                <div class="form-group">
                    <label>رفع السيرة الذاتية (CV)</label>
                    <div class="file-upload-box" onclick="document.getElementById('cv_file').click()">
                        <i class="fa-solid fa-file-pdf" style="font-size: 28px; color: var(--primary);"></i>
                        <p id="file-label" style="font-size: 14px; font-weight: 600;">انقر لرفع ملف السي في (PDF/صورة)</p>
                    </div>
                    <input type="file" id="cv_file" accept=".pdf,.doc,.docx,image/*" style="display: none;" onchange="handleFileChange(event)">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 14px;" id="submit-btn">حفظ ونشر الملف</button>
            </form>
        </div>
    </div>

    <div class="toast" id="toast"><i class="fa-solid fa-circle-check" style="color: var(--primary);"></i><span id="toast-message">تمت العملية بنجاح!</span></div>
    <script>
        const SUPABASE_URL = 'https://lvutrzswngpkjfamgact.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_fB8RmZyfymR8YpjLInA2LQ_hMA6qgRG';
        
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let selectedFile = null;

        document.addEventListener('DOMContentLoaded', fetchCandidates);

        async function fetchCandidates() {
            const grid = document.getElementById('candidates-grid');
            const countLabel = document.getElementById('candidates-count');

            try {
                const { data, error } = await supabase.from('resumes').select('*').order('created_at', { ascending: false });
                if (error) throw error;

                countLabel.textContent = `${data.length} كفاءة متوفرة`;
                grid.innerHTML = '';

                if (data.length === 0) {
                    grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--slate); padding: 40px;">لا توجد ملفات شخصية مسجلة حالياً.</p>';
                    return;
                }

                data.forEach(candidate => {
                    const skillsArray = candidate.skills ? candidate.skills.split(',').map(s => s.trim()) : [];
                    const initial = candidate.full_name ? candidate.full_name.charAt(0) : '؟';
                    
                    grid.insertAdjacentHTML('beforeend', `
                        <div class="card">
                            <div>
                                <div class="card-header">
                                    <div class="avatar">${initial}</div>
                                    <div class="candidate-info">
                                        <h3>${escapeHtml(candidate.full_name)}</h3>
                                        <p>${escapeHtml(candidate.job_title)}</p>
                                    </div>
                                </div>
                                <div class="card-body">
                                    <p>${escapeHtml(candidate.experience || 'لا توجد نبذة مختصرة مضافة.')}</p>
                                    ${skillsArray.length > 0 ? `<div class="skills-tags">${skillsArray.map(s => `<span class="tag">${escapeHtml(s)}</span>`).join('')}</div>` : ''}
                                </div>
                            </div>
                            <div class="card-footer">
                                <a href="https://wa.me/${candidate.phone.replace(/[^0-9]/g, '')}" target="_blank" class="btn btn-primary" style="flex: 1; justify-content: center; font-size: 13px;">
                                    <i class="fa-brands fa-whatsapp"></i> تواصل عبر الواتساب
                                </a>
                                ${candidate.cv_url ? `<a href="${candidate.cv_url}" target="_blank" class="btn btn-outline" style="font-size: 13px;"><i class="fa-solid fa-file-pdf"></i> CV</a>` : ''}
                            </div>
                        </div>
                    `);
                });
            } catch (err) {
                console.error(err);
                countLabel.textContent = 'خطأ في تحميل البيانات';
            }
        }

        function openModal() { document.getElementById('profile-modal').classList.add('active'); }
        function closeModal() {
            document.getElementById('profile-modal').classList.remove('active');
            document.getElementById('candidate-form').reset();
            document.getElementById('file-label').textContent = 'انقر لرفع ملف السي في (PDF/صورة)';
            selectedFile = null;
        }

        function handleFileChange(event) {
            const file = event.target.files[0];
            if (file) {
                selectedFile = file;
                document.getElementById('file-label').textContent = `تم اختيار: ${file.name}`;
            }
        }

        async function handleSubmit(event) {
            event.preventDefault();
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري الحفظ...';

            try {
                let cvUrl = '';
                if (selectedFile) {
                    const fileName = `${Date.now()}_${selectedFile.name.replace(/\s+/g, '_')}`;
                    const { data: uploadData, error: uploadError } = await supabase.storage.from('cv_files').upload(fileName, selectedFile);
                    if (!uploadError) {
                        const { data: publicUrlData } = supabase.storage.from('cv_files').getPublicUrl(fileName);
                        cvUrl = publicUrlData.publicUrl;
                    }
                }

                const newCandidate = {
                    full_name: document.getElementById('full_name').value,
                    job_title: document.getElementById('job_title').value,
                    phone: document.getElementById('phone').value,
                    skills: document.getElementById('skills').value,
                    experience: document.getElementById('experience').value,
                    cv_url: cvUrl
                };

                const { error: insertError } = await supabase.from('resumes').insert([newCandidate]);
                if (insertError) throw insertError;

                showToast('تم نشر ملفك الشخصي وسيرتك الذاتية بنجاح!');
                closeModal();
                fetchCandidates();
            } catch (error) {
                console.error(error);
                showToast('حدث خطأ أثناء الحفظ، يرجى المحاولة لاحقاً');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'حفظ ونشر الملف';
            }
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3500);
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }
    </script>
</body>
</html>
