<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كفاءات وخبراء محافظة ذمار | منصة صدارة</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #0f2347; --gold: #d4af37; --green: #25d366; --bg-light: #f8fafc; --text-dark: #0f172a; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background: var(--bg-light); padding-bottom: 50px; color: var(--text-dark); }

        .top-navbar { background: #0a1324; color: white; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--gold); }
        .back-btn { background: var(--gold); color: #0a1324; border: none; padding: 6px 12px; border-radius: 6px; font-weight: 800; font-size: 11px; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }

        .hero-section { background: linear-gradient(135deg, #0a1324 0%, var(--primary) 100%); color: white; padding: 25px 16px; text-align: center; margin-bottom: 20px; }
        .container { max-width: 800px; margin: 0 auto; padding: 0 16px; }

        .resume-card { background: white; border-radius: 12px; padding: 16px; margin-bottom: 14px; border: 1px solid #e2e8f0; box-shadow: 0 3px 10px rgba(0,0,0,0.02); display: flex; flex-direction: column; gap: 14px; }
        .resume-header-flex { display: flex; gap: 14px; align-items: flex-start; }
        .resume-img { width: 65px; height: 65px; border-radius: 50%; object-fit: cover; border: 2px solid var(--gold); background: #f1f5f9; flex-shrink: 0; }
        .resume-info { flex: 1; }
        .resume-name { font-size: 15px; font-weight: 900; color: var(--primary); display: flex; align-items: center; gap: 4px; }
        .resume-title { font-size: 12px; font-weight: 700; color: #3b82f6; margin-top: 2px; }
        .resume-exp { font-size: 11px; color: #64748b; margin-top: 6px; line-height: 1.5; white-space: pre-line; }
        
        .whatsapp-contact-btn { background: var(--green); color: white; text-decoration: none; padding: 6px 12px; border-radius: 6px; font-weight: bold; font-size: 11px; display: inline-flex; align-items: center; gap: 5px; margin-top: 10px; }

        .loading-box { text-align: center; padding: 30px; color: #64748b; font-size: 13px; font-weight: bold; }

        .resume-reviews-box { background: #f8fafc; border-radius: 10px; padding: 10px; border: 1px solid #cbd5e1; font-size: 12px; width: 100%; margin-top: 4px; }
        .star-select-resume { font-size: 16px; color: #cbd5e1; cursor: pointer; display: inline-block; margin: 2px 0; }
        .star-select-resume.active { color: var(--gold); }
        .single-resume-review { background: white; padding: 6px 10px; border-radius: 6px; margin-top: 6px; border-right: 3px solid var(--gold); border-bottom: 1px solid #e2e8f0; }
    </style>
</head>
<body>

    <div class="top-navbar">
        <span style="font-weight: 900; font-size:14px;"><i class="fa-solid fa-users-viewfinder"></i> دليل الكفاءات والخبراء</span>
        <a href="index.html" class="back-btn"><i class="fa-solid fa-house"></i> الرئيسية</a>
    </div>

    <div class="hero-section">
        <h1 style="font-size: 18px; font-weight: 900;">كفاءات ومستقلّو محافظة ذمار</h1>
        <p style="font-size: 11px; opacity: 0.85; margin-top: 4px;">تصفح أبرز الكفاءات والخبراء المعتمدين في مختلف التخصصات</p>
    </div>

    <div class="container">
        <div id="resumesBox">
            <div class="loading-box">جاري تحميل الكفاءات من السحابة... ⏳</div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://lvutrzswngpkjfamgact.supabase.co";
        const SUPABASE_KEY = "sb_publishable_fB8RmZyfymR8YpjLInA2LQ_hMA6qgRG";
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let selectedResumeStarsMap = {};

        function getBlueBadgeHTML() {
            return `<span title="حساب موثق" style="display:inline-flex; align-items:center; vertical-align:middle;">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z" fill="#1877F2"/>
                </svg>
            </span>`;
        }

        async function loadPublicResumes() {
            let box = document.getElementById('resumesBox');
            try {
                let { data, error } = await db.from('resumes').select('*').order('id', { ascending: false });
                
                if (error || !data || data.length === 0) {
                    box.innerHTML = '<div class="loading-box">لا توجد كفاءات مسجلة حالياً.</div>';
                    return;
                }

                box.innerHTML = '';
                data.forEach(r => {
                    let displayName = r.name || r.title || 'مستقل / كفاءة';
                    let displayTitle = r.job_title || r.specialty || r.title || 'تخصص عام';
                    let displayExp = r.experience || 'لا توجد نبذة مختصرة مسجلة.';
                    let displayPhone = r.phone ? r.phone.replace(/[^0-9]/g, '') : '967780568507';
                    let displayImg = (r.image && r.image.trim() !== '') ? r.image : 'https://cdn-icons-png.flaticon.com/512/3135/3135715.png';
                    let verifiedBadge = r.is_verified ? getBlueBadgeHTML() : '';
                    selectedResumeStarsMap[r.id] = 5;

                    box.innerHTML += `
                        <div class="resume-card">
                            <div class="resume-header-flex">
                                <img src="${displayImg}" class="resume-img" alt="صورة الكفاءة">
                                <div class="resume-info">
                                    <div class="resume-name">
                                        ${displayName} ${verifiedBadge}
                                    </div>
                                    <div class="resume-title">${displayTitle}</div>
                                    <div class="resume-exp">${displayExp}</div>
                                    <a href="https://wa.me/${displayPhone}?text=مرحباً،%20تواصلت%20معك%20عبر%20منصة%20صدارة" target="_blank" class="whatsapp-contact-btn">
                                        <i class="fa-brands fa-whatsapp"></i> تواصل عبر الواتساب
                                    </a>
                                </div>
                            </div>

                            <div class="resume-reviews-box">
                                <h4 style="font-size:12px; color:var(--primary); font-weight:bold;">⭐ تقييمات وتوصيات أصحاب الأعمال:</h4>
                                
                                <div style="margin: 4px 0;" id="resumeStarBox_${r.id}">
                                    <span class="star-select-resume active" onclick="setResumeStar(${r.id}, 1)">★</span>
                                    <span class="star-select-resume active" onclick="setResumeStar(${r.id}, 2)">★</span>
                                    <span class="star-select-resume active" onclick="setResumeStar(${r.id}, 3)">★</span>
                                    <span class="star-select-resume active" onclick="setResumeStar(${r.id}, 4)">★</span>
                                    <span class="star-select-resume active" onclick="setResumeStar(${r.id}, 5)">★</span>
                                </div>

                                <div style="display:flex; gap:5px; margin-top:4px;">
                                    <input type="text" id="resumeReviewText_${r.id}" placeholder="اكتب توصية أو رأيك في التعامل مع هذا الشخص..." style="flex:1; padding:6px; border:1px solid #cbd5e1; border-radius:6px; font-size:11px; outline:none;">
                                    <button onclick="submitResumeReview(${r.id})" style="background:var(--primary); color:white; border:none; padding:6px 12px; border-radius:6px; font-size:11px; font-weight:bold; cursor:pointer;">إرسال</button>
                                </div>

                                <div id="resumeReviewsList_${r.id}" style="margin-top:8px;">جاري تحميل التقييمات...</div>
                            </div>
                        </div>
                    `;

                    loadResumeReviews(r.id);
                });
            } catch (err) {
                box.innerHTML = '<div class="loading-box" style="color:red;">حدث خطأ أثناء جلب البيانات.</div>';
            }
        }

        function setResumeStar(resumeId, stars) {
            selectedResumeStarsMap[resumeId] = stars;
            const starEls = document.querySelectorAll(`#resumeStarBox_${resumeId} .star-select-resume`);
            starEls.forEach((el, idx) => {
                if (idx < stars) el.classList.add('active');
                else el.classList.remove('active');
            });
        }

        async function submitResumeReview(resumeId) {
            const commentInput = document.getElementById(`resumeReviewText_${resumeId}`);
            const comment = commentInput.value.trim();

            if (!comment) { alert('يرجى كتابة التوصية أو التعليق قبل الإرسال'); return; }

            const userPhone = localStorage.getItem('sadara_logged_phone') || 'غير مسجل';
            const userName = localStorage.getItem('sadara_logged_name') || 'جهة عمل';
            const fullIdentity = `${userName} (${userPhone})`;

            let { error } = await db.from('reviews').insert([{
                item_type: 'resume',
                item_id: resumeId,
                user_name: fullIdentity,
                rating: selectedResumeStarsMap[resumeId] || 5,
                comment: comment
            }]);

            if (error) {
                alert('خطأ أثناء إرسال التقييم: ' + error.message);
            } else {
                alert('شكراً لك! تم نشر التوصية بنجاح ✅');
                commentInput.value = '';
                loadResumeReviews(resumeId);
            }
        }

        async function loadResumeReviews(resumeId) {
            let { data: reviews } = await db.from('reviews')
                .select('*')
                .eq('item_type', 'resume')
                .eq('item_id', resumeId)
                .order('created_at', { ascending: false });

            let listBox = document.getElementById(`resumeReviewsList_${resumeId}`);
            if (!listBox) return;
            listBox.innerHTML = '';

            if (!reviews || !reviews.length) {
                listBox.innerHTML = '<p style="font-size:10px; color:#94a3b8;">لا توجد توصيات حتى الآن. كن أول من يضيف تقييماً لهذا الخبير!</p>';
                return;
            }

            reviews.forEach(r => {
                let starsHTML = '★'.repeat(r.rating || 5);
                listBox.innerHTML += `
                    <div class="single-resume-review">
                        <div style="display:flex; justify-content:space-between; font-weight:bold; color:#0f2347; font-size:11px;">
                            <span>👤 ${r.user_name}</span>
                            <span style="color:var(--gold);">${starsHTML}</span>
                        </div>
                        <p style="color:#475569; font-size:10px; margin-top:2px;">${r.comment}</p>
                    </div>
                `;
            });
        }

        document.addEventListener('DOMContentLoaded', loadPublicResumes);
    </script>
</body>
</html>
