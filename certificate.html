<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة صدارة - الشهادة الرقمية الرسمية</title>
    <!-- خط القاهرة الرسمي -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- مكتبة توليد رمز الـ QR -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- مكتبة تحويل العناصر إلى صور -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- مكتبة توليد ملفات PDF برمجياً -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: #0f172a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* شريط التحكم */
        .actions-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .btn {
            background-color: #059669;
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(5, 150, 105, 0.3);
        }

        .btn:hover {
            background-color: #047857;
            transform: translateY(-2px);
        }

        .btn-pdf {
            background-color: #dc2626;
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.3);
        }

        .btn-pdf:hover {
            background-color: #b91c1c;
        }

        .btn-outline {
            background-color: transparent;
            border: 2px solid #059669;
            color: #10b981;
            box-shadow: none;
        }

        /* حاوية الشهادة الرئيسية */
        .certificate-wrapper {
            position: relative;
            width: 1000px;
            height: 707px;
            border-radius: 8px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            background-color: #ffffff;
        }

        /* صورة الخلفية الرسمية */
        .cert-bg-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: fill;
            z-index: 1;
        }

        /* نصوص الشهادة والـ QR فوق الصورة */
        .cert-content {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
        }

        /* 1. اسم المتدرب */
        .cert-field.student-name {
            position: absolute;
            top: 47%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70%;
            text-align: center;
            font-size: 28px;
            font-weight: 900;
            color: #065f46;
        }

        /* 2. عبارة التمهيد */
        .cert-field.intro-text {
            position: absolute;
            top: 55%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            text-align: center;
            font-size: 18px;
            font-weight: 600;
            color: #334155;
        }

        /* 3. مسمى الدورة */
        .cert-field.course-title {
            position: absolute;
            top: 61.5%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 75%;
            text-align: center;
            font-size: 22px;
            font-weight: 800;
            color: #1e293b;
        }

        /* 4. تفاصيل التاريخ وعدد الساعات الديناميكية */
        .cert-field.meta-details {
            position: absolute;
            top: 67.5%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            text-align: center;
            font-size: 15px;
            font-weight: 700;
            color: #475569;
        }

        /* 5. رقم الشهادة (السيريال) */
        .cert-field.cert-serial {
            position: absolute;
            bottom: 12.8%;
            left: 20.5%;
            font-size: 13px;
            font-weight: 700;
            color: #334155;
            direction: ltr;
        }

        /* 6. مربع رمز الـ QR */
        .cert-field.qr-box {
            position: absolute;
            bottom: 8.5%;
            left: 8.2%;
            padding: 4px;
            background: #ffffff;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .loading-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.85);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: 700;
            z-index: 10;
        }

        @media print {
            body { 
                background: none; 
                padding: 0; 
                -webkit-print-color-adjust: exact !important; 
                print-color-adjust: exact !important; 
            }
            .actions-bar { display: none !important; }
            .certificate-wrapper { 
                box-shadow: none; 
                border-radius: 0; 
                width: 100vw; 
                height: 100vh; 
            }
        }
    </style>
</head>
<body>

    <!-- أزرار الإجراءات -->
    <div class="actions-bar">
        <button class="btn" onclick="downloadPNG()">🖼️ تحميل (PNG)</button>
        <button class="btn btn-pdf" onclick="downloadPDF()">📄 تحميل (PDF)</button>
        <button class="btn btn-outline" onclick="window.print()">🖨️ طباعة الشهادة</button>
    </div>

    <!-- كارت الشهادة -->
    <div class="certificate-wrapper" id="certificateCard">
        <div id="loadingOverlay" class="loading-overlay">جاري تحميل بيانات الشهادة...</div>

        <!-- صورة الخلفية الرسمية -->
        <img class="cert-bg-img" src="https://lvutrzswngpkjfamgact.supabase.co/storage/v1/object/public/platform-files/certificate.png" crossorigin="anonymous" alt="Certificate Background">

        <!-- عناصر الشهادة -->
        .cert-content">
            <div class="cert-field student-name" id="studentName">---</div>
            <div class="cert-field intro-text">وذلك لحضوره بنجاح الدورة التدريبية الموسومة بـ:</div>
            <div class="cert-field course-title" id="courseTitle">---</div>
            
            <div class="cert-field meta-details">
                وذلك بتاريخ: <span id="issueDate">---</span> | بواقع: <span id="courseHours">---</span> ساعة تدريبية
            </div>

            <div class="cert-field cert-serial" id="certSerial">---</div>
            <div class="cert-field qr-box" id="qrcode"></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://lvutrzswngpkjfamgact.supabase.co';
        const SUPABASE_ANON_KEY = 'ضع_مفتاح_ANON_KEY_هنا';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function fetchAndRenderCertificate() {
            const urlParams = new URLSearchParams(window.location.search);
            const certCode = urlParams.get('id') || 'SAD-2026-9814';

            try {
                const { data, error } = await supabaseClient
                    .from('certificates')
                    .select('*')
                    .eq('certificate_code', certCode)
                    .single();

                if (error || !data) {
                    renderCertificateData({
                        full_name: 'عبدالرحمن عبدالله صالح الذماري',
                        course_name: 'إدارة الأعمال والتسويق الرقمي الحديث',
                        certificate_code: certCode,
                        created_at: '2026-10-20',
                        hours: '30'
                    });
                } else {
                    renderCertificateData({
                        full_name: data.full_name,
                        course_name: data.course_name,
                        certificate_code: data.certificate_code,
                        created_at: new Date(data.created_at).toISOString().split('T')[0],
                        hours: data.hours || '30'
                    });
                }
            } catch (err) {
                console.error("خطأ في الجلب:", err);
            } finally {
                document.getElementById('loadingOverlay').style.display = 'none';
            }
        }

        function renderCertificateData(studentData) {
            document.getElementById('studentName').innerText = studentData.full_name;
            document.getElementById('courseTitle').innerText = studentData.course_name;
            document.getElementById('issueDate').innerText = studentData.created_at;
            document.getElementById('courseHours').innerText = studentData.hours;
            document.getElementById('certSerial').innerText = studentData.certificate_code;

            // 🌟 تنسيق بيانات الباركود لتظهر بشكل مباشر ومضمون التوليد دون مشاكل حجم البيانات
            const qrPayload = `SADARAH CERTIFICATE\nID: ${studentData.certificate_code}\nName: ${studentData.full_name}\nCourse: ${studentData.course_name}\nDate: ${studentData.created_at}\nHours: ${studentData.hours}h`;

            const qrContainer = document.getElementById("qrcode");
            qrContainer.innerHTML = "";
            
            // توليد الـ QR بالاعتماد على مكتبة qrcode.js وبدقة عالية ومستقرة
            try {
                new QRCode(qrContainer, {
                    text: qrPayload,
                    width: 78,
                    height: 78,
                    colorDark: "#000000",
                    colorLight: "#ffffff",
                    correctLevel: QRCode.CorrectLevel.L
                });
            } catch (e) {
                console.error("خطأ في توليد الباركود:", e);
            }
        }

        function downloadPNG() {
            const certElement = document.getElementById('certificateCard');
            html2canvas(certElement, { scale: 3, useCORS: true, allowTaint: true }).then(canvas => {
                const serial = document.getElementById('certSerial').innerText;
                const link = document.createElement('a');
                link.download = `شهادة_${serial}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }

        function downloadPDF() {
            const { jsPDF } = window.jspdf;
            const certElement = document.getElementById('certificateCard');

            html2canvas(certElement, { scale: 3, useCORS: true, allowTaint: true }).then(canvas => {
                const imgData = canvas.toDataURL('image/png');
                const pdf = new jsPDF('landscape', 'mm', 'a4');
                const pdfWidth = pdf.internal.pageSize.getWidth();
                const pdfHeight = pdf.internal.pageSize.getHeight();

                pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);
                const serial = document.getElementById('certSerial').innerText;
                pdf.save(`شهادة_${serial}.pdf`);
            });
        }

        window.addEventListener('DOMContentLoaded', fetchAndRenderCertificate);
    </script>
</body>
</html>
