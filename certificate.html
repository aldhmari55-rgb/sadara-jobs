<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الشهادة المعتمدة | منصة صدارة</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&family=Amiri:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        
        body { 
            background: #0a1324; 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 20px; 
        }

        /* ورقة الشهادة A4 أفقي تطابق صورتك تماماً كخلفية */
        .page-a4-landscape {
            width: 297mm;
            height: 210mm;
            background-image: url('٢٠٢٦١٠٢٠_١٩٥٠٤٩_2.jpg'); /* سيتم جلب الصورة كخلفية مباشرة */
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        /* اسم المتدرب فوق المستطيل الفارغ في التصميم */
        .student-name-overlay {
            position: absolute;
            top: 43.5%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 34px;
            font-weight: 900;
            color: #059669 !important;
            text-align: center;
            width: 550px;
        }

        /* اسم الدورة التدريبية */
        .course-name-overlay {
            position: absolute;
            top: 57.5%;
            right: 43%;
            font-size: 19px;
            font-weight: 900;
            color: #0f2347 !important;
        }

        /* الباركود وتفاصيل التحقق أسفل التصميم */
        .qr-overlay {
            position: absolute;
            bottom: 8mm;
            left: 12mm;
            text-align: center;
            background: rgba(255, 255, 255, 0.9);
            padding: 4px;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
        }
        #qrcode { display: inline-block; }
        .verification-code-text { font-size: 8px; color: #64748b !important; margin-top: 2px; font-weight: bold; }

        .controls-bar { margin-top: 20px; display: flex; gap: 12px; }
        .btn-action { 
            background: #d4af37; 
            color: #0a1324; 
            border: none; 
            padding: 12px 28px; 
            border-radius: 8px; 
            font-weight: bold; 
            font-size: 15px; 
            cursor: pointer; 
            box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
            transition: 0.2s;
        }
        .btn-action:hover { background: #fef08a; transform: translateY(-2px); }

        @media print {
            @page { size: A4 landscape; margin: 0; }
            *, *::before, *::after {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
                color-adjust: exact !important;
            }
            body { background: white !important; padding: 0; min-height: auto; }
            .controls-bar { display: none !important; }
            .page-a4-landscape { 
                box-shadow: none !important; 
                width: 297mm !important; 
                height: 210mm !important; 
                margin: 0 !important;
            }
        }
    </style>
</head>
<body>

    <div class="page-a4-landscape" id="certificateSheet">
        <!-- اسم المتدرب داخل المستطيل الفارغ -->
        <div class="student-name-overlay" id="studentNameDisplay">جاري التحميل...</div>
        
        <!-- اسم الدورة -->
        <div class="course-name-overlay" id="courseNameDisplay">...</div>

        <!-- الباركود وكود التحقق -->
        <div class="qr-overlay">
            <div id="qrcode"></div>
            <div class="verification-code-text" id="codeTextDisplay">CODE: ---</div>
        </div>
    </div>

    <div class="controls-bar">
        <button class="btn-action" onclick="window.print()">🖨️ طباعة أو حفظ الشهادة PDF (دقة عالية A4)</button>
    </div>

<script>
    const SUPABASE_URL = "https://lvutrzswngpkjfamgact.supabase.co";
    const SUPABASE_KEY = "sb_publishable_fB8RmZyfymR8YpjLInA2LQ_hMA6qgRG";
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function loadCertificateData() {
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');

        if (!code) {
            document.getElementById('certificateSheet').innerHTML = '<h2 style="text-align:center; padding:100px; color:red;">⚠️ كود الشهادة غير موجود بالرابط!</h2>';
            return;
        }

        let { data, error } = await db.from('course_certificates').select('*').eq('verification_code', code).single();

        if (error || !data) {
            document.getElementById('certificateSheet').innerHTML = '<h2 style="text-align:center; padding:100px; color:red;">⚠️ عذراً، لم يتم العثور على سجل لهذه الشهادة في قاعدة البيانات.</h2>';
            return;
        }

        document.getElementById('studentNameDisplay').textContent = data.student_name;
        document.getElementById('courseNameDisplay').textContent = data.course_name;
        document.getElementById('codeTextDisplay').textContent = "كود: " + data.verification_code;

        let verifyUrl = window.location.origin + `/verify.html?code=${data.verification_code}`;
        
        document.getElementById("qrcode").innerHTML = "";
        new QRCode(document.getElementById("qrcode"), {
            text: verifyUrl,
            width: 50,
            height: 50,
            colorDark : "#0f2347",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.H
        });
    }

    document.addEventListener('DOMContentLoaded', loadCertificateData);
</script>
</body>
</html>
