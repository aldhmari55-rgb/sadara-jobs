<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر الخدمات والمنتجات | منصة صدارة</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #0f2347; --gold: #d4af37; --green: #25d366; --bg-light: #f8fafc; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background: var(--bg-light); padding-bottom: 50px; color: #0f172a; }

        .top-navbar { background: #0a1324; color: white; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(212, 175, 55, 0.2); }
        .back-btn { background: var(--gold); color: #0a1324; padding: 6px 12px; border-radius: 6px; font-weight: bold; text-decoration: none; font-size: 11px; }

        .hero-store { background: linear-gradient(180deg, #0a1324 0%, var(--primary) 100%); color: white; padding: 25px 16px; text-align: center; }
        .main-container { max-width: 800px; margin: 15px auto; padding: 0 16px; }

        .search-cat-box { background: white; padding: 12px; border-radius: 12px; border: 1px solid #cbd5e1; margin-bottom: 15px; box-shadow: 0 2px 6px rgba(0,0,0,0.02); }
        .store-search { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 12px; outline: none; margin-bottom: 10px; }
        .cat-tags-container { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
        .store-cat-tag { background: #f1f5f9; color: #334155; padding: 6px 12px; border-radius: 20px; font-size: 11px; font-weight: bold; cursor: pointer; white-space: nowrap; border: 1px solid #cbd5e1; transition: 0.2s; }
        .store-cat-tag.active, .store-cat-tag:hover { background: var(--primary); color: white; border-color: var(--primary); }

        .affiliate-badge-info { background: #eff6ff; border: 1px solid #bfdbfe; color: #1e40af; padding: 10px; border-radius: 10px; font-size: 11px; text-align: center; font-weight: bold; margin-bottom: 15px; display: none; }

        .product-card { background: white; border-radius: 12px; border: 1px solid #cbd5e1; padding: 14px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.03); display: flex; flex-direction: column; gap: 8px; }
        .product-img { width: 100%; max-height: 220px; object-fit: cover; border-radius: 8px; border: 1px solid #e2e8f0; }
        .product-title-row { display: flex; justify-content: space-between; align-items: center; }
        .product-title { font-size: 15px; font-weight: 900; color: var(--primary); }
        .product-price { color: #10b981; font-weight: 900; font-size: 14px; }
        .product-desc { font-size: 11px; color: #64748b; line-height: 1.5; }
        .product-cat-label { background: #eff6ff; color: #0284c7; padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; width: fit-content; }
        .order-btn { background: var(--primary); color: white; text-align: center; padding: 10px; border-radius: 8px; font-weight: bold; text-decoration: none; font-size: 12px; margin-top: 5px; cursor: pointer; border: none; }

        /* نافذة تفاصيل المنتج المستقلة والطلب */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 9999; justify-content: center; align-items: center; padding: 15px; overflow-y: auto; }
        .modal-card { background: white; padding: 20px; border-radius: 14px; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .modal-card label { font-size: 11px; font-weight: bold; color: #475569; display: block; margin-top: 8px; }
        .modal-card input, .modal-card select, .modal-card textarea { width: 100%; padding: 9px 10px; margin-top: 4px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 12px; outline: none; background: #fff; }
    </style>
</head>
<body>

    <div class="top-navbar">
        <span style="font-weight: 900; font-size:14px;">صدارة للخدمات الرقمية</span>
        <a href="index.html" class="back-btn"><i class="fa-solid fa-house"></i> الرئيسية</a>
    </div>

    <div class="hero-store">
        <h1 style="font-size: 18px;">متجر الخدمات والاشتراكات والمنتجات 🛒</h1>
        <p style="font-size: 11px; opacity: 0.85; margin-top: 4px;">اختر المنتج المطلوب لعرض تفاصيله الكاملة والطلب المباشر</p>
    </div>

    <div class="main-container">

        <div class="affiliate-badge-info" id="affiliateBanner">
            🎉 مبروك! تم تفعيل كود الخصم والترشيح عبر مسوق موثق ✅
        </div>

        <div class="search-cat-box">
            <input type="text" id="storeSearchInput" class="store-search" placeholder="🔍 ابحث عن منتج أو خدمة بالاسم..." oninput="filterStore()">
            <div class="cat-tags-container">
                <span class="store-cat-tag active" onclick="filterStoreCategory('الكل', this)">الكل 🌐</span>
                <span class="store-cat-tag" onclick="filterStoreCategory('اشتراكات', this)">🔑 اشتراكات رقمية</span>
                <span class="store-cat-tag" onclick="filterStoreCategory('خدمات', this)">🛠️ خدمات</span>
                <span class="store-cat-tag" onclick="filterStoreCategory('ملابس', this)">👗 ملابس وأزياء</span>
                <span class="store-cat-tag" onclick="filterStoreCategory('تجميل', this)">💄 تجميل وعناية</span>
                <span class="store-cat-tag" onclick="filterStoreCategory('منزل', this)">🏡 مستلزمات منزلية</span>
                <span class="store-cat-tag" onclick="filterStoreCategory('أخرى', this)">📦 أخرى</span>
            </div>
        </div>

        <div id="storeProductsList">جاري تحميل المتجر والمنتجات...</div>
    </div>

    <!-- نافذة تفاصيل المنتج ونموذج الطلب الشامل -->
    <div class="modal-overlay" id="productModal">
        <div class="modal-card" id="modalProductContent">
            <!-- محتوى المنتج والتفاصيل يتم حقنه ديناميكياً هنا -->
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://lvutrzswngpkjfamgact.supabase.co";
        const SUPABASE_KEY = "sb_publishable_fB8RmZyfymR8YpjLInA2LQ_hMA6qgRG";
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let allProducts = [];
        let currentSelectedCategory = 'الكل';
        let currentSelectedProduct = null;

        async function initStore() {
            const urlParams = new URLSearchParams(window.location.search);
            let refParam = urlParams.get('ref');
            let productIdParam = urlParams.get('product_id');

            if (refParam) {
                localStorage.setItem('sadara_affiliate_ref', refParam);
                document.getElementById('affiliateBanner').style.display = 'block';
                trackAffiliateClick(refParam);
            } else if (localStorage.getItem('sadara_affiliate_ref')) {
                document.getElementById('affiliateBanner').style.display = 'block';
            }

            let { data, error } = await db.from('platform_services').select('*').eq('is_active', true).order('id', { ascending: false });
            if (error) {
                document.getElementById('storeProductsList').innerHTML = '<p style="text-align:center; color:red; font-size:12px;">حدث خطأ في تحميل المتجر.</p>';
                return;
            }

            allProducts = data || [];
            renderStoreProducts(allProducts);

            // إذا كان الرابط يحتوي على معرف منتج مباشر، افتح نافذة تفاصيله تلقائياً
            if (productIdParam) {
                let targetProd = allProducts.find(p => p.id == productIdParam);
                if (targetProd) {
                    openProductDetails(targetProd);
                }
            }
        }

        async function trackAffiliateClick(code) {
            try {
                let { data: aff } = await db.from('affiliates').select('*').or(`ref_code.eq.${code},phone.eq.${code}`).single();
                if (aff) {
                    let currentClicks = Number(aff.clicks || 0) + 1;
                    await db.from('affiliates').update({ clicks: currentClicks }).eq('id', aff.id);
                }
            } catch(e) {}
        }

        function filterStoreCategory(category, el) {
            currentSelectedCategory = category;
            document.querySelectorAll('.store-cat-tag').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            executeStoreFilter();
        }

        function filterStore() { executeStoreFilter(); }

        function executeStoreFilter() {
            let query = document.getElementById('storeSearchInput').value.toLowerCase().trim();
            let filtered = allProducts.filter(p => {
                let matchCat = (currentSelectedCategory === 'الكل' || p.category === currentSelectedCategory);
                let matchQuery = (!query || p.title.toLowerCase().includes(query) || (p.description && p.description.toLowerCase().includes(query)));
                return matchCat && matchQuery;
            });
            renderStoreProducts(filtered);
        }

        function renderStoreProducts(productsList) {
            let box = document.getElementById('storeProductsList');
            box.innerHTML = '';

            if (!productsList || productsList.length === 0) {
                box.innerHTML = '<p style="text-align:center; color:#64748b; font-size:12px; padding:20px;">لا توجد منتجات مطابقة لبحثك حالياً.</p>';
                return;
            }

            productsList.forEach(p => {
                let imgHTML = (p.image && p.image.trim() !== '') ? `<img src="${p.image}" class="product-img">` : '';
                let catTag = p.category ? `<span class="product-cat-label">📁 ${p.category}</span>` : '';

                box.innerHTML += `
                    <div class="product-card" style="cursor: pointer;" onclick="openProductDetailsById(${p.id})">
                        ${imgHTML}
                        <div class="product-title-row">
                            <span class="product-title">${p.title}</span>
                            <span class="product-price">${p.price}</span>
                        </div>
                        ${catTag}
                        <p class="product-desc">${p.description ? p.description.substring(0, 90) + '...' : 'بدون وصف إضافي'}</p>
                        <button class="order-btn" onclick="event.stopPropagation(); openProductDetailsById(${p.id})">عرض التفاصيل والطلب 🚀</button>
                    </div>
                `;
            });
        }

        function openProductDetailsById(id) {
            let p = allProducts.find(item => item.id == id);
            if (p) openProductDetails(p);
        }

        function openProductDetails(p) {
            currentSelectedProduct = p;
            let imgHTML = (p.image && p.image.trim() !== '') ? `<img src="${p.image}" style="width:100%; max-height:220px; object-fit:cover; border-radius:8px; margin-bottom:12px;">` : '';

            document.getElementById('modalProductContent').innerHTML = `
                ${imgHTML}
                <span class="product-cat-label">📁 ${p.category || 'عام'}</span>
                <h2 style="font-size:18px; color:var(--primary); margin:6px 0;">${p.title}</h2>
                <div style="font-size:16px; color:#10b981; font-weight:900; margin-bottom:10px;">السعر: ${p.price}</div>
                <div style="font-size:12px; color:#475569; line-height:1.6; background:#f8fafc; padding:10px; border-radius:8px; border:1px solid #e2e8f0; margin-bottom:15px;">
                    <strong>وصف وتفاصيل المنتج:</strong><br>${p.description || 'لا يوجد وصف إضافي.'}
                </div>

                <hr style="border:0; border-top:1px solid #e2e8f0; margin:15px 0;">

                <h3 style="font-size:14px; color:var(--primary); margin-bottom:8px;">🛒 نموذج الطلب والسداد المباشر</h3>
                
                <label>اسمك الكريم</label>
                <input type="text" id="clientName" placeholder="أحمد محمد">

                <label>رقم الواتساب للتواصل وتفعيل الخدمة</label>
                <input type="tel" id="clientPhone" placeholder="770000000">

                <label>المحافظة الحالية (مثال: ذمار، صنعاء، إب...)</label>
                <input type="text" id="clientCity" placeholder="ذمار">

                <label>من دلك أو كيف وصلت إلينا؟ (اختياري)</label>
                <input type="text" id="clientReferralSource" placeholder="اسم المسوق، صديق، وسائل التواصل...">

                <label>وسيلة الدفع والتحويل</label>
                <select id="payMethod">
                    <option value="محفظة جيب">محفظة جيب (780568507)</option>
                    <option value="بنك الكريمي">بنك الكريمي (2628009)</option>
                </select>

                <label>صورة سند التحويل أو الدفع 📄</label>
                <input type="file" id="payReceiptFile" accept="image/*">

                <label>ملاحظات إضافية (اختياري)</label>
                <input type="text" id="orderNotes" placeholder="أي تفاصيل تود إضافتها...">

                <button onclick="submitProductOrder()" style="width:100%; background:var(--green); color:white; border:none; padding:12px; border-radius:8px; font-weight:bold; margin-top:14px; cursor:pointer; font-size:13px;">تأكيد وإرسال الطلب 📱</button>
                <button onclick="closeProductModal()" style="width:100%; background:transparent; color:#64748b; border:none; margin-top:6px; cursor:pointer; font-size:11px;">إغلاق</button>
                
                <div id="orderStatusMsg" style="font-size:11px; margin-top:8px; text-align:center; font-weight:bold;"></div>
            `;
            document.getElementById('productModal').style.display = 'flex';
        }

        function closeProductModal() {
            document.getElementById('productModal').style.display = 'none';
        }

        async function submitProductOrder() {
            const name = document.getElementById('clientName').value.trim();
            const phone = document.getElementById('clientPhone').value.trim();
            const city = document.getElementById('clientCity').value.trim();
            const refSource = document.getElementById('clientReferralSource').value.trim();
            const payMethod = document.getElementById('payMethod').value;
            const file = document.getElementById('payReceiptFile').files[0];
            const notes = document.getElementById('orderNotes').value.trim();
            const msg = document.getElementById('orderStatusMsg');

            if (!name || !phone) { alert('يرجى إدخال اسمك ورقم الواتساب!'); return; }
            if (!file) { alert('يرجى إرفاق صورة سند الدفع أو التحويل!'); return; }

            msg.style.color = 'blue'; msg.textContent = 'جاري رفع الطلب ومعالجته... ⏳';

            let receiptUrl = '';
            try {
                const fileExt = file.name.split('.').pop();
                const fileName = `order_${Date.now()}.${fileExt}`;
                const { error: uploadErr } = await db.storage.from('platform-files').upload(fileName, file);
                if (uploadErr) { msg.style.color = 'red'; msg.textContent = 'فشل رفع صورة السند.'; return; }
                const { data: publicUrlData } = db.storage.from('platform-files').getPublicUrl(fileName);
                receiptUrl = publicUrlData.publicUrl;
            } catch(e) {
                msg.style.color = 'red'; msg.textContent = 'خطأ أثناء رفع السند.'; return;
            }

            let activeRefCode = localStorage.getItem('sadara_affiliate_ref') || new URLSearchParams(window.location.search).get('ref') || 'مباشر';
            let fullNotes = `المحافظة: ${city || 'غير محدد'} | مصدر الدلالة: ${refSource || 'غير محدد'} | ملاحظات: ${notes || 'لا يوجد'}`;

            let { error } = await db.from('service_orders').insert([{
                service_name: currentSelectedProduct.title,
                client_name: name,
                client_phone: phone,
                payment_method: payMethod,
                transaction_ref: receiptUrl,
                notes: fullNotes,
                affiliate_id: activeRefCode
            }]);

            if (error) {
                msg.style.color = 'red'; msg.textContent = 'خطأ في حفظ الطلب: ' + error.message;
            } else {
                msg.style.color = 'green'; msg.textContent = 'تم إرسال طلبك بنجاح! سيتم التواصل معك عبر الواتساب لتأكيد الخدمة. ✅';
                setTimeout(() => { closeProductModal(); }, 2000);
            }
        }

        document.addEventListener('DOMContentLoaded', initStore);
    </script>
</body>
</html>
