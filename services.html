<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <!-- شفرة أدسنس -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6392257665418096" crossorigin="anonymous"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر الخدمات والمنتجات | منصة صدارة</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { 
            --bg-main: #eef2f7;
            --neu-surface: #eef2f7;
            --c-darkest: #001D39;
            --c-mid: #49769F;
            --gold: #d4af37; 
            --green: #25d366; 
            --emerald-btn: #10B981;
            --spec-bg: #F0F7FF;
            --spec-border: #0284C7;
            --spec-text: #1E3A8A;
            --text-main: #0b132b;
            --neu-shadow: 9px 9px 18px #cbced1, -9px -9px 18px #ffffff;
            --neu-shadow-inset: inset 5px 5px 10px #cbced1, inset -5px -5px 10px #ffffff;
            --neu-card-hover: 12px 12px 24px #cbced1, -12px -12px 24px #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background: var(--bg-main); padding-bottom: 100px; color: var(--text-main); }

        .top-navbar { background: var(--neu-surface); padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--gold); position: sticky; top: 0; z-index: 1000; box-shadow: 0 8px 20px rgba(0,29,57,0.08); }
        .mini-btn { background: var(--neu-surface); color: var(--c-darkest); border: 1px solid rgba(212,175,55,0.4); padding: 10px 18px; border-radius: 16px; font-weight: 800; font-size: 12px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; transition: 0.3s; box-shadow: var(--neu-shadow); }
        .mini-btn:hover { box-shadow: var(--neu-shadow-inset); color: var(--gold); }

        .container { max-width: 1200px; margin: 25px auto; padding: 0 15px; }
        .store-header { background: var(--neu-surface); padding: 30px; border-radius: 24px; text-align: center; margin-bottom: 30px; box-shadow: var(--neu-shadow); border: 1px solid rgba(255,255,255,0.8); }
        .store-header h1 { color: var(--c-darkest); font-size: 24px; font-weight: 900; margin-bottom: 8px; }
        .store-header p { color: var(--c-mid); font-size: 13px; font-weight: 700; }

        .categories-tags { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-bottom: 30px; }
        .cat-tag { background: var(--neu-surface); color: var(--c-darkest); border: none; padding: 10px 20px; border-radius: 20px; font-size: 12px; font-weight: 800; cursor: pointer; transition: 0.3s; box-shadow: var(--neu-shadow); }
        .cat-tag.active, .cat-tag:hover { box-shadow: var(--neu-shadow-inset); color: var(--gold); transform: translateY(-2px); }

        .products-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 25px; }
        @media (max-width: 992px) { .products-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 576px) { .products-grid { grid-template-columns: repeat(1, 1fr); } }

        .product-card { background: var(--neu-surface); border-radius: 24px; border: 1px solid rgba(255,255,255,0.9); padding: 18px; box-shadow: var(--neu-shadow); display: flex; flex-direction: column; justify-content: space-between; gap: 14px; transition: 0.4s; }
        .product-card:hover { box-shadow: var(--neu-card-hover); transform: translateY(-5px); }

        .product-img-container { width: 100%; height: 220px; background: var(--neu-surface); border-radius: 16px; display: flex; justify-content: center; align-items: center; overflow: hidden; box-shadow: var(--neu-shadow-inset); padding: 8px; cursor: pointer; }
        .product-img { width: 100%; height: 100%; object-fit: contain; border-radius: 12px; }

        .product-title { font-size: 14px; font-weight: 900; color: var(--text-main); height: 40px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        .product-price { font-size: 14px; font-weight: 900; color: var(--emerald-btn); }
        
        /* صندوق المواصفات والمميزات بلون مخصص */
        .product-desc { font-size: 11px; color: var(--spec-text); background: var(--spec-bg); padding: 10px; border-radius: 10px; border-right: 3px solid var(--spec-border); box-shadow: var(--neu-shadow-inset); font-weight: 700; line-height: 1.5; height: 65px; overflow: hidden; }

        .order-btn { background: var(--emerald-btn); color: white; text-align: center; padding: 12px; border-radius: 14px; font-weight: 900; font-size: 12px; cursor: pointer; border: none; width: 100%; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: 0.3s; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); }
        .order-btn:hover { background: #059669; transform: translateY(-2px); }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,29,57,0.85); backdrop-filter: blur(8px); z-index: 99999; justify-content: center; align-items: center; padding: 15px; }
        .modal-card { background: var(--neu-surface); padding: 25px; border-radius: 26px; width: 100%; max-width: 500px; box-shadow: var(--neu-shadow); border-top: 6px solid var(--gold); max-height: 90vh; overflow-y: auto; }
        .modal-card h3 { color: var(--c-darkest); font-size: 18px; font-weight: 900; margin-bottom: 12px; }
        
        .modal-spec-box { font-size: 12px; color: var(--spec-text); background: var(--spec-bg); padding: 14px; border-radius: 12px; border-right: 4px solid var(--spec-border); box-shadow: var(--neu-shadow-inset); font-weight: 700; line-height: 1.7; margin-bottom: 15px; }
        
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 12px; font-weight: 900; color: var(--c-darkest); margin-bottom: 5px; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 12px; border: none; border-radius: 12px; font-size: 13px; font-weight: 700; outline: none; background: var(--neu-surface); box-shadow: var(--neu-shadow-inset); }
    </style>
</head>
<body>

    <div class="top-navbar">
        <a href="index.html" class="mini-btn"><i class="fa-solid fa-house"></i> الرئيسية</a>
        <span style="font-weight: 900; font-size: 16px; color: var(--c-darkest);">متجر <span style="color:var(--gold);">صدارة</span> الرقمي</span>
        <a href="affiliate.html" class="mini-btn"><i class="fa-solid fa-handshake-angle"></i> المسوقون</a>
    </div>

    <div class="container">
        <div class="store-header">
            <h1>🛒 متجر الخدمات والاشتراكات الرقمية</h1>
            <p>اختر الخدمة أو المنتج الرقمي المطلوب وقم بالطلب والسداد المباشر فوراً مع تفعيل رابط الإحالة الخاصة بك</p>
        </div>

        <div class="categories-tags" id="categoriesContainer">
            <span class="cat-tag active" onclick="filterStore('الكل', this)">الكل 🌐</span>
            <span class="cat-tag" onclick="filterStore('اشتراكات رقمية', this)">🔑 اشتراكات رقمية</span>
            <span class="cat-tag" onclick="filterStore('خدمات', this)">🛠️ خدمات</span>
            <span class="cat-tag" onclick="filterStore('تجميل وعناية', this)">💄 تجميل وعناية</span>
        </div>

        <div id="productsGridContainer" class="products-grid">
            جاري تحميل المنتجات...
        </div>
    </div>

    <div class="modal-overlay" id="orderModal">
        <div class="modal-card">
            <h3><i class="fa-solid fa-cart-shopping" style="color:var(--gold);"></i> طلب المنتج أو الخدمة الرقمية</h3>
            <div id="modalProductDetails" class="modal-spec-box">تفاصيل المنتج...</div>
            
            <div class="form-group">
                <label>اسمك الكامل</label>
                <input type="text" id="orderName" placeholder="أدخل اسمك الكريم">
            </div>
            <div class="form-group">
                <label>رقم الواتساب للتواصل وتفعيل الخدمة</label>
                <input type="tel" id="orderPhone" placeholder="770000000">
            </div>
            <div class="form-group">
                <label>وسيلة الدفع / التحويل</label>
                <select id="orderPaymentMethod">
                    <option value="محفظة جيب (780568507)">محفظة جيب (780568507)</option>
                    <option value="بنك الكريمي (2628009)">بنك الكريمي (2628009)</option>
                </select>
            </div>
            <div class="form-group">
                <label>رابط أو صورة سند التحويل (رابط الصورة)</label>
                <input type="text" id="orderReceipt" placeholder="رابط صورة سند التحويل أو إيصال الدفع">
            </div>
            <div class="form-group">
                <label>ملاحظات إضافية (اختياري)</label>
                <textarea id="orderNotes" rows="2" placeholder="أي تفاصيل أخرى تود إضافتها"></textarea>
            </div>

            <button onclick="submitOrder()" class="order-btn" style="background:var(--emerald-btn); margin-top:5px;">تأكيد وإرسال الطلب عبر الواتساب 📱</button>
            <button onclick="document.getElementById('orderModal').style.display='none'" style="width:100%; background:var(--neu-surface); color:var(--c-darkest); border:none; padding:12px; border-radius:12px; margin-top:10px; font-weight:900; cursor:pointer; box-shadow:var(--neu-shadow);">إغلاق</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://lvutrzswngpkjfamgact.supabase.co";
        const SUPABASE_KEY = "sb_publishable_fB8RmZyfymR8YpjLInA2LQ_hMA6qgRG";
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let allProducts = [];
        let selectedProductObj = null;

        async function loadStoreProducts() {
            try {
                let { data, error } = await db.from('platform_services').select('*').eq('is_active', true).order('id', {ascending: false});
                allProducts = data || [];
                renderStoreProducts(allProducts);

                // التحقق من وجود منتج محدد بالرابط ومعرف الإحالة
                const urlParams = new URLSearchParams(window.location.search);
                const prodId = urlParams.get('product_id');
                const refCode = urlParams.get('ref');
                if(refCode) localStorage.setItem('sadara_ref', refCode);

                if(prodId && allProducts.length > 0) {
                    let matched = allProducts.find(p => p.id == prodId);
                    if(matched) openOrderModal(matched);
                }
            } catch(e) {
                document.getElementById('productsGridContainer').innerHTML = '<p style="text-align:center; color:var(--c-mid);">عذراً، حدث خطأ في تحميل المنتجات.</p>';
            }
        }

        function filterStore(category, el) {
            document.querySelectorAll('.cat-tag').forEach(t => t.classList.remove('active'));
            if(el) el.classList.add('active');

            if(category === 'الكل') {
                renderStoreProducts(allProducts);
            } else {
                let filtered = allProducts.filter(p => p.category === category);
                renderStoreProducts(filtered);
            }
        }

        function renderStoreProducts(list) {
            let container = document.getElementById('productsGridContainer');
            container.innerHTML = '';

            if(!list || list.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:var(--c-mid); grid-column:1/-1; padding:30px;">لا توجد منتجات متاحة في هذا القسم حالياً.</p>';
                return;
            }

            list.forEach(p => {
                let imgTag = (p.image && p.image.trim() !== '') ? `<img src="${p.image}" class="product-img">` : '<i class="fa-solid fa-store" style="font-size:32px; color:var(--c-mid);"></i>';
                let descText = p.description || 'منتج رقمي معتمد ومضمون من منصة صدارة.';

                container.innerHTML += `
                    <div class="product-card">
                        <div class="product-img-container" onclick='openOrderModal(${JSON.stringify(p)})'>${imgTag}</div>
                        <div>
                            <div class="product-title" onclick='openOrderModal(${JSON.stringify(p)})' style="cursor:pointer;">${p.title}</div>
                            <div class="product-price" style="margin:6px 0;">السعر: ${p.price}</div>
                            <div class="product-desc">${descText}</div>
                        </div>
                        <button class="order-btn" onclick='openOrderModal(${JSON.stringify(p)})'><i class="fa-solid fa-cart-shopping"></i> طلب المنتج 🚀</button>
                    </div>
                `;
            });
        }

        function openOrderModal(product) {
            selectedProductObj = product;
            document.getElementById('modalProductDetails').innerHTML = `
                <b>📦 المنتج:</b> ${product.title}<br>
                <b>💵 السعر المطلوب:</b> ${product.price}<br>
                <b>📝 التفاصيل:</b> ${product.description || 'لا توجد تفاصيل إضافية'}
            `;
            document.getElementById('orderModal').style.display = 'flex';
        }

        async function submitOrder() {
            let name = document.getElementById('orderName').value.trim();
            let phone = document.getElementById('orderPhone').value.trim();
            let payment = document.getElementById('orderPaymentMethod').value;
            let receipt = document.getElementById('orderReceipt').value.trim();
            let notes = document.getElementById('orderNotes').value.trim();
            let refCode = localStorage.getItem('sadara_ref') || 'مباشر';

            if(!name || !phone) {
                alert('يرجى إدخال الاسم ورقم الواتساب على الأقل.');
                return;
            }

            try {
                await db.from('orders').insert([{
                    product_id: selectedProductObj.id,
                    product_title: selectedProductObj.title,
                    customer_name: name,
                    customer_phone: phone,
                    payment_method: payment,
                    receipt_url: receipt,
                    notes: notes,
                    ref_code: refCode,
                    status: 'جديد'
                }]);
            } catch(e) {}

            let waMessage = `مرحباً، أريد طلب المنتج الرقمي التالي:\n\n📦 المنتج: ${selectedProductObj.title}\n💵 السعر: ${selectedProductObj.price}\n👤 الاسم: ${name}\n📱 الهاتف: ${phone}\n💳 الدفع: ${payment}\n📄 سند التحويل: ${receipt || 'لم يُرفق'}\n🔗 الإحالة: ${refCode}\n\nملاحظات: ${notes}`;
            let encoded = encodeURIComponent(waMessage);
            window.open(`https://wa.me/967780568507?text=${encoded}`, '_blank');
            document.getElementById('orderModal').style.display = 'none';
        }

        window.addEventListener('DOMContentLoaded', loadStoreProducts);
    </script>
</body>
</html>
