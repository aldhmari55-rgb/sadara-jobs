<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الدورات التدريبية وكورساتي | منصة صدارة</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --navy: #0F172A; --royal: #2563EB; --emerald: #0D9488; --green: #10B981;
            --gold: #F59E0B; --bg: #F8FAFC; --surface: #FFFFFF; --border: #E2E8F0;
            --text: #1E293B; --muted: #64748B;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background: var(--bg); color: var(--text); padding-bottom: 50px; }
        .topbar {
            background: var(--navy); color: #fff; padding: 14px 18px;
            display: flex; justify-content: space-between; align-items: center; gap: 10px;
            position: sticky; top: 0; z-index: 100; border-bottom: 3px solid var(--emerald);
        }
        .brand { font-size: 17px; font-weight: 900; color: #fff; text-decoration: none; display: flex; align-items: center; gap: 8px; }
        .drawer-backdrop { display: none; position: fixed; inset: 0; background: rgba(15,23,42,0.5); z-index: 1100; }
        .side-drawer {
            position: fixed; top: 0; right: -300px; width: 280px; height: 100%;
            background: #fff; z-index: 1200; padding: 18px; transition: 0.25s ease;
            box-shadow: -8px 0 28px rgba(15,23,42,0.15);
        }
        .side-drawer.open { right: 0; }
        .drawer-link {
            display: flex; align-items: center; gap: 10px; padding: 11px 12px;
            color: var(--text); text-decoration: none; border-radius: 10px; font-weight: 700; font-size: 13.5px; margin-bottom: 6px;
        }
        .drawer-link:hover { background: #F1F5F9; color: var(--emerald); }
        .container { max-width: 1100px; margin: 22px auto; padding: 0 14px; }
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 20px; margin-bottom: 20px; box-shadow: 0 6px 20px rgba(15,23,42,0.04); }
        .phone-login-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
        .courses-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 16px; margin-top: 14px; }
        .course-card { background: #fff; border: 1px solid var(--border); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; }
        .course-body { padding: 15px; }
        .badge-owned { display: inline-block; background: #ECFDF5; color: #059669; padding: 4px 10px; border-radius: 99px; font-size: 11.5px; font-weight: 700; }
        .btn-enter { width: 100%; background: var(--royal); color: #fff; border: none; padding: 10px; border-radius: 10px; font-weight: 700; font-size: 13px; cursor: pointer; margin-top: 10px; }
        .modal-bg { display: none; position: fixed; inset: 0; background: rgba(15,23,42,0.65); z-index: 2000; align-items: center; justify-content: center; padding: 14px; }
        .modal-box { background: #fff; width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto; border-radius: 20px; padding: 20px; }
        .field { margin-bottom: 11px; }
        .field label { display: block; font-size: 12.5px; font-weight: 700; margin-bottom: 4px; }
        .field input { width: 100%; padding: 10px 12px; border: 1px solid #CBD5E1; border-radius: 10px; font-size: 13px; }
    </style>
</head>
<body>
    <div class="drawer-backdrop" id="drawerBackdrop" onclick="toggleDrawer(false)"></div>
    <aside class="side-drawer" id="sideDrawer">
        <div style="display:flex; justify-content:space-between; align-items:center; padding-bottom:12px; margin-bottom:12px; border-bottom:1px solid var(--border);">
            <strong style="color:var(--navy);">أقسام منصة صدارة</strong>
            <button type="button" onclick="toggleDrawer(false)" style="border:none; background:#F1F5F9; padding:4px 9px; border-radius:8px; cursor:pointer;">✕</button>
        </div>
        <a href="index.html" class="drawer-link"><i class="fa-solid fa-store"></i> المتجر والمنتجات (الرئيسية)</a>
        <a href="courses.html" class="drawer-link"><i class="fa-solid fa-graduation-cap"></i> الدورات التدريبية</a>
        <a href="affiliate.html" class="drawer-link"><i class="fa-solid fa-handshake"></i> بوابة المسوّقين بالعمولة</a>
        <a href="jobs.html" class="drawer-link"><i class="fa-solid fa-briefcase"></i> الوظائف والكفاءات</a>
        <a href="blog.html" class="drawer-link"><i class="fa-solid fa-newspaper"></i> المدونة والمقالات</a>
    </aside>

    <header class="topbar">
        <div style="display:flex; align-items:center; gap:10px;">
            <button type="button" onclick="toggleDrawer(true)" style="background:rgba(255,255,255,0.12); color:#fff; border:none; padding:8px 11px; border-radius:10px; cursor:pointer;">
                <i class="fa-solid fa-bars"></i>
            </button>
            <a href="courses.html" class="brand"><i class="fa-solid fa-graduation-cap" style="color:#5EEAD4;"></i> صدارة — الدورات وكورساتي</a>
        </div>
        <button type="button" data-sadara-auth-btn class="sa-pill-btn" onclick="SadaraAuth.openModal('login', loadMyCourses)">🔐 دخول / حساب جديد</button>
    </header>

    <main class="container">
        <section class="card">
            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
                <div>
                    <h1 style="font-size:19px; color:var(--navy); font-weight:900;">قسم «كورساتي» الدائم</h1>
                    <p id="myCoursesStatus" style="font-size:13px; color:var(--muted); margin-top:4px;">سجّل الدخول بالاسم أو الجوال + الرمز الرباعي لعرض دوراتك المفتوحة</p>
                </div>
            </div>
            <div class="phone-login-row">
                <button type="button" onclick="SadaraAuth.openModal('login', loadMyCourses)" style="background:var(--navy); color:#fff; border:none; padding:9px 18px; border-radius:11px; font-weight:700; cursor:pointer;">دخول حسابي 🔓</button>
                <button type="button" onclick="SadaraAuth.openModal('register', loadMyCourses)" style="background:var(--emerald); color:#fff; border:none; padding:9px 18px; border-radius:11px; font-weight:700; cursor:pointer;">إنشاء حساب جديد 🚀</button>
                <button type="button" onclick="SadaraAuth.logout(); location.reload();" style="background:#fff; color:#E11D48; border:1px solid var(--border); padding:9px 14px; border-radius:11px; font-weight:700; cursor:pointer;">خروج</button>
            </div>
            <div class="courses-grid" id="myCoursesGrid"></div>
        </section>

        <section class="card">
            <h2 style="font-size:18px; color:var(--navy); font-weight:900;">جميع الدورات التدريبية المتاحة</h2>
            <div class="courses-grid" id="allCoursesGrid">جاري تحميل الدورات...</div>
        </section>
    </main>

    <div class="modal-bg" id="courseModal" onclick="if(event.target.id==='courseModal') this.style.display='none'">
        <div class="modal-box" id="courseModalContent"></div>
    </div>

    <script src="sadara-auth.js"></script>
    <script>
        const SUPABASE_URL = "https://lvutrzswngpkjfamgact.supabase.co";
        const SUPABASE_KEY = "sb_publishable_fB8RmZyfymR8YpjLInA2LQ_hMA6qgRG";
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let allCourses = [];
        let approvedCourseIds = new Set();

        function toggleDrawer(open) {
            document.getElementById("sideDrawer").classList.toggle("open", open);
            document.getElementById("drawerBackdrop").style.display = open ? "block" : "none";
        }

        async function initCoursesPage() {
            const { data: courses } = await db.from("courses").select("*").order("id", { ascending: false });
            allCourses = (courses || []).filter(c => c.is_active !== false);
            await loadMyCourses();
        }

        async function loadMyCourses() {
            const user = window.SadaraAuth ? window.SadaraAuth.getUser() : null;
            const myGrid = document.getElementById("myCoursesGrid");
            const statusEl = document.getElementById("myCoursesStatus");

            if (!user || !user.phone) {
                approvedCourseIds = new Set();
                statusEl.textContent = "سجّل الدخول بالاسم أو الجوال + الرمز الرباعي لعرض دوراتك";
                myGrid.innerHTML = "";
                renderAllCourses();
                return;
            }

            const { data: enrollments } = await db.from("course_enrollments").select("*").eq("student_phone", user.phone);
            approvedCourseIds = new Set();
            (enrollments || []).forEach(e => {
                if (e.status === "approved") approvedCourseIds.add(String(e.course_id));
            });

            const ownedList = allCourses.filter(c => approvedCourseIds.has(String(c.id)));
            if (!ownedList.length) {
                statusEl.textContent = `حساب ${user.full_name} (${user.phone}): لا توجد دورات معتمدة بعد`;
                myGrid.innerHTML = '<div style="font-size:13px; color:var(--muted);">بمجرد اعتماد اشتراكك ستظهر الدورة هنا وتبقى مفتوحة لحسابك دائماً.</div>';
            } else {
                statusEl.textContent = `تم فتح ${ownedList.length} دورة لحساب ${user.full_name} ✅`;
                myGrid.innerHTML = "";
                ownedList.forEach(c => {
                    const card = document.createElement("div");
                    card.className = "course-card";
                    card.innerHTML = `
                        <div class="course-body">
                            <span class="badge-owned">مفتوحة لحسابك</span>
                            <h3 style="font-size:15.5px; color:var(--navy); margin:8px 0 4px;">${c.title}</h3>
                            <div style="font-size:12px; color:var(--muted);">المدرب: ${c.instructor || "صدارة"}</div>
                            <button type="button" class="btn-enter" style="background:var(--emerald);">متابعة الدروس ▶</button>
                        </div>
                    `;
                    card.querySelector(".btn-enter").onclick = () => openCourseModal(c);
                    myGrid.appendChild(card);
                });
            }
            renderAllCourses();
        }

        function renderAllCourses() {
            const grid = document.getElementById("allCoursesGrid");
            if (!allCourses.length) {
                grid.innerHTML = "<p>لا توجد دورات متاحة حالياً.</p>";
                return;
            }
            grid.innerHTML = "";
            allCourses.forEach(c => {
                const owned = approvedCourseIds.has(String(c.id));
                const card = document.createElement("div");
                card.className = "course-card";
                card.innerHTML = `
                    <div class="course-body">
                        <span class="badge-owned" style="background:${owned ? "#ECFDF5" : "#EFF6FF"}; color:${owned ? "#059669" : "#2563EB"};">
                            ${owned ? "مفتوحة لك ✅" : (c.price ? c.price + " YER" : "مجانية / اشتراك")}
                        </span>
                        <h3 style="font-size:16px; color:var(--navy); margin:8px 0 6px;">${c.title}</h3>
                        <p style="font-size:13px; color:var(--muted);">${c.description || ""}</p>
                        <button type="button" class="btn-enter">${owned ? "دخول الدورة ▶" : "اشتراك / فتح الدورة"}</button>
                    </div>
                `;
                card.querySelector(".btn-enter").onclick = () => openCourseModal(c);
                grid.appendChild(card);
            });
        }

        function openCourseModal(course) {
            const owned = approvedCourseIds.has(String(course.id));
            const box = document.getElementById("courseModalContent");
            const lessons = Array.isArray(course.lessons) ? course.lessons : [];

            if (owned) {
                box.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                        <h3 style="font-size:17px; color:var(--navy);">${course.title}</h3>
                        <button type="button" onclick="document.getElementById('courseModal').style.display='none'" style="border:none; background:#F1F5F9; padding:5px 10px; border-radius:8px; cursor:pointer;">✕</button>
                    </div>
                    <p style="font-size:13px; color:var(--muted); margin-bottom:14px;">${course.description || ""}</p>
                    ${lessons.length ? lessons.map((l, idx) => `
                        <div style="border:1px solid var(--border); border-radius:12px; padding:12px; margin-bottom:10px; background:#F8FAFC;">
                            <b>${idx + 1}.${l.title || "درس"}</b>
                            ${l.video_url ? `<div style="margin-top:8px;"><a href="${l.video_url}" target="_blank" style="color:var(--royal); font-weight:700; font-size:13px;">مشاهدة الدرس ↗</a></div>` : ""}
                            ${l.pdf_url ? `<div style="margin-top:6px;"><a href="${l.pdf_url}" target="_blank" style="color:var(--emerald); font-weight:700; font-size:13px;">تحميل ملف PDF ↗</a></div>` : ""}
                        </div>
                    `).join("") : "<p style='font-size:13px;'>الدورة مفعلة لحسابك وسيتم عرض الدروس المضافة فيها.</p>"}
                `;
            } else {
                const user = window.SadaraAuth ? window.SadaraAuth.getUser() : null;
                box.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                        <h3 style="font-size:17px; color:var(--navy);">طلب اشتراك في: ${course.title}</h3>
                        <button type="button" onclick="document.getElementById('courseModal').style.display='none'" style="border:none; background:#F1F5F9; padding:5px 10px; border-radius:8px; cursor:pointer;">✕</button>
                    </div>
                    <div class="field"><label>الاسم الكامل</label><input type="text" id="enrollName" value="${user ? user.full_name : ""}" placeholder="اسمك الكامل"></div>
                    <div class="field"><label>رقم الجوال / الواتساب</label><input type="tel" id="enrollPhone" value="${user ? user.phone : ""}" placeholder="780568507"></div>
                    <button type="button" class="btn-enter" style="background:var(--emerald);" onclick="submitCourseEnrollment(${course.id}, '${course.title.replace(/'/g, "\\'")}')">إرسال طلب الاشتراك ✅</button>
                    <div id="enrollMsg" style="margin-top:10px; font-size:12.5px; font-weight:700;"></div>
                `;
            }
            document.getElementById("courseModal").style.display = "flex";
        }

        async function submitCourseEnrollment(courseId, courseTitle) {
            const name = document.getElementById("enrollName").value.trim();
            const phone = window.SadaraAuth ? window.SadaraAuth.normalizePhone(document.getElementById("enrollPhone").value) : document.getElementById("enrollPhone").value.trim();
            const msg = document.getElementById("enrollMsg");
            if (!name || phone.length < 7) {
                msg.style.color = "#DC2626";
                msg.textContent = "يرجى إدخال الاسم ورقم الجوال الصحيح.";
                return;
            }
            const refCode = new URLSearchParams(window.location.search).get("ref") || "";
            const { error } = await db.from("course_enrollments").insert([{
                course_id: courseId,
                course_title: courseTitle,
                student_name: name,
                student_phone: phone,
                ref_code: refCode,
                status: "pending"
            }]);
            if (error) {
                msg.style.color = "#DC2626";
                msg.textContent = "تعذر إرسال الطلب، حاول مرة أخرى.";
            } else {
                msg.style.color = "#059669";
                msg.textContent = "تم إرسال طلب الاشتراك بنجاح! ستظهر الدورة تلقائياً في «كورساتي» فور اعتمادها.";
            }
        }

        window.addEventListener("DOMContentLoaded", initCoursesPage);
        window.addEventListener("sadara:auth-changed", loadMyCourses);
    </script>
</body>
</html>
