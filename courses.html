<div class="container">
    <h2 class="section-title">الدورات التدريبية المعتمدة</h2>
    <div class="courses-grid" id="dynamicCoursesGrid">
        <!-- يتم جلب الدورات وتعبئتها تلقائياً هنا من السحابة -->
    </div>
</div>

<script>
    const SUPABASE_URL = "https://lvutrzswngpkjfamgact.supabase.co";
    const SUPABASE_KEY = "sb_publishable_fB8RmZyfymR8YpjLInA2LQ_hMA6qgRG";
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function loadDynamicCourses() {
        let { data: courses, error } = await db.from('platform_courses').select('*').order('id', {ascending: false});
        let grid = document.getElementById('dynamicCoursesGrid');
        grid.innerHTML = '';

        if(!courses || courses.length === 0) {
            grid.innerHTML = '<p style="color:#64748b;">جاري إعداد دورات جديدة قريباً...</p>';
            return;
        }

        courses.forEach(c => {
            grid.innerHTML += `
                <div class="course-card" style="background:#fff; border-radius:12px; padding:20px; border:1px solid #cbd5e1; box-shadow:0 4px 6px rgba(0,0,0,0.05);">
                    <h3 style="color:#0f2347; font-size:1.2rem; margin-bottom:10px;">${c.title}</h3>
                    <p style="color:#64748b; font-size:0.95rem; margin-bottom:15px; line-height:1.5;">${c.description || 'دورة تدريبية متكاملة مع شهادة إتمام معتمدة.'}</p>
                    <div style="display:flex; justify-content:space-between; align-items:center; border-top:1px solid #f1f5f9; padding-top:15px;">
                        <span style="color:#059669; font-weight:bold;">⏱️ المدة: ${c.duration_minutes} دقائق</span>
                        <a href="watch.html?id=${c.id}" style="background:#2563eb; color:white; padding:8px 16px; border-radius:8px; text-decoration:none; font-weight:bold;">ابدأ الدورة الآن 🎬</a>
                    </div>
                </div>
            `;
        });
    }

    document.addEventListener('DOMContentLoaded', loadDynamicCourses);
</script>
