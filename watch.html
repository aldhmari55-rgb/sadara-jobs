<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشاهدة الدورة | منصة صدارة</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #0f2347; --gold: #d4af37; --bg: #f8fafc; --green: #059669; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background: var(--bg); padding: 15px; color: #0f172a; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
        h1 { color: var(--primary); font-size: 20px; margin-bottom: 5px; }
        .desc { color: #64748b; font-size: 13px; margin-bottom: 15px; }
        .secure-video-container { position: relative; width: 100%; padding-bottom: 56.25%; background: #000; border-radius: 12px; overflow: hidden; box-shadow: 0 8px 20px rgba(15, 35, 71, 0.15); margin-bottom: 20px; }
        #youtubePlayer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        .lessons-title { font-size: 15px; font-weight: bold; margin-bottom: 10px; color: var(--primary); border-bottom: 2px solid #f1f5f9; padding-bottom: 5px; display: flex; justify-content: space-between; align-items: center; }
        .lesson-item { padding: 12px; background: #f1f5f9; margin-bottom: 8px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: bold; transition: 0.2s; display: flex; justify-content: space-between; align-items: center; border-right: 4px solid transparent; }
        .lesson-item:hover { background: #e2e8f0; }
        .lesson-item.active { background: var(--primary); color: white; border-right-color: var(--gold); }
        .lesson-item.completed-lesson { border-right-color: var(--green); }
        .cert-box { margin-top: 25px; background: #dcfce7; border: 2px dashed #059669; padding: 20px; border-radius: 12px; text-align: center; display: none; }
        .cert-btn { background: var(--green); color: white; border: none; padding: 12px 25px; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; text-decoration: none; display: inline-block; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="container" id="courseContainer">
        <p style="text-align:center; padding:20px;">جاري تحميل تفاصيل الدورة والدروس... ⏳</p>
    </div>

<script>
    const SUPABASE_URL = "https://lvutrzswngpkjfamgact.supabase.co";
    const SUPABASE_KEY = "sb_publishable_fB8RmZyfymR8YpjLInA2LQ_hMA6qgRG";
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let player;
    let lessonsList = [];
    let currentIdx = 0;
    let courseId = "";
    let watchedLessons = new Set();
    let currentCourseName = "";
    let checkInterval;

    let currentUserId = localStorage.getItem('sadara_user_id');
    if (!currentUserId) {
        currentUserId = "user_" + Math.random().toString(36).substring(2, 11);
        localStorage.setItem('sadara_user_id', currentUserId);
    }

    function getYouTubeId(url) {
        if (!url) return '';
        let videoId = '';
        if (url.includes('embed/')) { videoId = url.split('embed/')[1].split('?')[0]; }
        else if (url.includes('youtu.be/')) { videoId = url.split('youtu.be/')[1].split('?')[0]; }
        else if (url.includes('watch?v=')) { videoId = url.split('watch?v=')[1].split('&')[0]; }
        return videoId || url;
    }

    async function loadCourseData() {
        const urlParams = new URLSearchParams(window.location.search);
        courseId = urlParams.get('id');
        const container = document.getElementById('courseContainer');

        if (!courseId) {
            container.innerHTML = '<p style="color:red; text-align:center;">رقم الدورة غير موجود في الرابط.</p>';
            return;
        }

        let { data: course, error } = await db.from('platform_courses').select('*').eq('id', courseId).single();

        if (error || !course || course.is_active === false) {
            container.innerHTML = '<p style="color:red; text-align:center;">عذراً، هذه الدورة غير متاحة حالياً.</p>';
            return;
        }

        currentCourseName = course.title;
        lessonsList = course.lessons || [];

        if (lessonsList.length === 0) {
            container.innerHTML = '<p style="color:red; text-align:center;">لا توجد دروس مضافة لهذه الدورة.</p>';
            return;
        }

        let html = `
            <h1>🎓 ${course.title}</h1>
            <p class="desc">${course.description || 'لا يوجد وصف متاح.'}</p>
            
            <div class="secure-video-container">
                <div id="youtubePlayer"></div>
            </div>

            <div class="lessons-title">
                <span>📚 قائمة دروس الدورة (${lessonsList.length} دروس)</span>
                <span id="progressText" style="font-size:12px; color:#059669;">تم إنجاز: 0 / ${lessonsList.length}</span>
            </div>
            <div id="lessonsContainerList">
        `;

        lessonsList.forEach((l, idx) => {
            let activeClass = idx === 0 ? 'active' : '';
            html += `
                <div class="lesson-item ${activeClass}" id="lesson-row-${idx}" onclick="switchLesson(${idx})">
                    <span>🔹 الدرس ${idx + 1}: ${l.lesson_title}</span>
                    <span id="badge-${idx}" style="font-size: 11px; opacity: 0.9;">قيد المشاهدة ⏳</span>
                </div>
            `;
        });

        html += `</div>
            <div class="cert-box" id="certificateBox">
                <h3 style="color:#065f46; font-size:16px;">🎉 مبروك! لقد أكملت كافة الدروس بنجاح</h3>
                <button onclick="generateAndOpenCert()" class="cert-btn">عرض واستلام الشهادة الرسمية 🎓</button>
            </div>
        `;
        container.innerHTML = html;

        // جلب التقدم المحفوظ مسبقاً من قاعدة البيانات
        await fetchUserProgressFromDB();

        let tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        let firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
    }

    // دالة جلب التقدم المحدثة والمصححة
    async function fetchUserProgressFromDB() {
        try {
            console.log("جاري جلب التقدم للمستخدم:", currentUserId, "والكورس:", courseId);
            let { data, error } = await db.from('user_progress')
                .select('lesson_id')
                .eq('user_id', currentUserId)
                .eq('course_id', courseId)
                .eq('is_completed', true);

            if (error) {
                console.error("خطأ من سوبايس عند جلب التقدم:", error);
            } else if (data) {
                console.log("الدروس المنجزة المسترجعة:", data);
                data.forEach(item => {
                    let idx = parseInt(item.lesson_id);
                    if (!isNaN(idx)) {
                        markLessonAsWatchedUIOnly(idx);
                    }
                });
            }
        } catch (err) {
            console.error("خطأ استثنائي عند جلب التقدم:", err);
        }
    }

    window.onYouTubeIframeAPIReady = function() {
        player = new YT.Player('youtubePlayer', {
            height: '100%',
            width: '100%',
            videoId: getYouTubeId(lessonsList[0].video_url),
            playerVars: { 'autoplay': 0, 'controls': 1, 'rel': 0, 'modestbranding': 1, 'disablekb': 1 },
            events: { 'onStateChange': onPlayerStateChange }
        });
    };

    function switchLesson(idx) {
        currentIdx = idx;
        let vId = getYouTubeId(lessonsList[idx].video_url);
        if (player && player.loadVideoById) {
            player.loadVideoById(vId);
        }
        document.querySelectorAll('.lesson-item').forEach((el, i) => {
            el.classList.remove('active');
            if (i === idx) el.classList.add('active');
        });
    }

    function onPlayerStateChange(event) {
        if (event.data == YT.PlayerState.PLAYING) {
            clearInterval(checkInterval);
            checkInterval = setInterval(() => {
                let currentTime = player.getCurrentTime();
                let duration = player.getDuration();
                
                if (duration > 0) {
                    let percent = (currentTime / duration) * 100;
                    if (percent >= 50) {
                        saveLessonProgressToDB(currentIdx);
                    }
                }
            }, 1000);
        } else {
            clearInterval(checkInterval);
        }
    }

    // دالة حفظ التقدم المحدثة والمصححة مع فحص الاستجابة
    async function saveLessonProgressToDB(idx) {
        if (watchedLessons.has(idx)) return;
        markLessonAsWatchedUIOnly(idx);

        try {
            console.log("جاري حفظ إنجاز الدرس رقم:", idx, "للمستخدم:", currentUserId);
            let { error } = await db.from('user_progress').upsert({
                user_id: currentUserId,
                course_id: courseId,
                lesson_id: idx.toString(),
                is_completed: true
            }, { onConflict: 'user_id,course_id,lesson_id' });

            if (error) {
                console.error("❌ فشل الحفظ في سوبايس (تحقق من سياسات RLS):", error.message);
            } else {
                console.log("✅ تم حفظ إنجاز الدرس بنجاح في السحابة!");
            }
        } catch (err) {
            console.error("خطأ استثنائي أثناء الحفظ:", err);
        }
    }

    function markLessonAsWatchedUIOnly(idx) {
        watchedLessons.add(idx);
        let badge = document.getElementById(`badge-${idx}`);
        let row = document.getElementById(`lesson-row-${idx}`);
        if (badge) {
            badge.textContent = "تم إنجاز النصف ✓";
            badge.style.color = "#059669";
        }
        if (row) {
            row.classList.add('completed-lesson');
        }
        document.getElementById('progressText').textContent = `تم إنجاز: ${watchedLessons.size} / ${lessonsList.length}`;
        
        if (watchedLessons.size >= lessonsList.length) {
            document.getElementById('certificateBox').style.display = 'block';
        }
    }

    async function generateAndOpenCert() {
        let studentName = prompt("أدخل اسمك الكامل ليظهر على الشهادة المعتمدة:");
        if (!studentName || !studentName.trim()) {
            alert("يرجى كتابة الاسم لإصدار الشهادة.");
            return;
        }

        let certCode = "SDR-" + Math.floor(100000 + Math.random() * 900000);

        let { error } = await db.from('course_certificates').insert([{
            student_name: studentName.trim(),
            course_name: currentCourseName,
            grade: "مكتمل بنجاح",
            attendance_hours: "ساعات معتمدة",
            verification_code: certCode
        }]);

        if (error) {
            alert("حدث خطأ أثناء إصدار الشهادة: " + error.message);
            return;
        }

        window.location.href = `certificate.html?code=${certCode}`;
    }

    document.addEventListener('DOMContentLoaded', loadCourseData);
</script>
</body>
</html>
