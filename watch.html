<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>غرفة التدريب التفاعلية | صدارة</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background: #0f172a; color: white; padding: 20px; direction: rtl; text-align: right; }
        .container { max-width: 900px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #334155; padding-bottom: 15px; }
        .back-btn { background: #334155; color: white; padding: 8px 16px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 13px; }
        .video-box { background: #1e293b; border-radius: 12px; overflow: hidden; margin-bottom: 20px; border: 1px solid #475569; position: relative; aspect-ratio: 16/9; }
        .video-box iframe { width: 100%; height: 100%; border: none; }
        .progress-box { background: #1e293b; padding: 20px; border-radius: 12px; text-align: center; border: 1px solid #475569; }
        .timer-display { font-size: 1.3rem; font-weight: bold; color: #38bdf8; margin: 10px 0; }
        .claim-btn { background: #10b981; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; display: none; margin-top: 15px; transition: 0.3s; }
        .claim-btn:hover { background: #059669; }
        .completed-notice { background: rgba(16, 185, 129, 0.15); border: 1px solid #10b981; padding: 15px; border-radius: 10px; margin-bottom: 15px; color: #34d399; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1 id="courseTitleText" style="font-size: 1.2rem; color: #f8fafc;">جاري التحقق من حالة الدورة...</h1>
            <a href="courses.html" class="back-btn">⬅️ العودة للدورات</a>
        </div>

        <div id="noticeContainer"></div>

        <div class="video-box" id="videoContainer">
            <!-- سيتم حقن فيديو اليوتيوب هنا -->
        </div>

        <div class="progress-box">
            <h3>📊 نظام تتابُع الحضور والمشاهدة الذكي</h3>
            <div class="timer-display" id="timerText">جاري مزامنة بياناتك من السحابة...</div>
            <p id="statusMsg" style="color: #94a3b8; font-size: 0.9rem;">يمكنك متابعة الفيديو أو مراجعة المحتوى في أي وقت.</p>
            <button class="claim-btn" id="claimCertBtn" onclick="generateAndDownloadCertificate()">🎓 تحميل شهادتك المعتمدة (PDF)</button>
        </div>
    </div>

    <canvas id="qrCanvas" style="display:none;"></canvas>

    <script>
        const SUPABASE_URL = "https://lvutrzswngpkjfamgact.supabase.co";
        const SUPABASE_KEY = "sb_publishable_fB8RmZyfymR8YpjLInA2LQ_hMA6qgRG";
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let courseData = null;
        let watchedSeconds = 0;
        let requiredSeconds = 300; 
        let timerInterval = null;
        const studentPhone = localStorage.getItem('sadara_logged_phone') || 'Guest_User';
        const studentName = localStorage.getItem('sadara_logged_name') || 'عبدالرحمن عبدالله الذماري';

        async function initWatchPage() {
            const urlParams = new URLSearchParams(window.location.search);
            const courseId = urlParams.get('id');

            if(!courseId) {
                alert('لم يتم تحديد الدورة التدريبية!');
                window.location.href = 'courses.html';
                return;
            }

            // 1. جلب بيانات الدورة
            let { data: course, error } = await db.from('platform_courses').select('*').eq('id', courseId).single();
            if(error || !course) {
                alert('عذراً، هذه الدورة غير متوفرة حالياً.');
                window.location.href = 'courses.html';
                return;
            }

            courseData = course;
            requiredSeconds = (courseData.duration_minutes || 5) * 60;
            document.getElementById('courseTitleText').textContent = courseData.title;
            
            // تجهيز رابط يوتيوب
            let ytUrl = courseData.video_url;
            let embedUrl = "";
            if (ytUrl.includes('youtu.be/')) {
                let videoId = ytUrl.split('youtu.be/')[1].split('?')[0];
                embedUrl = `https://www.youtube.com/embed/${videoId}?enablejsapi=1`;
            } else if (ytUrl.includes('watch?v=')) {
                let videoId = ytUrl.split('watch?v=')[1].split('&')[0];
                embedUrl = `https://www.youtube.com/embed/${videoId}?enablejsapi=1`;
            } else {
                embedUrl = ytUrl;
            }
            document.getElementById('videoContainer').innerHTML = `<iframe src="${embedUrl}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;

            // 2. التحقق مما إذا كان الطالب قد أنهى هذه الدورة مسبقاً من جدول الشهادات أو التقدم
            let { data: existingCert } = await db.from('course_certificates')
                .select('*')
                .eq('student_name', studentName)
                .eq('course_name', courseData.title)
                .single();

            if (existingCert) {
                // الطالب أخذ الشهادة مسبقاً! عرض وضع المراجعة فقط
                document.getElementById('noticeContainer').innerHTML = `
                    <div class="completed-notice">
                        🎉 لقد أتممت هذه الدورة مسبقاً واستلمت شهادتك المعتمدة! يمكنك مشاهدة الفيديو للمراجعة أو تحميل شهادتك في أي وقت.
                    </div>
                `;
                document.getElementById('timerText').textContent = "✅ تمت دراسة واجتياز الدورة بنجاح مسبقاً";
                document.getElementById('statusMsg').textContent = "أنت في وضع المراجعة والاستعراض.";
                document.getElementById('claimCertBtn').style.display = 'inline-block';
                document.getElementById('claimCertBtn').textContent = "📄 مراجعة وتحميل الشهادة (PDF)";
            } else {
                // استرجاع الثواني السابقة إذا كان قد شاهد جزءاً منها وخرج
                let { data: progressData } = await db.from('student_progress')
                    .select('*')
                    .eq('student_phone', studentPhone)
                    .eq('course_id', courseId)
                    .single();

                if (progressData) {
                    watchedSeconds = progressData.watched_seconds || 0;
                }

                startTrackingTimer();
            }
        }

        function startTrackingTimer() {
            if(timerInterval) return;
            timerInterval = setInterval(async () => {
                watchedSeconds++;
                let remaining = requiredSeconds - watchedSeconds;
                
                // حفظ التقدم في السحابة كل 10 ثوانٍ لضمان عدم ضياع أي ثانية إذا خرج الطالب
                if (watchedSeconds % 10 === 0) {
                    await db.from('student_progress').upsert({
                        student_phone: studentPhone,
                        student_name: studentName,
                        course_id: courseData.id,
                        watched_seconds: watchedSeconds
                    }, { onConflict: 'student_phone,course_id' });
                }

                if(remaining <= 0) {
                    clearInterval(timerInterval);
                    document.getElementById('timerText').textContent = "✅ اكتملت مدة الدورة بنجاح تام!";
                    document.getElementById('claimCertBtn').style.display = 'inline-block';
                    document.getElementById('statusMsg').textContent = "أنت مؤهل الآن لاستلام شهادتك المعتمدة.";
                } else {
                    let mins = Math.floor(remaining / 60);
                    let secs = remaining % 60;
                    document.getElementById('timerText').textContent = `الوقت المتبقي لاجتياز الدورة: ${mins} دقيقة و ${secs} ثانية`;
                }
            }, 1000);
        }

        async function generateAndDownloadCertificate() {
            // التحقق إن كانت الشهادة موجودة مسبقاً لجلب نفس كود التحقق أو إنشاء جديد
            let { data: existingCert } = await db.from('course_certificates')
                .select('*')
                .eq('student_name', studentName)
                .eq('course_name', courseData.title)
                .single();

            let verificationCode = existingCert ? existingCert.verification_code : ('SAD-' + Math.random().toString(36).substring(2, 9).toUpperCase());
            
            if (!existingCert) {
                await db.from('course_certificates').insert([{
                    student_name: studentName,
                    course_name: courseData.title,
                    grade: 'امتياز (معتمد نظامياً)',
                    attendance_hours: courseData.duration_minutes + ' دقائق تدريبية',
                    verification_code: verificationCode
                }]);
            }

            const verificationUrl = `https://sadarah.top/verify.html?code=${verificationCode}`;

            QRCode.toDataURL(verificationUrl, { width: 200 }, function (err, qrCodeDataUrl) {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });

                doc.setFillColor(255, 255, 255);
                doc.rect(0, 0, 297, 210, 'F');

                doc.setFillColor(15, 35, 71);
                doc.rect(0, 0, 297, 25, 'F');

                doc.setTextColor(212, 175, 55);
                doc.setFont("Helvetica", "bold");
                doc.setFontSize(14);
                doc.text("SADARAH PLATFORM - sadarah.top", 148, 16, { align: "center" });

                doc.setTextColor(15, 35, 71);
                doc.setFont("Helvetica", "bold");
                doc.setFontSize(28);
                doc.text("CERTIFICATE OF COMPLETION", 148, 48, { align: "center" });

                doc.setFontSize(14);
                doc.setTextColor(100, 116, 139);
                doc.text("تُشهد منصة صدارة للوظائف والخدمات الرقمية بأن المتدرب:", 148, 65, { align: "center" });

                doc.setFontSize(24);
                doc.setTextColor(15, 35, 71);
                doc.text(studentName, 148, 85, { align: "center" });

                doc.setFontSize(13);
                doc.setTextColor(100, 116, 139);
                doc.text(`قد أتم بنجاح الدورة التدريبية المعتمدة:`, 148, 102, { align: "center" });

                doc.setFontSize(18);
                doc.setTextColor(212, 175, 55);
                doc.text(courseData.title, 148, 118, { align: "center" });

                doc.setFontSize(11);
                doc.setTextColor(71, 85, 105);
                doc.text(`التقدير: امتياز | المدة التدريبية: ${courseData.duration_minutes} دقائق | تاريخ الإصدار: ${new Date().toLocaleDateString('ar-YE')}`, 148, 135, { align: "center" });

                doc.setDrawColor(212, 175, 55);
                doc.setLineWidth(0.5);
                doc.line(30, 150, 267, 150);

                doc.addImage(qrCodeDataUrl, 'PNG', 20, 155, 38, 38);
                doc.setFontSize(9);
                doc.setTextColor(100, 116, 139);
                doc.text("امسح الرمز للتحقق الفوري", 22, 198);

                doc.setFontSize(10);
                doc.setTextColor(15, 35, 71);
                doc.text(`رقم التحقق: ${verificationCode}`, 275, 172, { align: "right" });
                doc.text("معتمدة رسمياً عبر موقع sadarah.top", 275, 180, { align: "right" });
                doc.text("التوقيع والاعتماد: إدارة منصة صدارة", 275, 188, { align: "right" });

                doc.save(`Sadarah_Certificate_${studentName}.pdf`);
                alert('تم استعراض وتنزيل شهادتك المعتمدة بنجاح تام! 🌟');
            });
        }

        document.addEventListener('DOMContentLoaded', initWatchPage);
    </script>
</body>
</html>
