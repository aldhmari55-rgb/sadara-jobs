<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>غرفة التدريب التفاعلية | صدارة</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background: #0f172a; color: white; padding: 20px; direction: rtl; text-align: right; }
        .container { max-width: 900px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #334155; padding-bottom: 15px; }
        .back-btn { background: #334155; color: white; padding: 8px 16px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 13px; }
        .video-box { background: #1e293b; border-radius: 12px; overflow: hidden; margin-bottom: 20px; border: 1px solid #475569; position: relative; aspect-ratio: 16/9; }
        .video-box iframe { width: 100%; height: 100%; border: none; }
        .progress-box { background: #1e293b; padding: 20px; border-radius: 12px; text-align: center; border: 1px solid #475569; }
        .timer-display { font-size: 1.3rem; font-weight: bold; color: #38bdf8; margin: 10px 0; }
        .claim-btn { background: #10b981; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; display: none; margin-top: 15px; transition: 0.3s; }
        .claim-btn:hover { background: #059669; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1 id="courseTitleText" style="font-size: 1.2rem; color: #f8fafc;">جاري تحميل الدورة التدريبية...</h1>
            <a href="courses.html" class="back-btn">⬅️ العودة للدورات</a>
        </div>

        <div class="video-box" id="videoContainer">
            <!-- سيتم حقن فيديو اليوتيوب هنا تلقائياً -->
        </div>

        <div class="progress-box">
            <h3>📊 نظام تتابُع الحضور والمشاهدة التلقائي</h3>
            <div class="timer-display" id="timerText">وقت المشاهدة المتبقي: جاري تفعيل العد التنازلي...</div>
            <p id="statusMsg" style="color: #94a3b8; font-size: 0.9rem;">يرجى متابعة فيديو الشرح بالكامل ليتم فتح زر استلام الشهادة المعتمدة تلقائياً.</p>
            <button class="claim-btn" id="claimCertBtn" onclick="generateAndDownloadCertificate()">🎓 مبروك! استلم شهادتك المعتمدة الآن (PDF)</button>
        </div>
    </div>

    <canvas id="qrCanvas" style="display:none;"></canvas>

    <script>
        const SUPABASE_URL = "https://lvutrzswngpkjfamgact.supabase.co";
        const SUPABASE_KEY = "sb_publishable_fB8RmZyfymR8YpjLInA2LQ_hMA6qgRG";
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let courseData = null;
        let watchedSeconds = 0;
        let requiredSeconds = 300; // افتراضي 5 دقائق أو حسب إعدادات الدورة
        let timerInterval = null;
        const studentName = localStorage.getItem('sadara_logged_name') || 'متدرب صدارة الكريم';

        async function initWatchPage() {
            const urlParams = new URLSearchParams(window.location.search);
            const courseId = urlParams.get('id');

            if(!courseId) {
                alert('لم يتم تحديد الدورة التدريبية!');
                window.location.href = 'courses.html';
                return;
            }

            let { data, error } = await db.from('platform_courses').select('*').eq('id', courseId).single();
            if(error || !data) {
                alert('عذراً، هذه الدورة غير متوفرة حالياً.');
                window.location.href = 'courses.html';
                return;
            }

            courseData = data;
            requiredSeconds = (courseData.duration_minutes || 5) * 60; // تحويل الدقائق إلى ثواني

            document.getElementById('courseTitleText').textContent = courseData.title;
            
            // معالجة رابط يوتيوب وتحويله إلى صيغة الـ Embed المناسبة للعرض داخل المنصة
            let ytUrl = courseData.video_url;
            let embedUrl = "";
            
            if (ytUrl.includes('youtu.be/')) {
                let videoId = ytUrl.split('youtu.be/')[1].split('?')[0];
                embedUrl = `https://www.youtube.com/embed/${videoId}?enablejsapi=1`;
            } else if (ytUrl.includes('watch?v=')) {
                let videoId = ytUrl.split('watch?v=')[1].split('&')[0];
                embedUrl = `https://www.youtube.com/embed/${videoId}?enablejsapi=1`;
            } else if (ytUrl.includes('/embed/')) {
                embedUrl = ytUrl;
            } else {
                embedUrl = ytUrl;
            }

            document.getElementById('videoContainer').innerHTML = `<iframe src="${embedUrl}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;

            // بدء عداد وقت المشاهدة فور دخول الطالب وفتح الدورة
            startTrackingTimer();
        }

        function startTrackingTimer() {
            if(timerInterval) return;
            timerInterval = setInterval(() => {
                watchedSeconds++;
                let remaining = requiredSeconds - watchedSeconds;
                
                if(remaining <= 0) {
                    clearInterval(timerInterval);
                    document.getElementById('timerText').textContent = "✅ اكتملت مدة الدورة بنجاح تام!";
                    document.getElementById('claimCertBtn').style.display = 'inline-block';
                    document.getElementById('statusMsg').textContent = "أنت مؤهل الآن لاستلام شهادتك المعتمدة وتحميلها بصيغة PDF.";
                } else {
                    let mins = Math.floor(remaining / 60);
                    let secs = remaining % 60;
                    document.getElementById('timerText').textContent = `الوقت المتبقي لاجتياز الدورة: ${mins} دقيقة و ${secs} ثانية`;
                }
            }, 1000);
        }

        async function generateAndDownloadCertificate() {
            const verificationCode = 'SAD-' + Math.random().toString(36).substring(2, 9).toUpperCase();
            const verificationUrl = `https://sadarah.top/verify.html?code=${verificationCode}`;

            // حفظ بيانات الشهادة في جدول قاعدة البيانات لتفعيل باركود التحقق الفوري
            await db.from('course_certificates').insert([{
                student_name: studentName,
                course_name: courseData.title,
                grade: 'امتياز (معتمد نظامياً)',
                attendance_hours: courseData.duration_minutes + ' دقائق تدريبية',
                verification_code: verificationCode
            }]);

            // توليد الباركود وصيغة الـ PDF للشهادة
            QRCode.toDataURL(verificationUrl, { width: 150 }, function (err, qrCodeDataUrl) {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });

                doc.setFillColor(15, 23, 42);
                doc.rect(0, 0, 297, 210, 'F');

                doc.setTextColor(255, 255, 255);
                doc.setFont("Tajawal", "bold");
                doc.setFontSize(26);
                doc.text("منصة صدارة للتوظيف والخدمات الرقمية", 148, 30, { align: "center" });

                doc.setFontSize(16);
                doc.setTextColor(56, 189, 248);
                doc.text("شهادة إتمام دورة تدريبية معتمدة", 148, 45, { align: "center" });

                doc.setFontSize(14);
                doc.setTextColor(203, 213, 225);
                doc.text("تشهد إدارة منصة صدارة (sadarah.top) بأن المتدرب/ة:", 148, 70, { align: "center" });

                doc.setFontSize(24);
                doc.setTextColor(255, 255, 255);
                doc.text(studentName, 148, 88, { align: "center" });

                doc.setFontSize(14);
                doc.setTextColor(203, 213, 225);
                doc.text(`قد أتم بنجاح متطلبات الدورة التدريبية: ${courseData.title}`, 148, 108, { align: "center" });

                // إضافة الباركود الخاص بالتحقق في الزاوية
                doc.addImage(qrCodeDataUrl, 'PNG', 20, 150, 40, 40);
                doc.setFontSize(9);
                doc.setTextColor(148, 163, 184);
                doc.text("امسح الرمز للتحقق الفوري من صحة الشهادة", 22, 195);

                doc.text(`رقم التحقق: ${verificationCode}`, 230, 180);
                doc.text("معتمدة رسمياً عبر خوادم sadarah.top", 230, 188);

                doc.save(`Sadarah_Certificate_${studentName}.pdf`);
                alert('تهانينا الخالصة! تم إصدار وتنزيل شهادتك المعتمدة بنجاح تام 🎉');
            });
        }

        document.addEventListener('DOMContentLoaded', initWatchPage);
    </script>
</body>
</html>
