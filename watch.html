<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>التحقق الرسمي من الشهادة | صدارة</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background: #f8f9fa; display: flex; justify-content: center; align-items: center; min-height: 100vh; direction: rtl; padding: 15px; }
        .card { background: #fff; padding: 30px; border-radius: 14px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); width: 100%; max-width: 500px; text-align: center; border-top: 6px solid #059669; }
        h2 { color: #0f172a; margin-bottom: 15px; font-size: 22px; }
        .status { font-size: 1.1rem; color: #059669; font-weight: bold; margin-bottom: 20px; background: #dcfce7; padding: 10px; border-radius: 8px; }
        .info-box { text-align: right; background: #f1f5f9; padding: 15px; border-radius: 8px; margin-bottom: 15px; line-height: 2; }
        .info-box p { font-size: 14px; color: #334155; }
        .info-box span { font-weight: bold; color: #0f2347; }
        .error { color: #dc2626; font-weight: bold; background: #fee2e2; padding: 12px; border-radius: 8px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>التحقق الرسمي من الشهادة</h2>
        <div id="result">جاري جلب البيانات من السحابة... 🔍</div>
    </div>

    <script>
        const SUPABASE_URL = "https://lvutrzswngpkjfamgact.supabase.co";
        const SUPABASE_KEY = "sb_publishable_fB8RmZyfymR8YpjLInA2LQ_hMA6qgRG";
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function verifyCertificate() {
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');
            const resultDiv = document.getElementById('result');

            if (!code) {
                resultDiv.innerHTML = `<p class="error">⚠️ رابط التحقق غير صالح أو غير مكتمل!</p>`;
                return;
            }

            try {
                let { data, error } = await db
                    .from('course_certificates')
                    .select('*')
                    .eq('verification_code', code.trim())
                    .maybeSingle();

                if (error || !data) {
                    resultDiv.innerHTML = `<p class="error">⚠️ عذراً، هذه الشهادة غير مسجلة في قاعدة بيانات منصة صدارة أو أن كود التحقق غير صحيح!</p>`;
                    return;
                }

                resultDiv.innerHTML = `
                    <div class="status">✅ شهادة معتمدة وصحيحة 100%</div>
                    <div class="info-box">
                        <p>اسم المتدرب: <span>${data.student_name}</span></p>
                        <p>اسم الدورة: <span>${data.course_name}</span></p>
                        <p>تفاصيل الفترة: <span>${data.grade}</span></p>
                        <p>عدد الساعات: <span>${data.attendance_hours}</span></p>
                        <p>رقم التحقق: <span style="color:#2563eb;">${data.verification_code}</span></p>
                    </div>
                    <p style="font-size:11px; color:#64748b;">صادرة رسمياً ومعتمدة عبر منصة صدارة (sadarah.top)</p>
                `;
            } catch(e) {
                resultDiv.innerHTML = `<p class="error">حدث خطأ في الاتصال بقاعدة البيانات.</p>`;
            }
        }

        verifyCertificate();
    </script>

</body>
</html>
