<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشاهدة الدورة | منصة صدارة</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- مكتبة مشغل الفيديو المحترفة -->
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>

    <style>
        :root { --primary: #0f2347; --gold: #d4af37; --bg: #f8fafc; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background: var(--bg); padding: 15px; color: #0f172a; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
        h1 { color: var(--primary); font-size: 20px; margin-bottom: 5px; }
        .desc { color: #64748b; font-size: 13px; margin-bottom: 15px; }
        
        /* حاوية مشغل الفيديو مع طبقة عزل نهائية لإخفاء النصوص العلوية */
        .player-wrapper {
            position: relative;
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
            box-shadow: 0 8px 20px rgba(15, 35, 71, 0.15);
            margin-bottom: 20px;
        }

        /* طبقة حماية شفافة تغطي الجزء العلوي بالكامل لمنع ظهور أو النقر على عناوين يوتيوب */
        .video-shield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 70px;
            z-index: 99;
            background: transparent;
            pointer-events: auto;
        }

        .plyr--full-ui input[type=range] { color: #2563eb; }
        .plyr__control--overlaid { background: rgba(15, 35, 71, 0.9); }
        .plyr--video .plyr__control:hover { background: #2563eb; }

        .lessons-title { font-size: 15px; font-weight: bold; margin-bottom: 10px; color: var(--primary); border-bottom: 2px solid #f1f5f9; padding-bottom: 5px; }
        .lesson-item { padding: 12px; background: #f1f5f9; margin-bottom: 8px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: bold; transition: 0.2s; display: flex; justify-content: space-between; align-items: center; border-right: 4px solid transparent; }
        .lesson-item:hover { background: #e2e8f0; }
        .lesson-item.active { background: var(--primary); color: white; border-right-color: var(--gold); }
    </style>
</head>
<body>

    <div class="container" id="courseContainer">
        <p style="text-align:center; padding:20px;">جاري تحميل تفاصيل الدورة والدروس... ⏳</p>
    </div>

<script>
    const SUPABASE_URL = "https://lvutrzswngpkjfamgact.supabase.co";
    const SUPABASE_KEY = "sb_publishable_fB8RmZyfymR8YpjLInA2LQ_hMA6qgRG";
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let playerInstance = null;

    function getYouTubeId(url) {
        if (!url) return '';
        let videoId = '';
        if (url.includes('embed/')) {
            videoId = url.split('embed/')[1].split('?')[0];
        } else if (url.includes('youtu.be/')) {
            videoId = url.split('youtu.be/')[1].split('?')[0];
        } else if (url.includes('watch?v=')) {
            videoId = url.split('watch?v=')[1].split('&')[0];
        }
        return videoId || url;
    }

    async function loadCourseData() {
        const urlParams = new URLSearchParams(window.location.search);
        const courseId = urlParams.get('id');
        const container = document.getElementById('courseContainer');

        if (!courseId) {
            container.innerHTML = '<p style="color:red; text-align:center;">رقم الدورة غير موجود في الرابط.</p>';
            return;
        }

        let { data: course, error } = await db.from('platform_courses').select('*').eq('id', courseId).single();

        if (error || !course || course.is_active === false) {
            container.innerHTML = '<p style="color:red; text-align:center;">عذراً، هذه الدورة غير متاحة حالياً أو غير موجودة.</p>';
            return;
        }

        let lessons = course.lessons || [];
        let firstVideoId = lessons.length > 0 ? getYouTubeId(lessons[0].video_url) : '';

        let html = `
            <h1>🎓 ${course.title}</h1>
            <p class="desc">${course.description || 'لا يوجد وصف متاح.'}</p>
            
            <div class="player-wrapper">
                <!-- طبقة عزل علوية تمنع رؤية أو تفاعل النصوص العلوية -->
                <div class="video-shield"></div>
                <div id="player" data-plyr-provider="youtube" data-plyr-embed-id="${firstVideoId}"></div>
            </div>

            <div class="lessons-title">📚 قائمة دروس الدورة (${lessons.length} دروس)</div>
            <div id="lessonsList">
        `;

        lessons.forEach((l, idx) => {
            let activeClass = idx === 0 ? 'active' : '';
            let vId = getYouTubeId(l.video_url);
            html += `
                <div class="lesson-item ${activeClass}" onclick="playLesson('${vId}', this)">
                    <span>🔹 الدرس ${idx + 1}: ${l.lesson_title}</span>
                    <span style="font-size: 11px; opacity: 0.9;">مشاهدة ▶️</span>
                </div>
            `;
        });

        html += `</div>`;
        container.innerHTML = html;

        playerInstance = new Plyr('#player', {
            controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'fullscreen'],
            youtube: { noCookie: true, rel: 0, showinfo: 0, iv_load_policy: 3, modestbranding: 1 }
        });
    }

    function playLesson(videoId, element) {
        if (playerInstance) {
            playerInstance.source = {
                type: 'video',
                sources: [{
                    src: videoId,
                    provider: 'youtube',
                }]
            };
        }
        document.querySelectorAll('.lesson-item').forEach(el => el.classList.remove('active'));
        element.classList.add('active');
    }

    document.addEventListener('DOMContentLoaded', loadCourseData);
</script>
</body>
</html>
