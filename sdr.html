<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الشاملة | منصة صدارة</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #0f2347; --gold: #d4af37; --green: #25d366; --red: #ef4444; --bg: #f8fafc; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background: var(--bg); padding: 15px; color: #0f172a; padding-bottom: 50px; }
        .header { background: var(--primary); color: white; padding: 18px; border-radius: 12px; text-align: center; margin-bottom: 15px; border-bottom: 3px solid var(--gold); }
        .grid-container { display: grid; grid-template-columns: 1fr; gap: 20px; max-width: 1000px; margin: 0 auto; }
        @media(min-width: 768px) { .grid-container { grid-template-columns: 1fr 1fr; } }
        .card { background: white; padding: 18px; border-radius: 12px; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
        label { font-size: 12px; font-weight: bold; display: block; margin-top: 8px; color: #475569; }
        input, select, textarea { width: 100%; padding: 10px; margin-top: 4px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 13px; outline: none; }
        button { width: 100%; background: var(--primary); color: white; border: none; padding: 12px; margin-top: 15px; border-radius: 8px; font-weight: bold; font-size: 13px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header">
        <h1>لوحة تحكم منصة صدارة الشاملة 🛠️</h1>
        <p style="font-size: 12px; opacity: 0.8; margin-top: 4px;">لوحة محمية بالكامل مع تقنية ضغط الصور التلقائية</p>
    </div>

    <div class="grid-container">
        <!-- إدارة المتجر والخدمات -->
        <div class="card">
            <h2>🛒 إضافة أو تعديل خدمة بالمتجر</h2>
            <label>اسم الخدمة</label>
            <input type="text" id="serviceTitle" placeholder="مثال: اشتراك رقمي">
            <label>السعر</label>
            <input type="text" id="servicePrice" placeholder="1500 YER">
            <label>صورة الخدمة (سيتم ضغطها تلقائياً)</label>
            <input type="file" id="serviceImgFile" accept="image/*">
            <button onclick="saveService()">نشر الخدمة بالمتجر 🚀</button>
            <div id="serviceMsg" style="margin-top:8px; font-size:11px; text-align:center; font-weight:bold;"></div>
        </div>
    </div>

    <script>
        // نظام الحماية البرمجية المدمج
        function checkAdminAuth() {
            let adminPass = localStorage.getItem('sadara_admin_auth');
            if (adminPass !== 'Sdr@2026Admin') {
                let inputPass = prompt("الرجاء إدخال كلمة مرور المشرف للوصول إلى لوحة التحكم:");
                if (inputPass === 'Sdr@2026Admin') {
                    localStorage.setItem('sadara_admin_auth', 'Sdr@2026Admin');
                } else {
                    alert("كلمة المرور غير صحيحة!");
                    window.location.href = 'index.html';
                }
            }
        }
        checkAdminAuth();

        const SUPABASE_URL = "https://lvutrzswngpkjfamgact.supabase.co";
        const SUPABASE_KEY = "sb_publishable_fB8RmZyfymR8YpjLInA2LQ_hMA6qgRG";
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // دالة ضغط الصور تلقائياً قبل الرفع
        async function compressImage(file, maxWidth = 800, quality = 0.7) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = event => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        canvas.toBlob(blob => {
                            resolve(new File([blob], file.name, { type: 'image/jpeg', lastModified: Date.now() }));
                        }, 'image/jpeg', quality);
                    };
                    img.onerror = error => reject(error);
                };
            });
        }

        async function saveService() {
            const title = document.getElementById('serviceTitle').value.trim();
            const price = document.getElementById('servicePrice').value.trim();
            const imgFile = document.getElementById('serviceImgFile').files[0];
            const msg = document.getElementById('serviceMsg');

            if (!title || !price) { alert('ادخل اسم الخدمة والسعر'); return; }
            msg.style.color = 'blue'; msg.textContent = 'جاري ضغط الصورة ورفعها... ⏳';

            let imgUrl = '';
            if (imgFile) {
                const compressed = await compressImage(imgFile);
                const fileName = `service_${Date.now()}.jpg`;
                const { error: uploadErr } = await db.storage.from('platform-files').upload(fileName, compressed);
                if (!uploadErr) {
                    const { data } = db.storage.from('platform-files').getPublicUrl(fileName);
                    imgUrl = data.publicUrl;
                }
            }

            let { error } = await db.from('platform_services').insert([{ title, price, image: imgUrl, is_active: true }]);
            if (error) {
                msg.style.color = 'red'; msg.textContent = 'خطأ الحفظ: ' + error.message;
            } else {
                msg.style.color = 'green'; msg.textContent = 'تم حفظ ونشر الخدمة بنجاح! ✅';
            }
        }
    </script>
</body>
</html>
