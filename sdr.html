<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الشاملة - منصة صدارة للخدمات الرقمية</title>
    <!-- خط القاهرة الرسمي -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <!-- Tailwind CSS لتصميم سريع واحترافي -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        * { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6">

    <div class="max-w-6xl mx-auto">
        <!-- ترويسة لوحة التحكم -->
        <header class="bg-slate-800 border border-slate-700 rounded-xl p-6 mb-8 shadow-xl flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-black text-emerald-400">لوحة تحكم منصة صدارة</h1>
                <p class="text-slate-400 text-sm mt-1">إدارة الشهادات، الساعات التدريبية، وكشف الإصدارات الرقمية</p>
            </div>
            <div class="flex gap-3">
                <a href="certificate.html" target="_blank" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm font-bold transition shadow-md">
                    🔗 معاينة صفحة الشهادة
                </a>
            </div>
        </header>

        <!-- شبكة الإدارة (إضافة شهادة جديدة + الإحصائيات) -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 mb-8">
            
            <!-- نموذج إصدار شهادة جديدة -->
            <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-xl lg:col-span-1">
                <h2 class="text-lg font-bold text-emerald-400 mb-4 border-b border-slate-700 pb-2">➕ إصدار شهادة جديدة</h2>
                <form id="certForm" onsubmit="createNewCertificate(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-300 mb-1">اسم المتدرب الثلاثي/الرباعي</label>
                        <input type="text" id="fullName" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:border-emerald-500 focus:outline-none" placeholder="مثال: عبدالرحمن عبدالله الذماري">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-300 mb-1">مسمى الدورة التدريبية</label>
                        <input type="text" id="courseName" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:border-emerald-500 focus:outline-none" placeholder="مثال: إدارة الأعمال والتسويق الرقمي">
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-bold text-slate-300 mb-1">عدد الساعات</label>
                            <input type="number" id="courseHours" value="30" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:border-emerald-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-300 mb-1">كود الشهادة (السيريال)</label>
                            <input type="text" id="certCode" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:border-emerald-500 focus:outline-none" placeholder="SAD-2026-XXXX">
                        </div>
                    </div>
                    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-lg transition shadow-lg mt-2">
                        حفظ وإصدار الشهادة
                    </button>
                </form>
            </div>

            <!-- كشف وإدارة الشهادات (الجدول الرئيسي) -->
            <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-xl lg:col-span-2 flex flex-col">
                <div class="flex justify-between items-center mb-4 border-b border-slate-700 pb-2">
                    <h2 class="text-lg font-bold text-emerald-400">📋 كشف الشهادات الصادرة</h2>
                    <button onclick="loadCertificates()" class="text-xs bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-md transition text-slate-200">🔄 تحديث القائمة</button>
                </div>

                <div class="overflow-x-auto flex-grow">
                    <table class="w-full text-right text-sm">
                        <thead class="bg-slate-900 text-slate-400 uppercase text-xs">
                            <tr>
                                <th class="p-3">السيريال</th>
                                <th class="p-3">اسم المتدرب</th>
                                <th class="p-3">الدورة</th>
                                <th class="p-3">الساعات</th>
                                <th class="p-3">الإجراءات</th>
                            </tr>
                        </thead>
                        <tbody id="certificatesTableBody" class="divide-y divide-slate-700 text-slate-300">
                            <tr>
                                <td colspan="5" class="text-center p-4 text-slate-500">جاري تحميل البيانات...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://lvutrzswngpkjfamgact.supabase.co';
        const SUPABASE_ANON_KEY = 'ضع_مفتاح_ANON_KEY_هنا';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // توليد سيريال تلقائي عند فتح الصفحة
        function generateRandomSerial() {
            const randomNum = Math.floor(1000 + Math.random() * 9000);
            document.getElementById('certCode').value = `SAD-2026-${randomNum}`;
        }

        // جلب وعرض قائمة الشهادات في الجدول
        async function loadCertificates() {
            const tbody = document.getElementById('certificatesTableBody');
            tbody.innerHTML = `<tr><td colspan="5" class="text-center p-4 text-slate-500">جاري التحديث...</td></tr>`;

            try {
                const { data, error } = await supabaseClient
                    .from('certificates')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                if (!data || data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" class="text-center p-4 text-slate-500">لا توجد شهادات مسجلة حالياً.</td></tr>`;
                    return;
                }

                tbody.innerHTML = '';
                data.forEach(cert => {
                    const row = document.createElement('tr');
                    row.className = 'hover:bg-slate-750 transition';
                    row.innerHTML = `
                        <td class="p-3 font-mono text-xs text-emerald-400">${cert.certificate_code}</td>
                        <td class="p-3 font-bold">${cert.full_name}</td>
                        <td class="p-3 text-slate-300">${cert.course_name}</td>
                        <td class="p-3 text-emerald-300">${cert.hours || 30} س</td>
                        <td class="p-3 flex gap-2">
                            <a href="certificate.html?id=${cert.certificate_code}" target="_blank" class="bg-sky-600 hover:bg-sky-700 text-white px-2.5 py-1 rounded text-xs transition">عرض</a>
                            <button onclick="deleteCertificate('${cert.id}')" class="bg-rose-600 hover:bg-rose-700 text-white px-2.5 py-1 rounded text-xs transition">حذف</button>
                        </td>
                    `;
                    tbody.appendChild(row);
                });
            } catch (err) {
                console.error("خطأ في جلب الكشف:", err);
                tbody.innerHTML = `<tr><td colspan="5" class="text-center p-4 text-rose-400">فشل تحميل البيانات من قاعدة الداتا.</td></tr>`;
            }
        }

        // إضافة شهادة جديدة للقاعدة
        async function createNewCertificate(event) {
            event.preventDefault();
            
            const full_name = document.getElementById('fullName').value.trim();
            const course_name = document.getElementById('courseName').value.trim();
            const hours = parseInt(document.getElementById('courseHours').value) || 30;
            const certificate_code = document.getElementById('certCode').value.trim();

            try {
                const { error } = await supabaseClient
                    .from('certificates')
                    .insert([{ certificate_code, full_name, course_name, hours }]);

                if (error) throw error;

                alert('تم إصدار وحفظ الشهادة بنجاح في المنصة!');
                document.getElementById('certForm').reset();
                generateRandomSerial();
                loadCertificates();
            } catch (err) {
                alert('خطأ أثناء الحفظ: تأكد من أن كود الشهادة (السيريال) غير مكرر مسبقاً.');
                console.error(err);
            }
        }

        // حذف شهادة من الكشف
        async function deleteCertificate(id) {
            if (!confirm('هل أنت متأكد من حذف هذه الشهادة نهائياً من الكشف؟')) return;

            try {
                const { error } = await supabaseClient
                    .from('certificates')
                    .delete()
                    .eq('id', id);

                if (error) throw error;
                loadCertificates();
            } catch (err) {
                alert('فشل حذف الشهادة.');
                console.error(err);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            generateRandomSerial();
            loadCertificates();
        });
    </script>
</body>
</html>
