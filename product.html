<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>طلبات شي إن | صدارة شي إن</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 text-slate-800 pb-24">
  <header class="bg-white border-b border-slate-100 p-4 sticky top-0 z-40">
    <h1 class="font-extrabold text-lg">طلب وسيط صدارة شي إن 🛍️</h1>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-4">
    <div class="bg-emerald-50 border border-emerald-200 rounded-2xl p-4 text-emerald-900 text-xs font-bold space-y-1">
      <p>انسخ روابط منتجاتك أو سلتك المجمعة من SHEIN وسنقوم بطلبها وتوصيلها لك.</p>
      <p class="text-emerald-700 font-black">واتساب الدعم: 777900693</p>
    </div>

    <form class="bg-white p-4 rounded-2xl border border-slate-200 space-y-4 shadow-sm" id="shein-form">
      <div>
        <label class="text-xs font-bold block mb-1">رابط سلة شي إن أو المنتج:</label>
        <textarea rows="3" required placeholder="الصق رابط السلة (Share Cart) هنا..." class="w-full bg-slate-50 text-xs p-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-lime-500 outline-none"></textarea>
      </div>

      <div>
        <label class="text-xs font-bold block mb-1">ملاحظات المقاسات والألوان:</label>
        <textarea rows="2" placeholder="أكتب التفاصيل..." class="w-full bg-slate-50 text-xs p-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-lime-500 outline-none"></textarea>
      </div>

      <button type="submit" class="w-full py-3 bg-slate-900 text-white font-bold text-xs rounded-xl shadow-md">
        إرسال الطلب لـ صدارة شي إن
      </button>
    </form>

    <!-- قائمة الشحنات والتتبع -->
    <div class="space-y-2 pt-2">
      <h3 class="font-extrabold text-sm">تتبع شحناتك الحالية ✈️</h3>
      <div class="bg-white p-4 rounded-2xl border border-slate-100 space-y-2 shadow-sm">
        <div class="flex justify-between items-center text-xs">
          <span class="font-bold">طلبية #شحنة جديدة</span>
          <span class="bg-purple-100 text-purple-700 px-2 py-0.5 rounded-full font-bold">في الطريق إليك</span>
        </div>
        <div class="text-[11px] text-slate-400 flex justify-between border-t pt-2">
          <span>تاريخ الطلب: 2026-10-30</span>
          <span class="text-lime-600 font-bold cursor-pointer">تفاصيل التتبع ←</span>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
