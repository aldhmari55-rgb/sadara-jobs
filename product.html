<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل المنتج | منصة صدارة</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { 
            --sadarah-primary: #0F2A4A;
            --sadarah-light: #F4F7FB;
            --sadarah-gold: #D4AF37;
            --sadarah-btn: #0284C7;
            --discount-red: #E11D48;
            --neu-shadow: 6px 6px 14px #cbced1, -6px -6px 14px #ffffff;
            --neu-shadow-inset: inset 3px 3px 6px #cbced1, inset -3px -3px 6px #ffffff;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background: var(--sadarah-light); padding: 15px; color: #0f172a; padding-bottom: 50px; }

        .container { max-width: 650px; margin: 0 auto; }
        .back-btn { display: inline-flex; align-items: center; gap: 6px; color: var(--sadarah-primary); text-decoration: none; font-weight: 900; font-size: 12px; margin-bottom: 12px; }

        .product-detail-card { background: var(--sadarah-light); padding: 18px; border-radius: 20px; box-shadow: var(--neu-shadow); }
        .product-hero-img { width: 100%; height: 260px; object-fit: contain; background: #ffffff; border-radius: 14px; box-shadow: var(--neu-shadow-inset); padding: 8px; margin-bottom: 14px; }
        
        .price-section { display: flex; align-items: center; gap: 10px; margin: 10px 0; }
        .current-price { font-size: 18px; font-weight: 900; color: var(--discount-red); }
        .old-price { font-size: 13px; color: #94a3b8; text-decoration: line-through; }
        .discount-tag { background: var(--discount-red); color: white; padding: 3px 8px; border-radius: 6px; font-size: 10px; font-weight: 900; }

        .desc-box { background: #F0F7FF; padding: 12px; border-radius: 10px; border-right: 4px solid var(--sadarah-btn); font-size: 11px; line-height: 1.6; color: #1E3A8A; font-weight: 700; margin-bottom: 16px; }

        .order-form { background: var(--sadarah-light); padding: 14px; border-radius: 12px; box-shadow: var(--neu-shadow-inset); }
        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; font-size: 11px; font-weight: 900; color: var(--sadarah-primary); margin-bottom: 4px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border: none; border-radius: 8px; font-size: 11px; font-weight: 700; outline: none; background: #ffffff; box-shadow: var(--neu-shadow-inset); }

        .buy-now-btn { background: var(--sadarah-btn); color: white; width: 100%; border: none; padding: 12px; border-radius: 10px; font-weight: 900; font-size: 12px; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-right"></i> العودة للمتجر</a>

        <div class="product-detail-card" id="productCard">
            جاري تحميل تفاصيل المنتج...
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://lvutrzswngpkjfamgact.supabase.co";
        const SUPABASE_KEY = "sb_publishable_fB8RmZyfymR8YpjLInA2LQ_hMA6qgRG";
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentProduct = null;

        async function loadProductDetails() {
            const urlParams = new URLSearchParams(window.location.search);
            const productId = urlParams.get('id');
            const refCode = urlParams.get('ref');
            if(refCode) localStorage.setItem('sadara_ref', refCode);

            if(!productId) { window.location.href = 'index.html'; return; }

            let { data } = await db.from('platform_services').select('*').eq('id', productId).single();
            if(!data) { document.getElementById('productCard').innerHTML = 'المنتج غير موجود.'; return; }

            currentProduct = data;
            let img = data.image || 'images/logo.jpg';

            document.getElementById('productCard').innerHTML = `
                <img src="${img}" class="product-hero-img">
                <h2 style="font-size:16px; color:var(--sadarah-primary);">${data.title}</h2>
                
                <div class="price-section">
                    <span class="current-price">${data.price}</span>
                    ${data.old_price ? `<span class="old-price">${data.old_price}</span>` : ''}
                    ${data.discount ? `<span class="discount-tag">${data.discount}</span>` : ''}
                </div>

                <div class="desc-box">
                    <b>📝 تفاصيل ووصف المنتج:</b><br>${data.description || 'لا يوجد وصف إضافي.'}
                </div>

                <div class="order-form">
                    <h3 style="font-size:13px; color:var(--sadarah-primary); margin-bottom:10px;">إتمام الشراء والطلب 🛒</h3>
                    <div class="form-group"><label>الاسم الكامل</label><input type="text" id="custName" placeholder="أدخل اسمك الكريم"></div>
                    <div class="form-group"><label>رقم الجوال (واتساب)</label><input type="tel" id="custPhone" placeholder="770000000"></div>
                    <div class="form-group">
                        <label>طريقة الدفع</label>
                        <select id="custPayment">
                            <option value="محفظة جيب (780568507)">محفظة جيب (780568507)</option>
                            <option value="بنك الكريمي (2628009)">بنك الكريمي (2628009)</option>
                        </select>
                    </div>
                    <div class="form-group"><label>إرفاق سند التحويل (اختياري)</label><input type="file" id="custReceipt" accept="image/*"></div>
                    <div class="form-group"><label>ملاحظات إضافية</label><textarea id="custNotes" rows="2"></textarea></div>
                    <button class="buy-now-btn" onclick="submitDirectOrder()">تأكيد وإرسال الطلب عبر الواتساب 📱</button>
                </div>
            `;
        }

        async function submitDirectOrder() {
            let name = document.getElementById('custName').value.trim();
            let phone = document.getElementById('custPhone').value.trim();
            let payment = document.getElementById('custPayment').value;
            let fileInput = document.getElementById('custReceipt');
            let notes = document.getElementById('custNotes').value.trim();
            let refCode = localStorage.getItem('sadara_ref') || 'مباشر';

            if(!name || !phone) { alert('يرجى إدخال الاسم ورقم الواتساب.'); return; }

            let receiptUrl = '';
            if (fileInput.files && fileInput.files[0]) {
                let file = fileInput.files[0];
                let fileName = 'receipts/' + Date.now() + '_' + file.name;
                let { data: uploadData } = await db.storage.from('products_images').upload(fileName, file);
                if(uploadData) {
                    let { data: pubUrl } = db.storage.from('products_images').getPublicUrl(fileName);
                    receiptUrl = pubUrl.publicUrl;
                }
            }

            await db.from('orders').insert([{
                product_id: currentProduct.id,
                product_title: currentProduct.title,
                customer_name: name,
                customer_phone: phone,
                payment_method: payment,
                receipt_url: receiptUrl,
                notes: notes,
                ref_code: refCode,
                status: 'جديد'
            }]);

            let msg = `طلب جديد:\n\n📦 المنتج: ${currentProduct.title}\n💵 السعر: ${currentProduct.price}\n👤 الاسم: ${name}\n📱 الهاتف: ${phone}\n💳 الدفع: ${payment}\n📄 سند التحويل: ${receiptUrl || 'لم يُرفق'}\n🔗 المسوق: ${refCode}\nملاحظات: ${notes}`;
            window.open(`https://wa.me/967780568507?text=${encodeURIComponent(msg)}`, '_blank');
        }

        window.addEventListener('DOMContentLoaded', loadProductDetails);
    </script>
</body>
</html>
