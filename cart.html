<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إتمام الطلب - متجر صدارة</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <div class="logo"><a href="index.html" style="color:white; text-decoration:none;">صدارة <span>ذمار</span></a></div>
        <nav><a href="index.html">الرئيسية</a></nav>
    </header>

    <div class="container">
        <h2>سلة التسوق وإتمام الطلب</h2>
        <div id="cart-items-list" style="margin-bottom: 20px;"></div>

        <form id="checkout-form" class="checkout-form" onsubmit="submitOrderWithReceipt(event)">
            <div class="form-group">
                <label>الاسم الكامل:</label>
                <input type="text" id="c_name" required placeholder="أدخل اسمك الكريم">
            </div>

            <div class="form-group">
                <label>رقم الهاتف (واتساب):</label>
                <input type="tel" id="c_phone" required placeholder="77XXXXXXX">
            </div>

            <div class="form-group">
                <label>العنوان التفصيلي في ذمار:</label>
                <input type="text" id="c_address" required placeholder="الشارع / الحارة / معلم قريب">
            </div>

            <div class="form-group">
                <label>طريقة الدفع:</label>
                <select id="payment_method" onchange="toggleReceiptField()" required>
                    <option value="kuraimi">تحويل عبر الكريمي (حاسب)</option>
                    <option value="jeeb">محفظة جيب</option>
                    <option value="cod">دفع عند الاستلام (داخل مدينة ذمار)</option>
                </select>
            </div>

            <div id="transfer-info" class="bank-info">
                <p><strong>اسم المستلم للتحويل:</strong> عبدالرحمن عبدالله صالح الذماري</p>
                <label style="margin-top: 10px; display:block;">ارفع صورة سند التحويل أو الإيداع:</label>
                <input type="file" id="receipt_file" accept="image/*" style="margin-top: 5px;">
            </div>

            <button type="submit" class="btn-buy" style="margin-top:20px;">تأكيد وإرسال الطلب</button>
        </form>
    </div>

    <script src="main.js"></script>
</body>
</html>
