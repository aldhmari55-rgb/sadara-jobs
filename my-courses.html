<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الطالب - كورساتي | منصة صدارة</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #0f2347; --gold: #d4af37; --green: #25d366; --bg-light: #f3f4f6; --text-dark: #0f172a; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background: var(--bg-light); color: var(--text-dark); direction: rtl; text-align: right; padding-bottom: 50px; }
        
        header { background: #0a1324; color: #fff; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--gold); }
        header h1 { font-size: 14px; color: #38bdf8; font-weight: 900; }
        .nav-btns { display: flex; gap: 6px; }
        .back-btn { background: var(--gold); color: #0a1324; padding: 6px 12px; border-radius: 6px; text-decoration: none; font-weight: 800; font-size: 11px; border: none; display: inline-flex; align-items: center; gap: 4px; }
        
        .container { max-width: 900px; margin: 20px auto; padding: 0 10px; }
        .section-title { font-size: 15px; font-weight: 900; margin-bottom: 12px; color: var(--primary); border-bottom: 2px solid var(--gold); padding-bottom: 4px; display: flex; align-items: center; gap: 6px; }

        .products-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 15px; }
        @media (max-width: 600px) { .products-grid { grid-template-columns: 1fr; } }

        .product-card { background: white; border-radius: 10px; border: 1px solid #e2e8f0; padding: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.02); display: flex; flex-direction: column; justify-content: space-between; gap: 6px; }
        
        .product-img-container { width: 100%; height: 150px; background: #0a1324; border-radius: 8px; display: flex; justify-content: center; align-items: center; overflow: hidden; position: relative; }
        .product-img { width: 100%; height: 100%; object-fit: contain; display: block; }

        .product-title { font-size: 13px; font-weight: 700; color: var(--text-dark); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.4; height: 36px; }
        
        .watch-btn { background: var(--green); color: white; text-align: center; padding: 8px; border-radius: 6px; font-weight: bold; font-size: 11px; margin-top: 6px; cursor: pointer; border: none; width: 100%; text-decoration: none; display: inline-block; transition: 0.2s; }
        .watch-btn:hover { opacity: 0.9; }

        .empty-box { text-align: center; padding: 40px 20px; color: #64748b; grid-column: 1 / -1; background: white; border-radius: 12px; border: 1px dashed #cbd5e1; font-size: 12px; line-height: 1.8; }
        .empty-box a { color: #2563eb; font-weight: bold; text-decoration: none; }
    </style>
</head>
<body>

    <header>
        <h1>🎓 لوحة الطالب - كورساتي الشخصية</h1>
        <div class="nav-btns">
            <a href="courses.html" class="back-btn"><i class="fa-solid fa-graduation-cap"></i> تصفح الدورات</a>
            <a href="index.html" class="back-btn"><i class="fa-solid fa-house"></i> الرئيسية</a>
        </div>
    </header>

    <div class="container">
        <div class="section-title"><i class="fa-solid fa-book-open-reader"></i> دوراتي المفعلة التي أمتلك صلاحية الوصول إليها</div>
        
        <div id="myCoursesGrid">
            <div class="empty-box">جاري تحميل كورساتك المفعلة... ⏳</div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://lvutrzswngpkjfamgact.supabase.co";
        const SUPABASE_KEY = "sb_publishable_fB8RmZyfymR8YpjLInA2LQ_hMA6qgRG";
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function loadMyCourses() {
            let container = document.getElementById('myCoursesGrid');

            try {
                let userKey = localStorage.getItem('sadara_logged_phone') || localStorage.getItem('sadara_user_id');
                
                if (!userKey) {
                    container.innerHTML = `
                        <div class="empty-box">
                            <i class="fa-solid fa-user-slash" style="font-size:28px; color:var(--gold); margin-bottom:8px;"></i><br>
                            لم تقم بتسجيل الدخول أو تفعيل أي دورة بعد.<br>
                            <a href="courses.html">تصفح الدورات المتاحة واشترك 🚀</a>
                        </div>
                    `;
                    return;
                }

                // 1. جلب معرفات الدورات المشترك فيها المستخدم من جدول user_enrollments
                let { data: enrollments, error: enError } = await db.from('user_enrollments')
                    .select('course_id')
                    .eq('user_id', userKey)
                    .eq('is_enrolled', true);

                if (enError || !enrollments || enrollments.length === 0) {
                    container.innerHTML = `
                        <div class="empty-box">
                            <i class="fa-solid fa-folder-open" style="font-size:28px; color:var(--gold); margin-bottom:8px;"></i><br>
                            لم تقم بالاشتراك في أي دورة بعد.<br>
                            <a href="courses.html">تصفح الدورات المتاحة الآن واشترك 🚀</a>
                        </div>
                    `;
                    return;
                }

                let courseIds = enrollments.map(e => e.course_id);

                // 2. جلب تفاصيل الدورات الخاصة بهذه المعرفات من جدول platform_courses
                let { data: myActiveCourses, error: courseError } = await db.from('platform_courses')
                    .select('*')
                    .in('id', courseIds);

                if (courseError || !myActiveCourses || myActiveCourses.length === 0) {
                    container.innerHTML = `<div class="empty-box">لا توجد دورات مطابقة لحسابك حالياً.</div>`;
                    return;
                }

                let gridDiv = document.createElement('div');
                gridDiv.className = 'products-grid';

                myActiveCourses.forEach(c => {
                    let lessonsCount = (c.lessons && Array.isArray(c.lessons)) ? c.lessons.length : 0;
                    let imgHtml = c.image 
                        ? `<div class="product-img-container"><img src="${c.image}" class="product-img"></div>` 
                        : `<div class="product-img-container"><i class="fa-solid fa-graduation-cap" style="font-size:24px; color:var(--gold);"></i></div>`;

                    gridDiv.innerHTML += `
                        <div class="product-card">
                            ${imgHtml}
                            <div class="product-title">${c.title}</div>
                            <div style="display:flex; justify-content:space-between; align-items:center; margin-top:2px;">
                                <span class="product-subtext">📚 ${lessonsCount} دروس</span>
                                <span style="color:var(--green); font-size:10px; font-weight:bold;">مفعلة 🟢</span>
                            </div>
                            <a href="watch.html?id=${c.id}" class="watch-btn"><i class="fa-solid fa-play-circle"></i> بدء المشاهدة 🎥</a>
                        </div>
                    `;
                });

                container.innerHTML = '';
                container.appendChild(gridDiv);

            } catch(e) {
                container.innerHTML = `<div class="empty-box">حدث خطأ أثناء تحميل كورساتك. يرجى تحديث الصفحة.</div>`;
            }
        }

        document.addEventListener('DOMContentLoaded', loadMyCourses);
    </script>
</body>
</html>
